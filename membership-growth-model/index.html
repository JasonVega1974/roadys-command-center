/* ═══════════════ TAB RENDERER: Historical Data (Task 13) ═══════════════ */

// A year's monthly series has to be twelve cells. Nothing in the UI can
// produce anything else today, but `monthlyHistory` is reachable by a `data-k`
// write and by scenario load, and `row.map` / `row.reduce` on a non-array
// throws — which MGM.refresh's catch turns into a blank tab, taking the annual
// table and both charts down with the one bad year.
//
// So normalize, and PAD rather than skip: a padded row still renders twelve
// bound inputs, so the reader sees the damage and can repair it in place (the
// first cell write makes setPath replace the bad container with a real array).
// Skipping would hide the corrupted year entirely and leave no route back to
// it. Padding is with `null`, never 0 — an absent month is not a zero month,
// and `rowTotal` below keeps it out of the total.
const MH_MONTHS = 12;
MGM.monthlyRow = function (raw) {
  const arr = Array.isArray(raw) ? raw : [];
  const cells = [];
  for (let i = 0; i < MH_MONTHS; i++) cells.push(arr[i] == null ? null : arr[i]);
  return { cells,
           ok: Array.isArray(raw) && raw.length === MH_MONTHS,
           extra: Math.max(0, arr.length - MH_MONTHS) };
};

// "2010, 2011, … 2018" compresses to "2010–2018" only when the run really is
// unbroken; a gap has to print as a list, or the note claims years it does not
// cover.
MGM.yearSpan = function (ys) {
  if (!ys.length) return '';
  if (ys.length === 1) return String(ys[0]);     // not "2016–2016"
  return (ys[ys.length - 1] - ys[0] === ys.length - 1)
    ? `${ys[0]}–${ys[ys.length - 1]}` : ys.join(', ');
};

MGM.renderers.historical = function (D) {
  const { st } = D;
  const d = MM.derivedAttrition(st.history);
  const mh = st.monthlyHistory || {};
  // A non-numeric key cannot be reached from this tab's inputs, but a scenario
  // could carry one, and `String(NaN).slice(2)` would label a chart column "N".
  const years = Object.keys(mh).map(Number)
    .filter(y => Number.isFinite(y)).sort((a, b) => a - b);
  const badKeys = Object.keys(mh).filter(k => !Number.isFinite(Number(k)));
  const rows = {};                      // year -> normalized twelve-cell row
  years.forEach(y => { rows[y] = MGM.monthlyRow(mh[y]); });
  const malformed = years.filter(y => !rows[y].ok);

  // A prior count of 0 is a reachable edit — the column is a plain number
  // input — and `100 * lost / 0` is Infinity, which pct1 prints verbatim as
  // "Infinity%". Not derivable is not a rate.
  const rateCell = v => (v == null || !isFinite(v)) ? '—' : pct1(v);
  // There is deliberately no `brokenRate` flag any more. It tested
  // `d.rows.some(r => !isFinite(r.rate))`, which derivedAttrition's
  // `prev.count > 0` guard made permanently false -- zero-count years are
  // excluded from `rows` rather than emitted with an infinite rate. The
  // sentence it gated told the reader those rows "read as em dashes", and
  // they do not appear at all, so it was a false statement that happened to
  // be unreachable. rateCell's own !isFinite arm stays as formatting-layer
  // defence in depth if that engine guard is ever relaxed.

  // derivedAttrition averages `rows.slice(-3)`, so with one or two derivable
  // years the figure is an average of one or two — "Three-year average" over
  // it would claim a span the number does not have.
  const avgSpan = Math.min(d.rows.length, 3);
  const avgLabel = (avgSpan >= 3 || avgSpan === 0) ? 'Three-year average'
    : avgSpan === 1 ? 'Average of the single derivable year'
    : 'Average of the two derivable years';

  // An all-cleared row sums to 0 under `+v||0`, and "0" there asserts a year
  // with no signups where the truth is a year with nothing entered.
  const rowTotal = cells => cells.some(v => v != null)
    ? fmt(cells.reduce((a, v) => a + (+v || 0), 0)) : '—';

  // The brief's note asserted "each year's monthly total equals its New column
  // (2023 → 38, …)". True of the shipped data — verified — but both series are
  // editable, so a hardcoded figure goes stale on the first edit, and
  // `monthlyHistory` spans 2010–2026 while `history` starts at 2019, so nine of
  // the seventeen rows have no annual row to reconcile against at all.
  // Reconcile live, and name the span the claim actually covers.
  const annual = {};
  st.history.forEach(h => { if (h && h.year != null) annual[h.year] = h; });
  // `tot` is null, not 0, for a year with no month supplied — otherwise the
  // mismatch line would print "monthly 0 vs New 19" beside a row total that
  // correctly reads as an em dash, two different claims about one row.
  const recon = years.filter(y => annual[y] && annual[y].newR != null).map(y => ({
    y, newR: +annual[y].newR,
    tot: rows[y].cells.some(v => v != null)
      ? rows[y].cells.reduce((a, v) => a + (+v || 0), 0) : null
  }));
  const offBy = recon.filter(r => r.tot !== r.newR);
  const monthlyOnly = years.filter(y => !(annual[y] && annual[y].newR != null));

  // The partial-year marker follows the as-of date rather than hardcoding
  // "2026 / Jan–Oct", which would mislabel the row the day either changes.
  const asOf = `Jan–${MONTH_NAMES[Math.min(11, Math.max(0, st.ASOF_MONTH - 1))]}`;
  const lastYear = st.history.reduce(
    (a, h) => (h && h.year != null && h.year > a ? h.year : a), st.CURRENT_YEAR);

  document.getElementById('panel-historical').innerHTML = `
  <h2>${esc(st.labels.tabs.historical)}</h2>
  <p class="sub">Source data feeding New Additions, Member Losses and Revenue per
     Member. Roady's + Roady's Lite only — PTPC and COO excluded throughout.</p>

  <div class="card"><h3>Annual signups and losses</h3>
    <table>
      <tr><th>Year</th><th class="num">New (Roady's)</th><th class="num">Lost</th>
          <th class="num">Total count</th><th></th></tr>
      ${st.history.map((h, i) => `<tr>
        <td><input class="cell" type="number" data-k="history.${i}.year"
            value="${h.year == null ? '' : h.year}">
            ${h.year === st.CURRENT_YEAR ? ` <span class="note">${asOf}</span>` : ''}</td>
        <td class="num"><input class="cell" type="number" data-k="history.${i}.newR"
            value="${h.newR == null ? '' : h.newR}">${MGM.editedMark(`history.${i}.newR`)}</td>
        <td class="num"><input class="cell" type="number" data-k="history.${i}.lost"
            value="${h.lost == null ? '' : h.lost}">${MGM.editedMark(`history.${i}.lost`)}</td>
        <td class="num"><input class="cell" type="number" data-k="history.${i}.count"
            value="${h.count == null ? '' : h.count}">${MGM.editedMark(`history.${i}.count`)}</td>
        <td>${MGM.rowTools('history', i, st.history.length)}</td></tr>`).join('')}
      ${st.history.length ? '' : `<tr><td colspan="5" class="note">No annual rows
        entered. Add one below, or reset the section to the shipped series.</td></tr>`}
    </table>
    <div class="mgm-editonly" style="margin-top:10px">
      <button class="btn" onclick="MGM.addRow('history',{year:${lastYear + 1},newR:0,lost:null,count:null})">+ Add year</button>
      <button class="btn" onclick="MGM.resetSection('history')">Reset history</button>
    </div>
    <p class="note">The shipped series was verified against
      <code>Historical member signups.xlsx</code> row by row: 2025's 25 is 20
      Roady's + 5 Roady's Lite, 2026's 32 is 30 + 2. An
      <span class="edited">edited</span> badge means that cell no longer carries
      the verified figure.</p>
  </div>

  <div class="card"><h3>Derived attrition</h3>
    <table>
      <tr><th>Year</th><th class="num">Lost</th><th class="num">Prior count</th><th class="num">Rate</th></tr>
      ${d.rows.map(r => `<tr><td>${r.year}</td><td class="num">${fmt(r.lost)}</td>
        <td class="num">${fmt(r.base)}</td><td class="num">${rateCell(r.rate)}</td></tr>`).join('')}
      ${d.rows.length ? '' : `<tr><td colspan="4" class="note">No year has both a
        loss figure and a prior-year count, so no rate can be derived.</td></tr>`}
      <!-- derivedAttrition returns avg:0, NOT null, when no year has both a
           loss and a prior-year count — so pct1's null guard never fires and
           this read "0.0%", asserting that members never leave. Every value
           feeding it is user-editable, so an empty count column is reachable. -->
      <tr class="total"><td colspan="3">${avgLabel}</td>
        <td class="num"><b>${d.rows.length ? rateCell(d.avg) : '—'}</b></td></tr>
    </table>
    <p class="note">Rate is lost ÷ prior-year count, for every year where both are
      known. ${d.rows.length
      ? `This table is a cross-check, not an input: nothing in the engine reads it.
         The model runs on the <b>Steady annual attrition</b> field on Member Losses
         (${pct1(st.attrition.steady)}), an independent value seeded from this
         average by hand. Editing history moves this table and the Member Losses
         decomposition immediately; it does not move the modelled rate.`
      : `<b>No year currently has both a loss figure and a prior-year count, so no
         rate can be derived.</b> Nothing downstream breaks — the engine never read
         this figure. The model runs on the <b>Steady annual attrition</b> field on
         Member Losses (${pct1(st.attrition.steady)}), which is entered by hand and
         is unaffected either way.`}</p>
  </div>

  <div class="card"><h3>Monthly signups${years.length
      ? `, ${MGM.yearSpan(years)}` : ''}</h3>
    ${!years.length ? '<p class="note">No monthly series loaded.</p>' : `
    <div style="overflow-x:auto">
    <table>
      <tr><th>Year</th>${MONTH_NAMES.map(m => `<th class="num">${m}</th>`).join('')}
        <th class="num">Total</th></tr>
      ${years.map(y => `<tr><td>${y}${rows[y].ok ? ''
        : ' <span class="ovr">malformed</span>'}</td>
        ${rows[y].cells.map((v, i) => `<td class="num"><input class="cell" type="number"
          data-k="monthlyHistory.${y}.${i}" value="${v == null ? '' : v}"></td>`).join('')}
        <td class="num"><b>${rowTotal(rows[y].cells)}</b></td></tr>`).join('')}
    </table></div>
    ${malformed.length ? `<p class="note neg"><b>${malformed.length} year
      row${malformed.length === 1 ? '' : 's'} (${MGM.yearSpan(malformed)})
      ${malformed.length === 1 ? 'is' : 'are'} not a twelve-month array.</b> Shown
      padded to twelve cells so the row can be repaired in place; blank cells are
      missing months, not zero months${malformed.some(y => rows[y].extra)
        ? ', and values past December are not displayed' : ''}.</p>` : ''}
    `}
    ${badKeys.length ? `<p class="note neg"><b>${badKeys.length} monthlyHistory
      key${badKeys.length === 1 ? ' is' : 's are'} not a year
      (${badKeys.map(k => esc(k)).join(', ')})</b> — not shown in the grid above
      and not charted. Dropping a key silently would hide signups; fix it in the
      scenario or the config.</p>` : ''}
    <p class="note">${!recon.length
      ? '<b>No year appears in both tables</b>, so no monthly total can be reconciled against an annual New column.'
      : offBy.length
        ? `<b>${offBy.length} year${offBy.length === 1 ? '' : 's'} no longer
           reconcile${offBy.length === 1 ? 's' : ''} against the annual table:</b>
           ${offBy.map(r => `${r.y} (${r.tot == null ? 'no month entered'
             : 'monthly ' + fmt(r.tot)} vs New ${fmt(r.newR)})`).join(', ')}.
           Both series are editable, so one of the two has been changed.`
        : recon.length === 1
          ? `The one year appearing in both tables (${recon[0].y}) reconciles: its
             monthly total equals its New column.`
          : `All ${recon.length} years appearing in both tables reconcile
             (${MGM.yearSpan(recon.map(r => r.y))}): each year's monthly total
             equals its New column.`}${monthlyOnly.length
      ? ` ${MGM.yearSpan(monthlyOnly)} ${monthlyOnly.length === 1 ? 'is' : 'are'}
          monthly-only — there is no annual row to reconcile
          ${monthlyOnly.length === 1 ? 'it' : 'them'} against.` : ''}</p>
  </div>

  <div class="grid g2">
    <div class="card flush"><div style="padding:18px 20px 0">${MGM.chartTitle('history')}</div>
      ${st.history.length
        ? '<div style="height:260px;padding:10px 20px 20px"><canvas id="chHistory"></canvas></div>'
        : '<p class="note" style="padding:10px 20px 20px">No annual rows entered — nothing to chart.</p>'}</div>
    <div class="card flush"><div style="padding:18px 20px 0">
      ${MGM.chartTitle('monthly')}</div>
      ${years.length
        ? '<div style="height:260px;padding:10px 20px 20px"><canvas id="chMonthly"></canvas></div>'
        : '<p class="note" style="padding:10px 20px 20px">No monthly series loaded — nothing to chart.</p>'}
      <!-- The four examples are the ones the source series documents as batch
           deals, not simply the four largest cells: 2013-12's 34 is the second
           largest month in the shipped data and is NOT documented as a group
           signing, so naming it here would attribute a cause the source does
           not state. Member company names stay out of this public repo. -->
      <p class="note" style="padding:0 20px 18px">Spikes are batch deals, not
        seasonality: in the shipped series 2013-05 = 61, 2017-09 = 18,
        2024-09 = 22 and 2026-06 = 19 are each one multi-location group signing
        at once, not a seasonal peak that repeats.</p></div>
  </div>

  ${MGM.tabNotes('historical')}`;

  // Draw only where a canvas was actually rendered: mkChart hands $(id)
  // straight to Chart, and `new Chart(null, …)` throws into MGM.refresh's
  // catch — blanking the very tab that just explained why there is no chart.
  if (st.history.length) MGM.drawHistory(st);
  if (years.length) MGM.drawMonthlyHistory(st);
};

MGM.drawHistory = function (st) {
  const h = st.history;
  mkChart('#chHistory', {
    type: 'bar',
    data: { labels: h.map(x => x.year), datasets: [
      // null, not 0: a year with no figure entered has to be a gap in the
      // series, not a bar sitting on the axis.
      { label: "New signups (Roady's)", data: h.map(x => x.newR == null ? null : x.newR),
        backgroundColor: css('--gain') },
      { label: 'Lost', data: h.map(x => x.lost == null ? null : -x.lost),
        backgroundColor: css('--loss') }
    ]},
    options: (() => { const o = baseOpts(); o.scales.x.stacked = true; o.scales.y.stacked = true; return o; })()
  });
};

MGM.drawMonthlyHistory = function (st) {
  const mh = st.monthlyHistory || {};
  const years = Object.keys(mh).map(Number)
    .filter(y => Number.isFinite(y)).sort((a, b) => a - b);
  const labels = [], data = [];
  // Same normalization as the grid, for the same reason: a row that is not an
  // array would throw here instead, and the chart has to plot exactly the
  // twelve cells the grid shows.
  years.forEach(y => MGM.monthlyRow(mh[y]).cells.forEach((v, i) => {
    labels.push(`${MONTH_NAMES[i]} ${String(y).slice(2)}`);
    data.push(v == null ? null : v);
  }));
  mkChart('#chMonthly', {
    type: 'bar',
    data: { labels, datasets: [{ label: 'New signups', data, backgroundColor: css('--gain') }] },
    options: baseOpts()
  });
};

/* ═══════════════ BINDING (Task 8) ═══════════════ */
// data-k       scalar — number | text | date | select, dotted state path
// data-k-list  repeating rows — add / remove / reorder
// data-k-text  prose — multi-line, stored as plain text
// Every control writes to MGM.state and nothing else, so localStorage,
// scenarios, Supabase sync and JSON export all follow for free.
MGM.bindAll = function (root) {
  root = root || document;

  // A non-admin gets no write listeners at all. The server would refuse the
  // write anyway (the RLS write policies are the real boundary), but a field
  // that accepts a keystroke and then silently fails to persist is the same
  // "looks saved, wasn't" defect MGM.bindWrite's refusal machinery exists to
  // prevent. applyWriteFailures still runs, so a refusal raised before the
  // mode changed stays visible; then we return, which costs a read-only
  // visitor nothing -- tab switching, print and export are inline handlers
  // elsewhere, not bound here.
  const ro = !MGM.canEdit();
  root.querySelectorAll('[data-k],[data-k-text]').forEach(el => {
    if ('disabled' in el) el.disabled = ro;
    el.classList.toggle('read-only', ro);
  });
  if (ro) {
    // The prose textareas carry no `value` attribute in their markup -- the
    // binding pass below is what fills them from state. Returning before that
    // would show a read-only viewer EMPTY notes on every tab and print an
    // empty Notes block into their report, which reads as "no assumptions
    // were recorded" rather than "you may not edit them". So hydrate first,
    // then return without attaching listeners.
    root.querySelectorAll('[data-k-text]').forEach(el => {
      el.value = MM.getPath(MGM.state, el.dataset.kText) || '';
    });
    MGM.applyWriteFailures(root);
    return;
  }

  root.querySelectorAll('[data-k]').forEach(el => {
    if (el.dataset.mgmBound) return;
    el.dataset.mgmBound = '1';
    if (!('value' in el)) return;            // read-only display cell
    const path = el.dataset.k;
    const ev = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const raw = el.value;
      MGM.bindWrite(el, path,
        el.type === 'number' ? (raw === '' ? null : Number(raw)) : raw);
      MGM.save();
      MGM.refreshSoft();
    });
  });

  root.querySelectorAll('[data-k-text]').forEach(el => {
    if (el.dataset.mgmBound) return;
    el.dataset.mgmBound = '1';
    const path = el.dataset.kText;
    el.value = MM.getPath(MGM.state, path) || '';
    el.addEventListener('input', () => {
      MGM.bindWrite(el, path, el.value);
      MGM.save();
    });
  });

  // Must run AFTER binding, on every call: bindAll is invoked at the end of
  // every MGM.refresh(), which is the redraw that would otherwise have wiped
  // the refusal marker created by the write that triggered the redraw.
  MGM.applyWriteFailures(root);
};

// A refused write must not look like a successful one. `setPath` returns the
// object unchanged when a path contains a reserved segment (__proto__,
// constructor, prototype) — see Task 3. Throwing here would break the page
// mid-keystroke inside an input handler, and silence would let someone edit a
// field, watch it "take", and build a report on a value that never landed.
// So: write, read back, and surface a visible inline warning on mismatch.
MGM.writeFailed = {};          // path -> true, cleared on a successful write

// The note is keyed to the FIELD, not to a shared parent. A parent-scoped
// lookup meant that when two bound inputs were direct siblings, a successful
// write on one DELETED the other's visible note.
MGM.refusedNoteId = path => 'refused-' + String(path).replace(/[^A-Za-z0-9_.-]/g, '_');

MGM.showRefusal = function (el, path, failed) {
  el.classList.toggle('write-refused', failed);
  const id = MGM.refusedNoteId(path);
  let note = document.getElementById(id);
  if (failed && !note) {
    note = document.createElement('div');
    note.className = 'refused-note';
    note.id = id;
    note.textContent = 'This value was not saved — the field name is reserved. Rename it and try again.';
    el.insertAdjacentElement('afterend', note);
  } else if (!failed && note) {
    note.remove();
  }
};

MGM.bindWrite = function (el, path, value) {
  MM.setPath(MGM.state, path, value);
  const landed = MM.getPath(MGM.state, path);
  const ok = JSON.stringify(landed) === JSON.stringify(value);
  if (ok) { delete MGM.writeFailed[path]; }
  else { MGM.writeFailed[path] = true; }
  MGM.showRefusal(el, path, !ok);
  return ok;
};

// Re-apply refusal markers after a redraw. WITHOUT THIS THE WHOLE MECHANISM IS
// INERT: the scalar listener runs bindWrite -> save -> refreshSoft, and
// refreshSoft re-renders the panel, destroying the class and the note bindWrite
// just created — so a refused write would again look identical to a successful
// one. MGM.writeFailed is the persistent record; this is what makes it visible
// again. Called at the end of bindAll, which runs after every refresh.
MGM.applyWriteFailures = function (root) {
  (root || document).querySelectorAll('[data-k],[data-k-text]').forEach(el => {
    const path = el.dataset.k || el.dataset.kText;
    if (path) MGM.showRefusal(el, path, !!MGM.writeFailed[path]);
  });
};

MGM.addRow = function (listPath, template) {
  if (!MGM.requireAdmin('Adding a row')) return;
  const list = MM.getPath(MGM.state, listPath) || [];
  list.push(JSON.parse(JSON.stringify(template)));
  MM.setPath(MGM.state, listPath, list);
  MGM.save(); MGM.refresh();
};

MGM.removeRow = function (listPath, i) {
  if (!MGM.requireAdmin('Removing a row')) return;
  (MM.getPath(MGM.state, listPath) || []).splice(i, 1);
  MGM.save(); MGM.refresh();
};

MGM.moveRow = function (listPath, i, delta) {
  if (!MGM.requireAdmin('Reordering rows')) return;
  const list = MM.getPath(MGM.state, listPath) || [];
  const j = i + delta;
  if (j < 0 || j >= list.length) return;
  const [row] = list.splice(i, 1);
  list.splice(j, 0, row);
  MGM.save(); MGM.refresh();
};

MGM.rowTools = function (listPath, i, len) {
  return `<span class="mgm-editonly">
    <button class="btn" title="Move up" onclick="MGM.moveRow('${listPath}',${i},-1)" ${i === 0 ? 'disabled' : ''}>▲</button>
    <button class="btn" title="Move down" onclick="MGM.moveRow('${listPath}',${i},1)" ${i === len - 1 ? 'disabled' : ''}>▼</button>
    <button class="btn" title="Remove" onclick="MGM.removeRow('${listPath}',${i})">✕</button>
  </span>`;
};

// ── Edited markers and reset ──────────────────────────────────────────────
// For a path inside a REORDERABLE array (groups.2.count), the index is not an
// identity: moveRow/removeRow renumber rows, so comparing state[i] against
// config[i] would badge a row against an unrelated config row. These arrays
// each carry a stable identifying field, so resolve the matching config row by
// that instead. A row the user added has no config counterpart and is edited
// by definition.
MGM.ROW_KEYS = { 'groups': 'key', 'sources': 'key', 'staffing.reps': 'name', 'history': 'year' };

MGM.isEdited = function (path) {
  const m = String(path).match(/^(.+?)\.(\d+)(?:\.(.+))?$/);
  const idField = m && MGM.ROW_KEYS[m[1]];
  if (idField) {
    const row = (MM.getPath(MGM.state, m[1]) || [])[+m[2]];
    if (!row) return false;
    const cfgRow = (MM.getPath(MGM_CONFIG, m[1]) || [])
      .find(r => r && r[idField] === row[idField]);
    if (!cfgRow) return true;                        // user-added row
    const field = m[3];
    // The identity field cannot be checked against the row we just FOUND by
    // matching that same field — `row[idField] === cfgRow[idField]` holds by
    // construction, so a real rename would never badge. (Renaming a rep
    // "Robert Watson" -> "Angel Long" locates Angel Long's shipped row and
    // reports no edit.) Fall back to a positional comparison for that one
    // field: after a reorder it can badge a row that was not edited, but a
    // false POSITIVE is the safe direction here — a false negative tells the
    // reader a hand-typed value is sourced data.
    if (field === idField) {
      const cfgAtIdx = (MM.getPath(MGM_CONFIG, m[1]) || [])[+m[2]];
      return !cfgAtIdx
        || JSON.stringify(row[field]) !== JSON.stringify(cfgAtIdx[field]);
    }
    return JSON.stringify(field ? row[field] : row)
        !== JSON.stringify(field ? cfgRow[field] : cfgRow);
  }
  return JSON.stringify(MM.getPath(MGM.state, path))
      !== JSON.stringify(MM.getPath(MGM_CONFIG, path));
};

MGM.editedMark = function (path) {
  return MGM.isEdited(path)
    ? '<span class="edited" title="Differs from the shipped default">edited</span>' : '';
};

MGM.resetSection = function (path) {
  if (!MGM.requireAdmin('Resetting a section')) return;
  const dflt = MM.getPath(MGM_CONFIG, path);
  if (dflt === undefined) return;
  MM.setPath(MGM.state, path, JSON.parse(JSON.stringify(dflt)));
  MGM.save(); MGM.refresh();
};

MGM.resetAll = function () {
  if (!MGM.requireAdmin('Resetting every value')) return;
  if (!confirm('Reset every value and label to the shipped defaults?')) return;
  MGM.state = MM.defaultState(MGM_CONFIG);
  MGM.save(); MGM.refresh();
};

// ── Edit mode ─────────────────────────────────────────────────────────────
// View-only state: never persisted into a scenario, never affects the model,
// and always off for print so the report shows values, not form controls.
MGM.editMode = false;
MGM.toggleEdit = function () {
  // The UI gate is NOT the security boundary -- the RLS write policies on
  // mgm_scenarios / mgm_pnl_actuals are, and they hold against a console
  // user who sets MGM.isAdmin = true. This exists so the tool does not invite
  // an edit the server will then refuse, and so a read-only viewer is told
  // plainly that they are one. A disabled control with a stated reason beats
  // a missing one, so the button stays and explains itself.
  if (!MGM.requireAdmin('Editing')) return;
  MGM.editMode = !MGM.editMode;
  document.body.classList.toggle('mgm-edit', MGM.editMode);
  document.getElementById('editBtn').textContent =
    MGM.editMode ? '✓ Done editing' : '✎ Edit';
  MGM.refresh();
};
window.addEventListener('beforeprint', () => document.body.classList.remove('mgm-edit'));
window.addEventListener('afterprint', () =>
  document.body.classList.toggle('mgm-edit', MGM.editMode));

/* ═══════════════ SIGN-IN, ADMIN STATUS, CLOUD SYNC (Tasks 16 / 19) ═══════════════ */

// Never construct a client here. roadysBD.js owns the one client whose session
// the RLS policies recognise; a second client would carry no session and every
// query would 403. (Same note as CRM.html and bus-dev-potential-gallons.)
MGM.sb = function () {
  try { return (window.RoadysBD && RoadysBD.auth.client()) || null; }
  catch (e) { return null; }
};

MGM.authEmail = function () {
  try { return (window.RoadysBD && RoadysBD.auth.email()) || ''; }
  catch (e) { return ''; }
};

// Ported from bus-dev-potential-gallons/index.html:8700-8732 so all four pages
// present the same gate. Sign-ups are disabled in the Supabase dashboard, so
// the account list IS the allowlist -- deliberately no sign-up affordance.
// Unlike BDPG this is an ACTION, not a boot gate: the tool stays fully usable
// unsigned (view, print, export), so nothing is hidden behind it.
function bdShowLoginGate(onReady) {
  RoadysBD.auth.init().then(function (session) {
    if (session) { onReady(); return; }
    var ov = document.createElement('div');
    ov.className = 'pin-overlay';
    ov.innerHTML =
      '<div class="pin-box">' +
      '<h3>🔒 Sign in</h3>' +
      '<p>Membership Growth Model — Roady\'s</p>' +
      '<input type="email" class="pin-input bd-email" placeholder="email" autocomplete="username"/>' +
      '<input type="password" class="pin-input bd-pw" placeholder="password" autocomplete="current-password"/>' +
      '<div class="pin-err"></div>' +
      '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center">' +
      '<button class="btn" data-mgm-cancel>Cancel</button>' +
      '<button class="btn primary bd-go">Sign in</button></div>' +
      '</div>';
    document.body.appendChild(ov);
    var em = ov.querySelector('.bd-email'), pw = ov.querySelector('.bd-pw'),
        err = ov.querySelector('.pin-err'), go = ov.querySelector('.bd-go'),
        cancel = ov.querySelector('[data-mgm-cancel]');
    var submit = function () {
      err.textContent = '';
      go.disabled = true; go.textContent = 'Signing in…';
      RoadysBD.auth.signIn(em.value.trim(), pw.value).then(function (r) {
        go.disabled = false; go.textContent = 'Sign in';
        if (!r.ok) { err.textContent = r.error || 'Sign-in failed'; pw.value = ''; pw.focus(); return; }
        ov.remove();
        onReady();
      });
    };
    go.onclick = submit;
    // BDPG's gate has no Cancel because the page is unusable without a
    // session. This one is dismissable: everything except cloud sync and the
    // P&L reconciliation works signed out, so trapping the reader behind an
    // overlay they do not need would be the wrong trade.
    if (cancel) cancel.onclick = function () { ov.remove(); };
    [em, pw].forEach(function (i) {
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    });
    setTimeout(function () { em.focus(); }, 50);
  });
}

// Resolve admin status SERVER-side. Do NOT reimplement this as a client query:
// a `.ilike('email', email)` would make the user's own address a SQL pattern
// (PostgREST passes the value through as a LIKE pattern, so `_`, `%` and -- via
// PostgREST's own `*` translation -- `*` are all wildcards), and a second
// implementation of a security predicate can disagree with the first. The RPC
// is SECURITY DEFINER, pins search_path, reads auth.jwt()->>'email' (which the
// client cannot forge), and is the IDENTICAL predicate the RLS write policies
// on mgm_scenarios / mgm_pnl_actuals evaluate.
MGM.adminError = '';
MGM.loadAdminStatus = async function () {
  const sb = MGM.sb();
  const email = MGM.authEmail();
  MGM.adminError = '';
  // No client and no session: anonymous, which is "not determined", not "not
  // an admin" -- the bar wording differs between the two.
  if (!sb || !email) { MGM.isAdmin = null; return; }
  try {
    const { data, error } = await sb.rpc('mgm_is_admin');
    // A query error counts as NOT admin -- failing closed, because the
    // alternative is granting edit rights on a network hiccup. The reason is
    // kept separately so the bar can say "could not be confirmed" instead of
    // asserting the roster does not list them, which would be a different
    // claim and might be false.
    if (error) { MGM.isAdmin = false; MGM.adminError = error.message || String(error); return; }
    // `data === true`, never a truthy test: mgm_is_admin() RETURNS boolean, so
    // a scalar-returning RPC lands the value directly in `data` (same shape as
    // aggregator-planner.html's get_optin_token, which uses `data` as the
    // scalar). A `"f"` or a `0` must not pass.
    MGM.isAdmin = (data === true);
  } catch (e) {
    MGM.isAdmin = false;
    MGM.adminError = e.message || String(e);
  }
};

// ── The auth / permission bar ─────────────────────────────────────────────
// One function renders the whole #authBar, because the account identity and
// the permission level are one sentence to the reader and two functions
// writing the same element would race. Every state is named in WORDS: a bar
// that implies a mode instead of stating it is how a user ends up misreading
// their own permissions.
MGM.renderAuth = function () {
  const email = MGM.authEmail();
  const admin = MGM.canEdit();

  // The ONLY place body.mgm-admin is set or cleared. The CSS rule
  // `body:not(.mgm-admin) .mgm-editonly{display:none}` hides every edit
  // control -- including an admin's -- if this line is ever dropped.
  document.body.classList.toggle('mgm-admin', admin);

  // Losing admin (sign-out, or a session expiring in another tab) must also
  // drop edit mode. Otherwise body.mgm-edit survives with no way to turn it
  // off, since toggleEdit() now refuses for a non-admin.
  if (!admin && MGM.editMode) {
    MGM.editMode = false;
    document.body.classList.remove('mgm-edit');
    const eb = document.getElementById('editBtn');
    if (eb) eb.textContent = '✎ Edit';
  }

  let bar;
  if (!email) {
    bar = '<span class="adminbar ro">Read-only — sign in as an admin to edit</span>';
  } else if (MGM.isAdmin === true) {
    bar = '<span class="adminbar rw">Admin — editing enabled</span>';
  } else if (MGM.isAdmin === false && MGM.adminError) {
    // Signed in, but the check itself failed. "Not an admin" would be a claim
    // about the roster that this code has no evidence for; it is still
    // read-only, because the check fails closed.
    bar = '<span class="adminbar ro">Read-only — your access could not be confirmed</span>';
  } else if (MGM.isAdmin === false) {
    bar = '<span class="adminbar ro">Read-only — this account is not an admin</span>';
  } else {
    // Signed in, isAdmin still null: the RPC has not answered. Saying either
    // "not an admin" or "sign in" here would be false, so it says neither.
    bar = '<span class="adminbar pending">Checking your access…</span>';
  }

  // Two different buttons, not one disabled one. Pushing is admin-only
  // (mgm_scenarios INSERT/UPDATE are WITH CHECK mgm_is_admin()), so offering
  // a non-admin a "Sync" button means offering a save the database will
  // refuse -- and reading mgm_scenarios IS open to any signed-in user, so
  // there is a genuinely useful action to offer them instead. The label says
  // which half they get.
  const cloudBtn = admin
    ? '<button class="btn ghost" onclick="MGM.syncScenarios()" title="Push local scenarios to the shared set, then merge the shared set back down">☁️ Sync scenarios</button>'
    : '<button class="btn ghost" onclick="MGM.pullScenarios()" title="Read the shared scenarios. Saving is limited to administrators, so nothing is pushed.">☁️ Refresh shared scenarios</button>';

  document.getElementById('authBar').innerHTML = email
    ? `<span class="who">${esc(email)}</span>${bar}${cloudBtn}
       <button class="btn ghost" onclick="RoadysBD.auth.signOut().then(function(){location.reload();})">Sign out</button>`
    : `${bar}<button class="btn ghost" onclick="MGM.signIn()">Sign in to sync</button>`;

  if (MGM.adminError) {
    document.getElementById('authBar').innerHTML +=
      `<span class="who" title="${esc(MGM.adminError)}">(admin check failed)</span>`;
  }
};

MGM.signIn = function () {
  bdShowLoginGate(async () => {
    // AWAIT, in this order, and all of them. loadAdminStatus must resolve
    // before anything renders or loadPnlActuals decides its reason: an
    // unawaited call leaves MGM.isAdmin null, which renders every data-k
    // input disabled and would land an admin on a read-only page until some
    // later redraw happened to unlock it.
    await MGM.loadAdminStatus();
    await MGM.loadPnlActuals();
    await MGM.loadPipeline();
    // PULL only, never push, on sign-in. Reading mgm_scenarios is open to any
    // signed-in user; writing is admin-only, so an automatic push here would
    // hand a non-admin a wall of server refusals for something they never
    // asked for. Pushing is the explicit ☁️ Sync button.
    await MGM.pullScenarios({ quiet: true });
    MGM.renderAuth();
    MGM.refresh();
  });
};

// ── The gated P&L ─────────────────────────────────────────────────────────
// Two sources, neither of them this repo's committed files: the admin-gated
// mgm_pnl_actuals table in production, and a gitignored local file for
// development. Sets MGM.pnlReason alongside the data -- see its declaration
// for why the reason is not inferred from an empty result.
MGM.loadPnlActuals = async function () {
  MGM.pnlError = '';
  // Clear the session-only margin FIRST, so a failed or downgraded reload
  // (signed out, admin check now failing) cannot leave the previous load's
  // figure driving the lens while every caption says nothing is loaded.
  MGM.loadedMarginPct = null;
  MGM.loadedNetMarginPct = null;
  MGM.loadedMarginBasisDetail = null;
  if (typeof MGM_PNL_ACTUALS !== 'undefined' && MGM_PNL_ACTUALS) {
    MGM.pnlActuals = MGM_PNL_ACTUALS;       // gitignored dev fallback
    MGM.pnlReason = 'ok';
    MGM.applyPnlTotals(MGM_PNL_ACTUALS.totals || {});
    return;
  }
  const sb = MGM.sb();
  if (!sb || !MGM.authEmail()) {
    MGM.pnlActuals = null; MGM.pnlReason = 'anon'; return;
  }
  // The admin check is the input, read defensively so this composes whether
  // loadAdminStatus() ran first or not. Anything other than an explicit
  // `false` is 'anon' -- "not an admin" must never be claimed before the
  // server has actually said so.
  if (MGM.isAdmin !== true) {
    MGM.pnlActuals = null;
    MGM.pnlReason = (MGM.isAdmin === false && !MGM.adminError) ? 'not-admin' : 'anon';
    return;
  }
  const { data, error } = await sb.from('mgm_pnl_actuals')
    .select('*').order('id', { ascending: false }).limit(1);
  if (error) {
    // A failure to READ is not "no data". Naming it keeps the tile from
    // asserting a business fact about a request that never completed.
    MGM.pnlActuals = null; MGM.pnlReason = 'error';
    MGM.pnlError = error.message || String(error);
    return;
  }
  if (!data || !data.length) {
    // An admin with an empty table. This is the state immediately after the
    // migration runs, and it must not look like a permission problem.
    MGM.pnlActuals = null; MGM.pnlReason = 'none-loaded'; return;
  }
  const row = data[0];
  const t = row.totals || {};
  MGM.pnlActuals = {
    periodLabel: row.period_label,
    totalPerMemberYr: t.totalPerMemberYr,
    streams: row.streams || {}
  };
  MGM.pnlReason = 'ok';
  MGM.applyPnlTotals(t);
};

// The real EBITDA margin and its basis detail are auth-gated and never
// committed. Apply them to state only once a session has supplied them, and
// only if the user has not already typed a margin of their own -- overwriting
// a hand-entered assumption with a loaded one would silently replace the
// reader's own input.
MGM.applyPnlTotals = function (t) {
  t = t || {};
  // Same validity checks as before -- an empty string and a null both coerce
  // to a number isFinite() accepts, so both are rejected explicitly. What
  // changed is the destination: these land on MGM, never on MGM.state. The
  // "only if the user has not already typed one" rule moved with them, to
  // MGM.runFor, where the typed value is still what wins.
  const num = k => (t[k] !== null && t[k] !== '' && t[k] !== undefined
                    && isFinite(Number(t[k]))) ? Number(t[k]) : null;
  // ONLY ebitdaMarginPct drives the EBITDA lens. A net margin is not an EBITDA
  // margin, and feeding one into the other's slot is the misattribution the
  // add-backs provenance note was rewritten to remove -- so netMarginPct is
  // recorded for that note to name and is never applied to anything.
  MGM.loadedMarginPct = num('ebitdaMarginPct');
  MGM.loadedNetMarginPct = num('netMarginPct');
  MGM.loadedMarginBasisDetail = t.marginBasisDetail || null;
};

// What the reconciliation tile (and the Valuation card) says for each reason.
// One table, so two surfaces cannot give a reader two different explanations
// of the same state -- and so none of them can tell a signed-in non-admin to
// sign in, which is advice they have already taken and which will never work.
MGM.PNL_REASON_TEXT = {
  anon:          'sign in as an admin to reconcile',
  'not-admin':   'P&L reconciliation is limited to administrators',
  'none-loaded': 'no P&L period has been loaded yet — the table is empty',
  error:         'the P&L could not be loaded',
  // Reached only when a period DID load but carries no per-member total, since
  // every caller of pnlWhy() is already inside an "actual is missing" branch.
  // An empty string here would leave a blank cell, which asserts nothing and
  // explains nothing.
  ok:            'the loaded P&L period carries no per-member total'
};
MGM.pnlWhy = function () {
  if (MGM.pnlReason === 'error') {
    return MGM.PNL_REASON_TEXT.error + (MGM.pnlError ? ' — ' + MGM.pnlError : '');
  }
  // 'anon' is also the reason when the admin check has not resolved or failed,
  // because claiming "not an admin" before the server has said so would be a
  // claim we have no evidence for. But a reader WITH a session must never be
  // told to sign in -- they have, and it will never help. So the one reason
  // value carries three different sentences depending on why it is 'anon'.
  if (MGM.pnlReason === 'anon' && MGM.authEmail()) {
    return MGM.adminError
      ? 'your administrator access could not be confirmed — ' + MGM.adminError
      : 'checking whether this account is an administrator';
  }
  return MGM.PNL_REASON_TEXT[MGM.pnlReason] || 'not available';
};

// ── Scenario cloud sync ───────────────────────────────────────────────────
// Read, compute from that snapshot, write guarded by the `updated_at` we read.
// updated_at is trigger-maintained (touch_mgm_scenarios_updated_at), so it is
// the version token. An empty returned array means the guarded UPDATE matched
// nothing: NEVER retry -- a retry would overwrite whatever the other owner
// wrote.
//
// But an empty array has TWO causes under RLS and they need opposite messages.
// `mgm_scenarios_update` is `USING (mgm_is_admin())`, and a row a policy
// filters out is simply not there to update: PostgREST returns 200 with an
// empty body, NOT a 403. So a non-admin's refused write and a genuine
// concurrent edit are indistinguishable at this call site. We re-ask the
// server which one it was, with the same predicate the policy uses.
MGM.cloudSave = async function (rec) {
  const sb = MGM.sb();
  if (!sb) return { ok: false, reason: 'no-client' };

  const { data: existing, error: readErr } = await sb
    .from('mgm_scenarios').select('id,updated_at').eq('id', rec.id).maybeSingle();
  if (readErr) return { ok: false, reason: 'error', detail: readErr.message };

  const row = {
    id: rec.id, name: rec.name, scope: rec.scope || 'company',
    owner_email: MGM.authEmail(),
    state: rec.state
  };

  if (!existing) {
    const { error } = await sb.from('mgm_scenarios').insert(row);
    // An INSERT refused by WITH CHECK does raise an error (42501), unlike the
    // UPDATE above, so a non-admin's first save is named correctly here
    // without a second round trip.
    if (error) {
      return /row-level security|42501|permission/i.test(error.message || '')
        ? { ok: false, reason: 'refused', detail: error.message }
        : { ok: false, reason: 'conflict', detail: error.message };
    }
    return { ok: true, created: true };
  }

  const seen = existing.updated_at;
  const { data, error } = await sb.from('mgm_scenarios')
    .update(row).eq('id', rec.id).eq('updated_at', seen).select();
  if (error) {
    return /row-level security|42501|permission/i.test(error.message || '')
      ? { ok: false, reason: 'refused', detail: error.message }
      : { ok: false, reason: 'error', detail: error.message };
  }
  if (!data || data.length === 0) {
    // Ask the server which of the two it was rather than guessing. Without
    // this, a non-admin is told "someone else changed it first" -- a specific
    // factual claim about another person's edit, invented to explain a
    // permission denial.
    await MGM.loadAdminStatus();
    return MGM.isAdmin === true
      ? { ok: false, reason: 'conflict' }
      : { ok: false, reason: 'refused' };
  }
  return { ok: true };
};

// Merge the shared cloud set down into the local list. Read-only, so any
// signed-in user can run it; the sign-in path uses this instead of a full
// sync so nobody is handed refusals they did not ask for.
MGM.pullScenarios = async function (opts) {
  opts = opts || {};
  const sb = MGM.sb();
  if (!sb || !MGM.authEmail()) return { ok: false, reason: 'anon' };
  const { data: cloud, error } = await sb
    .from('mgm_scenarios').select('*').eq('scope', 'company');
  if (error) {
    if (!opts.quiet) alert('Could not read cloud scenarios: ' + error.message);
    return { ok: false, reason: 'error', detail: error.message };
  }
  const local = MGM.scenarioList();
  const buried = MGM.scenarioTombstones();
  let pulled = 0, skipped = 0;
  (cloud || []).forEach(c => {
    // A scenario deleted here stays deleted here. mgm_scenarios has no DELETE
    // policy by design, so the cloud row outlives a local delete -- without
    // this the next pull would resurrect it and nothing would explain why.
    if (buried.indexOf(c.id) >= 0) { skipped++; return; }
    const rec = { id: c.id, name: c.name, scope: c.scope, state: c.state, updated_at: c.updated_at };
    const i = local.findIndex(s => s.id === c.id);
    if (i >= 0) local[i] = rec; else { local.push(rec); pulled++; }
  });
  MGM.scenarioWriteAll(local);
  MGM.refresh();
  const out = { ok: true, cloudCount: (cloud || []).length, pulled, skipped };
  if (!opts.quiet) {
    // A button that completes silently looks broken, and "0 new" has to be
    // distinguishable from "it did not run".
    alert(`${out.cloudCount} shared scenario(s) in the cloud; ${pulled} new here, ` +
      `${out.cloudCount - pulled - skipped} already present` +
      (skipped ? `, ${skipped} you deleted locally and left alone.` : '.') +
      (MGM.canEdit() ? '' : '\n\nNothing was pushed — saving scenarios is limited to administrators.'));
  }
  return out;
};

MGM.syncScenarios = async function () {
  const sb = MGM.sb();
  if (!sb || !MGM.authEmail()) {
    alert('Sign in first to sync scenarios.');
    return;
  }
  const list = MGM.scenarioList();
  if (!list.length) {
    // Nothing to push is not a failure, and "0 pushed" with no explanation
    // reads like one.
    const r0 = await MGM.pullScenarios({ quiet: true });
    alert(r0.ok
      ? `No local scenarios to push. ${r0.cloudCount} shared scenario(s) in the cloud` +
        (r0.skipped ? `, ${r0.skipped} of them deleted locally and left alone.` : '.')
      : 'Could not read cloud scenarios: ' + (r0.detail || r0.reason));
    MGM.renderAuth();
    return;
  }

  let pushed = 0;
  const conflicts = [], refused = [], errors = [];
  for (const rec of list) {
    const r = await MGM.cloudSave(rec);
    if (r.ok) pushed++;
    else if (r.reason === 'conflict') conflicts.push(rec.name);
    else if (r.reason === 'refused') refused.push(rec.name);
    else errors.push(rec.name + ': ' + (r.detail || r.reason));
  }

  const pull = await MGM.pullScenarios({ quiet: true });
  if (!pull.ok) { alert('Pushed ' + pushed + ', but reading the cloud back failed: ' + (pull.detail || pull.reason)); return; }

  const parts = [`Pushed ${pushed} of ${list.length}; ${pull.cloudCount} shared scenario(s) in the cloud.`];
  if (refused.length) parts.push(
    `The server REFUSED these — writing scenarios is limited to administrators, ` +
    `so nothing was saved for them: ${refused.join(', ')}.`);
  if (conflicts.length) parts.push(
    `Someone else changed these first, so they were NOT overwritten: ${conflicts.join(', ')}. ` +
    `Reload to see their version before saving again.`);
  if (errors.length) parts.push(`Failed: ${errors.join('; ')}.`);
  if (pull.skipped) parts.push(
    `${pull.skipped} cloud scenario(s) you deleted locally were left in place and not pulled back — ` +
    `removing the shared copy is a Supabase SQL-editor job.`);
  alert(parts.join('\n\n'));
  MGM.renderAuth();
};

/* ═══════════════ SCENARIOS (Task 14) ═══════════════ */

const SCEN_KEY = 'roadys_mgm_scenarios_v1';
// Local tombstones. mgm_scenarios has NO DELETE policy and no DELETE grant --
// deliberately, since browser-initiated deletes of shared state are not
// wanted -- so a deleted scenario's cloud row survives. Without this list the
// next pull brings it straight back and the delete appears to undo itself.
// The list is the mechanism; scenarioDelete() states the consequence in words.
const SCEN_DELETED_KEY = 'roadys_mgm_scenarios_deleted_v1';

// Fields that live in `state` but are view/meta, not model inputs. They are
// absent from MGM_CONFIG, so mergeState correctly reports them as "unknown"
// (a field this build does not have) -- which would make every scenario saved
// after a preset was applied announce a phantom obsolete field. Filtered out
// of the notice, not out of the state.
const SCEN_META_KEYS = ['activeScenario'];

MGM.scenarioList = function () {
  try {
    const v = JSON.parse(localStorage.getItem(SCEN_KEY));
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
};

MGM.scenarioWriteAll = function (list) {
  try { localStorage.setItem(SCEN_KEY, JSON.stringify(list)); }
  catch (e) { alert('Could not save the scenario — browser storage is full.'); }
};

MGM.scenarioTombstones = function () {
  try {
    const v = JSON.parse(localStorage.getItem(SCEN_DELETED_KEY));
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
};

MGM.scenarioBury = function (id, bury) {
  const t = MGM.scenarioTombstones().filter(x => x !== id);
  if (bury) t.push(id);
  try { localStorage.setItem(SCEN_DELETED_KEY, JSON.stringify(t)); } catch (e) {}
};

MGM.scenarioId = name => 'scn_' + String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-');

MGM.scenarioSave = function () {
  // Not just a UI nicety: mgm_scenarios INSERT/UPDATE are
  // `WITH CHECK (mgm_is_admin())`, so a non-admin's save would be refused by
  // the database on the next sync anyway. Better to say so before they type a
  // name than after.
  if (!MGM.requireAdmin('Saving a scenario')) return;
  const name = (prompt('Scenario name:', MGM.state.activeScenario || 'Base') || '').trim();
  if (!name) return;
  const list = MGM.scenarioList();
  const id = MGM.scenarioId(name);
  const rec = {
    id, name, scope: 'company',
    state: JSON.parse(JSON.stringify(MGM.state)),
    updated_at: new Date().toISOString()
  };
  const i = list.findIndex(s => s.id === id);
  if (i >= 0) {
    // Name the EXISTING row, not the name just typed. The id is a slug of the
    // name, so "Base Case" and "Base-Case" share one id -- quoting the new
    // name would ask permission to overwrite a scenario that does not exist
    // while silently replacing one that does.
    if (!confirm(list[i].name === name
      ? `Overwrite the saved scenario "${name}"?`
      : `"${name}" and the saved scenario "${list[i].name}" share the same id (${id}).\n\nSaving will REPLACE "${list[i].name}". Continue?`)) return;
    list[i] = rec;
  } else { list.push(rec); }
  MGM.scenarioWriteAll(list);
  // Re-saving a name that was deleted before is an un-delete, so the
  // tombstone has to go or the next pull would silently drop it again.
  MGM.scenarioBury(id, false);
  MGM.state.activeScenario = name;
  MGM.scenarioNotice = null;
  MGM.save(); MGM.refresh();
};

MGM.scenarioLoad = function (id) {
  const rec = MGM.scenarioList().find(s => s.id === id);
  if (!rec) return;
  // MM.mergeState, not Object.assign: a shallow merge replaces each of the 17
  // nested top-level keys wholesale, so a scenario saved before a nested field
  // existed reopens with that field undefined -- and MM._n(undefined) is 0, a
  // silent zero rather than an error. mergeState mutates its first argument,
  // so it gets a fresh defaultState every time.
  const merged = MM.mergeState(MM.defaultState(MGM_CONFIG), rec.state || {});
  MGM.state = merged.state;
  MGM.scenarioNotice = MGM.scenarioNoticeFor(rec, merged);
  MGM.save(); MGM.refresh();
};

// A silent default-fill is better than a silent zero, but it is still a number
// the user did not enter, so say so -- and say it somewhere a redraw does not
// wipe, which rules out alert(). Lives in #scenarioBar beside the scenario
// name and persists until another scenario is loaded or saved.
MGM.scenarioNotice = null;
MGM.scenarioNoticeFor = function (rec, merged) {
  const added = (merged.added || []).slice();
  const unknown = (merged.unknown || []).filter(p => SCEN_META_KEYS.indexOf(p) < 0);
  const ov = MGM.state.gallons && MGM.state.gallons.groupBaselineOverride;
  const overrides = ov ? Object.keys(ov).filter(k => ov[k] !== null && ov[k] !== '') : [];
  if (!added.length && !unknown.length && !overrides.length) return null;
  return { name: rec.name, added, unknown, overrides };
};

MGM.scenarioRename = function (id) {
  if (!MGM.requireAdmin('Renaming a scenario')) return;
  const list = MGM.scenarioList();
  const rec = list.find(s => s.id === id);
  if (!rec) return;
  const name = (prompt('Rename scenario:', rec.name) || '').trim();
  if (!name || name === rec.name) return;
  // The id is derived from the name, so a rename is a new id. Keep the old row
  // out of the way rather than leaving two copies behind.
  const newId = MGM.scenarioId(name);
  if (newId !== id && list.some(s => s.id === newId)) {
    alert('A scenario named "' + name + '" already exists.');
    return;
  }
  rec.name = name; rec.id = newId; rec.updated_at = new Date().toISOString();
  MGM.scenarioWriteAll(list);
  MGM.scenarioBury(newId, false);
  // The old cloud row cannot be deleted from here (no DELETE policy), and the
  // new id will be inserted on the next sync, so bury the old id or the next
  // pull re-adds the pre-rename copy alongside the renamed one.
  if (newId !== id) MGM.scenarioBury(id, true);
  if (MGM.state.activeScenario) MGM.state.activeScenario = name;
  MGM.save(); MGM.refresh();
  alert('Renamed locally. Sync to push the new name to the cloud. The pre-rename cloud row, if any, stays until it is removed in the Supabase SQL editor — it will not be pulled back here.');
};

MGM.scenarioDelete = function (id) {
  if (!MGM.requireAdmin('Deleting a scenario')) return;
  const rec = MGM.scenarioList().find(s => s.id === id);
  if (!rec) return;
  if (!confirm(`Delete the local scenario "${rec.name}"?\n\n` +
    'The shared cloud copy is NOT deleted — mgm_scenarios has no delete policy ' +
    'by design, so removing it is a Supabase SQL-editor job. This browser will ' +
    'stop showing it either way and will not pull it back.')) return;
  MGM.scenarioWriteAll(MGM.scenarioList().filter(s => s.id !== id));
  MGM.scenarioBury(id, true);
  if (MGM.scenarioNotice && MGM.scenarioNotice.name === rec.name) MGM.scenarioNotice = null;
  MGM.refresh();
  alert(`"${rec.name}" is gone from this browser and will not come back on the next sync. ` +
    `The shared copy is still in mgm_scenarios; to remove it for everyone, run in the Supabase SQL editor:\n\n` +
    `delete from public.mgm_scenarios where id = '${id}';\n\n` +
    `(That needs a role with delete rights — the browser has none, deliberately.)`);
};

MGM.applyPreset = function (name) {
  // A preset writes model inputs, so it is an edit, not a view.
  if (!MGM.requireAdmin('Applying a preset')) return;
  MM.applyScenario(MGM.state, name);
  MGM.scenarioNotice = null;
  MGM.save(); MGM.refresh();
};

// The bar outside the panels, so the active scenario name and any load notice
// survive a tab switch and every refresh.
MGM.renderScenarioBar = function () {
  const el = document.getElementById('scenarioBar');
  if (!el) return;
  const n = MGM.scenarioNotice;
  // A scenario saved before any preset was applied carries no activeScenario,
  // so fall back to the loaded record's name rather than printing an unnamed
  // "Loaded scenario" above a warning about it.
  const nm = MGM.state.activeScenario || (n && n.name) || '';
  if (!nm && !n) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const show = ps => ps.slice(0, 3).map(p => `<code>${esc(p)}</code>`).join(', ')
    + (ps.length > 3 ? `, and ${ps.length - 3} more` : '');
  let msg = '';
  if (n && n.added.length) msg += ` <span class="warn">This scenario predates
    ${n.added.length} field${n.added.length === 1 ? '' : 's'}</span>, now at
    ${n.added.length === 1 ? 'its' : 'their'} current default${n.added.length === 1 ? '' : 's'}:
    ${show(n.added)}. Review ${n.added.length === 1 ? 'it' : 'them'} before quoting a figure from it.`;
  if (n && n.unknown.length) msg += ` <span class="warn">It carries ${n.unknown.length}
    field${n.unknown.length === 1 ? '' : 's'} this build no longer uses</span>
    (${show(n.unknown)}); the value${n.unknown.length === 1 ? ' is' : 's are'} kept but unused.`;
  if (n && n.overrides.length) msg += ` <span class="warn">It carries overridden gallon
    baselines</span> that differ from the Bus Dev engine (${show(n.overrides)}) —
    see Fuel Gallon Production.`;
  el.style.display = '';
  el.innerHTML = `<div class="inner">${nm ? `Scenario: <b>${esc(nm)}</b>` : 'Loaded scenario'}${msg}</div>`;
};

// Each column is a FULL independent re-run through MGM.runFor, so a scenario
// differing in any input -- not just attrition -- shows its real effect, and
// the Current column is computed by exactly the code the rest of the page
// uses.
MGM.renderCompare = function () {
  const cols = [{ name: 'Current', state: MGM.state, live: true }]
    .concat(MGM.scenarioList().map(s => {
      // Deep merge here too: a comparison against a scenario that predates a
      // field must compare against that field's default, not against a zero.
      const merged = MM.mergeState(MM.defaultState(MGM_CONFIG), s.state || {});
      return {
        name: s.name, id: s.id, state: merged.state,
        stale: merged.added.length,
        extra: merged.unknown.filter(p => SCEN_META_KEYS.indexOf(p) < 0).length
      };
    }));

  const runs = cols.map(c => {
    const D = MGM.runFor(c.state);
    const last = D.R[D.R.length - 1];
    const lastF = D.F.length ? D.F[D.F.length - 1] : null;
    const years = D.M.years;
    return {
      name: c.name, id: c.id, live: c.live, stale: c.stale, extra: c.extra,
      D, last, lastF,
      // `cost.unset` is the same gate MGM.runFor applies to the valuation
      // override: with no costs entered, the cash bridge's EBITDA is revenue
      // minus nothing, so printing it as "EBITDA" would assert a 100% margin.
      ebitda: (!D.cost.unset && lastF) ? lastF.ebitda : null,
      // The valuation EBITDA lens is NOT the cash-bridge EBITDA above: with no
      // costs entered the lens can still rest on a margin or on add-backs. A
      // row labelled plain "EBITDA" reading an em dash beside a two-lens
      // "Indicated value" reads as a contradiction, so both are named.
      valBasis: !D.cost.unset ? 'real costs'
        : D.effectiveMargin != null
          ? pct1(D.effectiveMargin) + (D.marginFromPnl ? ' margin (P&L, this session)' : ' margin (entered)')
        : D.valuation.ebitdaBase ? 'add-backs only'
        : 'none',
      endLoc: years.length ? years[years.length - 1].end : null,
      netGrowth: years.length ? years[years.length - 1].end - years[0].start : null,
      newModeled: years.reduce((a, y) => a + y.newModeled, 0),
      lost: years.reduce((a, y) => a + y.lost, 0),
      steady: (c.state.attrition || {}).steady,
      basis: (c.state.salesPipeline || {}).basis
    };
  });

  // Every cell goes through a formatter that maps absence to an em dash. A
  // comparison table is the single most screenshot-able surface here, so a 0
  // standing for "could not be computed" would travel without its caption.
  const dash = (v, f) => (v === null || v === undefined || (typeof v === 'number' && !isFinite(v))) ? '—' : f(v);
  const rows = [
    ['Steady attrition',    r => pct1(r.steady)],
    ['Add basis',           r => r.basis === 'pipeline' ? 'Pipeline' : 'Flat'],
    ['Ending locations',    r => dash(r.endLoc, fmt)],
    ['Net growth',          r => dash(r.netGrowth, d => (d >= 0 ? '+' : '') + fmt1(d))],
    // newModeled, NOT newAdds: newAdds folds in the current year's YTD
    // signings, which are already inside the opening count, so it would
    // report a bigger number here than the New Additions tab shows.
    ['Modeled new members', r => dash(r.newModeled, fmt1)],
    ['Projected losses',    r => dash(r.lost, fmt1)],
    ['Final-year revenue',  r => dash(r.last ? r.last.total : null, fmM)],
    ['$/member/yr',         r => dash(r.last && r.last.members ? r.last.total / r.last.members : null, fm$)],
    // null when costs are unset, NOT 0: "EBITDA $0.00M" is a business claim
    // and the truth is that no costs were entered.
    ['EBITDA (cash bridge)', r => r.ebitda === null ? '— <span class="note">(no costs entered)</span>' : fmM(r.ebitda)],
    ['Valuation EBITDA basis', r => esc(r.valBasis)],
    // indicated, never mid: a scenario whose costs and margin are unset has
    // one live lens, and mid would report half of it.
    ['Indicated value',     r => dash(r.D.valuation.indicated, fmM)],
    ['Lenses with a basis', r => String(r.D.valuation.lensCount)]
  ];

  // A column header naming a scenario must not imply the comparison is
  // like-for-like when that scenario predates fields the current one has.
  const head = r => esc(r.name) + (r.live ? ' <span class="note">(live)</span>' : '')
    + (r.stale ? ` <span class="ovr" title="Fields this scenario did not carry, shown at today's defaults">${r.stale} defaulted</span>` : '')
    + (r.extra ? ` <span class="ovr" title="Fields this build no longer uses">${r.extra} unused</span>` : '');

  const anyStale = runs.some(r => r.stale || r.extra);

  return `<div class="card"><h3>Scenario comparison</h3>
    <div style="overflow-x:auto"><table>
      <tr><th>Measure</th>${runs.map(r => `<th class="num">${head(r)}</th>`).join('')}</tr>
      ${rows.map(([label, fn]) => `<tr><td>${label}</td>${
        runs.map(r => `<td class="num">${fn(r)}</td>`).join('')}</tr>`).join('')}
      <tr><td></td>${runs.map(r => r.id
        ? `<td class="num"><button class="btn" onclick="MGM.scenarioLoad('${esc(r.id)}')">Load</button>
           <button class="btn mgm-editonly" onclick="MGM.scenarioRename('${esc(r.id)}')">✎</button>
           <button class="btn mgm-editonly" onclick="MGM.scenarioDelete('${esc(r.id)}')">✕</button></td>`
        : '<td class="num"><span class="note">live</span></td>').join('')}</tr>
    </table></div>
    ${runs.length === 1
      ? `<p class="note">No saved scenarios yet — use <b>Save scenario…</b> in the header.
         The single column is the live model, not a comparison.</p>`
      : ''}
    ${anyStale
      ? `<p class="note"><span class="ovr">not fully like-for-like</span> A column marked
         <b>defaulted</b> was saved before some of today's inputs existed, so those cells
         carry current defaults rather than anything that scenario recorded. One marked
         <b>unused</b> carries inputs this build dropped. Load it to see which fields.</p>`
      : ''}
    <p class="note">Every column is a complete independent re-run of the model on
      that scenario's own inputs — not a re-scaled version of the live figures.</p>
    ${runs.some(r => r.D.marginFromPnl)
      ? `<p class="note"><span class="assume">session-only basis</span> The valuation
         columns rest on an EBITDA margin loaded from the P&amp;L for this session. It
         is deliberately not stored in any scenario, so a reader without
         administrator access sees the same scenarios valued on the revenue lens
         alone. That is a different figure, not a disagreement — and no direction
         is claimed for it here, because a margin-derived EBITDA lens can land
         either side of the revenue lens depending on the margin and the
         multiple.</p>`
      : ''}
  </div>`;
};

// ── Chart titles, tab notes and tab renaming ────────────────────────────────
// Every chart heading rendered by Tasks 9–13 is an input bound to its label,
// not static text, so "chart titles and axis labels" is editable uniformly.
MGM.chartTitle = function (key) {
  return `<h3><input class="lbl-in" type="text" data-k="labels.charts.${key}"
    value="${esc(MGM.state.labels.charts[key])}"></h3>`;
};

MGM.tabNotes = function (key) {
  return `<div class="card noprint-edit">
    <h3>Notes &amp; assumptions</h3>
    <textarea class="prose" data-k-text="labels.notes.${key}"
      placeholder="Assumptions and caveats for this tab — printed with the report."></textarea>
  </div>`;
};

MGM.tabRenameCard = function () {
  return `<div class="card mgm-editonly"><h3>Tab names</h3><table>` +
    TAB_ORDER.map(k => `<tr><td>${esc(MGM_CONFIG.labels.tabs[k])}</td>
      <td><input class="lbl-in" type="text" data-k="labels.tabs.${k}"
        value="${esc(MGM.state.labels.tabs[k])}"></td></tr>`).join('') +
    `</table><button class="btn" onclick="MGM.resetSection('labels.tabs')">Reset tab names</button></div>`;
};

/* theme toggle: pre-existing brand-bar control, independent of the v1
   growth model being ported out from under it here, so it is kept working
   rather than left as a dead button nobody owns in a later task. */
const themePref = localStorage.getItem('roadys_mgm_theme');
if (themePref) document.documentElement.dataset.theme = themePref;
else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = cur;
  localStorage.setItem('roadys_mgm_theme', cur);
  Object.values(CH).forEach(c => c.destroy()); CH = {};
  MGM.refresh();
};

document.addEventListener('DOMContentLoaded', async () => {
  MGM.renderTabs();
  MGM.switchTab('starting');

  // Restore the session BEFORE anything decides what the reader may do. Every
  // await below is load-bearing:
  //
  //  - loadAdminStatus is async, and an un-awaited call would leave
  //    MGM.isAdmin null through the first render: bindAll would disable every
  //    data-k input and an admin would land on a read-only page that only
  //    unlocks if something later happens to redraw.
  //  - loadPnlActuals reads MGM.isAdmin to pick its reason, so it must run
  //    after the admin check or it would report 'anon' to an admin.
  if (window.RoadysBD) { try { await RoadysBD.auth.init(); } catch (e) {} }
  await MGM.loadAdminStatus();
  MGM.renderAuth();
  await MGM.loadPnlActuals();
  // Unsigned, loadPipeline's own guard makes this a no-op and leaves
  // pipelineState at its 'unsigned' default.
  await MGM.loadPipeline();
  if (MGM.authEmail()) await MGM.pullScenarios({ quiet: true });
  MGM.loadRegionVariance();      // fetch + its own refresh; nothing waits on it
  MGM.renderAuth();
  MGM.refresh();
});
</script>
</body>
</html>
