<style>
:root{
  --red:#C4111B; --red-bright:#E8232E; --road:#14161B; --ink:#1A1C22; --ink-soft:#4A4E58;
  --bg:#F4F4F2; --surface:#FFFFFF; --line:#D9DCE1; --line-soft:#E8EAEE;
  --sign-green:#1E6B3C; --amber:#B96A00; --loss:#B3261E; --gain:#1E7A46;
  --chip:#EFF1F4; --th:#F7F8F9; --shadow:0 1px 3px rgba(20,22,27,.08);
  color-scheme: light;
}
[data-theme="dark"]{
  --red:#E8232E; --red-bright:#FF4049; --road:#0D0F13; --ink:#ECEEF1; --ink-soft:#A6ABB5;
  --bg:#14161B; --surface:#1C1F26; --line:#2C3038; --line-soft:#24272E;
  --sign-green:#2E8B52; --amber:#D98E2B; --loss:#F2655E; --gain:#4CC077;
  --chip:#262A32; --th:#20242B; --shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Barlow',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
h1,h2,h3,.disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.01em}
h2{font-size:26px;font-weight:600;margin:0 0 4px}
h3{font-size:19px;font-weight:600;margin:0 0 10px}
.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px}
a{color:var(--red)}
/* ── Brand bar ── */
.brandbar{background:var(--road);color:#fff;border-bottom:4px solid var(--red)}
.brandbar .inner{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brandbar img{height:52px;width:auto;display:block}
.brandbar.no-img img{display:none}
.authbar{display:inline-flex;align-items:center;gap:8px}
.brandbar .ttl{flex:1;min-width:220px}
.brandbar .ttl .t1{font-family:'Barlow Condensed';font-size:25px;font-weight:600;line-height:1.1}
.brandbar .ttl .t2{font-size:12.5px;color:#B9BEC7;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:'Barlow';font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-bright);border-color:var(--red-bright)}
.btn.ghost{background:transparent;border-color:#3A3F49;color:#E7E9ED}
.btn.ghost:hover{border-color:#8A909C}
/* ── Tabs ── */
.tabrail{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabrail .inner{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tab{font-family:'Barlow Condensed';font-size:16.5px;font-weight:600;padding:13px 16px 11px;border:0;background:none;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
/* ── Layout ── */
main{max-width:1240px;margin:0 auto;padding:26px 20px 80px}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.card .hd{padding:14px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card .bd{padding:16px 20px}
.note{font-size:12.5px;color:var(--ink-soft)}
.flag{display:inline-block;font-size:11px;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 6px;vertical-align:1px}
.src{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--chip);border-radius:4px;padding:2px 7px}
/* ── Highway-sign KPI ── */
.signrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.sign{background:var(--sign-green);border:3px solid #fff;outline:2px solid var(--sign-green);border-radius:10px;color:#fff;padding:12px 16px 10px}
.sign.red{background:var(--red);outline-color:var(--red)}
.sign.dark{background:var(--road);outline-color:var(--road)}
.sign .k{font-size:12px;font-weight:600;letter-spacing:.06em;opacity:.92}
.sign .v{font-family:'Barlow Condensed';font-size:38px;font-weight:700;line-height:1.05;margin-top:2px}
.sign .d{font-size:12px;opacity:.9;margin-top:2px}
/* ── Tables ── */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--th);text-align:left;font-weight:600;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-top:2px solid var(--line);background:var(--th)}
.pos{color:var(--gain);font-weight:600}.neg{color:var(--loss);font-weight:600}
/* ── Inputs: everything editable ── */
input[type=number],input[type=text],input[type=email],select{font-family:'Barlow';font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
input:focus,select:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
input.cell{width:84px;text-align:right;padding:4px 6px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.fieldrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:340px}
/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;padding:22px 24px;max-height:90vh;overflow:auto}
.modal h3{margin-top:0}
/* ── Report / letterhead ── */
#reportSheet{background:#fff;color:#1A1C22;border:1px solid var(--line);border-radius:8px;max-width:860px;margin:0 auto;padding:48px 56px;box-shadow:var(--shadow)}
#reportSheet .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:4px solid #C4111B;padding-bottom:16px;margin-bottom:8px}
#reportSheet .lh img{height:64px}
#reportSheet .lh .co{text-align:right;font-size:12px;color:#4A4E58;line-height:1.5}
#reportSheet h1{font-size:30px;margin:18px 0 2px}
#reportSheet .meta{font-size:12.5px;color:#4A4E58;margin-bottom:22px}
#reportSheet h2{font-size:20px;border-bottom:1px solid #D9DCE1;padding-bottom:4px;margin:26px 0 10px}
#reportSheet table{font-size:12.5px}
#reportSheet .rsign{display:inline-block;background:#1E6B3C;color:#fff;border:2px solid #fff;outline:1.5px solid #1E6B3C;border-radius:8px;padding:8px 16px;margin:4px 10px 4px 0}
#reportSheet .rsign .v{font-family:'Barlow Condensed';font-size:26px;font-weight:700}
#reportSheet .rsign .k{font-size:11px;letter-spacing:.05em}
#reportSheet .foot{margin-top:34px;padding-top:12px;border-top:1px solid #D9DCE1;font-size:11.5px;color:#4A4E58;display:flex;justify-content:space-between}
@media print{
  body.mgm-print{background:#fff}
  body.mgm-print .brandbar,body.mgm-print .tabrail,
  body.mgm-print .noprint,body.mgm-print .actions{display:none!important}
  body.mgm-print main{padding:0;max-width:none}
  body.mgm-print .panel{display:none!important}
  body.mgm-print #panel-report{display:block!important}
  body.mgm-print #reportSheet{border:0;box-shadow:none;padding:24px 8px;max-width:none}
}
@media(max-width:640px){
  .brandbar img{height:40px}
  #reportSheet{padding:24px 18px}
}
/* ── Universal editability (Task 8) ── */
/* Read mode shows values; edit mode reveals controls and row tools. */
.mgm-editonly{display:none}
body.mgm-edit .mgm-editonly{display:inline-flex;gap:6px}
.cell{border:1px solid transparent;background:transparent;color:inherit;
      font:inherit;width:100%;text-align:right;padding:3px 5px;border-radius:4px}
body.mgm-edit .cell{border-color:var(--line);background:var(--surface)}
.cell:focus{border-color:var(--red);outline:none}
.lbl-in{border:1px solid transparent;background:transparent;color:inherit;
        font:inherit;width:100%;padding:3px 5px;border-radius:4px}
body.mgm-edit .lbl-in{border-color:var(--line);background:var(--surface)}
.prose{width:100%;min-height:68px;font:inherit;color:inherit;
       background:var(--surface);border:1px solid var(--line);
       border-radius:6px;padding:8px 10px;resize:vertical}
.edited{color:var(--amber);font-size:11px;margin-left:5px}
.write-refused{border-color:var(--loss) !important;background:rgba(179,38,30,.06)}
.refused-note{color:var(--loss);font-size:11.5px;margin-top:4px;font-weight:600}
.ovr{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;
     border-radius:10px;background:var(--amber);color:#fff;margin-left:6px}
.assume{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;
        border-radius:10px;background:var(--chip);color:var(--ink-soft);margin-left:6px}
@media print{.mgm-editonly,.noprint{display:none !important}}
/* ── Admin gating (Task 19) ───────────────────────────────────────────── */
/* A non-admin keeps every view: tabs, charts, print, export. What they lose
   is the write path, and they are told so in words rather than left to
   discover a dead field. */
.read-only{opacity:.75;cursor:default}
/* The edit-only controls (row tools, + Add, Reset) are hidden for anyone who
   is not a confirmed admin. MGM.renderAuth() is the ONLY place that sets or
   clears body.mgm-admin; if that line is ever dropped, this rule hides every
   edit control including the admin's own. */
body:not(.mgm-admin) .mgm-editonly{display:none !important}
.adminbar{font-family:'Barlow';font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:10px}
.adminbar.ro{background:var(--chip);color:var(--ink-soft)}
.adminbar.rw{background:var(--sign-green);color:#fff}
.adminbar.pending{background:var(--chip);color:var(--ink-soft);font-style:italic}
.authbar .who{font-size:12.5px;color:#B9BEC7}
/* ── Scenario bar (Task 14) ───────────────────────────────────────────── */
/* Lives outside the panels so the active scenario and its load notice survive
   a tab switch and every MGM.refresh(). An alert() would be wiped by the next
   render, and the notice has to outlast the load that produced it. */
.scenbar{background:var(--chip);border-bottom:1px solid var(--line)}
.scenbar .inner{max-width:1240px;margin:0 auto;padding:8px 20px;font-size:12.5px;color:var(--ink-soft)}
.scenbar b{color:var(--ink)}
.scenbar .warn{color:var(--amber);font-weight:600}
.scenbar code{font-size:11.5px}
/* ── Sign-in gate ─────────────────────────────────────────────────────── */
/* Ported from bus-dev-potential-gallons/index.html:468-480 so all four pages
   present the same gate. The BDPG rules are NOT copied verbatim: they are
   written against that page's token names (--border2, --accent, --muted,
   --text, --ff, --fb), none of which exist here, and an unresolved var()
   falls back to the property's initial value -- a transparent border and an
   inherited colour, i.e. an unreadable box. Same geometry, this page's
   tokens. */
.pin-overlay{position:fixed;inset:0;background:rgba(10,12,16,.7);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.pin-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px;text-align:center;min-width:280px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.pin-box h3{font-family:'Barlow Condensed';font-size:21px;margin:0 0 6px;color:var(--ink)}
.pin-box p{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px}
.pin-input{width:260px;display:block;margin:0 auto 10px;background:var(--bg);border:2px solid var(--line);border-radius:8px;color:var(--ink);padding:10px;font-family:'Barlow';font-size:14px;text-align:left}
.pin-input:focus{outline:none;border-color:var(--red)}
.pin-err{color:var(--loss);font-size:12.5px;margin-top:8px;min-height:1.2em;font-weight:600}
@media print{.pin-overlay{display:none !important}}
</style>

<script>
const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];

// User-authored labels and prose reach innerHTML; escape so a pasted
// '<' or '&' renders literally instead of breaking the table or report.
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

/* ═══════════════ CHARTS ═══════════════ */
let CH={};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function baseOpts(){
  const grid=css('--line-soft'), tick=css('--ink-soft');
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:tick,font:{family:'Barlow',size:12}}}},
    scales:{x:{grid:{color:grid},ticks:{color:tick}},y:{grid:{color:grid},ticks:{color:tick}}}};
}
function mkChart(id,cfg){ if(CH[id])CH[id].destroy(); CH[id]=new Chart($(id),cfg); }

/* ═══════════════ MGM STATE ═══════════════ */
const MGM = {};
const MM = MembershipModel;
const STORE_KEY = 'roadys_mgm_v2';   // v2: the v1's state shape is not compatible

MGM.state = MM.defaultState(MGM_CONFIG);
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));
  // MM.mergeState, NOT Object.assign. Object.assign is shallow and 17 of the
  // 25 top-level state keys are nested objects, so each was replaced
  // wholesale: a returning user's stored state silently lost every nested
  // field added since their last visit, and `MM._n(undefined)` is 0, so the
  // loss landed as a real-looking zero rather than an error. Measured on two
  // fields: $198,467/yr of revenue gone with nothing on screen saying so.
  // This is the most load-bearing of the four merge sites because it runs on
  // EVERY page load. mergeState mutates its first argument, so it gets a
  // fresh defaultState, never a shared object.
  if (saved) MGM.state = MM.mergeState(MM.defaultState(MGM_CONFIG), saved).state;
} catch (e) { /* corrupt entry: fall back to defaults rather than a blank page */ }

MGM.save = function () {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(MGM.state)); }
  catch (e) { console.warn('[MGM] save failed', e); }
};

// Live data, populated only when signed in (Tasks 10 and 16).
MGM.leads = [];
MGM.profiles = [];
MGM.pnlActuals = null;

// WHY a reason and not just a null. The P&L read is ADMIN-ONLY
// (sql/2026-10-28-mgm-scenarios.sql: mgm_pnl_actuals_read USING
// mgm_is_admin()), so "no actual figure" has five different causes and they
// need five different sentences. Collapsing them to one null made the
// reconciliation tile tell a signed-in non-admin to "sign in" -- advice they
// had already taken, and which will never work for them. Never infer the
// reason from an empty array; it is decided from the session and the admin
// check. 'anon' covers "the admin check has not resolved yet" too, because
// claiming "not an admin" before the server has answered is the one wrong
// thing to say.
MGM.pnlReason = 'anon';   // 'anon' | 'not-admin' | 'none-loaded' | 'error' | 'ok'
MGM.pnlError = '';

// SESSION-ONLY, and deliberately NOT inside MGM.state.
//
// The loaded EBITDA margin is a P&L actual. mgm_pnl_actuals is admin-only on
// SELECT, but mgm_scenarios is readable by ANY signed-in user -- and both
// MGM.save() (localStorage) and a scenario save serialise MGM.state wholesale.
// So a margin written into MGM.state.valuation would travel into a saved
// scenario and let a non-admin read the gated figure straight out of it,
// defeating the read policy the migration exists to enforce. An admin would
// not even have to type it: merely loading the page and saving a scenario
// would be enough.
//
// Held here instead, applied to a COPY of the state at the moment a valuation
// is computed (see MGM.runFor), and gone on reload. Nothing serialises it:
// MGM.save writes JSON.stringify(MGM.state), scenarioSave deep-copies
// MGM.state, and an export reads MGM.state -- none of them can reach MGM.
MGM.loadedMarginPct = null;            // drives the lens; EBITDA margin only
MGM.loadedNetMarginPct = null;         // reported for provenance, NEVER applied
MGM.loadedMarginBasisDetail = null;

// Three states, and the distinction is load-bearing:
//   null  = not determined (anonymous, or the check has not resolved)
//   false = signed in, confirmed NOT on the admin roster
//   true  = confirmed admin
// MGM.canEdit() must test === true, never truthiness: collapsing null and
// false into one falsy case is harmless, but treating a non-boolean truthy
// value (a "yes" string, a 1) as admin is not. There is no automated test for
// this -- the page layer has no test seam -- so it is held by the manual
// checks in the task-19 verification list.
MGM.isAdmin = null;
MGM.canEdit = () => MGM.isAdmin === true;

// One guard for every state mutation, applied at the FUNCTION, not the markup.
// `body:not(.mgm-admin) .mgm-editonly{display:none}` hides the row tools, the
// + Add buttons and the per-section Reset buttons, but three mutating controls
// deliberately live OUTSIDE .mgm-editonly because they are actions rather than
// edit affordances -- "Reset all" in the header, "Use split basis" on Member
// Losses and "Use N gal as the model average" on Fuel Gallon Production. Those
// stay visible and explain themselves on click, per this task's "a disabled
// control with a stated reason beats a missing one". Gating the handler rather
// than the class also means a control added later cannot quietly open a write
// path by forgetting a CSS class.
MGM.requireAdmin = function (what) {
  if (MGM.canEdit()) return true;
  alert((what || 'This change') + ' is limited to administrators. ' +
    (MGM.isAdmin === false
      ? 'You are signed in, but this account is not on the admin list.'
      : 'Sign in with an admin account to make changes.') +
    ' Viewing, printing and exporting stay open.');
  return false;
};

// crm_leads requires a session (sql/2026-10-05-crm-leads-require-auth.sql),
// so an unsigned page gets an empty pipeline and says so. Never substitute
// invented leads for missing ones.
MGM.pipelineState = 'unsigned';   // 'unsigned' | 'loading' | 'ok' | 'error'
MGM.pipelineError = '';

MGM.loadPipeline = async function () {
  const sb = MGM.sb && MGM.sb();
  if (!sb || !(window.RoadysBD && RoadysBD.auth.email())) {
    MGM.pipelineState = 'unsigned';
    MGM.leads = []; MGM.profiles = [];
    MGM.refresh();          // every other branch refreshes; this one must too,
    return;                 // or a sign-out leaves the last signed-in data on screen
  }
  // Clear BEFORE announcing 'loading'. Without this, a reload after a previous
  // success leaves the old leads in place, so the gated tiles blank to '—'
  // while the table and chart still show stale real figures — two opposite
  // lies on one screen.
  MGM.leads = []; MGM.profiles = [];
  MGM.pipelineState = 'loading';
  MGM.refresh();
  try {
    const [L, P] = await Promise.all([
      sb.from('crm_leads').select(
        'id,company,stage,owner,source,locations,est_gallons,deal_value,follow_up,updated_at'
      ).is('deleted_at', null),
      sb.from('bd_value_profiles').select('id,lead_id,final_gallons,status')
        .is('deleted_at', null).eq('status', 'final')
    ]);
    if (L.error) throw L.error;
    if (P.error) throw P.error;
    MGM.leads = L.data || [];
    MGM.profiles = P.data || [];
    MGM.pipelineState = 'ok';
  } catch (e) {
    MGM.pipelineState = 'error';
    MGM.pipelineError = e.message || String(e);
    MGM.leads = []; MGM.profiles = [];
  }
  MGM.refresh();
};

// The injected baseline lookup that keeps the engine pure.
MGM.baselineFor = function (profile, roadway) {
  try { return BusDevGallonsCalc.getBaselineRow(profile, roadway) || null; }
  catch (e) { return null; }
};

// One place that assembles every layer, so no renderer recomputes a slice
// of the model on its own and drifts.
// MGM.model() runs the live state; MGM.runFor(st) runs any state through the
// IDENTICAL path. Task 14's scenario comparison needs a full independent
// re-run per column, and the first draft of that card assembled its own
// stack -- which meant it passed F[last].ebitda as the valuation override
// unconditionally, so its "Current" column reported a materially higher
// indicated value, on two lenses, for the very same inputs the Profit & Cash
// Flow tab was showing on one. See the ebitdaOverride note below for why that
// branch is wrong. One function, so a comparison column and the live page
// cannot disagree about the same state.
MGM.model = function () { return MGM.runFor(MGM.state); };

MGM.runFor = function (st) {
  const pipeline = MM.pipelineModel(st, MGM.leads, MGM.profiles);
  const M = MM.runModel(st, MM.addsOpts(st, pipeline));
  const R = MM.revenueModel(st, M);
  const F = MM.cashflowModel(st, M, R);
  const cost = MM.costModel(st, M, R);

  // A zero-cost cash bridge must NOT become a valuation basis. With costs
  // unset, cashflowModel's EBITDA is revenue minus nothing -- a 100% margin --
  // and passing it as the override produced a $9.09M headline midpoint against
  // $3.03M on the margin branch: a 3x overstatement on the shipped defaults,
  // against a real net margin that is a small fraction of 100% (the figure
  // itself is auth-gated and never committed to this public repo). It also made
  // valuation.ebitdaMargin dead code, since the override always won.
  // So: only hand over a computed EBITDA once real costs exist.
  //
  // NOT covered by membershipModel.test.js -- that suite tests the engine, and
  // passes even with this line reverted. Changing it needs a hand check:
  // defaults must give a $3.03M midpoint, exactly half the revenue lens.
  const ebitdaOverride = (!cost.unset && F.length) ? F[F.length - 1].ebitda : null;

  // The loaded P&L margin is session-only and must never enter MGM.state:
  // scenarioSave and an export both serialise state wholesale, and
  // mgm_scenarios is readable by ANY signed-in user while mgm_pnl_actuals is
  // admin-only -- so a margin in state lets a non-admin read the gated figure
  // out of a saved scenario, defeating that policy. Applied here, against a
  // copy, at the moment a valuation is computed. A hand-typed margin still
  // wins; the loaded figure only fills an unset one, as before.
  //
  // `typedMargin` keeps its original meaning throughout the page: what the
  // reader typed. `effectiveMargin` is what the lens actually used. Those two
  // diverge exactly when a loaded actual is in play, and SIX caption sites
  // used to read the state value to decide what to say -- which after this
  // change would caption "no margin set" over a lens that has a basis. Both
  // the value and its provenance are therefore returned, and every caption
  // reads these rather than the state.
  const typedMargin = st.valuation.ebitdaMargin;
  const marginFromPnl = !typedMargin && MGM.loadedMarginPct != null;
  const effectiveMargin = typedMargin ? Number(typedMargin)
                        : (marginFromPnl ? MGM.loadedMarginPct : null);

  const vst = marginFromPnl
    ? Object.assign({}, st, { valuation:
        Object.assign({}, st.valuation, { ebitdaMargin: MGM.loadedMarginPct }) })
    : st;

  return {
    st, pipeline, M, R, F, cost,
    rpm: MM.revPerMember(st, M, MGM.pnlActuals),
    gallons: MM.gallonProduction(st, MGM.baselineFor, pipeline),
    participation: MM.participationModel(st, M),
    capacity: MM.capacityModel(st, M, pipeline),
    valuation: MM.valuation(vst, R[R.length - 1], ebitdaOverride),
    // null, never 0, for "no margin in force" -- 0 is a real margin a reader
    // could mean, so it cannot double as "absent".
    effectiveMargin: effectiveMargin,
    typedMargin: typedMargin ? Number(typedMargin) : null,
    marginFromPnl: marginFromPnl,
    marginBasisDetail: marginFromPnl ? MGM.loadedMarginBasisDetail : null,
    // For the provenance note only. Present whenever an admin session loaded
    // them, regardless of which one (if either) is driving the lens.
    loadedMarginPct: MGM.loadedMarginPct,
    loadedNetMarginPct: MGM.loadedNetMarginPct
  };
};

       onclick="MGM.switchTab('${k}')">${esc(t[k])}</button>`).join('');

MGM.switchTab = function (k) {
  MGM.tab = k;
  TAB_ORDER.forEach(x => {
    const p = document.getElementById('panel-' + x);
    if (p) p.classList.toggle('active', x === k);
  });
  MGM.renderTabs();
  MGM.refresh();
};

// Renderers register here; tabs 1-12 fill in over Tasks 9-13 and 17.
MGM.renderers = {};

MGM.refresh = function () {
  const fn = MGM.renderers[MGM.tab];
  if (fn) {
    try { fn(MGM.model()); }
    catch (e) {
      console.error('[MGM] render failed', MGM.tab, e);
      document.getElementById('panel-' + MGM.tab).innerHTML =
        `<div class="card"><h3>This tab could not render</h3>
         <p class="note">${esc(e.message)}</p></div>`;
    }
  }
  // Outside the panel, so they survive a tab switch. Guarded because refresh()
  // runs during the very first render, before the Task 14/16 definitions below
  // have been evaluated on a partially loaded page.
  if (MGM.renderScenarioBar) MGM.renderScenarioBar();
  if (MGM.bindAll) MGM.bindAll();
};
MGM.refreshSoft = MGM.refresh;

// Placeholder so an unimplemented tab says so instead of showing blank.

TAB_ORDER.forEach(k => {

      `<div class="card"><h3>${esc(MGM.state.labels.tabs[k])}</h3>
       <p class="note">Not implemented yet.</p></div>`;
  });
});

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

MGM.renderMonthly = function (M, year) {
  const mm = M.months.filter(m => m.year === year);
  if (!mm.length) return '<tr><td class="note">No modeled months in this year.</td></tr>';
  return '<tr><th>Month</th><th class="num">Start</th><th class="num">New</th>' +
    '<th class="num">Steady loss</th><th class="num">Structural</th>' +
    '<th class="num">End</th><th class="num">Producing</th></tr>' +
    mm.map(m => {
      // Supplied by the engine (Task 2) rather than re-derived here by
      // inverting runModel's update expression.
      const start = m.start;
      return `<tr><td>${MONTH_NAMES[(m.month - 1) % 12]} ${year}</td>
        <td class="num">${fmt1(start)}</td><td class="num">${fmt1(m.adds)}</td>
        <td class="num">${fmt1(m.steadyLost)}</td><td class="num">${fmt1(m.structuralLost)}</td>
        <td class="num"><b>${fmt1(m.end)}</b></td><td class="num">${fmt1(m.producing)}</td></tr>`;
    }).join('') +
    `<tr class="total"><td>Year total</td><td class="num">—</td>
     <td class="num">${fmt1(mm.reduce((a, m) => a + m.adds, 0))}</td>
     <td class="num">${fmt1(mm.reduce((a, m) => a + m.steadyLost, 0))}</td>
     <td class="num">${fmt1(mm.reduce((a, m) => a + m.structuralLost, 0))}</td>
     <td class="num">—</td><td class="num">—</td></tr>`;
};

MGM.toggleMonthly = function (year) {
  const el = document.getElementById('mo-' + year);
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : '';
  el.previousElementSibling.querySelector('button').textContent =
    open ? '▸ months' : '▾ months';
};

MGM.drawFunnel = function (p, sp) {

// The group `key` is NOT cosmetic: Task 11 interpolates it into state paths
// (`gallons.groupProfile.<key>`, `gallons.groupBaselineOverride.<key>`). The
// first draft of this plan created groups with `key: ''` and gave no way to
// edit it, which meant (a) an added group could never be mapped to a gallon
// profile, and (b) two added groups collided on the same empty override slot.
// So the key is derived from the label, kept unique, and validated here —
// at the point of creation, with a visible message — rather than relying on
// `setPath`'s reserved-segment guard, which refuses silently by design.
MGM.RESERVED_KEYS = ['__proto__', 'constructor', 'prototype'];

MGM.makeGroupKey = function (label, taken) {
  const base = String(label || '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'group';
  if (MGM.RESERVED_KEYS.indexOf(base) !== -1) return null;
  let key = base, i = 2;
  while (taken.indexOf(key) !== -1) { key = base + '-' + i; i++; }
  return key;
};

MGM.addGroup = function () {
  if (!MGM.requireAdmin('Adding a group')) return;
  const label = (prompt('Group name:', 'New group') || '').trim();
  if (!label) return;
  const taken = MGM.state.groups.map(g => g.key);
  const key = MGM.makeGroupKey(label, taken);
  if (!key) {
    alert('"' + label + '" is a reserved word and cannot be used as a group name. Pick a different name.');
    return;
  }
  MGM.addRow('groups', { key: key, label: label, count: 0 });
};

// NOTE: there is deliberately no renameGroup(). The label is edited in place
// through a plain `data-k="groups.N.label"` input, and the KEY is never bound
// to any control — so a rename cannot orphan the gallon mapping that Task 11
// addresses by key. An earlier draft had a prompt() wrapper warning about key
// stability; it was dead code, because the risk it warned about cannot occur.

MGM.useSplitBasis = function () {
  // Visible outside .mgm-editonly, so the guard has to be here.
  if (!MGM.requireAdmin('Switching to the split basis')) return;
  MGM.state.attrition.steady = MGM.state.attrition.steadyAlt;
  MGM.save(); MGM.refresh();
};

MGM.useGallonsInModel = function (perMember) {

MGM.renderers.cashflow = function (D) {
  const { st, F, valuation: v, cost: C,
          effectiveMargin: EM, typedMargin: TM, marginFromPnl: MFP,
          marginBasisDetail: MBD } = D;
  // EM is the margin the EBITDA lens actually used; TM is what the reader
  // typed. They differ only when an admin's session has loaded a P&L actual,
  // which never enters MGM.state (see MGM.runFor). Captions read EM/MFP;
  // the one bound <input> below reads st.valuation.ebitdaMargin, because an
  // input must show what it will write back.
  // `pnlMargin` is the one phrase naming the loaded source, defined once so
  // five captions cannot word the same provenance five ways.
  const marginSrc = MFP ? 'margin loaded from the P&L' : 'margin assumption';
  const last = F[F.length - 1] ||
    { year: st.CURRENT_YEAR, ebitda: 0, revenue: 0, cash: 0, margin: 0 };

  document.getElementById('panel-cashflow').innerHTML = `
  <h2>${esc(st.labels.tabs.cashflow)}</h2>
  <p class="sub">Revenue less cost to serve and acquisition cost, to EBITDA and cash.</p>
  <div class="signrow">
    ${sign('FINAL-YEAR REVENUE', fmM(last.revenue), `${last.year}`)}
    ${sign('EBITDA', fmM(last.ebitda),
           C.unset ? 'costs unset — equals revenue (100% margin)' : pct1(last.margin) + ' margin', 'dark')}
    ${sign('CASH', fmM(last.cash),
           C.unset ? 'costs unset — no cost subtracted yet' : 'after capex', 'red')}
    ${(() => {
      // The boldest number on the page must not defer its basis to the card
      // below, and it must not be an average of a real method with an absent
      // one. With costs unset the valuation declines the cash bridge and falls
      // back to the margin branch, so at the shipped 0% margin the EBITDA lens
      // is genuinely $0 -- and `v.mid`, which this tile used to print, was
      // then exactly half the only lens that existed.
      //
      // `v.indicated` is the engine's single answer to "what should be
      // displayed" (the midpoint at two lenses, the lens itself at one, null
      // at none) and `v.lensCount` is the only thing the LABEL may be keyed
      // on. Both live in the engine on purpose: the printed report, the CSV
      // and the scenario comparison read the same two fields, so the screen
      // and the paper cannot state different headline numbers. Reading
      // `v.mid` anywhere outside the two-lens case reintroduces exactly that
      // split.
      if (v.lensCount === 0)
        return sign('INDICATED VALUE', '—', 'no lens has a basis', 'dark');

      if (v.lensCount === 1)
        // Name the METHOD, because a single-method figure is a different kind
        // of claim from a midpoint and must not be read as one. Which lens is
        // live is read off the engine's own lens values, never re-derived from
        // the input state, so this caption cannot contradict `lensCount`.
        return sign('INDICATED VALUE', fmM(v.indicated),
          (v.rev ? 'revenue multiple' : 'EBITDA multiple') + ', single method', 'dark');

      // Two live lenses, so the midpoint is a real two-method midpoint. Branch
      // order matters: real costs win over a margin assumption, because the
      // override path ignores the margin entirely once it is supplied. The
      // "no live lens" and "revenue lens only" arms this chain used to carry
      // are gone — `lensCount` decides those cases above, and an EBITDA lens
      // that is live here always has a nonzero `ebitdaBase` behind it.
      // EM, not st.valuation.ebitdaMargin: a loaded actual drives the lens
      // without being in state, so reading state here would caption

        // PROVENANCE, not value. valuation.ebitdaMargin is an assumption input

        const a = MGM.pnlActuals || null;
        // The reported figures come from the LOADER's own reads of the row
        // (MGM.loadedMarginPct / MGM.loadedNetMarginPct, surfaced by
        // MGM.runFor), not from a shape guessed at here. The previous version

        //
        // The NAME still travels with the figure: an EBITDA margin is not a
        // net margin, and only the EBITDA one is ever applied to the lens.
        const reportedE = D.loadedMarginPct;
        const reportedN = D.loadedNetMarginPct;
        const entered = TM;                       // what the reader typed
        const period = (a && a.periodLabel) ? ` (${esc(a.periodLabel)})` : '';

        // Where the figure came from. Each arm claims provenance ONLY. The

        // "this page cannot tell which" arm is gone. It was true only while
        // the loader wrote into valuation.ebitdaMargin, which it no longer
        // does, and leaving it would have been a false disclaimer.
        const names = [];
        if (reportedE != null) names.push(`EBITDA margin <b>${pct1(reportedE)}</b>`);
        if (reportedN != null) names.push(`net margin <b>${pct1(reportedN)}</b>`);

        const prov =
          names.length
            ? `The P&amp;L${period} reports ${names.join(' and ')}.` +
              (entered
                ? ` The <b>${pct1(entered)}</b> on the Valuation card was entered by hand
                    and overrides ${names.length > 1 ? 'the EBITDA figure' : 'it'}.`
                : (reportedE != null
                    ? ` The EBITDA figure is driving the lens for this session only — it is
                        not stored in this page's state, so it cannot reach a saved scenario
                        or an export.`
                    : ` A net margin is not an EBITDA margin, so it is reported here and
                        applied to nothing.`))
          : !a
            ? (entered
                ? `No P&amp;L actual is loaded; the <b>${pct1(entered)}</b> margin on the
                   Valuation card is an entered assumption, not a reported figure.`

            : (entered

                   <b>${pct1(entered)}</b> margin on the Valuation card is an entered

        // What the lens is resting on RIGHT NOW. Kept separate from provenance
        // because the two are independent: with real costs entered the margin is
        // not in use at all, so a note that says "the EBITDA lens has no basis"
        // because no margin was supplied would contradict the tile above it,

        const lens = !C.unset

          : '';

        // The basis caveat that travelled with the loaded figure. Only an
        // admin's session can hold it, so rendering it discloses nothing a
        // non-admin is not already denied.
        const basis = (MFP && MBD)
          ? ` <span class="assume">basis</span> ${esc(MBD)}`
          : '';

        return prov + lens + hint + basis;
      })()}
      If you are arguing for a normalized figure, enter it as an add-back above so
      a reader can see the adjustment rather than finding it baked into a margin.</p>

        // A lens with no basis values at $0.00M, and printing that as the low

        if (v.lensCount === 2)

              (one live lens: ${v.rev ? 'revenue' : 'EBITDA'})</td>
            <td class="num">${fmM(v.indicated)}</td></tr>`;
        return `<tr class="total"><td colspan="3">No live lens — no indicated range</td>

      <tr><td>EBITDA margin % (used only when costs are unset)

          overrides it.</span>` : ''}</td><td class="num">

             Rendering a loaded figure into a data-k input would make the next
             keystroke write it into MGM.state, which is the leak this whole

         same sentence in membershipModel.js was rewritten for the same
         reason; this is the third instance of the shape found on this branch. -->
    <p class="note"><b>Both lenses apply to the model's own revenue total</b> —
      net per-member streams. Never to the P&amp;L's Total Income, which is ~95%

      ? (EM != null
