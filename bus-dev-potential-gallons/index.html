  BDPG.pitchOpportunitiesHtml = function () {
    var items = BDPG.pitchOpportunities();
    if (!items.length) return '';
    // The footnote only applies when a swing-percentage bullet is actually on
    // screen (the pricing bullet carries no percentage), so check rather than
    // always appending it.
    var hasPct = items.some(function (t) { return t.indexOf('%') !== -1; });
    var footnote = hasPct
      ? '<div style="margin-top:8px;font-size:.75em;color:var(--muted)">Percentages show the change to your projection from where it stands today.</div>'
      : '';
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Opportunities to Grow</div></div>' +
      '<ul style="margin:0 0 0 18px;font-size:.8em;line-height:1.7">' +
        items.map(function (t) { return '<li>' + BDPG.escHtml(t) + '</li>'; }).join('') +
      '</ul>' + footnote + '</div>';
  };


  BDPG.pitchSectionsHtml = function () {
    if (!BDPG.state.result) return '';
    return BDPG.pitchHeroHtml() +
      BDPG.pitchDriversHtml() +
      BDPG.pitchOpportunitiesHtml() +
      BDPG.pitchBusinessCaseHtml() +
      BDPG.pitchNetworkStripHtml();
  };

  // Unmistakably "internal, not for the prospect" -- the Network Fit Grade,
  // amenity chart, network-context table, condition-adjusted view and
  // analysis all live below this and would actively damage a sales call if
  // shown to the owner (a grade letter, "non-official", deficiency framing).
  BDPG.adjustmentRows = function (e) {
    var terms = [
      { label: 'Region adjustment', pct: e.regionPct },
      { label: 'Online rating adjustment', pct: e.reviewPct },
      { label: 'Pricing strategy adjustment', pct: e.pricingPct },
      { label: 'Rewards participation adjustment', pct: e.rewardsPct },
      { label: 'Amenities adjustment', pct: e.amenityPct }
    ];
    var cum = 1, running = e.baseline, out = [];
    terms.forEach(function (t) {
      cum += t.pct;
      var next = Math.round(e.baseline * (cum < 0 ? 0 : cum));
      out.push({ label: t.label, pct: t.pct, delta: next - running });
      running = next;
    });
    return { rows: out, total: running };
  };

  BDPG.adjustmentTableHtml = function (e, forPrint) {
    var b = BDPG.adjustmentRows(e);
    function pctTxt(p) { return (p >= 0 ? '+' : '') + (p * 100).toFixed(1) + '%'; }
    function galTxt(n) { return (n >= 0 ? '+' : '') + BDPG.fmtGal(n); }
    var num = 'text-align:right;font-family:var(--ff);white-space:nowrap';
    var rows = b.rows.map(function (r) {
      return '<tr><td style="padding:3px 0">+ ' + BDPG.escHtml(r.label) +
        ' (' + pctTxt(r.pct) + ')</td>' +
        '<td style="' + num + '">' + galTxt(r.delta) + '</td></tr>';
    }).join('');
    return '<div class="' + (forPrint ? 'bdpg-box' : 'cc') + '" style="margin-top:14px">' +
      (forPrint ? '<div style="font-weight:700;margin-bottom:6px">How the estimate is built</div>'
                : '<div class="cc-lbl">How the estimate is built</div>') +
      '<table style="width:100%;max-width:560px;font-size:.9em;border-collapse:collapse">' +
        '<tbody>' +
        '<tr><td style="padding:3px 0">Baseline: network average</td>' +
          '<td style="' + num + '">' + BDPG.fmtGal(e.baseline) + ' gal/mo</td></tr>' +
        rows +
        '<tr><td colspan="2" style="border-top:1px solid var(--border);padding:0;height:6px"></td></tr>' +
        '<tr style="font-weight:700"><td style="padding:3px 0">' +
          'Total Adjusted Baseline network gallons average:</td>' +
          '<td style="' + num + '">' + BDPG.fmtGal(b.total) + ' gal/mo</td></tr>' +
        '</tbody></table>' +
    '</div>';
  };

  BDPG.resultsHtml = function () {
    var r = BDPG.state.result, e = r.estimate;

    // The as-of disclosure, in the pitch's own voice. '' when there is no
    // date, so no empty grey strip is emitted.
    var asOfPitch = BDPG.regionVarianceAsOfLinePitch();
    var asOfPitchLine = asOfPitch
      ? '<div style="margin-top:8px;font-size:.75em;color:var(--muted)">' + BDPG.escHtml(asOfPitch) + '</div>' : '';

    // Everything that used to sit below an INTERNAL divider -- the network
    // range bar, the Network Fit Grade badge, the amenity chart, the
    // condition-adjusted view, membership fit, the network-context table and
    // the analysis narrative -- was deleted on 2026-09-30 rather than hidden.
    // The divider went with them: with nothing internal left to separate, a
    // line saying "not shown to the prospect" had nothing on its far side.
    return '<div class="bdpg-results">' +
      BDPG.pitchSectionsHtml() +
      asOfPitchLine +
      (e.reviewFlagged ? '<div style="margin-top:6px;color:var(--yellow);font-size:.8em">No Trucker Path rating found — Review% treated as 0%.</div>' : '') +
      BDPG.adjustmentTableHtml(e, false) +
      BDPG.defInsideHtml(false) +
    '</div>';
  };

  BDPG.pitchBusinessCaseHtml = function () {
    var e = BDPG.state.result.estimate;
    var annual = e.finalGallons * 12;

    var stat = 'font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px';
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:4px"><div class="sec-title" style="font-size:.85em">What This Means For Your Business</div></div>' +
      '<div style="font-size:.82em;color:var(--muted);margin-bottom:12px">Based on network averages for comparable locations:</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:34px">' +
        '<div><div style="' + stat + '">Monthly potential</div>' +
          '<div style="font-family:var(--ff);font-size:1.9em;font-weight:800;color:var(--accent);line-height:1">' +
          BDPG.fmtGal(e.finalGallons) + '<span style="font-size:.4em;color:var(--muted);margin-left:6px">gal/mo</span></div></div>' +
        '<div><div style="' + stat + '">Annual potential</div>' +
          '<div style="font-family:var(--ff);font-size:1.9em;font-weight:800;color:var(--accent);line-height:1">' +
          BDPG.fmtGal(annual) + '<span style="font-size:.4em;color:var(--muted);margin-left:6px">gal/yr</span></div></div>' +
      '</div>' +
    '</div>';
  };

  // The prospect's leave-behind. Everything below resultsHtml()'s INTERNAL
  // divider -- the Network Fit Grade, the network range bar, the
  // condition-adjusted view, the amenity chart, the network-context table and
  // the Analysis block -- is deliberately absent: an owner reading a grade
  // letter or the word "non-official" about their own site loses the room.
  // The pitch itself comes from BDPG.pitchSectionsHtml(), the same call
  // resultsHtml() makes, so the page and the packet cannot drift. That
  // function returns '' when there is no result, and pitchDriversHtml() /
  // pitchOpportunitiesHtml() each legitimately return '' on their own (a
  // top-band prospect has no opportunities, a weak one has no drivers), so
  // nothing here may assume a fixed section count.
  BDPG.exportPdfHtml = function () {
    var r = BDPG.state.result;
    if (!r) return '';
    var e = r.estimate, loc = BDPG.displayLocation();

    var chartImg = '';

    // The rep's local calendar date, NOT toISOString().slice(0,10) -- that is
    // UTC, so for everyone west of it the last hours of every working day
    // stamp a document handed to a customer with tomorrow's date. (The
    // tracker's savedAt stays ISO/UTC on purpose: it is a lexicographic sort
    // key, not a date a human reads. Different job, different rule.)
    var now = new Date();
    var today = now.getFullYear() + '-' +
      ('0' + (now.getMonth() + 1)).slice(-2) + '-' +
      ('0' + now.getDate()).slice(-2);
    var asOfPitch = BDPG.regionVarianceAsOfLinePitch();

    return '<div id="bdpg-print-only">' +
      '<h1>Roady\'s Fuel Network — Value Proposition for ' + BDPG.escHtml(BDPG.displayName()) + '</h1>' +
      (loc ? '<h2>' + BDPG.escHtml(loc) + '</h2>' : '') +
      '<p style="font-size:.9em">' + today + '</p>' +
      // Exactly the sections shown on screen -- same function, not a second
      // copy, so the packet and the laptop cannot drift.
      BDPG.pitchSectionsHtml() +
      '<h3>How the estimate is built</h3>' +
      '<p>' + BDPG.escHtml(BDPG.state.profile) + ' / ' + BDPG.escHtml(BDPG.state.roadway) + '</p>' +
      // The same calculation table the rep just showed, not a second rendering
      // of the same figures in different words.
      BDPG.adjustmentTableHtml(e, true) +
      BDPG.defInsideHtml(true) +
      '<p style="font-size:.85em;color:#666">Network-Adjusted Baseline (region, amenities and rating only): ' +
        BDPG.fmtGal(e.officialSubtotal) + ' gal/mo</p>' +
      // Pitch wording, and omitted entirely when there is no date -- the
      // internal "not set (0% adjustment)" phrasing is a rep-facing note and
      // stays below the divider on screen. See regionVarianceAsOfLinePitch().
      (asOfPitch ? '<p style="font-size:.85em;color:#666">' + BDPG.escHtml(asOfPitch) + '</p>' : '') +
      chartImg +
    '</div>';
  };

  BDPG.onExportPdf = function () {
    if (!BDPG.state.result) { alert('Generate a Value Profile first.'); return; }
    // The waterfall chart is gone, so there is nothing to rasterise for the
    // packet -- the breakdown prints as the same calculation table shown on
    // screen. printChartImg stays defined (empty) because exportPdfHtml()
    // still reads it.
    BDPG.printChartImg = '';

    // Rebuild just the print-only block (not a full BDPG.render(), which would
    // tear down and recreate the on-screen charts) so the freshly-captured
    // chart image is actually in the DOM before window.print() opens.
    var printOnly = document.getElementById('bdpg-print-only');
    if (printOnly) printOnly.outerHTML = BDPG.exportPdfHtml();

    // bdpg-print-mode is what the @media print rules key off of (see <style>),
    // so a plain browser File > Print on some other page never gets caught by
    // these rules — only a print triggered through this button does.
    // It goes on BOTH elements: body gates every rule about what is shown,
    // and html gates the one rule that has to reach the print canvas's
    // background (body's own background does not propagate past an html that
    // sets its own). They are set and cleared together, always.
    document.documentElement.classList.add('bdpg-print-mode');
    document.body.classList.add('bdpg-print-mode');
    window.print();
  };

  if (!BDPG._printModeCleanupBound) {
    BDPG._printModeCleanupBound = true;
    window.addEventListener('afterprint', function () {
      document.documentElement.classList.remove('bdpg-print-mode');
      document.body.classList.remove('bdpg-print-mode');
    });
  }

  BDPG.summaryText = function () {
    var r = BDPG.state.result, e = r.estimate, loc = BDPG.displayLocation();
    // This gets pasted into prospect-facing email, so it follows the same
    // pitch-only rule as the Export Pitch Summary packet: no Network Fit
    // Grade line. The grade is an internal score and reads to an owner as a
    // report card on their own site.
    var lines = [
      'Roady\'s Fuel Network — Value Proposition for ' + BDPG.displayName(),
      loc || '',
      '',
      // Same reframing as the on-screen hero and the packet: this is a
      // network average for comparable locations, not a promise to this one.
      'For a location similar to this, Roady\'s network averages ' +
        BDPG.fmtGal(e.finalGallons) + '* gal/mo — ' + BDPG.fmtGal(e.finalGallons * 12) +
        ' gal/yr. Estimated from network averages; actual results vary.',
      '',
      'Location Profile: ' + BDPG.state.profile + ' / ' + BDPG.state.roadway,
      'Network-Adjusted Baseline math: ' + e.officialMathLine,
      'Network-Adjusted Baseline: ' + BDPG.fmtGal(e.officialSubtotal),
      // From the estimate, not from state: e.pricingPct is the value the
      // math lines above were actually computed with, and a summary whose
      // stated posture could differ from its own arithmetic is worse than
      // one that omits it.
      'Discount pricing strategy: ' + BDPG.fmtSignedPct(e.pricingPct),
      'Roady\'s Rewards: ' + BDPG.state.rewardsLevel,
      'Final Potential Gallons math: ' + e.finalMathLine,
      'Final Potential Gallons: ' + BDPG.fmtGal(e.finalGallons)
    ];
    var di = BusDevGallonsCalc.defInsideEstimate(e.finalGallons, BDPG.defInside());
    if (di) {
      lines.push('');
      lines.push('DEF gallons: ' + BDPG.fmtGal(di.defGallonsMo) + ' /mo · ' + BDPG.fmtGal(di.defGallonsYr) + ' /yr');
      lines.push('DEF sales: ' + BDPG.fmtMoney(di.defSalesMo) + ' /mo · ' + BDPG.fmtMoney(di.defSalesYr) + ' /yr');
      lines.push('Inside transactions: ' + BDPG.fmtGal(di.transactionsMo) + ' /mo · ' + BDPG.fmtGal(di.transactionsYr) + ' /yr');
      lines.push('Inside sales: ' + BDPG.fmtMoney(di.insideSalesMo) + ' /mo · ' + BDPG.fmtMoney(di.insideSalesYr) + ' /yr');
      lines.push('(DEF and inside sales are estimates based on network averages.)');
    }
    // Last, after the optional DEF block, so the asterisk is answered at the
    // foot of the message wherever that foot happens to fall.
    lines.push('');
    lines.push(BDPG.QUALIFYING_NOTE);
    // An absent location or GS name leaves its slot as '' next to the
    // deliberate blank separator below it. Collapse only those runs -- the
    // single blanks that structure the message stay.
    return lines.filter(function (l, i) { return !(l === '' && lines[i - 1] === ''); }).join('\n');
  };

  BDPG.onCopySummary = function () {
    var text = BDPG.summaryText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Copied to clipboard'); }, function () { BDPG.fallbackCopy(text); });
    } else {
      BDPG.fallbackCopy(text);
    }
  };

  BDPG.fallbackCopy = function (text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e) { alert(text); }
    document.body.removeChild(ta);
  };

  // Every bullet is generated from the actual selected values -- never a
  // hardcoded list -- and appears ONLY when its signal is positive. Negative
  // and neutral signals are handled by pitchOpportunitiesHtml() instead, so
  // this section never tells a prospect what is wrong with their site.
  BDPG.pitchDrivers = function () {
    var s = BDPG.state, e = s.result.estimate, out = [];

    if (s.roadway === 'Interstate') {
      out.push('Your Interstate location puts you in the path of high-volume fleet corridors — the strongest traffic signal in our network.');
    } else if (s.roadway === 'Highway') {
      out.push('Your Highway location sits on a steady regional freight corridor.');
    }
    // e.regionPct is the ADMIN'S +/-10% manual slider, not a measurement. This
    // bullet used to read "the <region> region runs X% above the network
    // average", which describes it as a comparison against network
    // performance -- a claim it has never been entitled to make, and one the
    // packet now visibly contradicts: networkAverageLineHtml() prints the real
    // 12-month regional figure a few centimetres above this list (Midwest
    // 21,737 gal/mo, +76.1% vs the 12,347 network average), so a +7.5% slider
    // described as the same quantity is wrong by an order of magnitude on a
    // sheet handed to the owner. The network-average line is the only surface
    // entitled to a "vs network" claim; this one names the adjustment as an
    // adjustment. Do not reintroduce a network comparison here -- if one is
    // ever wanted in this list it must come from
    // BDPG_NETWORK_BASELINES[region].pctVsNetwork, never from regionPct.
    if (e.regionPct > 0) {
      out.push('Your baseline carries a +' + (e.regionPct * 100).toFixed(1) +
        '% regional adjustment for the ' + BDPG.regionDisplayName(s.result.region) +
        ' region — your geography works in your favor.');
    }
    if (e.amenityPct > 0) {
      out.push('Your amenity level — ' + s.amenityLevel + ' — already places you above the network average for driver satisfaction.');
    }
    if (e.reviewPct > 0) {
      // Never name the 3.6 threshold here: (3.55).toFixed(1) displays "3.5"
      // while its reviewPct is already positive, which would make this bullet
      // self-contradicting for a saved record at that exact value.
      out.push('Your ' + Number(s.truckerPathRating).toFixed(1) +
        ' Trucker Path rating already places you in our top service band — drivers rate you well.');
    }
    if (e.pricingPct > 0) {
      out.push('Your discount pricing strategy is projected to add ' +
        BDPG.fmtSignedPct(e.pricingPct) + ' in gallon volume.');
    }
    if (e.rewardsPct > 0) {
      out.push('Participating in Roady\'s Rewards adds an estimated +' + (e.rewardsPct * 100).toFixed(1) +
        '% volume uplift as loyalty members are directed to your stop.');
    }
    return out;
  };

  BDPG.pitchDriversHtml = function () {
    var items = BDPG.pitchDrivers();
    // Omit the whole section rather than render an empty heading.
    if (!items.length) return '';
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">How We Get There</div></div>' +
      '<ul style="margin:0 0 0 18px;font-size:.8em;line-height:1.7">' +
        items.map(function (t) { return '<li>' + BDPG.escHtml(t) + '</li>'; }).join('') +
      '</ul></div>';
  };

  // The mirror of pitchDrivers(): everything that is NOT already a positive
  // signal, phrased as upside the prospect can capture -- never as a
  BDPG.pitchNetworkStripHtml = function () {
    var nc = BDPG.networkContext, r = BDPG.state.result;
    if (!nc || !r.region || !nc.byRegion) return '';
    var rd = nc.byRegion[r.region];
    if (!rd) return '';

    var stats = [];
    if (typeof nc.activeTotal === 'number') {
      stats.push([BDPG.fmtGal(nc.activeTotal), 'active locations across the Roady\'s network']);
    }
    if (typeof rd.total === 'number') {
      // escHtml for the same reason as the byType label below: this string is
      // interpolated into HTML. region is a trusted config key today, so this
      // is consistency rather than a live fix -- but the escaping convention
      // is what makes "is this value trusted?" a question nobody has to ask.
      stats.push([BDPG.fmtGal(rd.total), 'locations in your region (' + BDPG.escHtml(BDPG.regionDisplayName(r.region)) + ')']);
    }
    // byType keys come from the source CSV's Type column while locationType
    // comes from the ⓪ card's own list; they do not always match, which is why
    // this is a hasOwnProperty check and not a plain lookup.
    var lt = BDPG.state.prospect.locationType;
    if (lt && rd.byType && Object.prototype.hasOwnProperty.call(rd.byType, lt)) {
      stats.push([BDPG.fmtGal(rd.byType[lt]), BDPG.escHtml(lt) + ' locations like yours already in the network']);
    }
    if (!stats.length) return '';

    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:10px"><div class="sec-title" style="font-size:.85em">About the Roady\'s Network</div></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:34px">' +
        stats.map(function (s) {
          return '<div><div style="font-family:var(--ff);font-size:1.9em;font-weight:800;color:var(--accent);line-height:1">' +
            s[0] + '</div><div style="font-size:.78em;color:var(--muted);margin-top:3px;max-width:200px">' + s[1] + '</div></div>';
        }).join('') +
      '</div>' +
      (nc.asOf ? '<div style="font-size:.68em;color:var(--muted);margin-top:10px">Network figures as of ' + BDPG.escHtml(nc.asOf) + '.</div>' : '') +
    '</div>';
  };

  BDPG.getSavedProfiles = function () {
    try {
      var v = JSON.parse(localStorage.getItem('roadysBDPGProfiles') || '[]');
      // A corrupted value (e.g. hand-edited to "{}" or "x") must not take
      // down every caller -- getSavedProfiles() is the one place all of
      // them read through, so guarding here fixes it everywhere at once.
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  };

  // Captures what the Prospects tracker table shows, from the *current*
  // state and result, so the tracker never has to re-derive it. A profile
  // saved before Generate has run has null gallons and an empty grade --
  // that is legitimate data, not corruption.
  BDPG.trackerSummary = function () {
    var s = BDPG.state, r = s.result, e = r ? r.estimate : null;
    return {
      name: BDPG.displayName(),
      locationType: s.prospect.locationType || '',
      city: s.prospect.city || '',
      stateCode: s.state || '',
      region: s.state ? BusDevGallonsCalc.resolveRegion(s.state) : '',
      profile: s.profile || '', roadway: s.roadway || '',
      officialSubtotal: e ? e.officialSubtotal : null,
      finalGallons: e ? e.finalGallons : null,
      // The region scale those gallons were computed on. Taken from the
      // estimate's OWN regionPct -- what calculateEstimate() actually used --
      // never from a second read of effectiveRegionPct() here: the stamp has
      // to describe the figure sitting beside it, not today's slider.
      regionPctStamp: e ? BDPG.regionPctStamp(e.regionPct) : '',
      // The PDF baseline those gallons were built from. Same rule again: read
      // from the estimate's OWN baseline -- the row calculateEstimate() actually
      // resolved -- not from a fresh getBaselineRow() lookup here, which would
      // describe today's table rather than the figure beside it.
      baselineStamp: e ? BDPG.baselineStamp(e.baseline) : '',
      preEvalSignal: s.prospect.preEvalSignal || '',
      amenityLevel: s.amenityLevel || '',
      // Resolved to a number rather than `|| ''`: pricing is numeric now and
      // 0 is falsy, so the old idiom would have written an empty string for
      // every prospect saved at the neutral default -- the single most
      // common value -- and lost it on reopen.
      pricingLevel: BusDevGallonsCalc.pricingAdjustment(s.pricingLevel),
      rewardsLevel: s.rewardsLevel || ''
    };
  };

  // Profiles saved before this release have no `prospect` and no `summary`.
  // Every field falls back to a dash or empty string; nothing here may ever
  // render "undefined", and a legitimate zero (=== 0) must not collapse to
  // the "missing" fallback the way `|| null` would.
  //
  // The string fields all read through str(), the third member of this file's
  // guard set alongside isNum() for stored numbers and hasOwn() for stored
  // map keys. A hand-edited record holding an object where a label belongs
  // (e.g. rewardsLevel: {}) is truthy, so every `||` chain below used to pass
  // it straight to escHtml() and the tracker printed the literal
  // "[object Object]" -- a string this branch's own constraints forbid
  // rendering anywhere. Coercing a non-string to '' also lets the chain fall
  // through to the next source rather than stopping on the corrupt one, and
  // lands on the same "—" the rest of the table uses for missing data.
  function str(v) { return typeof v === 'string' ? v : ''; }
  BDPG.readSummary = function (p) {
    var sum = p.summary || {};
    var st = p.state || {};
    var pr = st.prospect || {};
    var stateCode = str(sum.stateCode) || str(st.state);
    return {
      name: str(sum.name) || str(p.name) || str(pr.name) || '—',
      locationType: str(sum.locationType) || str(pr.locationType),
      city: str(sum.city) || str(pr.city),
      stateCode: stateCode,
      // Region is DERIVED from the stored state code, never read from the
      // stored region string. The 5->8 split is not a rename: old "West"
      // covered WA/OR/ID/MT/WY as well as CA/NV/UT/CO, so a stored "West"
      // cannot be mapped to a new region without guessing which half it meant.
      // The state code is unambiguous and every record has one (State is
      // required before Generate). str() coerces resolveRegion()'s null (no
      // state code, or a code the 8-region map doesn't cover) to '', which
      // trackerRowHtml() and onLoadProfile() both treat as "needs re-select".
      region: stateCode ? str(BusDevGallonsCalc.resolveRegion(stateCode)) : '',
      profile: str(sum.profile) || str(st.profile), roadway: str(sum.roadway) || str(st.roadway),
      officialSubtotal: (sum.officialSubtotal === 0 || sum.officialSubtotal) ? sum.officialSubtotal : null,
      finalGallons: (sum.finalGallons === 0 || sum.finalGallons) ? sum.finalGallons : null,
      // grade / gradeLabel / weightStamp are deliberately NOT read back. The
      // Network Fit Grade was deleted on 2026-09-30; records saved before
      // then still carry those keys and are simply ignored rather than
      // migrated, so an old profile loads without error and without
      // resurrecting a letter nothing can recompute.
      //
      // No fallback chain and no default: a record saved before region
      // stamping has no evidence of the scale its gallons were computed on,
      // and '' must keep meaning "unknown". str() also turns a hand-edited
      // number or object into '' rather than letting it be compared as a
      // stamp.
      regionPctStamp: str(sum.regionPctStamp),
      // Same no-fallback rule again. Note this cannot fall back to
      // st.result.estimate.baseline either -- the snapshot deliberately drops
      // `result`, so a pre-stamping record has no record of its baseline
      // anywhere and '' is the only honest answer.
      baselineStamp: str(sum.baselineStamp),
      preEvalSignal: str(sum.preEvalSignal) || str(pr.preEvalSignal),
      amenityLevel: str(sum.amenityLevel) || str(st.amenityLevel),
      // Not str(): pricing is a number now, and str() returns '' for one.
      // pricingAdjustment() takes the number, the legacy option string a
      // pre-slider record carries, or nothing, and answers with the
      // percentage in every case -- so an old prospect reopens at the
      // posture it was quoted at instead of snapping to neutral.
      pricingLevel: BusDevGallonsCalc.pricingAdjustment(
        sum.pricingLevel !== undefined && sum.pricingLevel !== null && sum.pricingLevel !== ''
          ? sum.pricingLevel : st.pricingLevel),
      rewardsLevel: str(sum.rewardsLevel) || str(st.rewardsLevel),
      savedAt: str(p.savedAt)
    };
  };

  // The explicit save. Promoted from a plain `.btn` reading "Save Profile"
  // to the accent button and a stated destination, because "Save Profile"
  // named the thing being saved and not where it went -- the Prospects tab
  // was a separate discovery.
  //
  // It stays visible before Generate rather than appearing only after one.
  // Saving an un-generated prospect is supported on purpose (onSaveProfile
  // confirms, then stores blank figures), and that is the same save a rep
  // reaches for when they are capturing a lead to finish later. What changes
  // with a result present is the hint: it names the figure that is about to
  // be stored, so "Save to CRM" is never a guess about what lands.
  BDPG.saveToProspectsHtml = function () {
    var e = BDPG.state.result ? BDPG.state.result.estimate : null;
    var hint;
    if (e && isNum(e.finalGallons)) {
      hint = 'Creates or links a CRM lead for ' + BDPG.escHtml(BDPG.displayName()) + ' with ' +
        BDPG.fmtGal(e.finalGallons) + ' gal/mo and every adjustment behind it, ' +
        'and stores the same profile in the Prospects tab so it can be reopened later.';
    } else if (BDPG.state.resultStale) {
      hint = 'An input changed since the last Generate. Saving now creates or links a CRM lead ' +
        '(and the Prospects tab entry) with blank gallon figures — click Generate Value Profile first to store the number.';
    } else {
      hint = 'Generate a value profile first to store the gallons figure with it. ' +
        'Saving now creates or links a CRM lead (and the Prospects tab entry) without a number.';
    }
    // Lets the rep attach this save to an existing CRM lead by name/city/
    // state search, instead of only via the ?lead= deep link or an exact
    // normalised-name match in createLeadFromProfile()'s own duplicate check.
    var esc = BDPG.escHtml;
    var linkBlock;
    if (BDPG.currentLeadId) {
      linkBlock =
        '<div style="font-size:.74em;margin-bottom:10px">' +
          '<span style="color:var(--muted)">Will attach to CRM lead:</span> ' +
          '<b>' + esc(BDPG._leadLabel || BDPG.currentLeadId) + '</b> ' +
          '<a href="#" onclick="BDPG.onUnpickLead(); return false;" ' +
             'style="color:var(--accent);text-decoration:underline;margin-left:6px">change</a>' +
        '</div>';
    } else {
      var rows = BDPG._leadSearchResults.map(function (l) {
        var label = l.company + (l.city || l.state ? ' (' + [l.city, l.state].filter(Boolean).join(', ') + ')' : '');
        var args = JSON.stringify(l.id).replace(/"/g, '&quot;') + ',' +
                   JSON.stringify(label).replace(/"/g, '&quot;');
        return '<div onclick="BDPG.onPickLead(' + args + ')" ' +
               'style="padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.76em">' +
               esc(label) + ' <span style="color:var(--muted)">· ' + esc(l.stage || '') + '</span></div>';
      }).join('');
      linkBlock =
        '<div style="margin-bottom:10px">' +
          '<label style="font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">' +
            'Attach to an existing CRM lead (optional)</label>' +
          '<input id="bdpg-lead-search" placeholder="search company, city or state" ' +
            'oninput="BDPG.onLeadSearchInput(this.value)" ' +
            'style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;' +
            'color:var(--text);padding:6px 8px;font-size:.8em;font-family:var(--fb);margin-top:4px">' +
          (rows ? '<div style="border:1px solid var(--border);border-radius:5px;margin-top:4px;' +
                  'max-height:150px;overflow-y:auto">' + rows + '</div>' : '') +
          '<div style="font-size:.68em;color:var(--muted);margin-top:4px">' +
            'Leave blank to create a new lead at Prospect.</div>' +
        '</div>';
    }
    return '<div class="bdpg-box" id="bdpg-save-box" style="margin-top:14px">' +
      linkBlock +
      '<button class="btn btn-accent" onclick="BDPG.onSaveProfile()"' +
        (BDPG._saving ? ' disabled' : '') + '>💾 Save to CRM</button>' +
      '<div style="font-size:.72em;color:var(--muted);margin-top:8px">' + hint + '</div>' +
    '</div>';
  };

  // Debounced so a search does not fire per keystroke. 300ms rather than the
  // draft's 800: this is a user waiting on a list, not a background save.
  BDPG.onLeadSearchInput = function (v) {
    if (BDPG._leadSearchTimer) clearTimeout(BDPG._leadSearchTimer);
    var q = (v || '').trim();
    if (q.length < 2) { BDPG._leadSearchResults = []; BDPG.refreshSaveBox(); return; }
    BDPG._leadSearchTimer = setTimeout(function () {
      BDPG._leadSearchTimer = null;
      BDPG.searchLeads(q).then(function (rows) {
        BDPG._leadSearchResults = rows || [];
        BDPG.refreshSaveBox();
      });
    }, 300);
  };

  BDPG.onPickLead = function (id, label) {
    BDPG.currentLeadId = id;
    BDPG._leadLabel = label || '';
    BDPG._leadSearchResults = [];
    BDPG.refreshSaveBox();
  };

  BDPG.onUnpickLead = function () {
    BDPG.currentLeadId = null;
    BDPG._leadLabel = '';
    BDPG._leadSearchResults = [];
    BDPG.refreshSaveBox();
  };

  // Targeted patch, never a full render: a full render would destroy the
  // search input mid-typing and take the cursor with it.
  BDPG.refreshSaveBox = function () {
    var box = document.getElementById('bdpg-save-box');
    if (!box) return;
    var focused = document.activeElement && document.activeElement.id === 'bdpg-lead-search';
    var caret = focused ? document.activeElement.selectionStart : null;
    var val = focused ? document.activeElement.value : null;
    box.outerHTML = BDPG.saveToProspectsHtml();
    if (focused) {
      var again = document.getElementById('bdpg-lead-search');
      if (again) { again.value = val; again.focus(); again.setSelectionRange(caret, caret); }
    }
  };

  BDPG.onSaveProfile = function () {
    // Re-entry guard: the cloud half below is async, and a second click
    // before createLeadFromProfile()/saveFinal() resolves would otherwise
    // retake the create branch and insert a second crm_leads row.
    if (BDPG._saving) return;
    var name = BDPG.resolveProspectName() || prompt('Name this profile:');
    if (!name) return;
    // The prompt fallback above is otherwise a dead end: BDPG.displayName()
    // (used for both the record's `name` and `summary.name` below) only
    // ever reads through BDPG.resolveProspectName() (prospect.name /
    // supportingDetails.prospectName), so a typed prompt answer has to be
    // written back into state or it vanishes and every display falls back
    // to the literal "Prospect". Guard runs before the write below, so the
    // write can't make its own condition false.
    if (!BDPG.resolveProspectName()) {
      BDPG.state.prospect.name = name;
    }
    var profiles = BDPG.getSavedProfiles();

    // Re-saving a prospect that came from the tracker (or that this page
    // saved a moment ago) updates that record instead of appending another
    // one. The tracker's averages and its grade/signal distributions count
    // rows, so three rows for one prospect misreports the pipeline
    // threefold -- the natural "pull it up, refresh the numbers, save" loop
    // used to do exactly that.
    //
    // The binding is dropped the moment the displayed name stops matching
    // the record's: a rep who types a different prospect over the top of a
    // loaded one is starting a new record and must never overwrite the old
    // one. That errs toward an extra row (harmless, deletable) rather than
    // toward silent data loss.
    var idx = -1;
    if (BDPG.currentProfileId) {
      for (var i = 0; i < profiles.length; i++) {
        if (profiles[i].id === BDPG.currentProfileId) { idx = i; break; }
      }
      if (idx >= 0 && profiles[idx].name !== BDPG.displayName()) idx = -1;
    }

    // Nothing may be stored that describes a different input set than the
    // result it carries. By the time Save runs, that can only be true one
    // way -- an input changed after Generate, so invalidateResult() already
    // dropped the result -- and the two honest outcomes are "store it blank"
    // or "go back and Generate". Which one it is has to be the rep's call,
    // never a silent recompute of the number they last read on screen.
    if (!BDPG.state.result) {
      var prevSum = (idx >= 0 && profiles[idx].summary) ? profiles[idx].summary : null;
      var wouldBlankStoredFigures = !!prevSum &&
        (isNum(prevSum.officialSubtotal) || isNum(prevSum.finalGallons));
      if (BDPG.state.resultStale || wouldBlankStoredFigures) {
        var why = BDPG.state.resultStale
          ? 'An input changed after the last Generate, so there are no current results to save.'
          : 'No value profile has been generated since this prospect was loaded, so there are no current results to save.';
        if (!confirm(why + '\n\nSaving now stores this prospect with BLANK gallon figures and no grade.\n\n' +
                     'OK — save it blank.\nCancel — go back and click Generate Value Profile first.')) return;
      }
    }

    var snapshot = JSON.parse(JSON.stringify(BDPG.state));
    delete snapshot.result;
    delete snapshot.resultStale;
    var record = {
      id: idx >= 0 ? profiles[idx].id : 'bdpg_' + Date.now(),
      name: BDPG.displayName(),
      savedAt: new Date().toISOString(),
      state: snapshot,
      summary: BDPG.trackerSummary()
    };
    if (idx >= 0) profiles[idx] = record; else profiles.push(record);
    localStorage.setItem('roadysBDPGProfiles', JSON.stringify(profiles));
    BDPG.currentProfileId = record.id;
    // Save is what promotes the draft to a real prospect, so the draft is
    // done: the work is in roadysBDPGProfiles now and the Prospects tab is
    // where it is read back. Cancel any pending debounced write first, or it
    // would fire a second later and re-create the draft this just cleared.
    if (BDPG._draftTimer) { clearTimeout(BDPG._draftTimer); BDPG._draftTimer = null; }
    BDPG.clearDraftStorage();
    BDPG._draftMsg = '';
    // Names the prospect, so a rep who saves two in a row can see which one
    // landed -- "Profile saved" alone could not be told apart from the
    // previous save's toast. Reworded to not claim the CRM half, which
    // hasn't started yet -- the cloud half below replaces this with the
    // real outcome once it knows one.
    toast((idx >= 0 ? 'Updated — ' : 'Saved — ') + record.name + ' · syncing to CRM…');
    BDPG.render();
    // After the render, so step2Html()'s pricingLevel/amenityLevel defaults
    // are already settled and the baseline matches what is now on screen.
    BDPG.savedSig = BDPG.stateSig();

    // ── CRM lead link + cloud profile (Task 7) ────────────────────────────
    // Everything above is unconditional and already done -- this page's own
    // Prospects tab never depends on the network or on Supabase being up.
    // What follows is a second, independent write: attach (or create) a CRM
    // lead, store this same profile in bd_value_profiles as a 'final' row
    // (what Phase 2's CRM views read), and offer the stage move. A failure
    // in any of the three never touches the local save above, and the rep
    // is told exactly which part did not land -- never a bare "Saved" that
    // quietly papers over a half-finished sync.
    BDPG._saving = true;
    BDPG.refreshSaveBox();
    // Cleared on every exit of the async chain below -- success, every
    // failure branch, and both outer .catch handlers -- so a rejected
    // promise never leaves the Save button permanently disabled.
    var doneSaving = function () { BDPG._saving = false; BDPG.refreshSaveBox(); };

    // Three independent steps (lead link/create, cloud profile, stage move)
    // can each fail on their own. toast() cancels its predecessor, so a
    // per-step toast would mean only the LAST failure is ever seen -- these
    // collect into one final message that names every part that didn't land.
    var problems = [];
    // Two buckets, because they mean different things to a rep. A problem is
    // something that did NOT land and may need a retry; a warning is a caveat
    // about something that DID land. Styling them the same would train the
    // rep to ignore both.
    var warnings = [];
    var leadNote = '';
    var finishUp = function () {
      // Warnings are NOT an else-branch of problems. A caveat about something
      // that DID land (a lead that may duplicate an existing one) is still
      // true when a later step fails -- and it can never resurface, because
      // currentLeadId is set by then, so a retry takes the already-linked
      // path and never re-runs the duplicate scan.
      var notes = problems.concat(warnings);
      if (problems.length) {
        toast('Saved on this device. ' + notes.join(' '), 'terr');
      } else if (warnings.length) {
        toast('Saved to CRM — ' + BDPG.displayName() + leadNote + '. ' + warnings.join(' '), 'twarn');
      } else {
        toast('Saved to CRM — ' + BDPG.displayName() + leadNote, 'tok');
      }
      doneSaving();
    };

    // Runs after the lead is known (already linked, newly created, attached
    // to an existing one, or left unlinked because that step failed).
    // leadId may be null -- saveFinal() still writes an unlinked profile.
    var proceedToSaveFinal = function (leadId) {
      BDPG.currentLeadId = leadId || null;
      var prof = BDPG.draftProfile(BDPG.draftSnapshot());
      prof.leadId = BDPG.currentLeadId;
      return RoadysBD.profiles.saveFinal(prof).then(function (r) {
        if (!r.ok) {
          problems.push(BDPG.currentLeadId
            ? 'The lead was created but the value profile did not reach the cloud (' + r.error + ').'
            : 'The value profile did not reach the cloud (' + r.error + ').');
          finishUp();
          return;
        }
        // Release the cloud binding rather than keeping it. This row is now a
        // FINAL profile; draftProfile() always writes status:'draft', so if the
        // rep edits the still-populated card afterwards the next autosave would
        // upsert this very row back down to a draft -- and forLead(), which
        // filters status='final', would then report that the lead has no value
        // profile at all. Clearing it means the next keystroke starts a new
        // draft row instead. The partial unique indexes allow one draft AND one
        // final per lead, so both can coexist.
        BDPG.currentCloudId = null;
        BDPG._draftAuthor = '';
        BDPG._draftUpdatedAt = '';
        if (BDPG.currentLeadId) {
          return BDPG.maybePromptStage(BDPG.currentLeadId, BDPG.displayName()).then(function (st) {
            if (st.error) problems.push('The lead was not moved to Contacted (' + st.error + ').');
            else if (st.moved) leadNote += ' · moved to Contacted';
            finishUp();
          });
        }
        finishUp();
      });
    };

    if (BDPG.currentLeadId) {
      // Already linked (deep link, a previous save, or the attach search
      // box) -- nothing to create, so no lead-step problem can arise here.
      leadNote = ' · attached to lead';
      // Promise.resolve().then(...) so a SYNCHRONOUS throw inside
      // proceedToSaveFinal's prelude (draftProfile/draftSnapshot run before
      // any promise exists) lands in the catch below instead of escaping and
      // leaving _saving true -- a dead Save button with no message.
      Promise.resolve().then(function () {
        return proceedToSaveFinal(BDPG.currentLeadId);
      }).catch(function (err) {
        problems.push('Something went wrong syncing to CRM (' + BDPG.errText(err) + ').');
        finishUp();
      });
    } else {
      Promise.resolve().then(function () {
        return BDPG.createLeadFromProfile();
      }).then(function (res) {
        if (!res.ok) {
          problems.push('No CRM lead was created (' + res.error + ').');
        } else {
          leadNote = res.attached ? ' · attached to lead' : ' · new lead created';
        }
        if (res.scanFailed) warnings.push('The duplicate-company check could not run, so this may duplicate an existing lead.');
        return proceedToSaveFinal(res.ok ? res.id : null);
      }).catch(function (err) {
        problems.push('Something went wrong syncing to CRM (' + BDPG.errText(err) + ').');
        finishUp();
      });
    }
  };

  // Leads the rep can attach this profile to. Searched over company, city and
  // state — the three things they will actually have in front of them.
  BDPG.searchLeads = function (q) {
    var c = RoadysBD.auth.client();
    if (!c || !q) return Promise.resolve([]);
    var like = '%' + q.replace(/[%_,().]/g, '') + '%';
    return c.from('crm_leads').select('id,company,city,state,stage')
      .is('deleted_at', null)
      .or('company.ilike.' + like + ',city.ilike.' + like + ',state.ilike.' + like)
      .limit(10)
      .then(function (r) { return (r.error || !r.data) ? [] : r.data; })
      .catch(function () { return []; });
  };

  // Creates a lead at Prospect, seeded from the profile. Reuses the CRM's own
  // normalisation so the duplicate check below matches what CRM.html would
  // have matched -- a company already in the pipeline must warn, not silently
  // become a second card.
  BDPG.normCompany = function (s) {
    return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  };

  // Mirrors roadysBD.js's errText() -- same shape of Supabase error, same
  // graceful fallback -- so a thrown non-Supabase error still prints
  // something instead of "[object Object]".
  BDPG.errText = function (e) {
    if (!e) return '';
    return e.message || e.error_description || 'Unknown error';
  };

  // Resolves { ok, id, error, scanFailed, attached } rather than an
  // id-or-null. null conflated three different outcomes -- no client, a
  // failed insert, and a caught error -- and the caller then could not tell
  // "attached to lead X" from "no lead exists at all", so a silently
  // unlinked profile was reported as a complete success. `attached` is true
  // only when an existing lead was matched and the rep chose to attach,
  // false when a new row was inserted.
  BDPG.createLeadFromProfile = function () {
    var c = RoadysBD.auth.client();
    if (!c) return Promise.resolve({ ok: false, id: null, error: 'Supabase unavailable', scanFailed: false, attached: false });
    var s = BDPG.state, p = s.prospect;
    var company = BDPG.displayName();
    return c.from('crm_leads').select('id,company,city,state,stage')
      .is('deleted_at', null)
      // Ordered so the scanned set is deterministic -- without it, which rows
      // come back under a limit is unspecified, and the same company could be
      // caught on one save and missed on the next. Rows are five small columns,
      // so a high limit is cheap.
      .order('company').limit(5000)
      .then(function (r) {
        var scanFailed = !!r.error;
        // A read failure here must not silently skip the duplicate check --
        // that would create a second lead for a company already in the
        // pipeline with no signal to anyone that the check never ran.
        if (scanFailed) console.warn('[BDPG] duplicate-company scan failed; creating without the duplicate check', r.error);
        var rows = (r.error || !r.data) ? [] : r.data;
        // A silent truncation would turn the dup check into a coin flip. Say so.
        if (rows.length >= 5000) console.warn('[BDPG] duplicate-company scan hit the 5000-row limit; the check may be incomplete');
        var dup = rows.filter(function (x) {
          return BDPG.normCompany(x.company) === BDPG.normCompany(company);
        })[0];
        if (dup) {
          var ok = confirm('A lead for "' + dup.company + '" already exists (' +
            (dup.state || 'no state listed') + ' · ' + dup.stage + ').\n\n' +
            'OK — attach this profile to that lead.\n' +
            'Cancel — create a second lead anyway.');
          if (ok) return { ok: true, id: dup.id, error: '', scanFailed: scanFailed, attached: true };
        }
        var id = 'CRM-' + String(Date.now()).slice(-6);
        var row = {
          id: id, company: company,
          contact: '', phone: '', email: '',
          street: p.street || '', city: p.city || '', state: s.state || '',
          zip: '', exit: '', lanes: '',
          stage: 'Prospect', priority: 'Medium',
          // Unassigned, not the session email. `owner` is a controlled
          // vocabulary (CRM_OWNERS) that CRM.html's analytics and leaderboard
          // GROUP BY -- an email here invents a third person on the leaderboard,
          // matches none of the owner filters, and has no option in the lead
          // modal's Owner select, so opening and saving the lead silently blanks
          // it. CRM.html's own CSV import applies exactly this rule. The rep
          // assigns a real owner in the CRM.
          // (The activity-log `by` field keeps the email -- that one is free
          // text, not a vocabulary.)
          owner: '', source: 'Market Research',
          locations: 1, est_gallons: 0, deal_value: 0,
          follow_up: '', notes: p.notes || '',
          activity: [{ text: 'Lead created from a value profile',
                       date: new Date().toISOString().slice(0, 10),
                       by: RoadysBD.auth.email() || '', type: 'note' }],
          updated_at: new Date().toISOString()
        };
        return c.from('crm_leads').insert(row).then(function (ins) {
          return ins.error
            ? { ok: false, id: null, error: BDPG.errText(ins.error), scanFailed: scanFailed, attached: false }
            : { ok: true, id: id, error: '', scanFailed: scanFailed, attached: false };
        });
      })
      .catch(function (err) {
        return { ok: false, id: null, error: BDPG.errText(err), scanFailed: false, attached: false };
      });
  };

  // Spec §0.1: "Contacted" means we reached out, and a value profile is often
  // pre-contact research -- so this ASKS and never moves a lead silently. Only
  // Prospect and Qualified are offered; a lead already at Meeting Scheduled or
  // later is never prompted and never moved.
  BDPG.MOVEABLE_STAGES = ['Prospect', 'Qualified'];

  // Resolves { moved, error }: moved=true only when the stage actually changed
  // in the database. A rep who clicks OK and is told nothing will believe the
  // lead moved; if the update failed, the board will disagree with them later.
  BDPG.maybePromptStage = function (leadId, company) {
    var c = RoadysBD.auth.client();
    if (!c || !leadId) return Promise.resolve({ moved: false, error: '' });
    return c.from('crm_leads').select('stage').eq('id', leadId).limit(1)
      .then(function (r) {
        if (r.error || !r.data || !r.data.length) return { moved: false, error: '' };
        var stage = r.data[0].stage;
        if (BDPG.MOVEABLE_STAGES.indexOf(stage) === -1) return { moved: false, error: '' };
        if (!confirm('Saved value profile for ' + company + '.\n\n' +
                     'This lead is at ' + stage + '. Move it to Contacted?')) return { moved: false, error: '' };
        var act = { text: 'Moved from ' + stage + ' to Contacted',
                    date: new Date().toISOString().slice(0, 10),
                    by: RoadysBD.auth.email() || '', type: 'stage' };
        return c.from('crm_leads').select('activity').eq('id', leadId).limit(1)
          .then(function (a) {
            var log = (!a.error && a.data && a.data.length && Array.isArray(a.data[0].activity))
              ? a.data[0].activity : [];
            log.push(act);
            return c.from('crm_leads')
              .update({ stage: 'Contacted', activity: log }).eq('id', leadId)
              .then(function (u) {
                return u.error ? { moved: false, error: BDPG.errText(u.error) } : { moved: true, error: '' };
              });
          });
      })
      .catch(function (err) { return { moved: false, error: BDPG.errText(err) }; });
  };

  // Returns true only if the profile was actually loaded, so callers that
  // do more afterwards (onTrackerLoad's tab switch, onTrackerExport's
  // generate-and-print) stop when the rep declines.
  // `skipConfirm` is for callers that have already asked with a message of
  // their own -- never a way to skip the question altogether.
  BDPG.onLoadProfile = function (id, skipConfirm) {
    var profiles = BDPG.getSavedProfiles();
    var found = profiles.filter(function (p) { return p.id === id; })[0];
    if (!found) return false;
    // Loading replaces BDPG.state wholesale and there is no undo and no
    // history in roadysBDPGProfiles -- an in-progress prospect that was
    // never saved is simply gone. Ask first.
    if (!skipConfirm && !BDPG.confirmDiscard(
      'You have unsaved changes on the Potential Gallons tab.\n\n' +
      'Loading "' + (found.name || 'this prospect') + '" replaces them, and they cannot be recovered.\n\nContinue?')) return false;
    BDPG.state = JSON.parse(JSON.stringify(found.state));
    BDPG.state.result = null;
    // A deliberate load is not a stale result -- there is simply no result
    // yet. (And a record saved by an older build could carry the flag in its
    // snapshot; it must not resurrect a warning about someone else's edit.)
    BDPG.state.resultStale = false;
    BDPG.currentProfileId = found.id;
    // ── Migration guards for records saved by older builds ───────────────
    // These used to mix `=== undefined` and `!` from line to line; both were
    // correct for their own field, but the adjacency made the next one added
    // a coin flip. One rule now, no exceptions: each guard tests that the
    // field HAS THE TYPE it must have, never whether it is truthy. That keeps
    // a legitimate falsy value (tutorialOpen:false means the help modal is
    // closed, not that the field is unset) and still replaces a missing
    // field -- or a hand-edited one of the wrong type, which `=== undefined`
    // would have waved through into the DOM as "[object Object]".
    if (typeof BDPG.state.tutorialOpen !== 'boolean') BDPG.state.tutorialOpen = false;
    // A profile saved before the rewards term existed has no rewardsLevel;
    // one saved with a since-renamed label carries an orphan string. Both
    // resolve to the documented default here (and pricingLevel with it), so
    // the loaded record's stored numbers stay put and Step 2 shows the value
    // actually in force. See BDPG.normalizeLevels().
    BDPG.normalizeLevels();
    // A profile saved before Task 4 has no `prospect` at all -- default it
    // to the same empty shape the page starts with, so prospect-reading
    // code (the Step 0 card, the badge, trackerSummary) never throws on
    // a pre-Task-4 record.
    // (typeof null === 'object', hence both halves.)
    if (!BDPG.state.prospect || typeof BDPG.state.prospect !== 'object') {
      BDPG.state.prospect = { name: '', street: '', city: '', locationType: '', notes: '' };
    }
    // ...and then seed the name from the record itself. A pre-Task-4 record
    // carries the prospect's name at the TOP level (`found.name`) -- which is
    // exactly what the tracker row prints, via readSummary()'s `str(p.name)`
    // fallback -- but nothing copied it into the `prospect` shape above, so
    // resolveProspectName() returned '' and the record loaded anonymous.
    // Harmless before this branch (the name only appeared in an internal
    // header); now the hero, the packet <h1> and Copy Summary all read through
    // resolveProspectName(), so the same record exported a leave-behind headed
    // "Value Proposition for Prospect" while the row it was launched from said
    // "Old Record Diner".
    // `||`-chained, so a record that HAS a prospect.name keeps it -- this only
    // fills a blank. str-guarded like readSummary(): a hand-edited non-string
    // `name` must not reach escHtml() as "[object Object]".
    if (typeof BDPG.state.prospect.name !== 'string' || !BDPG.state.prospect.name) {
      BDPG.state.prospect.name = (typeof found.name === 'string' ? found.name : '');
    }
    // gsName is no longer a field. A profile saved while it existed still
    // carries one on its stored record; it is neither read nor copied onto
    // state, so it simply stops appearing. Nothing needs migrating.
    // Same "needs re-select" case trackerRowHtml() flags for this record's
    // row: readSummary() derives region from the state code, not from
    // whatever this record's summary.region says, and here that came back
    // empty even though the record has a real city/state to show. One toast
    // per load, worded identically to the tracker badge so the rep sees the
    // same fact in both places.
    var loadedSum = BDPG.readSummary(found);
    if (!loadedSum.region && (loadedSum.city || loadedSum.stateCode)) {
      toast('region updated — re-select state', 'terr');
    }
    BDPG.render();
    BDPG.savedSig = BDPG.stateSig();
    // The draft must always describe the ⓪ card that is on screen. A load
    // replaces that card wholesale, so the previous draft now describes
    // nothing visible -- leaving it would mean reloading the page brought
    // back the old draft instead of the prospect the rep just opened.
    // (Save is the one deliberate exception: it clears the draft outright,
    // because by then the work is in the tracker.)
    //
    // The card now holds a different prospect, so every binding to the PREVIOUS
    // prospect's cloud row and lead must go. Without this, the flushDraft()
    // below writes this prospect's data into the last one's bd_value_profiles
    // row, still carrying its lead_id -- and because drafts are shared, a
    // colleague sees that too. (currentProfileId is the LOCAL tracker id and is
    // set above deliberately; it is a different id space.)
    BDPG.currentCloudId = null;
    BDPG.currentLeadId = null;
    BDPG._leadLabel = '';
    BDPG._leadSearchResults = [];
    BDPG._draftAuthor = '';
    BDPG._draftUpdatedAt = '';
    BDPG.flushDraft();
    return true;
  };

  BDPG.onDeleteProfile = function (id) {
    if (!confirm('Delete this saved profile?')) return;
    var profiles = BDPG.getSavedProfiles().filter(function (p) { return p.id !== id; });
    localStorage.setItem('roadysBDPGProfiles', JSON.stringify(profiles));
    if (BDPG.currentProfileId === id) {
      // What is on the calculator tab came from the record just deleted, so
      // it is no longer stored anywhere: drop the update binding (a later
      // Save must create a new record, not resurrect this id) and mark the
      // state as unsaved work. '' can never equal a real signature, so
      // hasUnsavedWork() reports true until the next Save or Load.
      BDPG.currentProfileId = null;
      BDPG.savedSig = '';
      // The card came from the record just deleted, so no cloud draft/final
      // binding or lead link should survive it either -- same reset set as
      // onLoadProfile() and onClearDraft().
      BDPG.currentCloudId = null;
      BDPG.currentLeadId = null;
      BDPG._leadLabel = '';
      BDPG._leadSearchResults = [];
      BDPG._draftAuthor = '';
      BDPG._draftUpdatedAt = '';
    }
    BDPG.render();
  };

  BDPG.activeTab = 'calc';
  // 'weights' and 'locations' have no button in the tab row any more -- both
  // are reached through DEV -- so the toggle below simply finds nothing for
  // them and the row correctly shows neither as active while you are in there.
  BDPG.DEV_TABS = ['weights', 'locations'];
  BDPG.switchTab = function (name) {
    BDPG.activeTab = name;
    // Driven off one list rather than a line per tab, so a fourth tab can
    // never be added to the markup and forgotten here (which would leave two
    // buttons looking active at once).
    ['calc', 'prospects', 'weights', 'locations'].forEach(function (t) {
      var btn = document.getElementById('bdpg-tab-' + t);
      if (btn) btn.classList.toggle('active', t === name);
    });
    var dev = document.getElementById('bdpg-dev-entry');
    if (dev) dev.classList.toggle('on', BDPG.DEV_TABS.indexOf(name) !== -1);
    BDPG.render();
  };

  // Sub-nav for the DEV area. Both views behind the PIN sit here rather than
  // in the tab row, so the row a GS sees is the calculator and their
  // prospects, nothing else.
  BDPG.devNavHtml = function () {
    var items = [['weights', 'Admin settings'], ['locations', 'Network Locations']];
    return '<div class="bdpg-box" style="margin-bottom:10px;display:flex;gap:8px;' +
        'align-items:center;flex-wrap:wrap">' +
      '<span style="font-weight:700;letter-spacing:.06em;font-size:.8em;color:var(--muted)">DEV</span>' +
      items.map(function (it) {
        var on = BDPG.activeTab === it[0];
        return '<button class="btn' + (on ? ' on' : '') + '"' +
          (on ? ' style="background:var(--accent);color:#1A1D24"' : '') +
          ' onclick="BDPG.switchTab(\'' + it[0] + '\')">' + BDPG.escHtml(it[1]) + '</button>';
      }).join('') +
      '<div style="flex:1"></div>' +
      '<button class="btn" onclick="BDPG.switchTab(\'calc\')">← Back to the calculator</button>' +
    '</div>';
  };

  // Signal -> chip tone, mirrors the tones BDPG_STATS.prospectSignal assigns
  // (see the c7 overall-signal chip): Strong=green, Moderate=yellow, Review=red.
  BDPG.PREEVAL_SIGNAL_TONES = { Strong: 'green', Moderate: 'yellow', Review: 'red' };

  // Rewards posture -> chip/segment tone. Keyed by level name (matching
  // BDPG_CONFIG.REWARDS_LEVELS), not position, so this one map serves both
  // the tracker's Rewards column badge below and the Step 2 segmented
  // control's selected-background color (see rcol in step2Html) -- an
  // index-keyed array next to this would just invite the same reordering
  // hazard this map exists to avoid.
  //
  // CONSTRAINT ON THE VALUES, which nothing enforces at runtime: each tone
  // word is used in TWO different grammars and must be valid in both --
  //   * `var(--<tone>)`  -- the Step 2 segment background (rcol in step2Html)
  //   * `.tag-<tone>`    -- the tracker's Rewards badge class
  // and the two vocabularies are NOT the same set. `.tag-gray` exists while
  // `--gray` does not, which is exactly why the miss fallbacks are written
  // asymmetrically ('gray' for the class, a hardcoded var(--muted) for the
  // colour) instead of sharing one word. A fourth level whose tone word has
  // only one of the two definitions fails silently in the other place -- an
  // unstyled badge or a transparent segment, no console error. Before adding
  // one, confirm BOTH `--<tone>` (in :root AND the day-mode block) and
  // `.tag-<tone>` exist.
  BDPG.REWARDS_TONES = {
    "Participating in Roady's Rewards": 'green',
    'Undecided / unknown': 'yellow',
    'Not participating': 'red'
  };

  // Plain `[]` lookups on REGION_COLORS/GRADE_COLORS/PREEVAL_SIGNAL_TONES
  // would resolve a stored value of "constructor" or "toString" to an
  // inherited Object.prototype function instead of undefined, which then
  // blows up the caller (e.g. hexToRgba(fn, ...) calling fn.startsWith).
  // Requires hand-edited storage to reach, but the table must never break
  // on one bad cell, so every map lookup below goes through this.
  function hasOwn(obj, key) { return !!key && Object.prototype.hasOwnProperty.call(obj, key); }

  // Same reasoning, for the stored gallons values. BDPG.readSummary() only
  // screens out null/undefined, so a hand-edited record can hand the table a
  // string, an object or NaN. `!= null` would let all three through into
  // fmtGal() and print the literal "NaN" -- and in the diff-arrow chain a NaN
  // difference compares false against both `> 0` and `< 0` and lands on the
  // `else`, so corrupt data would render as the confident business claim
  // "No pricing adjustment". Every numeric cell tests the value itself with
  // the same guard trackerStatsHtml uses for the averages, and falls back to
  // the same "—" the rest of the table uses for missing data.
  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  // One row of the Prospects tracker, built entirely from BDPG.readSummary()
  // -- never from p.state/p.summary directly -- so a pre-Task-7 record
  // renders dashes instead of throwing or printing "undefined".
  BDPG.trackerRowHtml = function (p) {
    var sum = BDPG.readSummary(p);

    var typeBadge = sum.locationType
      ? ' <span class="badge tag-gray">' + BDPG.escHtml(sum.locationType) + '</span>' : '';
    var nameCell = BDPG.escHtml(sum.name) + typeBadge;

    var cityState = (!sum.city && !sum.stateCode) ? '—' :
      BDPG.escHtml(sum.city || '') + (sum.city && sum.stateCode ? ', ' : '') + BDPG.escHtml(sum.stateCode || '');
    // Only append a region badge when there's a real city/state to append it
    // to -- otherwise the cell could read "— Southeast", which defeats the
    // sort handler's exact `=== '—'` "dashes sort last" check.
    //
    // Within that guard, two outcomes: readSummary() resolved a region from
    // the stored state code (normal chip), or it couldn't -- no state code
    // at all, or one the 8-region map doesn't cover (a typo, or a code that
    // predates this split and was never revisited). That second case is
    // reachable now that readSummary() derives instead of trusting a stored
    // region name, so it gets its own flag instead of silently showing no
    // badge (which would look identical to "not evaluated for region yet").
    var regionChip = '';
    if (cityState !== '—') {
      if (sum.region && hasOwn(BDPG.REGION_COLORS, sum.region)) {
        var rc = BDPG.REGION_COLORS[sum.region];
        regionChip = ' <span class="badge" style="background:' + hexToRgba(rc, 0.18) + ';color:' + rc + '">' +
          BDPG.escHtml(sum.region) + '</span>';
      } else {
        regionChip = ' <span class="badge tag-yellow">region updated — re-select state</span>';
      }
    }
    var locationCell = cityState + regionChip;

    var profileCell = (sum.profile && sum.roadway)
      ? BDPG.escHtml(sum.profile) + ' · ' + BDPG.escHtml(sum.roadway) : '—';

    var officialCell = isNum(sum.officialSubtotal) ? BDPG.fmtGal(sum.officialSubtotal) : '—';
    // The region % is admin-editable, so a stored subtotal is only comparable
    // with the rest of this table -- and with what this row's own Export Pitch
    // Summary will print, since that recomputes from today's slider -- if it
    // was computed on the same region scale. Exactly the three cases the Grade
    // cell's weight marker uses, for exactly the same reason, and "unknown" is
    // again NOT folded into "matches": a record saved before stamping carries
    // no evidence either way.
    //
    // Deliberately TWO markers on this row rather than one combined
    // "different basis" badge. The two inputs move two different numbers: the
    // weights move only the letter, the region % moves only the gallons, and
    // they move independently. A single badge would have to sit in one cell
    // and implicate the other -- marking the Grade when only the region slider
    // moved says the letter is off-scale when it is not, and vice versa. Each
    // marker instead names the figure it describes, and the two share one
    // visual vocabulary (same glyph, same tag-yellow badge) so they still read
    // as one family of provenance warnings.
    //
    // Appended AFTER the number, never before: the delegated sort handler
    // parseFloat()s the cell text, which takes the leading number and stops --
    // "7,650 ! other region %" still sorts as 7650, the same way the Final
    // cell's arrows already do. A badge in front would break numeric sort.
    //
    // Skipped entirely when the region could not be resolved: the row already
    // carries the louder "region updated — re-select state" flag, and
    // effectiveRegionPct('') is 0, so comparing against it would assert a
    // scale nobody chose.
    if (isNum(sum.officialSubtotal) && sum.region && hasOwn(BDPG.REGION_COLORS, sum.region)) {
      var curRegionStamp = BDPG.regionPctStamp(BDPG.effectiveRegionPct(sum.region));
      if (!sum.regionPctStamp) {
        officialCell += ' <span class="badge tag-yellow" title="Saved before the region adjustment was recorded, so the region % behind these gallons is unknown. The current ' +
          BDPG.escHtml(sum.region) + ' adjustment is ' + BDPG.escHtml(curRegionStamp) +
          '%. Both stored figures are left exactly as they were saved — re-run Generate and save to restamp them.">&#9888; region scale unknown</span>';
      } else if (sum.regionPctStamp !== curRegionStamp) {
        officialCell += ' <span class="badge tag-yellow" title="Computed under a ' + BDPG.escHtml(sum.regionPctStamp) +
          '% region adjustment; the current ' + BDPG.escHtml(sum.region) + ' adjustment is ' + BDPG.escHtml(curRegionStamp) +
          '%, so this figure and the Final Gallons beside it are not directly comparable with rows computed on the current scale — and this row\'s Export Pitch Summary, which recomputes, will print different numbers. The stored figures are left exactly as they were saved — re-run Generate and save to recompute them.">&#9888; other region %</span>';
      }
    }

    // The same treatment for the PDF baseline, which BASELINE_TABLE made
    // mutable on 2026-09-24 (Profile 3: 5,000 -> 4,000 from network analysis).
    // It sits on the Official cell beside the region marker because both scale
    // that figure -- and a row can legitimately carry both when the baseline
    // moved AND a slider did, which is two independent facts, not one repeated.
    //
    // Compared against the CURRENT row for this record's own profile/roadway,
    // so only records on a row that actually changed are marked. Skipped when
    // the pair no longer resolves to a baseline row: there is nothing to
    // compare against, and the Location Profile cell already reads "—".
    if (isNum(sum.officialSubtotal) && sum.profile && sum.roadway) {
      // Compared against this profile's CURRENT baseline -- the network
      // median if it has one, else the table row. Baselines went back to
      // being one per profile when region moved out of the lookup, so a
      // single comparison per profile is like-for-like again.
      var curMap = BDPG.profileBaselineMap();
      var curDyn = curMap ? curMap[BDPG_STATS.baselineKeyFor(sum.profile, sum.roadway)] : null;
      var curRow = curDyn && isNum(curDyn.baseline)
        ? curDyn : BusDevGallonsCalc.getBaselineRow(sum.profile, sum.roadway);
      if (curRow) {
        var curBaselineStamp = BDPG.baselineStamp(curRow.baseline);
        if (!sum.baselineStamp) {
          officialCell += ' <span class="badge tag-yellow" title="Saved before the BD Calculator baseline was recorded, so the baseline behind these gallons is unknown. The current ' +
            BDPG.escHtml(sum.profile) + ' / ' + BDPG.escHtml(sum.roadway) + ' baseline is ' +
            BDPG.fmtGal(curRow.baseline) + ' gal/mo. The stored figures are left exactly as they were saved — re-run Generate and save to restamp them.">&#9888; baseline unknown</span>';
        } else if (sum.baselineStamp !== curBaselineStamp) {
          officialCell += ' <span class="badge tag-yellow" title="Built from a ' + BDPG.fmtGal(Number(sum.baselineStamp)) +
            ' gal/mo baseline; the current ' + BDPG.escHtml(sum.profile) + ' / ' + BDPG.escHtml(sum.roadway) +
            ' baseline is ' + BDPG.fmtGal(curRow.baseline) + ' gal/mo, so this figure and the Final Gallons beside it are not directly comparable with rows built on the current table — and this row\'s Export Pitch Summary, which recomputes, will print different numbers. The stored figures are left exactly as they were saved — re-run Generate and save to recompute them.">&#9888; other baseline</span>';
        }
      }
    }

    var finalCell = isNum(sum.finalGallons) ? BDPG.fmtGal(sum.finalGallons) : '—';
    if (isNum(sum.finalGallons) && isNum(sum.officialSubtotal)) {
      // finalGallons - officialSubtotal was purely the pricing delta before
      // this branch, and the tooltips said so. It is now pricing AND rewards,
      // and the two can pull in opposite directions -- measured on a saved row
      // with Aggressive (+2.5%) and Not participating (-5%), the old wording
      // read "Pricing posture removes 313 gal/mo" while pricing was in fact
      // ADDING 313 and rewards removing 626, with the row's own Pricing
      // Posture column contradicting it two cells to the right.
      //
      // The two non-zero branches are worded for what the number actually is
      // rather than split into GALLONS per term: a per-term gallon figure would
      // have to come from a stored pricingAdjusted (which no already-saved
      // record carries) or from re-multiplying the percentages, and a
      // re-multiplied step can land a gallon off the independently-rounded
      // engine figures -- the same rounding seam the waterfall's difference
      // form exists to avoid.
      //
      // The zero branch is different, and the first pass at this fix got it
      // wrong in exactly the way the original defect did. A zero DELTA is not
      // the same fact as zero ADJUSTMENTS: Most aggressive (+5%) with Not
      // participating (-5%) cancels to 13,000 == 13,000, and the row then said
      // "No pricing or rewards adjustment" while its own Pricing Posture and
      // Rewards columns both showed maximum magnitude. Two of the fifteen
      // pairings land here (the other is No discounts + Participating).
      //
      // Distinguishing them needs no stored figure and no gallon arithmetic --
      // only the two PERCENTAGES, which come straight from the config maps the
      // levels are keyed by. hasOwn-guarded like every other name-keyed lookup
      // in this file, falling back to 0 so a legacy row with no rewardsLevel
      // (or a hand-edited orphan string) reads as the 0% it is actually
      // computed at, rather than printing undefined. Pricing goes through
      // pricingAdjustment() instead, which resolves a slider number, a
      // legacy option string and junk to the same answer the formula used.
      var pPct = BusDevGallonsCalc.pricingAdjustment(sum.pricingLevel);
      var rPct = hasOwn(BDPG_CONFIG.REWARDS_ADJUST, sum.rewardsLevel) ? BDPG_CONFIG.REWARDS_ADJUST[sum.rewardsLevel] : 0;
      function pctTxt(v) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; }
      var diff = sum.finalGallons - sum.officialSubtotal;
      if (diff > 0) {
        finalCell += ' <span style="color:var(--green)" title="Pricing and Rewards together add ' + BDPG.fmtGal(diff) + ' gal/mo above the published figure">▲</span>';
      } else if (diff < 0) {
        finalCell += ' <span style="color:var(--red)" title="Pricing and Rewards together remove ' + BDPG.fmtGal(Math.abs(diff)) + ' gal/mo below the published figure">▼</span>';
      } else if (pPct === 0 && rPct === 0) {
        finalCell += ' <span style="color:var(--muted)" title="No pricing or rewards adjustment">●</span>';
      } else if (pPct + rPct === 0) {
        finalCell += ' <span style="color:var(--muted)" title="Pricing ' + pctTxt(pPct) + ' and Rewards ' + pctTxt(rPct) + ' cancel out — no net change from the published figure">●</span>';
      } else {
        // Unreachable from real data -- a record whose stored gallons agree
        // while its two percentages do not sum to zero has been hand-edited
        // (every real save computes finalGallons through both terms). Kept as
        // its own branch anyway because "cancel out" would be a false
        // mechanism claim on, say, +2.5% and +0.0%, and this file's whole
        // stance is that corrupt input degrades to a true statement rather
        // than a confident wrong one. States the two percentages and the
        // observed net, and asserts nothing about why.
        finalCell += ' <span style="color:var(--muted)" title="Pricing ' + pctTxt(pPct) + ' and Rewards ' + pctTxt(rPct) + ' — no net change from the published figure">●</span>';
      }
    }

    var signalCell = '—';
    if (sum.preEvalSignal) {
      var tone = hasOwn(BDPG.PREEVAL_SIGNAL_TONES, sum.preEvalSignal) ? BDPG.PREEVAL_SIGNAL_TONES[sum.preEvalSignal] : 'gray';
      signalCell = '<span class="badge tag-' + tone + '">' + BDPG.escHtml(sum.preEvalSignal) + '</span>';
    }

    var amenityCell = sum.amenityLevel ? BDPG.escHtml(sum.amenityLevel) : '—';
    // Formatted, not truthiness-tested: 0% is the default posture and a
    // falsy check would print "—" for most rows in the tracker.
    var pricingCell = (sum.pricingLevel === '' || sum.pricingLevel === null ||
        sum.pricingLevel === undefined)
      ? '—' : BDPG.escHtml(BDPG.fmtSignedPct(BusDevGallonsCalc.pricingAdjustment(sum.pricingLevel)));

    // Tone by posture, via the same hasOwn-guarded map style every other
    // lookup in this file uses, so a hand-edited value can't resolve to an
    // inherited Object.prototype member.
    var rewardsCell = '—';
    if (sum.rewardsLevel) {
      var rtone = hasOwn(BDPG.REWARDS_TONES, sum.rewardsLevel) ? BDPG.REWARDS_TONES[sum.rewardsLevel] : 'gray';
      rewardsCell = '<span class="badge tag-' + rtone + '">' + BDPG.escHtml(sum.rewardsLevel) + '</span>';
    }
    // "YYYY MM DD" sliced straight from the stored ISO string -- not
    // `new Date(...).toLocaleDateString()` -- for three reasons (see
    // task-8-ruling.md): (1) the shared sort handler's numeric-parse strips
    // whitespace but not "/" or "-", so this is the one digit-grouping that
    // collapses to a single chronologically-correct integer instead of
    // tying same-year or same-month rows; (2) slicing never produces the
    // literal string "Invalid Date" for a non-empty-but-unparseable value;
    // (3) it sidesteps the UTC-stored/local-rendered day-shift a Date
    // conversion could introduce for a timestamp saved late in the day.
    var savedCell = (typeof sum.savedAt === 'string' && sum.savedAt.length >= 10)
      ? sum.savedAt.slice(0, 10).replace(/-/g, ' ') : '—';

    // A record missing its id (unreachable from any real Save Profile,
    // which always writes 'bdpg_' + Date.now(), but hand-edited storage
    // could produce one) must not render action buttons that silently
    // no-op or, worse, consume a Delete confirmation and delete nothing.
    var pid = p.id || '';
    var actionsCell;
    if (pid) {
      // JSON.stringify + escaping only the HTML-attribute-delimiting `"`
      // (matching the existing onLocationType(...) pattern elsewhere in
      // this file) is what actually neutralizes an id containing a quote
      // inside this onclick="..." attribute -- HTML-entity-escaping the id
      // itself (BDPG.escHtml) would not, because the browser decodes
      // entities in the attribute value before compiling it as JS, so an
      // escaped `'` would decode right back into a string-breaking quote.
      var idJs = JSON.stringify(pid).replace(/"/g, '&quot;');
      actionsCell =
        '<button class="btn btn-accent" onclick="BDPG.onTrackerLoad(' + idJs + ')">Load</button> ' +
        '<button class="btn" onclick="BDPG.onTrackerExport(' + idJs + ')">Export Pitch Summary</button> ' +
        '<button class="btn" onclick="BDPG.onDeleteProfile(' + idJs + ')">Delete</button>';
    } else {
      actionsCell = '<span style="color:var(--muted);font-size:.8em">No id — can’t act</span>';
    }

    return '<tr>' +
      '<td>' + nameCell + '</td>' +
      '<td>' + locationCell + '</td>' +
      '<td>' + profileCell + '</td>' +
      '<td>' + officialCell + '</td>' +
      '<td>' + finalCell + '</td>' +
      '<td>' + signalCell + '</td>' +
      '<td>' + amenityCell + '</td>' +
      '<td>' + pricingCell + '</td>' +
      '<td>' + rewardsCell + '</td>' +
      '<td>' + savedCell + '</td>' +
      '<td>' + actionsCell + '</td>' +
    '</tr>';
  };

  // Roll-up beneath the Prospects table: five grade chips + three signal
  // chips (always all eight, even at zero, per the user's ruling that the
  // shape must stay fixed and comparable) plus the two averages. Every
  // field comes from BDPG.readSummary(p) -- never p.state/p.summary
  // directly -- so a legacy record (no `prospect`, no `summary`) degrades
  // exactly like it does in trackerRowHtml: an empty grade/signal is
  // excluded from its distribution (never miscounted as 'A' or 'Strong'),
  // and a null gallons value is excluded from the averages' denominator
  // rather than counted as zero -- a profile saved before Generate has run
  // has null gallons, and averaging it in as 0 would silently drag every
  // average down and misreport the pipeline.
  BDPG.trackerStatsHtml = function (profiles) {
    var signalOrder = ['Strong', 'Moderate', 'Review'];
