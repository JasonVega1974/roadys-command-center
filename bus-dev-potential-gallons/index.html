        // Small/Backroad's two locations median far above its fallback, so the
        // observed figure is shown rather than hidden behind the fallback.
        (d.median !== null ? ' (observed average ' + BDPG.fmtGal(d.median) + ').' : '.');
    return '<div style="' + muted + '"><span class="badge tag-gray">Network default</span> ' + why + '</div>' + count;
  };

  BDPG.profileRangeMap = function () {
    if (!BDPG._locationsReady) return {};
    return BDPG_STATS.profileRanges(BDPG.networkLocations(), BDPG_CONFIG.BASELINE_TABLE);
  };

  // The spread behind a card's median: p10 — median — p90, drawn to the
  // profile's own scale rather than a shared one.
  //
  // Per-card scale is the deliberate choice. A shared axis across all eight
  // cards would squash Fuel stop (614–16,302) into the left eighth of
  // Large/Interstate's range (1,452–60,545) and make its spread unreadable,
  // and the cards are read one at a time against their own numbers, not
  // compared end to end. The printed endpoints carry the absolute values, so
  // nothing is inferred from bar width alone.
  //
  // Nothing is drawn below DYNAMIC_BASELINE_MIN_N: profileRanges() returns
  // nulls there, and a card whose baseline is the static fallback has no
  // observed spread to advertise.
  BDPG.profileRangeBarHtml = function (rg) {
    if (!rg || rg.low === null || rg.high === null || rg.mid === null) {
      return '<div class="bdpg-bcard-sub" style="margin-top:6px;color:var(--muted)">' +
        'range —<span style="font-size:.88em"> (n=' + ((rg && rg.n) || 0) + ')</span></div>';
    }
    // Guard the degenerate case: p10 === p90 when every reporting location
    // in the profile reads the same, which would divide by zero.
    var span = rg.high - rg.low;
    var pos = span > 0 ? ((rg.mid - rg.low) / span) * 100 : 50;
    pos = Math.max(0, Math.min(100, pos));
    return '<div style="margin-top:7px" title="10th percentile, average and 90th percentile of the ' +
        rg.n + ' reporting locations in this profile.">' +
      '<div style="position:relative;height:5px;border-radius:3px;background:var(--border)">' +
        '<div style="position:absolute;top:0;bottom:0;left:0;right:0;border-radius:3px;' +
          'background:linear-gradient(90deg,var(--border),var(--accent))"></div>' +
        '<div style="position:absolute;top:-3px;width:3px;height:11px;border-radius:2px;' +
          'background:var(--text);left:' + pos.toFixed(1) + '%;transform:translateX(-50%)"></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:.66em;color:var(--muted);margin-top:3px">' +
        '<span>Low ' + BDPG.fmtGal(rg.low) + '</span>' +
        '<span>Avg ' + BDPG.fmtGal(rg.mid) + '</span>' +
        '<span>High ' + BDPG.fmtGal(rg.high) + '</span>' +
      '</div></div>';
  };

  BDPG.step1Html = function () {
    var s = BDPG.state;
    var ICONS = { 'Fuel stop': '⛽', 'Small truck stop': '🚏',
                  'Medium truck stop': '🚛', 'Large truck stop': '🏙' };
    // Cards are generated from BASELINE_TABLE itself -- never a hand-copied
    // duplicate of it, so the grid can't drift from the config.
    // Resolved once per render rather than per card.
    var baseMap = BDPG.profileBaselineMap();
    var rangeMap = BDPG.profileRangeMap();
    function cardBase(r) {
      var b = baseMap ? baseMap[BDPG_STATS.baselineKeyFor(r.profile, r.roadway)] : null;
      return b || { baseline: r.baseline, total: 0, n: 0, source: 'static' };
    }
    var cards = BDPG_CONFIG.BASELINE_TABLE.map(function (r) {
      var on = (r.profile === s.profile && r.roadway === s.roadway);
      var dim = (s.profile && r.profile !== s.profile && !on);
      var suggest = !on && (s.suggestProfiles || []).indexOf(r.profile) !== -1;
      return '<div class="bdpg-bcard' + (on ? ' on' : '') + (dim ? ' dim' : '') + (suggest ? ' suggest' : '') + '" ' +
        'onclick="BDPG.onBaselineCardClick(' + JSON.stringify(r.profile).replace(/"/g, '&quot;') +
        ',' + JSON.stringify(r.roadway).replace(/"/g, '&quot;') + ')">' +
        '<div class="bdpg-bcard-ico">' + (ICONS[r.profile] || '📍') + '</div>' +
        '<div class="bdpg-bcard-name">' + BDPG.escHtml(r.profile) + '</div>' +
        '<div class="bdpg-bcard-sub">' + BDPG.escHtml(r.roadway) + ' · ' +
          (r.lanes === 'any' ? 'any lanes' : BDPG.escHtml(r.lanes) + ' lanes') + '</div>' +
        // The live network median where the profile has one, so the grid and
        // the Selected Baseline callout below it cannot disagree.
        '<div class="bdpg-bcard-gal">' + BDPG.fmtGal(cardBase(r).baseline) + '</div>' +
        '<div class="bdpg-bcard-sub">average gal/mo</div>' +
        // The qualifying n, not the total that match the profile. The card
        // puts a location count directly under an average, so the count has
        // to be the sample that produced the average. Under the qualifying
        // rule the two diverge sharply -- 29 fuel stops in the network, 7 of
        // them behind the 5,630 -- and printing the larger number here claims
        // evidence the average does not have. The total stays, as the second
        // half of "7 of 29", because the footprint is worth knowing too.
        '<div class="bdpg-bcard-sub" style="margin-top:2px" title="' +
          cardBase(r).total + ' network locations match this profile; ' + cardBase(r).n +
          ' of them clear the qualifying rule (at least ' +
          BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo and at least ' +
          BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months) and feed this average.">' +
          'qualifying locations: ' + cardBase(r).n + ' of ' + cardBase(r).total + '</div>' +
        BDPG.profileRangeBarHtml(rangeMap[BDPG_STATS.baselineKeyFor(r.profile, r.roadway)]) +
      '</div>';
    }).join('');

    var row = (s.profile && s.roadway) ? BusDevGallonsCalc.getBaselineRow(s.profile, s.roadway) : null;
    var callout = '';
    if (row) {
      // Kicks the fetch on the first baseline of a session if the Network
      // Locations tab has not already done it; re-renders when it lands.
      BDPG.primeLocationsForBaseline();
      var dyn = BDPG.currentBaseline();
      var shown = (dyn && isNum(dyn.baseline)) ? dyn.baseline : row.baseline;
      // The range bar that used to sit here is GONE, deliberately.
      //
      // It plotted this baseline on an axis spanning every profile's baseline
      // (2,338 to 20,232), which answered "how does this profile compare to
      // the other seven?" -- a different question from the one the card
      // directly above it answers with Low / Avg / High for THIS profile. Two
      // bars, two axes, no labels distinguishing them: the reader had no way
      // to know they measured different things, and the cross-profile one
      // looked like a contradiction of the per-profile one.
      //
      // Rescaling it to this profile's own p10/p90 was the other option, and
      // it was worse: it would have drawn the SAME bar as the selected card
      // immediately above, twice, inches apart.
      //
      // The cross-profile comparison it was reaching for still exists, done
      // properly -- the Distribution by Baseline Profile panel on the DEV tab
      // puts all eight on one shared axis with every end labelled.
      callout = '<div class="bdpg-callout">' +
        '<div class="bdpg-lbl">Selected Baseline</div>' +
        '<div style="font-family:var(--ff);font-size:2em;font-weight:800;color:var(--accent);line-height:1">' +
          BDPG.fmtGal(shown) + '<span style="font-size:.45em;color:var(--muted);margin-left:8px">avg gal/mo baseline</span></div>' +
        BDPG.baselineSourceNoteHtml(dyn) +
      '</div>';
    } else {
      callout = '<div class="bdpg-callout" style="color:var(--muted);font-size:.85em">Pick a location profile above to set the baseline.</div>';
    }

    var note = s.autoSetNote
      ? '<div style="margin-top:10px;font-size:.82em;color:var(--accent)">' + BDPG.escHtml(s.autoSetNote) + '</div>'
      : (s.suggestProfiles && s.suggestProfiles.length
          ? '<div style="margin-top:10px;font-size:.82em;color:var(--yellow)">Suggested starting point for this location type.</div>'
          : '');

    return '<div class="bdpg-grid-3">' + cards + '</div>' + note + callout;
  };

  BDPG.onBaselineCardClick = function (profile, roadway) {
    // Sets the same two fields the old cascading selects set -- one click instead
    // of two, same resulting state. A manual pick always wins over an earlier
    // Location Type auto-set, so any stale "baseline auto-set" note must not
    // linger next to a contradicting selection.
    // Only a real change invalidates: re-clicking the already-selected card
    // must not throw away results it still describes exactly.
    if (BDPG.state.profile !== profile || BDPG.state.roadway !== roadway) BDPG.invalidateResult();
    BDPG.state.profile = profile;
    BDPG.state.roadway = roadway;
    BDPG.state.autoSetNote = '';
    // The discount slider's ends come from THIS profile's p10/p90, so the
    // range just changed underneath a stored posture. Bring it inside the new
    // range before rendering, or the handle sits at one value while the
    // estimate uses another.
    BDPG.reconcilePricingToProfile();
    BDPG.render();
  };

  // Step 2's Pricing and Rewards controls are segmented buttons driven by a
  // fixed option list, so a stored value that is not *in* that list has no
  // segment to light up: the control rendered with nothing selected while the
  // engine quietly computed at the 0% band, and a Save persisted the orphan
  // string. Unreachable from the UI itself (every write comes from a button
  // carrying one of the listed labels) but reachable by a hand-edited record
  // or a future label rename -- the same class of silent failure this file
  // already hardens with hasOwn() on every map lookup and isNum() on every
  // stored gallons value. Snapping an unrecognised value back to the
  // documented default makes the fallback visible on screen rather than
  // presenting as "nothing chosen".
  //
  // `indexOf(...) < 0` rather than a truthiness test, so it covers the empty
  // first-render case, an orphan label AND a non-string (a hand-edited object
  // would otherwise reach the engine and the tracker verbatim).
  //
  // Called from the two chokepoints that between them cover every consumer:
  // step2Html() (so the control always shows the value actually in force) and
  // onGenerate() (so the pitch builders, which read live state rather than
  // the estimate's own inputs, can never see an orphan -- an unrecognised
  // pricingLevel made PRICING_LEVELS.indexOf() return -1 in
  // pitchOpportunities() and silently dropped the pricing bullet).
  //
  // Pricing is now a number, and normalizing it means resolving whatever is
  // stored -- a slider value, a legacy option string off a saved prospect,
  // or junk -- to the number the formula will actually use. Resolving it
  // here, once, is what keeps every later reader (the control, the
  // breakdown, the pitch, the export) from having to know that strings can
  // still arrive.
  BDPG.normalizeLevels = function () {
    var s = BDPG.state;
    s.pricingLevel = BusDevGallonsCalc.pricingAdjustment(s.pricingLevel);
    if (BDPG_CONFIG.REWARDS_LEVELS.indexOf(s.rewardsLevel) < 0) s.rewardsLevel = BDPG_CONFIG.REWARDS_DEFAULT;
  };

  // Restroom / shower condition. Its own additive term, summed with the
  // amenity level into the single Amenities figure the breakdown shows.
  // The row primitive supplies the "Restroom / Shower Condition" title now
  // -- this returns just the <select>.
  BDPG.restroomSelectHtml = function () {
    var cur = BDPG.state.restroomLevel || BDPG_CONFIG.RESTROOM_DEFAULT;
    var opts = BDPG_CONFIG.RESTROOM_LEVELS.map(function (lv) {
      var pct = BDPG_CONFIG.RESTROOM_ADJUST[lv];
      return '<option value="' + BDPG.escHtml(lv) + '"' + (lv === cur ? ' selected' : '') + '>' +
        BDPG.escHtml(lv) + ' (' + (pct >= 0 ? '+' : '') + (pct * 100).toFixed(0) + '%)</option>';
    }).join('');
    return '<select style="max-width:260px" onchange="BDPG.onRestroomChange(this.value)">' + opts + '</select>';
  };

  BDPG.onRestroomChange = function (value) {
    var v = BDPG_CONFIG.RESTROOM_LEVELS.indexOf(value) >= 0 ? value : BDPG_CONFIG.RESTROOM_DEFAULT;
    if (BDPG.state.restroomLevel !== v) BDPG.invalidateResult();
    BDPG.state.restroomLevel = v;
    BDPG.render();
  };

  // ── DEF + inside sales ──────────────────────────────────────────────────
  //
  // Downstream of the formula: both are derived from FINAL monthly gallons
  // and neither touches calculateEstimate(). Four commercial assumptions and
  // an on/off switch, stored per browser like every other admin value.
  BDPG.DEF_INSIDE_KEY = 'roadysBDPGDefInside';
  BDPG.defInsideConfig = null;

  BDPG.loadDefInside = function () {
    var out = {};
    Object.keys(BDPG_CONFIG.DEF_INSIDE_DEFAULTS).forEach(function (k) {
      out[k] = BDPG_CONFIG.DEF_INSIDE_DEFAULTS[k];
    });
    var raw = null;
    try { raw = localStorage.getItem(BDPG.DEF_INSIDE_KEY); } catch (e) { BDPG.defInsideConfig = out; return; }
    if (raw) {
      var parsed = null;
      try { parsed = JSON.parse(raw); } catch (e2) { parsed = null; }
      if (parsed && typeof parsed === 'object') {
        if (typeof parsed.enabled === 'boolean') out.enabled = parsed.enabled;
        // Each rate validated on its own. A single bad value falls back to
        // its default rather than discarding the other three -- these are
        // independent assumptions, not one set.
        ['defPctOfDiesel', 'defPricePerGal', 'gallonsPerTransaction', 'avgInsideRing'].forEach(function (k) {
          var n = Number(parsed[k]);
          if (isFinite(n) && n > 0) out[k] = n;
        });
      }
    }
    BDPG.defInsideConfig = out;
  };

  BDPG.defInside = function () {
    if (!BDPG.defInsideConfig) BDPG.loadDefInside();
    return BDPG.defInsideConfig;
  };

  BDPG.onDefInsideChange = function (field, value) {
    var cfg = BDPG.defInside();
    if (field === 'enabled') { cfg.enabled = !!value; }
    else {
      var n = Number(value);
      if (!isFinite(n) || n <= 0) { BDPG.defInsideMsg('That value must be a positive number — nothing was saved.', true); return; }
      cfg[field] = n;
    }
    try { localStorage.setItem(BDPG.DEF_INSIDE_KEY, JSON.stringify(cfg)); }
    catch (e) { BDPG.defInsideMsg('Could not save in this browser.', true); return; }
    BDPG.render();
    BDPG.defInsideMsg('Saved.', false);
  };

  BDPG.defInsideMsg = function (text, isErr) {
    var el = document.getElementById('bdpg-definside-msg');
    if (!el) return;
    el.textContent = text;
    el.style.color = isErr ? 'var(--red)' : 'var(--green)';
  };

  BDPG.defInsideCardHtml = function () {
    var c = BDPG.defInside();
    function num(field, label, val, step, prefix) {
      return '<div class="fg"><label style="font-size:.72em">' + label + '</label>' +
        '<input type="number" step="' + step + '" min="0" value="' + BDPG.escHtml(String(val)) + '" ' +
        'onchange="BDPG.onDefInsideChange(\'' + field + '\', this.value)"></div>';
    }
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div style="font-weight:700;margin-bottom:6px">⛽ DEF &amp; Inside Sales estimates</div>' +
      '<div style="font-size:.8em;color:var(--muted);margin-bottom:10px">Derived from final monthly ' +
        'gallons and shown on the value profile, the packet and the Copy Summary. Turning this off ' +
        'removes the section from all three.</div>' +
      '<label style="display:flex;gap:8px;align-items:center;font-size:.85em;margin-bottom:10px">' +
        '<input type="checkbox"' + (c.enabled ? ' checked' : '') +
        ' onchange="BDPG.onDefInsideChange(\'enabled\', this.checked)"> Show this section</label>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">' +
        num('defPctOfDiesel', 'DEF % of diesel', c.defPctOfDiesel, '0.001') +
        num('defPricePerGal', 'DEF price / gal ($)', c.defPricePerGal, '0.01') +
        num('gallonsPerTransaction', 'Gallons per transaction', c.gallonsPerTransaction, '1') +
        num('avgInsideRing', 'Average inside ring ($)', c.avgInsideRing, '0.01') +
      '</div>' +
      '<div id="bdpg-definside-msg" style="font-size:.8em;margin-top:8px"></div>' +
    '</div>';

  BDPG.fmtMoney = function (n) {
    return '$' + Math.round(Number(n) || 0).toLocaleString();
  };

  // The prospect-facing block. Returns '' when the section is off or the
  // rates are unusable, so every caller omits it rather than printing zeros.
  BDPG.defInsideHtml = function (forPrint) {
    if (!BDPG.state.result) return '';
    var d = BusDevGallonsCalc.defInsideEstimate(BDPG.state.result.estimate.finalGallons, BDPG.defInside());
    if (!d) return '';
    var stat = 'font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px';
    var big = 'font-family:var(--ff);font-size:1.5em;font-weight:800;color:var(--accent);line-height:1';
    function cell(label, mo, yr) {
      return '<div><div style="' + stat + '">' + label + '</div>' +
        '<div style="' + big + '">' + mo + '</div>' +
        '<div style="font-size:.72em;color:var(--muted);margin-top:2px">' + yr + ' / yr</div></div>';
    }
    return '<div class="' + (forPrint ? 'bdpg-box' : 'cc') + '" style="margin-top:14px">' +
      (forPrint ? '<div style="font-weight:700;margin-bottom:6px">DEF &amp; Inside Sales</div>'
                : '<div class="cc-lbl">DEF &amp; Inside Sales</div>') +
      '<div style="display:flex;flex-wrap:wrap;gap:30px">' +
        cell('DEF gallons', BDPG.fmtGal(d.defGallonsMo) + ' gal/mo', BDPG.fmtGal(d.defGallonsYr) + ' gal') +
        cell('DEF sales', BDPG.fmtMoney(d.defSalesMo), BDPG.fmtMoney(d.defSalesYr)) +
        cell('Inside transactions', BDPG.fmtGal(d.transactionsMo) + ' /mo', BDPG.fmtGal(d.transactionsYr)) +
        cell('Inside sales', BDPG.fmtMoney(d.insideSalesMo), BDPG.fmtMoney(d.insideSalesYr)) +
      '</div>' +
      '<div style="font-size:.72em;color:var(--muted);margin-top:10px">Estimates based on network ' +
        'averages: DEF at ' + (d.rates.defPct * 100).toFixed(1) + '% of diesel gallons priced at ' +
        BDPG.fmtMoney(d.rates.defPrice) + '/gal, and one inside transaction per ' +
        BDPG.fmtGal(d.rates.perTxn) + ' gallons at an average ring of ' +

  // Shared by the full render (stepRowHtml) and the targeted slider patch
  // (patchStepValue) so both ever paint a given value the same colour --
  // one tone decision instead of two that could drift apart.
  BDPG.stepValueTone = function (row) {
    if (row.valueKind === 'pct' && row.value !== null) {
      return row.value > 0 ? 'var(--green)' : (row.value < 0 ? 'var(--red)' : 'var(--muted)');
    }
    if (row.valueKind === 'gallons') return 'var(--accent)';
    return 'var(--muted)';
  };

  // and right-hand value come from BDPG_STEPS.rows(); the body is whatever
  // control that step owns. Adding a step means adding it to bdpgSteps.js and
  // passing a body here -- never hand-building another row.
  //
  // The value cell carries a stable id (bdpg-astep-v-N) so patchStepValue()
  // can repaint it without a full render -- see onRatingSlider/onPricingSlider.
  BDPG.stepRowHtml = function (row, bodyHtml) {
    var tone = BDPG.stepValueTone(row);
    return '<div class="bdpg-astep">' +
      '<div>' +
        '<div class="bdpg-astep-t"><span class="bdpg-astep-n">' + row.n + '</span>' +
          BDPG.escHtml(row.title) + '</div>' +
        (row.subtitle ? '<div class="bdpg-astep-sub">' + BDPG.escHtml(row.subtitle) + '</div>' : '') +
        (bodyHtml ? '<div class="bdpg-astep-body">' + bodyHtml + '</div>' : '') +
      '</div>' +
      '<div id="bdpg-astep-v-' + row.n + '" class="bdpg-astep-v ' + row.valueKind + '" style="color:' + tone + '">' +
        BDPG.escHtml(row.valueText) + '</div>' +
    '</div>';
  };

  // The single source of truth for what each Adjustment Step's right-hand
  // value says. step2Html() calls this on every full render; patchStepValue()
  // calls it from a targeted slider patch. One function, two callers, so a
  // badge painted mid-drag and a badge painted by the next full render can
  // never disagree about the same input.
  //
  // amenityLevelPct reads s.amenityLevel rather than re-deriving a
  // suggestion from amenityDetails: deriving it is step2Html()'s own render
  // side effect (it writes s.amenityLevel), and that must happen exactly
  // once per full render, not once per call here.
  BDPG.stepRowsNow = function () {
    var s = BDPG.state;
    var region = s.state ? BusDevGallonsCalc.resolveRegion(s.state) : null;
    var regionPct = region ? BDPG.effectiveRegionPct(region) : 0;
    var baseRow = BDPG.currentBaseline();
    var levelPct = (s.amenityLevel && hasOwn(BDPG_CONFIG.AMENITY_ADJUST, s.amenityLevel))
      ? BDPG_CONFIG.AMENITY_ADJUST[s.amenityLevel] : 0;
    return BDPG_STEPS.rows({
      baseline:        baseRow && isNum(baseRow.baseline) ? baseRow.baseline : null,
      profile:         s.profile || '',
      roadway:         s.roadway || '',
      regionPct:       region ? regionPct : null,
      reviewPct:       BusDevGallonsCalc.reviewAdjustment(s.truckerPathRating).pct,
      amenityLevelPct: levelPct,
      restroomPct:     BusDevGallonsCalc.restroomAdjustment(s.restroomLevel || BDPG_CONFIG.RESTROOM_DEFAULT),
      rewardsPct:      BusDevGallonsCalc.rewardsAdjustment(s.rewardsLevel),
      pricingPct:      BDPG.currentPricingPct()
    });
  };

  // Targeted patch for one Adjustment Step's badge, for the two handlers
  // (onRatingSlider, onPricingSlider) that intentionally skip BDPG.render()
  // so a dragged slider keeps focus. Reads BDPG.stepRowsNow() -- the same
  // function the full render reads -- so the patched figure and the next
  // full render can never disagree.
  BDPG.patchStepValue = function (n) {
    var el = document.getElementById('bdpg-astep-v-' + n);
    if (!el) return;
    var row = BDPG.stepRowsNow()[n - 1];
    el.textContent = row.valueText;
    el.style.color = BDPG.stepValueTone(row);
  };

  BDPG.step2Html = function () {
    var s = BDPG.state;
    var region = s.state ? BusDevGallonsCalc.resolveRegion(s.state) : null;
    var regionPct = region ? BDPG.effectiveRegionPct(region) : 0;

    BDPG.normalizeLevels();

    function selectHtml(id, options, current, handler) {
      return '<select id="' + id + '" onchange="' + handler + '(this.value)">' +
        '<option value="">Select…</option>' +
        options.map(function (o) { return '<option value="' + BDPG.escHtml(o) + '"' + (o === current ? ' selected' : '') + '>' + BDPG.escHtml(o) + '</option>'; }).join('') +
        '</select>';
    }

    // Amenities are optional. The level is whatever the rule makes of the
    // answers given; with no answers there is no level and no adjustment.
    //
    // This is the fix for a real asymmetry rather than a relaxation of one.
    // suggestAmenityLevel({}) returns the BOTTOM band ("Very limited", -5%):
    // an empty details object satisfies every "no showers / no truck parking
    // / no real food" test at once, so *unanswered* used to read identically
    // to *answered badly*, and that -5% landed inside the Network-Adjusted
    // Baseline on a site nobody had surveyed. The old gate made that safe by
    // refusing to Generate until all four were answered; leaving the level
    // unset when none are answered makes it harmless instead, which is the
    // better trade -- a rep without the information should be able to run the
    // number, just not be penalised for the gap.
    //
    // Unset, not 'Average'. amenityAdjustment() returns 0 for any level it
    // does not recognise, so '' gives the required neutral 0% without
    // asserting that the site was assessed and found average. The two are
    // the same arithmetic and a different claim.
    //
    // A PARTIAL set still goes through the rule, as specified: some answers
    // are evidence, and the rule reads a blank as a "no". A rep who answers
    // two of four gets a level derived partly from silence -- shown below
    // with its count so that is visible rather than implied.
    var answered = BDPG.amenityAnsweredCount();
    var suggestion = answered > 0
      ? BusDevGallonsCalc.suggestAmenityLevel(s.amenityDetails)
      : null;
    s.amenityLevel = suggestion ? suggestion.level : '';

    var levelPct = (suggestion && hasOwn(BDPG_CONFIG.AMENITY_ADJUST, suggestion.level))
      ? BDPG_CONFIG.AMENITY_ADJUST[suggestion.level] : 0;
    var levelPctTxt = (levelPct >= 0 ? '+' : '') + (levelPct * 100).toFixed(1) + '%';
    var amenityNotice = '';
    var suggestLine = !suggestion
      ? '<div style="margin-top:10px;font-size:.82em;color:var(--muted)">' +
          'Amenity level: <b>not assessed</b> (+0.0%) — optional. Answer any of the four ' +
          'above to apply an amenity adjustment.</div>'
      : '<div style="margin-top:10px;font-size:.82em;color:var(--muted)">Amenity level: <b>' +
          BDPG.escHtml(suggestion.level) + '</b> (' + levelPctTxt + ') — ' +
          BDPG.escHtml(suggestion.reason) +
          (answered < BDPG.AMENITY_RULE_FIELDS.length
            ? ' <span style="color:var(--yellow)">Based on ' + answered + ' of ' +
              BDPG.AMENITY_RULE_FIELDS.length + ' answers; the rule reads a blank as a "no".</span>'
            : '') +
        '</div>';

    // The region chip (or the "not recognized" warning) sits above the map,
    // same as before the restructure -- just inside step 2's body now
    // instead of the removed "left" column.
    var regionNotice = region
      ? ('<div style="margin-bottom:6px;display:inline-block;color:var(--accent);border-color:var(--accent)" class="btn">Network Region: ' + region + ' (' + (regionPct * 100).toFixed(1) + '%)</div>')
      : (s.state ? '<div style="margin-bottom:6px;color:var(--red);font-size:.8em">Not a recognized state code</div>' : '');

    var rv = s.truckerPathRating;
    // The four details suggestAmenityLevel() actually reads. `service` and
    // `defReefer` were asked on every prospect and read by nothing -- removed
    // with the confirmation dropdown, since a question that cannot change the
    // answer is just a way to make the form look thorough.
    // DEF and Laundry are supporting criteria: they lift a site that already
    // has all four core amenities into "Good / full service", and can never
    // promote one that is missing a core amenity or demote one to
    // "Very limited". See suggestAmenityLevel().
    // DEF is the one inline SVG among the emoji, and it is the pump decal:
    // a blue rounded badge, "DEF" in white, white nozzle and droplet to the
    // right of the text. It replaces a green version of the same idea --
    // DEF is signed BLUE at the pump (ISO 22241), and a green DEF decal would
    // be read as diesel by anyone who fuels for a living. Before that it was
    // 🧪, a lab test tube, which read as chemistry rather than as the thing a
    // driver pulls off the island.
    //
    // Deliberately WIDER than tall. Height is what matches the emoji beside
    // it; width is what lets three letters be legible, and squeezing "DEF"
    // into a true square at this size turns the text into a smudge.
    //
    // SIZE: matched to the emoji's APPARENT size, which is not their height.
    //
    // Measured on the live page: the emoji ink is ~19.2px tall (ink/font-size
    // ratio 0.98, taken at 400px to keep rounding out of it) and an earlier
    // version of this badge painted 20.09px -- already taller than its
    // neighbours. It still read as roughly half their size, and that
    // complaint was correct.
    //
    // The reason is that this icon is a WORDMARK and they are pictograms. An
    // emoji spends its whole box on one shape; the badge spends most of its
    // box on a blue field and renders the part you actually read -- three
    // letters -- at about 8px. Matching bounding heights matches the wrong
    // quantity. What has to match is the size of the mark you perceive.
    //
    // So the badge is deliberately LARGER than the emoji: ~25px painted
    // against their 19.2, with the lettering taking 13 of 24 viewBox units
    // instead of 11 so the growth goes into the type rather than into more
    // blue. The three letters then render near the emoji's own ink height,
    // which is the comparison a reader is actually making.
    //
    // Sized in em, not px, so it tracks .bdpg-acard-ico's 1.4em if the type
    // scale ever changes -- a px icon beside em-sized emoji drifts apart the
    // first time anyone touches the base font size.
    //
    // currentColor is deliberately NOT used: these cards grey their text when
    // unset, and a greyed-out DEF badge would stop reading as DEF signage.
    var DEF_BLUE = '#4400EE';
    var DEF_ICON =
      // display:block, not inline-block. An inline SVG sits on a text baseline
      // and the descender space below it grows the line box, which made this
      // card's icon row taller than the other five. As a block with auto
      // margins it takes exactly its own height and stays centred.
      //
      // The negative vertical margin is the other half of the fix. The box is
      // ~26px so the badge can paint at ~25, but the emoji's line box is
      // 19.6px and these cards do NOT auto-equalise -- measured: without this
      // the DEF card stands taller than the other five. Pulling the
      // difference back at each end lets the artwork be deliberately larger
      // while the grid stays level. The overflow lands in the card's 10px
      // padding, not on the label beneath.
      '<svg viewBox="0 0 31 24" width="1.72em" height="1.33em" aria-hidden="true" focusable="false" ' +
        'style="display:block;margin:-0.166em auto">' +
        // Half-unit inset only: the badge IS the icon, so every unit it gives
        // back to padding is a unit it loses against the emoji next to it.
        '<rect x="0.5" y="0.5" width="30" height="23" rx="5" fill="' + DEF_BLUE + '"/>' +
        // "DEF" at 13 of 24 units -- the growth from the previous version
        // went here rather than into the blue field. textLength pins the
        // glyph run to an exact width so the layout cannot shift between the
        // fonts this page may fall back to; without it a wider system font
        // pushes the text under the nozzle.
        '<text x="3" y="17" textLength="16.5" lengthAdjust="spacingAndGlyphs" ' +
          'font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700" ' +
          'fill="#fff">DEF</text>' +
        // Nozzle: filled rather than stroked. A 1px stroke on a badge this
        // small antialiases into a grey smear; solid shapes stay crisp.
        '<rect x="21" y="6.8" width="4" height="7" rx="1.4" fill="#fff"/>' +
        // Spout arm over to the fill point.
        '<path d="M25 8.8h1.5a1.25 1.25 0 0 1 1.25 1.25v2.1" fill="none" stroke="#fff" ' +
          'stroke-width="1.45" stroke-linecap="round"/>' +
        // The droplet, the other half of the standard decal.
        '<path d="M27.75 13.9c.78 1.06 1.26 1.8 1.26 2.48a1.26 1.26 0 0 1-2.52 0c0-.68.48-1.42 1.26-2.48z" ' +
          'fill="#fff"/>' +
      '</svg>';

    var AICONS = { showers:'🚿', food:'🍔', scale:'⚖️', parking:'🅿️', def:DEF_ICON, laundry:'🧺' };
    var ALABELS = { showers:'Showers', food:'Food', scale:'Scale', parking:'Parking',
                    def:'DEF', laundry:'Laundry' };

    // Row primitive supplies the "Trucker Path Rating" title now -- the
    // control's own bdpg-lbl line is dropped.
    var ratingBody =
      '<div style="display:flex;align-items:center;gap:12px">' +
        '<input type="range" min="1" max="5" step="0.1" style="flex:1" ' +
          'value="' + (rv === '' ? '3' : BDPG.escHtml(rv)) + '" oninput="BDPG.onRatingSlider(this.value)">' +
        '<span id="bdpg-tp-num" style="font-family:var(--ff);font-size:1.5em;font-weight:800;color:var(--text);min-width:2.2em;text-align:right">' +
          (rv === '' ? '—' : Number(rv).toFixed(1)) + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:4px">' +
        '<span id="bdpg-tp-stars">' + BDPG.starsHtml(rv) + '</span>' +
        '<span id="bdpg-tp-band" style="font-size:.76em">' + BDPG.ratingBandHtml(rv) + '</span>' +
        '<button class="btn" style="margin-left:auto;font-size:.66em" onclick="BDPG.onRatingClear()">No rating found</button>' +
      '</div>';

    // The slider is anchored to the SELECTED PROFILE's own observed spread,
    // not to a flat percentage: 0% is that profile's average, the low end is
    // the percentage that lands on its p10 and the high end the percentage
    // that lands on its p90. See BDPG_STATS.pricingRangeForProfile.
    //
    // So the ends differ per profile and can be very wide -- Large/Highway
    // runs -79% to +780% because its p10 site genuinely does 673 gal/mo and
    // its p90 does 28,006. That spread is the point; a flat +/-50% described
    // none of these profiles.
    //
    // Built like the Trucker Path rating slider directly above: an
    // oninput-driven range plus a live readout, patched in place by
    // onPricingSlider() rather than re-rendering, so the handle keeps focus
    // while it is being dragged.
    var pr = BDPG.pricingRange();
    var pcur = BDPG.currentPricingPct();
    var N = BDPG_STATS.PRICING_POSITIONS_PER_SIDE;
    // The control's value is a POSITION, not a percentage -- see the split
    // scale in bdpgStats. min/max/step are therefore fixed and identical for
    // every profile; what differs per profile is what each position MEANS.
    // That is what puts 0% at the midpoint on all eight instead of at 7% of
    // the travel on the widest one.
    var segs = '<div style="display:flex;align-items:center;gap:12px">' +
        // The track and its midpoint marker share one wrapper so the marker
        // can be positioned against the same box the handle travels in.
        '<div style="position:relative;flex:1;display:flex;align-items:center">' +
          '<input id="bdpg-pricing-slider" type="range" style="width:100%;position:relative;z-index:2" ' +
            'min="' + (-N) + '" max="' + N + '" step="1" ' +
            'value="' + BDPG_STATS.pricingPositionForPct(pcur, pr) + '" ' +
            'aria-label="Discount pricing strategy. Centre is this profile&#39;s average; ' +
              'left reaches ' + BDPG.fmtSignedPct(pr.min) + ', right reaches ' + BDPG.fmtSignedPct(pr.max) + '" ' +
            'aria-valuetext="' + BDPG.escHtml(BDPG.fmtSignedPct(pcur)) + '" ' +
            'oninput="BDPG.onPricingSlider(this.value)">' +
          // Drawn at the fraction the shared mapping reports for 0 rather than
          // a hardcoded 50%: if the two ever disagreed, the marker would be
          // lying about where the average is, which is the original bug.
          '<div aria-hidden="true" style="position:absolute;z-index:1;top:50%;margin-top:-9px;' +
            'width:2px;height:18px;background:var(--muted);opacity:.7;' +
            'left:' + BDPG_STATS.pricingTrackFraction(0, pr).toFixed(2) + '%;' +
            'transform:translateX(-50%)"></div>' +
        '</div>' +
        '<span id="bdpg-pricing-num" style="font-family:var(--ff);font-size:1.5em;font-weight:800;' +
          'min-width:4.2em;text-align:right;color:' + BDPG.pricingTone(pcur) + '">' +
          BDPG.fmtSignedPct(pcur) + '</span>' +
      '</div>' +
      // Three labels on a three-column grid, not space-between: the centre
      // label has to sit under the centre MARK, and space-between would place
      // it by its own width instead.
      '<div title="' + BDPG.escHtml(BDPG.pricingAnchorTitle(pr)) + '" ' +
          'style="display:grid;grid-template-columns:1fr 1fr 1fr;font-size:.72em;' +
          'color:var(--muted);margin-top:2px">' +
        '<span style="text-align:left">No discounts<br>' + BDPG.fmtSignedPct(pr.min) + '</span>' +
        '<span style="text-align:center;color:var(--text)">▲ Profile average<br>0%</span>' +
        '<span style="text-align:right">Most aggressive<br>' + BDPG.fmtSignedPct(pr.max) + '</span>' +
      '</div>' +
      // The live figure, so the rep sees gallons rather than having to
      // translate a percentage against a baseline they cannot see from here.
      '<div id="bdpg-pricing-gal" style="font-size:.8em;margin-top:6px">' +
        BDPG.pricingGallonsLineHtml(pcur) + '</div>';

    // Three fixed tones rather than the pricing row's five-stop gradient:
    // this is a yes / unknown / no posture, not a scale. Keyed by level
    // *name*, not position, and shared with the tracker's Rewards column
    // (BDPG.REWARDS_TONES, defined below) so there is one map of posture ->
    // tone instead of two parallel ones that could drift out of sync --
    // hasOwn-guarded the same way every other name-keyed lookup in this file
    // is, so reordering BDPG_CONFIG.REWARDS_LEVELS (or a hand-edited state)
    // can't silently mis-tint this control the way an index-keyed array
    // would.
    var rsegs = BDPG_CONFIG.REWARDS_LEVELS.map(function (lvl, i) {
      var pct = BDPG_CONFIG.REWARDS_ADJUST[lvl];
      var on = (s.rewardsLevel === lvl);
      // Unreachable via REWARDS_LEVELS.map itself (every lvl here is by
      // definition a key of the map it drives), but rtone is looked up
      // through the same hasOwn guard as every other name-keyed lookup for
      // consistency, and a miss falls back to a real CSS var (there is no
      // --gray token) rather than an inert var(--gray).
      var rcol = hasOwn(BDPG.REWARDS_TONES, lvl) ? 'var(--' + BDPG.REWARDS_TONES[lvl] + ')' : 'var(--muted)';
      return '<button class="' + (on ? 'on' : '') + '"' +
        (on ? ' style="background:' + rcol + '"' : '') +
        ' onclick="BDPG.onRewardsChange(' + JSON.stringify(lvl).replace(/"/g, '&quot;') + ')">' +
        BDPG.escHtml(lvl.replace("Participating in Roady's Rewards", 'Participating')) + '<br>' +
        '<span style="opacity:.85">' + (pct >= 0 ? '+' : '') + (pct * 100).toFixed(1) + '%</span></button>';
    }).join('');

    var acards = Object.keys(AICONS).map(function (f) {
      var v = s.amenityDetails[f];
      return '<div class="bdpg-acard' + (v ? ' set' : '') + '" onclick="BDPG.onAmenityCycle(\'' + f + '\')">' +
        '<div class="bdpg-acard-ico">' + AICONS[f] + '</div>' +
        '<div class="bdpg-acard-f">' + ALABELS[f] + '</div>' +
        '<div class="bdpg-acard-v">' + BDPG.escHtml(v || 'tap to set') + '</div>' +
      '</div>';
    }).join('');

    // Amenities are Task 4's job -- for this task the existing amenity
    // markup (acards + amenityNotice + suggestLine, plus its own section
    // label) passes through unchanged as step 4's body.
    var amenityBody =
      '<div class="bdpg-lbl" style="margin-top:14px">Amenity Details</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' + acards + '</div>' +
      amenityNotice + suggestLine;

    // Row primitive supplies its own bdpg-lbl title now -- the control's
    // own title line is dropped.
    var restroomBody = BDPG.restroomSelectHtml();

    // BDPG.stepRowsNow() is the one place this input object is built --
    // see its own comment for why amenityLevelPct reads s.amenityLevel
    // instead of re-deriving a suggestion here.
    var stepRows = BDPG.stepRowsNow();
    function stepRow(n, body) { return BDPG.stepRowHtml(stepRows[n - 1], body); }

    var body =
      stepRow(1, '') +
      stepRow(2,
        regionNotice +
        BDPG.mapHtml() +
        '<div class="fg" style="margin-top:8px;max-width:180px"><label>Or type state code</label>' +
          '<input id="bdpg-state" maxlength="2" placeholder="e.g. ID" value="' + BDPG.escHtml(s.state) + '" ' +
          'oninput="BDPG.onStateInput(this.value)" style="text-transform:uppercase"></div>' +
        BDPG.regionChipsHtml()) +
      stepRow(3, ratingBody) +
      stepRow(4, amenityBody) +
      stepRow(5, restroomBody) +
      stepRow(6, '<div class="bdpg-seg">' + rsegs + '</div>') +
      stepRow(7, segs);

    return '<div id="bdpg-step2">' + body + '</div>';
  };

  // Re-renders only the Step 2 box (via outerHTML), not the whole page, and
  // restores focus + cursor position afterward -- typing a 2-letter state code
  // must not visibly lose focus after the first keystroke.
  BDPG.onStateInput = function (val) {
    var next = val.toUpperCase();
    // State selects the region, which sets regionPct in the estimate and
    // result.region on the record. Guarded on a real change so a keystroke
    // that re-types the same letter is a no-op.
    if (BDPG.state.state !== next) BDPG.invalidateResult();
    BDPG.state.state = next;
    BDPG.updatePreEvalSignal();
    // Two inputs can call this now (Step 2's own "type a state code" field,
    // and the Prospect Profile card's State field added in Task 4) -- only
    // refocus Step 2's field below if it was the one actually being typed
    // in, never unconditionally, or typing in the OTHER field would get its
    // focus yanked away after every keystroke.
    var wasStep2Field = document.activeElement && document.activeElement.id === 'bdpg-state';
    var stepEl = document.getElementById('bdpg-step2');
    if (!stepEl) return;
    stepEl.outerHTML = BDPG.step2Html();
    if (wasStep2Field) {
      var input = document.getElementById('bdpg-state');
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }
    // The Generate button lives outside #bdpg-step2, so its disabled state
    // (which depends on s.state) would otherwise go stale until some other
    // control triggers a full BDPG.render() -- update just the button here
    // instead of calling render(), which would steal focus from the input above.
    var btn = document.getElementById('bdpg-generate-btn');
    if (btn) { btn.outerHTML = BDPG.generateButtonHtml(); }
    // Step 2's done badge/checkmark live in the surrounding .bdpg-step card,
    // outside the #bdpg-step2 content div just replaced above.
    BDPG.updateStepCardBadge(2, BDPG.step2Done());
    // Mirror the value into whichever of the two State inputs did NOT just
    // trigger this call, so both stay showing the same single source of
    // truth -- but never touch the one currently focused, or its cursor
    // position would jump while the user is still typing in it.
    var pInput = document.getElementById('bdpg-prospect-state');
    if (pInput && document.activeElement !== pInput) pInput.value = BDPG.state.state;
    BDPG.updateStepCardBadge(0, BDPG.prospectDone());
    // State is one of the six ⓪-card values the draft carries. Safe to patch
    // the indicator from here: the swap above replaced #bdpg-step2 only, and
    // #bdpg-draft-status lives in the Prospect Profile card above it.
    BDPG.markDraftDirty();
    // The outerHTML swap above destroyed the map's <svg> along with the rest
    // of #bdpg-step2 -- rebuild it so typing a state code updates the map too.
    BDPG.renderMap();
  };

  BDPG.starsHtml = function (v) {
    var n = Number(v) || 0, out = '';
    for (var i = 1; i <= 5; i++) {
      if (n >= i) out += '★';
      else if (n >= i - 0.5) out += '<span class="bdpg-star-half">☆<span>★</span></span>';
      else out += '☆';
    }
    return '<span class="bdpg-stars">' + out + '</span>';
  };
  BDPG.ratingBandHtml = function (v) {
    var info = BusDevGallonsCalc.reviewAdjustment(v === '' ? null : Number(v));
    var txt, col;
    if (info.flagged) { txt = 'No rating found — 0%'; col = 'var(--muted)'; }
    else if (info.pct < 0) { txt = 'Below 3.0 — −5%'; col = 'var(--red)'; }
    else if (info.pct > 0) { txt = '3.6+ — +2%'; col = 'var(--green)'; }
    else { txt = '3.0–3.5 — 0%'; col = 'var(--muted)'; }
    return '<span style="color:' + col + ';font-weight:700">' + txt + '</span>';
  };

  // Targeted DOM update only -- a slider drag must never rebuild the panel.
  BDPG.onRatingSlider = function (v) {
    // Review % is an engine input. invalidateResult() patches the results
    // container rather than re-rendering, so a drag keeps its grip on the
    // slider while the stale panel is replaced by the notice.
    if (String(BDPG.state.truckerPathRating) !== String(v)) BDPG.invalidateResult();
    BDPG.state.truckerPathRating = v;
    var num = document.getElementById('bdpg-tp-num');
    var st = document.getElementById('bdpg-tp-stars');
    var band = document.getElementById('bdpg-tp-band');
    if (num) num.textContent = v === '' ? '—' : Number(v).toFixed(1);
    if (st) st.innerHTML = BDPG.starsHtml(v);
    if (band) band.innerHTML = BDPG.ratingBandHtml(v);
    // Row 3 (Trucker Path Rating) is the badge this slider drives --
    // patch it the same targeted way, so it tracks the drag instead of
    // waiting for the next full render to catch up.
    BDPG.patchStepValue(3);
  };
  BDPG.onRatingClear = function () {
    if (BDPG.state.truckerPathRating !== '') BDPG.invalidateResult();
    BDPG.state.truckerPathRating = '';
    BDPG.render();
  };

  // Each click advances to the next option for that field, wrapping. Writes the
  // same amenityDetails values the old <select>s wrote.
  BDPG.onAmenityCycle = function (field) {
    var opts = BDPG_CONFIG.AMENITY_DETAIL_OPTIONS[field] || [];
    if (!opts.length) return;
    var cur = BDPG.state.amenityDetails[field];
    var i = opts.indexOf(cur);
    // Always a real change (the cycle always advances), and the amenity level
    // is now derived straight from these answers, so every tap moves an engine
    // input and strands any result on screen.
    BDPG.invalidateResult();
    BDPG.state.amenityDetails[field] = opts[(i + 1) % opts.length];
    BDPG.render();
  };

  BDPG.fmtSignedPct = function (frac) {
    var p = Number(frac) * 100;
    if (!isFinite(p)) p = 0;
    // No decimals: every position on the split-scale track lands on a whole
    // percentage, so a "+15.0%" readout would imply a precision the control
    // cannot produce and the percentiles do not support.
    return (p > 0 ? '+' : (p < 0 ? '−' : '')) + Math.abs(Math.round(p)) + '%';
  };

  // The live slider range for whatever profile is selected. Recomputed on
  // every read rather than cached, because the profile can change under it
  // and a cached range would leave the control describing the previous one.
  BDPG.pricingRange = function () {
    var s = BDPG.state;
    var rg = null;
    if (s.profile && s.roadway) {
      rg = BDPG.profileRangeMap()[BDPG_STATS.baselineKeyFor(s.profile, s.roadway)] || null;
    }
    return BDPG_STATS.pricingRangeForProfile(rg, BDPG_CONFIG.PRICING_RANGE);
  };

  // The stored posture, SNAPPED to the current profile's step grid and then
  // clamped into its range.
  //
  // Both halves are needed, and the snap is the less obvious one. Clamping
  // alone leaves a value that is inside the range but off its grid -- a
  // +115% carried from Small/Backroad (1% steps) onto Large/Highway (10%
  // steps) is in range, so nothing clamps it, but the browser silently moves
  // the handle to the nearest valid 120% while state still holds 1.15. The
  // readout then says +115% under a handle sitting at +120%, and the estimate
  // uses a third thing. Snapping first makes the handle, the readout and the
  // figure the same number by construction.
  //
  // 0 survives any snap: every range's min is a whole multiple of its own
  // step, so the grid always includes zero and "the profile average" stays
  // exactly reachable.
  BDPG.currentPricingPct = function () {
    var pr = BDPG.pricingRange();
    var p = BusDevGallonsCalc.pricingAdjustment(BDPG.state.pricingLevel);
    p = Math.max(pr.min, Math.min(pr.max, p));
    // Round-tripped through the position scale, which is the snap: a value is
    // only representable if some position produces it. Doing it this way
    // rather than with a separate rounding rule is what guarantees the handle,
    // the readout and the estimate are the same number -- they all come from
    // one mapping instead of three that have to be kept in agreement.
    return BDPG_STATS.pricingPctForPosition(
      BDPG_STATS.pricingPositionForPct(p, pr), pr);
  };

  // Called whenever the profile selection changes: if the stored posture no
  // longer fits the new profile's range, bring it inside and invalidate any
  // result computed from the old value.
  BDPG.reconcilePricingToProfile = function () {
    var stored = BusDevGallonsCalc.pricingAdjustment(BDPG.state.pricingLevel);
    var clamped = BDPG.currentPricingPct();
    if (stored !== clamped) {
      BDPG.state.pricingLevel = clamped;
      BDPG.invalidateResult();
    }
  };

  // Same positive-is-green convention the retired button row used. The
  // saturation point is a FRACTION of the live range rather than a fixed
  // percentage -- it was a hardcoded 0.15 against a +/-25% slider, and a
  // fixed figure cannot serve ranges that now run from 166 to 850 points
  // wide: it would saturate in the first fifth of the travel and the colour
  // would stop carrying information for the rest of it.
  BDPG.PRICING_TONE_SATURATION = 0.6;

  BDPG.pricingTone = function (frac, range) {
    var p = Number(frac) || 0;
    var r = range || BDPG.pricingRange();
    if (p === 0) return 'var(--text)';
    if (p > 0) {
      return p >= r.max * BDPG.PRICING_TONE_SATURATION
        ? 'var(--green)' : 'color-mix(in srgb, var(--green) 55%, var(--yellow))';
    }
    return p <= r.min * BDPG.PRICING_TONE_SATURATION ? 'var(--red)' : 'var(--orange)';
  };

  // Gallons at the current slider position, live as the rep drags.
  //
  // Amber past 80% of the profile's observed p90: that is not a limit, it is
  // a note that the quote has reached the top of what this kind of site has
  // been seen to do. The rep can go further -- p90 is a real percentile, not
  // a ceiling -- but an aggressive quote should be a decision rather than an
  // accident of where the handle landed.
  BDPG.PRICING_CAUTION_FRACTION = 0.8;

  BDPG.pricingGallonsLineHtml = function (frac) {
    var dyn = BDPG.currentBaseline();
    if (!dyn || !isNum(dyn.baseline)) {
      return '<span style="color:var(--muted)">Pick a profile to see the gallons this produces.</span>';
    }
    var pr = BDPG.pricingRange();
    var gal = Math.round(dyn.baseline * (1 + (Number(frac) || 0)));
    if (gal < 0) gal = 0;
    var caution = pr.source === 'profile' && pr.high &&
      gal >= pr.high * BDPG.PRICING_CAUTION_FRACTION;
    return '<span style="color:var(--muted)">At this pricing strategy, the baseline reads </span>' +
      '<b style="font-family:var(--ff);font-size:1.15em;color:' +
        (caution ? 'var(--yellow)' : 'var(--accent)') + '">' + BDPG.fmtGal(gal) + ' gal/mo</b>' +
      (caution
        ? '<span style="color:var(--yellow)"> &#9888; at or near the top of what this profile has been ' +
          'observed to do (p90 ' + BDPG.fmtGal(pr.high) + ').</span>'
        : '');
  };

  // The provenance of the slider's two ends, as tooltip text rather than a
  // visible line. Without it the percentages look arbitrary; with it they are
  // attributable to named percentiles of a stated sample -- which a rep still
  // needs when somebody in a meeting asks where +150% came from.
  BDPG.pricingAnchorTitle = function (pr) {
    var r = pr || BDPG.pricingRange();
    if (r.source !== 'profile') {
      return 'Range is the default ' + BDPG.fmtSignedPct(r.min) + ' to ' + BDPG.fmtSignedPct(r.max) +
        ': this profile has ' + r.n + ' reporting location' + (r.n === 1 ? '' : 's') +
        ', short of the ' + BDPG_STATS.DYNAMIC_BASELINE_MIN_N +
        ' needed to measure its own spread.';
    }
    return 'Ends are this profile’s observed spread over ' + r.n + ' reporting locations: ' +
      'p10 ' + BDPG.fmtGal(r.low) + ' gal/mo (' + BDPG.fmtSignedPct(r.lowPct) + ') · ' +
      'average ' + BDPG.fmtGal(r.mid) + ' (0%) · ' +
      'p90 ' + BDPG.fmtGal(r.high) + ' (' + BDPG.fmtSignedPct(r.highPct) + ').' +
      ' The track is split at the average, so each half gets half the width ' +
      'and the two halves step at different rates.';
  };

  // Patched in place, not re-rendered: a full render would rebuild the range
  // input and drop the handle mid-drag.
  // `value` is a POSITION off the split-scale track, not a percentage.
  BDPG.onPricingSlider = function (value) {
    var frac = BDPG_STATS.pricingPctForPosition(value, BDPG.pricingRange());
    if (BDPG.state.pricingLevel !== frac) BDPG.invalidateResult();
    BDPG.state.pricingLevel = frac;
    var num = document.getElementById('bdpg-pricing-num');
    if (num) {
      num.textContent = BDPG.fmtSignedPct(frac);
      num.style.color = BDPG.pricingTone(frac);
    }
    // The live gallons figure, the whole reason this is patched rather than
    // re-rendered: it has to track the handle without the handle moving.
    var gal = document.getElementById('bdpg-pricing-gal');
    if (gal) gal.innerHTML = BDPG.pricingGallonsLineHtml(frac);
    // Row 7 (Discount Pricing Strategy) is the badge this slider drives --
    // patch it the same targeted way, so it tracks the drag instead of
    // waiting for the next full render to catch up.
    BDPG.patchStepValue(7);
  };

  // Kept for saved-prospect restore and anything that sets pricing without
  // touching the slider; a full re-render is correct there.
  BDPG.onPricingChange = function (value) {
    if (BDPG.state.pricingLevel !== value) BDPG.invalidateResult();
    BDPG.state.pricingLevel = value;
    BDPG.render();
  };

  // Mirrors onPricingChange exactly, invalidation guard included -- rewards is
  // an engine input, so a change here strands any result already on screen.
  BDPG.onRewardsChange = function (value) {
    if (BDPG.state.rewardsLevel !== value) BDPG.invalidateResult();
    BDPG.state.rewardsLevel = value;
    BDPG.render();
  };

  // Step 3 is gone. Condition / Hours / Distance / Corridor / Competition fed
  // only the Network Fit Grade, which was deleted; Distance to Interstate was
  // separately redundant with the roadway already chosen in Step 1. What
  // survived is the observed diesel-lane count, which exists to contradict the
  // lane band implied by the Step 1 row -- so it now sits in Step 1, beside
  // the thing it disagrees with, rather than two cards away from it.
  //
  // The Step 3 name/city/state echoes went too. They were the second half of
  // resolveProspectName()'s precedence, which now resolves from the Prospect
  // Profile card alone.
  BDPG.actualLanesHtml = function () {
    var s = BDPG.state, sd = s.supportingDetails;
    var row = (s.profile && s.roadway) ? BusDevGallonsCalc.getBaselineRow(s.profile, s.roadway) : null;
    var laneWarning = '';
    if (row && sd.actualLanes !== '') {
      var lo = parseInt(row.lanes, 10);
      var hasPlus = /\+/.test(row.lanes);
      var hi = hasPlus ? Infinity : parseInt(row.lanes.split('-')[1], 10);
      var actual = Number(sd.actualLanes);
      if (isFinite(actual) && (actual < lo || actual > hi)) {
        laneWarning = '<div style="margin-top:6px;font-size:.78em;color:var(--yellow)">' +
          'Selected row expects ' + BDPG.escHtml(row.lanes) + ' lanes - reconsider Location Profile/Roadway?</div>';
      }
    }
    return '<div class="fg" style="margin-top:12px;max-width:260px">' +
        '<div class="bdpg-lbl">Actual Diesel Lanes Observed</div>' +
        '<input id="bdpg-sd-lanes" type="number" min="0" value="' + BDPG.escHtml(sd.actualLanes) + '" ' +
          'oninput="BDPG.state.supportingDetails.actualLanes=this.value" onblur="BDPG.render()">' +
        laneWarning +
      '</div>';
  };
  // An explicit confirmation, not merely a suggestion that was adopted by
  // default. Tapping the six amenity cards produces real data and therefore a
  // The four CORE details. DEF and laundry are deliberately not counted
  // here: this list drives the "answered" count shown under the icons, and a
  // supporting criterion missing is not the same as a core question
  // unanswered.
  BDPG.AMENITY_RULE_FIELDS = ['showers', 'food', 'scale', 'parking'];

  BDPG.amenityAnsweredCount = function () {
    var d = BDPG.state.amenityDetails || {};
    var n = 0;
    BDPG.AMENITY_RULE_FIELDS.forEach(function (f) { if (d[f]) n++; });
    return n;
  };

  BDPG.generateButtonHtml = function () {
    var s = BDPG.state;
    // Amenities are deliberately absent from this list. They are optional
    // now that an unanswered set carries no adjustment, so gating on them
    // would block a rep who simply does not have the information.
    var can = !!(BDPG.prospectDone() && s.profile && s.roadway && s.state);
    var title = can ? '' :
      ' title="Complete the Prospect Profile and pick a location profile and state to generate."';
    return '<button id="bdpg-generate-btn" class="bdpg-go"' + (can ? '' : ' disabled' + title) +
      ' onclick="BDPG.onGenerate()">🚛 Generate Value Profile</button>';
  };

  // ── Result ↔ input coupling ────────────────────────────────────────────
  // BDPG.state.result is the engine's answer for ONE exact set of inputs,
  // while BDPG.trackerSummary() pairs it with the *live* profile / roadway /
  // state / city. So the moment an input that feeds the engine changes while
  // a result is still sitting in state, Save Profile would freeze a
  // mismatched pair into a durable record — a tracker row stating an
  // Official Subtotal that the location profile printed beside it could
  // never produce (measured: 14,250 stored against a Fuel stop whose real
  // subtotal is 2,375). That is the one number that has to match Roady's
  // published calculator in front of a customer.
  //
  // The fix is at the root: every handler that changes an engine input calls
  // this, which drops the result and says so on screen. Recomputing silently
  // at Save time was rejected on purpose — that would rewrite the number the
  // rep just read off the screen, which is a different lie, not a fix.
  //
  // Inputs that invalidate — precisely what onGenerate() feeds the engine:
  //   profile / roadway ...... calculateEstimate + calculateNetworkFitGrade
  //   state .................. regionPct, and result.region
  //   truckerPathRating ...... calculateEstimate
  //   pricingLevel ........... calculateEstimate
  //   rewardsLevel ........... calculateEstimate
  //   amenityLevel ........... calculateEstimate
  //   amenityDetails ......... feeds amenityLevel whenever the rep hasn't
  //                            overridden the suggestion, and the results
  //                            panel's own amenity chart reads it directly
  //                            either way
  //   supportingDetails' five signal selects ... calculateNetworkFitGrade,
  //                            and `condition` also conditionAdjustedGallons
  //   the region-variance override ... effectiveRegionPct()
  //
  // Inputs that deliberately do NOT invalidate, because nothing in
  // state.result derives from them: prospect name / street / city / notes
  // (display only, and read live by displayName() / trackerSummary(), so
  // they cannot go stale against the result); prospect.locationType on its
  // own (it matters only when it auto-sets profile/roadway, and
  // onLocationType invalidates in exactly that case); Step 3's
  // prospectName / prospectCity / prospectState (display-only duplicates);
  // actualLanes (drives only Step 3's lane-mismatch warning); and every
  // panel open/closed toggle.
  BDPG.invalidateResult = function () {
    if (!BDPG.state.result) return;
    BDPG.state.result = null;
    BDPG.state.resultStale = true;
    // The handlers that patch the DOM instead of calling render() (the state
    // field, the rating slider) would otherwise leave the old results panel
    // on screen describing inputs that no longer exist.
    var wrap = document.getElementById('bdpg-results-wrap');
    if (wrap) wrap.innerHTML = BDPG.resultsWrapHtml();
  };

  BDPG.resultsWrapHtml = function () {
    if (BDPG.state.result) {
      return BDPG.resultsHtml() +
        '<button class="btn btn-accent" onclick="BDPG.onExportPdf()">Export Pitch Summary</button> ' +
        '<button class="btn" onclick="BDPG.onCopySummary()">Copy Summary</button>' +
        BDPG.exportPdfHtml();
    }
    if (BDPG.state.resultStale) {
      return '<div class="bdpg-box" style="margin-top:14px;border-color:var(--yellow);color:var(--yellow)">' +
        '⚠ An input changed after the last Generate, so those results no longer describe this prospect and have been cleared. ' +
        'Click <b>Generate Value Profile</b> to recalculate before saving or exporting.</div>';
    }
    return '';
  };

  // ── Unsaved-work detection ─────────────────────────────────────────────
  // Signature of everything a saved record actually carries. Panel
  // open/closed flags and the derived result are excluded: toggling a
  // disclosure triangle is not unsaved work, and the result is rebuilt by
  // Generate. Keys are walked in sorted order so a freshly-typed state and a
  // JSON round-tripped one produce the same string for the same data.
  // myProfilesOpen is kept deliberately: the modal it belonged to is gone, but
  // records saved before its removal still carry the key in their snapshot,
  // and onLoadProfile copies the snapshot into BDPG.state wholesale. Skipping
  // it keeps a legacy record's signature comparable with a fresh one.
  // csvResultMsg was listed here too, for the retired region-variance CSV
  // tool's confirmation line; it went out with the tool, since a SIG_SKIP key
  // for state that no longer exists is just a name nobody can check. The rule
  // it was added under stands for anything new on BDPG.state: if a saved
  // record would not be wrong without it, it belongs in this list, or running
  // an admin tool will make hasUnsavedWork() true and prompt a rep to discard
  // changes they never made.
  BDPG.SIG_SKIP = {
    result: 1, resultStale: 1, adminOpen: 1, adminSavedJson: 1,
    ncGeneratorOpen: 1, myProfilesOpen: 1, supportingOpen: 1,
    tutorialOpen: 1, tutorialTab: 1
  };
  BDPG.stateSig = function () {
    var s = BDPG.state, out = {};
    Object.keys(s).sort().forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(BDPG.SIG_SKIP, k)) out[k] = s[k];
    });
    try { return JSON.stringify(out); } catch (e) { return ''; }
  };
  // null means "no baseline captured yet" (the very first render hasn't
  // finished), which must not be reported as unsaved work.
  BDPG.savedSig = null;
  BDPG.hasUnsavedWork = function () {
    return BDPG.savedSig !== null && BDPG.stateSig() !== BDPG.savedSig;
  };
  BDPG.confirmDiscard = function (msg) {
    if (!BDPG.hasUnsavedWork()) return true;
    return confirm(msg);
  };

  // Id of the saved record the current state came from (an explicit Load, or
  // this page's own last Save), so a re-save updates that record instead of
  // appending a second row for the same prospect. Lives on BDPG, not on
  // BDPG.state, so it is never serialized into a snapshot.
  BDPG.currentProfileId = null;

  // The bd_value_profiles row id for the draft/profile currently on screen.
  //
  // Deliberately NOT BDPG.currentProfileId, which means something else and
  // predates this: that one is the id of a record in the local
  // roadysBDPGProfiles tracker array, and onSaveProfile() SEARCHES that array
  // for it to decide update-vs-append. Putting a cloud id in that field makes
  // the lookup miss every time and silently appends a duplicate tracker row.
  // Two id spaces, two fields.
  BDPG.currentCloudId = null;

  // Results of the last lead search, and the label of the lead the rep picked.
  // Both are view state only -- the binding that matters is currentLeadId.
  BDPG._leadSearchResults = [];
  BDPG._leadLabel = '';
  BDPG._leadSearchTimer = null;

  // Re-entry guard for onSaveProfile()'s cloud half. Set the instant that
  // async chain starts, cleared on every exit (success, saveFinal failure,
  // and createLeadFromProfile's own failure path) -- a double-click before
  // createLeadFromProfile() resolves would otherwise retake the create
  // branch and insert a second crm_leads row for the same prospect.
  BDPG._saving = false;

  // Returns true when a result was computed and written to state, false on
  // every bail -- so a caller other than the button (BDPG.onTrackerExport()
  // is the one that exists today, but this is the one place that protects
  // any future one too) can tell a real bail apart from success without
  // re-deriving the reason itself, and never has to guess from state.result
  // alone whether the attempt even ran.
  BDPG.onGenerate = function () {
    var s = BDPG.state;
    // Before anything reads them: the estimate below, and the pitch builders
    // that read s.pricingLevel / s.rewardsLevel live off state once a result
    // exists, must all see the same in-list value. See BDPG.normalizeLevels().
    BDPG.normalizeLevels();
    var region = BusDevGallonsCalc.resolveRegion(s.state);
    var regionPct = region ? BDPG.effectiveRegionPct(region) : 0;

    // The profile's network median, or the static row when its sample is too
    // thin. Region is NOT applied here -- it arrives once, as regionPct.
    var dyn = BDPG.currentBaseline();

    var estimate = BusDevGallonsCalc.calculateEstimate({
      profile: s.profile, roadway: s.roadway, regionPct: regionPct,
      baseline: dyn ? dyn.baseline : null,
      amenityLevel: s.amenityLevel, restroomLevel: s.restroomLevel, reviewRating: s.truckerPathRating === '' ? null : Number(s.truckerPathRating),
      // Resolved rather than `|| DEFAULT`: pricing is numeric and 0 is
      // falsy, so the old idiom would have replaced a deliberate 0 with the
      // default. They are the same number today, which is exactly why this
      // would have gone unnoticed if the default ever moved.
      pricingLevel: BusDevGallonsCalc.pricingAdjustment(s.pricingLevel),
      rewardsLevel: s.rewardsLevel || BDPG_CONFIG.REWARDS_DEFAULT
    });
    if (!estimate) { alert('Pick a valid Location Profile + Roadway combination first.'); return false; }

    s.result = { estimate: estimate, region: region, baselineSource: dyn ? dyn.source : '', baselineN: dyn ? dyn.n : 0 };
    // The result and the inputs are back in step, so the "results cleared"
    // notice must go with them.
    s.resultStale = false;
    BDPG.render();
    return true;
  };

  // Mirrors the six rows of the on-screen waterfall table exactly, so the chart
  // and the table can never disagree. Presentation arithmetic only -- every
  // number comes from the engine's estimate object.
  //
  // Pricing and Rewards both use the difference form (this step's own
  // to - from), not a fresh Math.round(baseline * pct). Each of baseline,
  // pricingAdjusted and finalGallons is already independently rounded by the
  // engine, so a step computed from a re-multiplied percentage can land a
  // gallon off from what its own bar spans -- and the column would stop
  // summing to the stated total. The difference form keeps every step
  // chained to the one before it, which is the property a waterfall actually
  // promises; a one-gallon disagreement with a recomputed percentage is
  // invisible, but rows that don't add up to the total is not. (See Task 3
  // ruling in .superpowers/sdd/2026-09-23-bdpg-rewards-and-b2b-pitch/task-1-rulings.md.)
  // Both on-screen charts are gone: the adjustment waterfall became a plain
  // calculation table and the amenity profile chart went with the internal
  // section. Kept as a no-op rather than deleted because render() calls it
  // unconditionally and a future chart would land here.
  BDPG.drawCharts = function () {};

  // The region's headline gallons figure, preferring the live file over the
  // config. Returns null when neither has anything to say about the region.
  //
  // network-locations.json is the source; BDPG_NETWORK_BASELINES is a
  // fallback for a region the file is too thin to speak for -- the same
  // shape currentBaseline() already uses against BASELINE_TABLE, and for the
  // same reason: one source of truth, with the static table catching the
  // case where the observed sample cannot carry the claim.
  //
  // The config figures are means from a retired 12-month gallon report and
  // read much higher than the file's medians (Southeast 10,373 against
  // 5,985). Mixing them per-region is the price of the fallback existing at
  // all, which is why `source` is returned and the caption says which one
  // produced the number rather than presenting both as the same measurement.
  BDPG.effectiveNetworkAverage = function (region) {
    var live = BDPG.networkRegionAverages()[region] || null;
    if (live && live.median !== null && live.n >= BDPG_STATS.DYNAMIC_BASELINE_MIN_N) {
      return {
        avgGalMo: live.median, n: live.n, source: 'network',
        // Same threshold the admin panel's like-for-like delta uses, so a
        // region flagged thin in one place is flagged thin in both.
        lowSample: live.n < BDPG_STATS.REGION_THIN_N,
        asOf: (BDPG.locationsMeta && BDPG.locationsMeta.asOf) || BDPG_CONFIG.NETWORK_BASELINE_META.asOf
      };
    }
    if (!hasOwn(BDPG_CONFIG.BDPG_NETWORK_BASELINES, region)) return null;
    var b = BDPG_CONFIG.BDPG_NETWORK_BASELINES[region];
    var n = isFinite(Number(b.n)) && Number(b.n) > 0 ? Number(b.n) : null;
    return {
      avgGalMo: b.avgGalMo, n: n, source: 'static',
      lowSample: !!b.lowSample,
      asOf: BDPG_CONFIG.NETWORK_BASELINE_META.asOf
    };
  };

  BDPG.networkAverageLineHtml = function () {
    var r = BDPG.state.result;
    var key = r && r.region;
    if (!key) return '';
    var b = BDPG.effectiveNetworkAverage(key);
    if (!b) return '';

    // The caption has to describe THIS region's sample, not the network's.
    // It used to fall back to "from Roady's 227-location network report" --
    // the size of a gallon report that no longer backs anything else on the
    // page. Citing a dataset the rest of the tool has stopped using told an
    // owner the figure was both better evidenced and differently sourced
    // than it is. Now the number and its count come from the same file, so
    // the caption names the region's own reporting locations and nothing
    // else. Do not reintroduce a whole-network count here: a per-region
    // figure captioned with a network-sized n overstates its own evidence,
    // which is the exact defect this replaced.
    var hasN = b.n !== null;
    var sample;
    if (b.source === 'network') {
      sample = '12mo average of ' + BDPG.escHtml(String(b.n)) +
        ' reporting Roady\'s locations in this region, as of ' + BDPG.escHtml(String(b.asOf));
    } else if (hasN) {
      sample = '12mo avg of ' + BDPG.escHtml(String(b.n)) +
        ' Roady\'s locations in this region, as of ' + BDPG.escHtml(String(b.asOf));
    } else {
      // Static fallback with no count of its own: say the region is too
      // thinly reported to measure rather than borrowing a number from
      // somewhere that did not measure it.
      sample = '12mo avg, as of ' + BDPG.escHtml(String(b.asOf)) +
        ' · too few reporting locations in this region to measure directly';
    }

    // var(--muted), not var(--yellow): inside #bdpg-print-only the @media print
    // block re-points --muted to #555 but leaves --yellow alone, so a yellow
    // caveat would print illegibly on white and break the packet's
    // everything-is-black-ink property. The glyph carries the signal.
    var lowSampleLine = b.lowSample
      ? '<div style="font-size:.72em;color:var(--muted);margin-top:2px">&#9888; Small sample — this regional figure is drawn from ' +
        (hasN ? (BDPG.escHtml(String(b.n)) + ' locations') : 'a small number of locations') + '.</div>'
      : '';

    return '<div style="margin-top:6px;font-size:.85em">' +
      '<span class="bdpg-lbl" style="display:inline">Roady\'s Network Average (your region):</span> ' +
      '<b>' + BDPG.fmtGal(b.avgGalMo) + ' gal/mo</b>' +
      '<div style="font-size:.72em;color:var(--muted);margin-top:2px">' +
        BDPG.escHtml(BDPG.regionDisplayName(key)) + ' · ' + sample + '</div>' +
      lowSampleLine +
    '</div>';
  };

  // Prospect-facing hero. Extracted so the Export Pitch Summary renders the
  // identical block rather than a hand-maintained second copy that could
  // drift from what the rep saw on screen.

  BDPG.pitchHeroHtml = function () {
    var e = BDPG.state.result.estimate;
    // displayName() falls back to the literal "Prospect" when nothing is
    // entered, which reads badly mid-sentence -- use a neutral phrase instead.
    // See resolveProspectName() for the shared precedence both draw from.
    var raw = BDPG.resolveProspectName();
    var who = raw ? BDPG.escHtml(raw) : 'this location';

    // The name sits in its own span so BDPG.refreshPitchHero() can retarget it
    // after an edit without re-rendering (and without stealing the caret from
    // the field being typed in). A class, not an id: this same markup is
    // rendered twice at once -- once on screen and once inside
    // #bdpg-print-only -- and duplicate ids would be a lie about which one
    // getElementById returns.
    return '<div class="bdpg-hero-card final" style="margin-bottom:14px">' +
      // Reframed 2026-09-30. The old headline read "Roady's can drive X
      // gallons/month to [Name]" -- a promise about one specific location.
      // The figure is a network average across comparable locations, and the
      // wording now says so. The number did not change; the claim about it did.
      '<div class="bdpg-hero-num" style="font-size:2.3em;line-height:1.15">' +
        'For a location similar to <span class="bdpg-hero-who">' + who + '</span>, ' +
        'Roady\'s network averages ' + BDPG.fmtGal(e.finalGallons) + ' gallons/month*</div>' +
      '<div style="font-size:.95em;color:var(--muted);margin-top:8px">' +
        'Estimated from Roady\'s network averages for comparable locations — actual results vary.</div>' +
      '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">' +
        // Was "Roady's BD Calculator Figure ... Matches Roady's BD Calculator".
        // That claim died with the region cap: the region term now carries real
        // per-region deltas up to +58.8%, so this figure matches no published
        // calculator outside the old band.
        '<span class="bdpg-lbl" style="display:inline">Network-Adjusted Baseline:</span> ' +
        '<b style="font-size:1.15em">' + BDPG.fmtGal(e.officialSubtotal) + ' gal/mo</b>' +
        '<div style="font-size:.72em;color:var(--muted);margin-top:3px">' +
          'Baseline with region, amenities and rating applied — before pricing and rewards.</div>' +
        BDPG.networkAverageLineHtml() +
      '</div>' +
      // The asterisk on the headline figure. One string, BDPG.QUALIFYING_NOTE,
      // shared by this card, the exported packet and the Copy Summary -- the
      // three places the figure leaves the screen, and three places a
      // separately-worded footnote would eventually drift apart.
      '<div style="font-size:.7em;color:var(--muted);margin-top:10px;padding-top:8px;' +
        'border-top:1px solid var(--border)">' + BDPG.escHtml(BDPG.QUALIFYING_NOTE) + '</div>' +
    '</div>';
  };

  // Targeted patch for the one piece of the rendered hero that a keystroke can
  // change: the prospect's name. The name is display-only, so editing it
  // deliberately does NOT invalidate the result -- but onExportPdf() rebuilds
  // the packet from live state, so without this the laptop showed one name
  // while the sheet handed over carried another. Same shape as every other
  // handler on this card: patch the node, never BDPG.render(), which would
  // destroy the input mid-word.
  //
  // textContent, not innerHTML: the value comes straight from a text field, so
  // this is the one write that must not be able to introduce markup. It also
  // updates the copy inside #bdpg-print-only, so the two can't drift between
  // renders.
  BDPG.refreshPitchHero = function () {
    var who = BDPG.resolveProspectName() || 'this location';
    var els = document.querySelectorAll('.bdpg-hero-who');
    for (var i = 0; i < els.length; i++) { els[i].textContent = who; }
  };

  // The single definition of "what the prospect sees". resultsHtml() renders
  // it above the divider and the export renders exactly this -- so the
  // leave-behind can never drift from what the rep showed on screen. Guarded
  // here (rather than trusting every caller) because this is the function
  // that decides when the pitch block renders at all -- Task 10 adds a
  // second caller, and neither one should be able to invoke the builders
  // below against a null result.
  // diagnosis of what is wrong with their site.
  BDPG.pitchOpportunities = function () {
    var s = BDPG.state, e = s.result.estimate, out = [];

    // These three are swing bullets: the percentage is the change to the
    // prospect's own projection from where it stands today (e.g. Not
    // participating at -5% to Participating at +5% is a 10-point swing), not
    // a second, larger quote of the program's band -- see the footnote below.
    if (e.rewardsPct < 0.05) {
      out.push('Joining Roady\'s Rewards moves your projection by ' +
        ((0.05 - e.rewardsPct) * 100).toFixed(1) + '% — about ' +
        BDPG.fmtGal(Math.round(e.baseline * (0.05 - e.rewardsPct))) + ' gal/mo.');
    }
    if (e.amenityPct < 0.02) {
      out.push('Reaching a "Good / full service" amenity level moves your projection by ' +
        ((0.02 - e.amenityPct) * 100).toFixed(1) + '% — about ' +
        BDPG.fmtGal(Math.round(e.baseline * (0.02 - e.amenityPct))) + ' gal/mo.');
    }
    if (e.reviewPct < 0.02) {
      out.push('Reaching a 3.6+ Trucker Path rating moves your projection by ' +
        ((0.02 - e.reviewPct) * 100).toFixed(1) + '% — about ' +
        BDPG.fmtGal(Math.round(e.baseline * (0.02 - e.reviewPct))) + ' gal/mo.');
    }
    // One position up the slider, rather than "the next option along" --
    // there are no options now, and the step in percentage points differs
    // between the two halves of the split track. Stepping by POSITION is the
    // only definition that stays right on both sides. Suppressed at the top
    // of the range, where there is no next position to offer.
    var pr = BDPG.pricingRange();
    var curPct = BDPG.currentPricingPct();
    if (curPct < pr.max) {
      var nextPos = BDPG_STATS.pricingPositionForPct(curPct, pr) + 1;
      var nextPct = BDPG_STATS.pricingPctForPosition(nextPos, pr);
      if (nextPct <= curPct) nextPct = pr.max;
      // Pricing and Rewards are deliberately outside officialSubtotal (see
      // busDevGallonsCalculator.js), so this caveat has to survive here too --
      // otherwise a prospect reads this gain against the Published Calculator
      // Figure, the one number that provably never moves.
      out.push('Moving your discount pricing strategy from ' + BDPG.fmtSignedPct(curPct) + ' to ' +
        BDPG.fmtSignedPct(nextPct) + ' could add about ' +
        BDPG.fmtGal(Math.round(e.baseline * (nextPct - e.pricingPct))) +
        ' gal/mo to your Final Potential Gallons estimate — this does not change Roady\'s BD Calculator Figure.');
    }
    return out;
  };
