  // an engine input, so a change here strands any result already on screen.
  BDPG.onRewardsChange = function (value) {
    if (BDPG.state.rewardsLevel !== value) BDPG.invalidateResult();
    BDPG.state.rewardsLevel = value;
    BDPG.render();
  };

  BDPG.onAmenityConfirm = function (value) {
    if (BDPG.state.amenityLevel !== value) BDPG.invalidateResult();
    BDPG.state.amenityLevel = value;
    BDPG.state.amenityOverridden = true;
    BDPG.render();
  };

  BDPG.supportingDetailsHtml = function () {
    var s = BDPG.state, sd = s.supportingDetails;
    var opts = BDPG_CONFIG.NETWORK_FIT_SIGNAL_OPTIONS;

    function selectHtml(id, options, current, field) {
      return '<select id="' + id + '" onchange="BDPG.onSupportingSelect(\'' + field + '\', this.value)">' +
        '<option value="">Select…</option>' +
        options.map(function (o) { return '<option value="' + BDPG.escHtml(o) + '"' + (o === current ? ' selected' : '') + '>' + BDPG.escHtml(o) + '</option>'; }).join('') +
        '</select>';
    }

    var row = (s.profile && s.roadway) ? BusDevGallonsCalc.getBaselineRow(s.profile, s.roadway) : null;
    var laneWarning = '';
    if (row && sd.actualLanes !== '') {
      var lo = parseInt(row.lanes, 10);
      var hasPlus = /\+/.test(row.lanes);
      var hi = hasPlus ? Infinity : parseInt(row.lanes.split('-')[1], 10);
      var actual = Number(sd.actualLanes);
      if (isFinite(actual) && (actual < lo || actual > hi)) {
        laneWarning = '<div style="grid-column:1/-1;margin-top:-4px;font-size:.78em;color:var(--yellow)">' +
          'Selected row expects ' + BDPG.escHtml(row.lanes) + ' lanes — reconsider Location Profile/Roadway?</div>';
      }
    }

    return '<div class="bdpg-grid-3">' +
        '<div class="fg"><label style="font-size:.72em">Condition</label>' + selectHtml('bdpg-sd-condition', opts.condition, sd.condition, 'condition') + '</div>' +
        '<div class="fg"><label style="font-size:.72em">Hours</label>' + selectHtml('bdpg-sd-hours', opts.hours, sd.hours, 'hours') + '</div>' +
        '<div class="fg"><label style="font-size:.72em">Distance to Interstate</label>' + selectHtml('bdpg-sd-distance', opts.distance, sd.distance, 'distance') + '</div>' +
        '<div class="fg"><label style="font-size:.72em">Corridor</label>' + selectHtml('bdpg-sd-corridor', opts.corridor, sd.corridor, 'corridor') + '</div>' +
        '<div class="fg"><label style="font-size:.72em">Competition</label>' + selectHtml('bdpg-sd-competition', opts.competition, sd.competition, 'competition') + '</div>' +
        '<div class="fg"><label style="font-size:.72em">Actual Diesel Lanes Observed</label>' +
          '<input id="bdpg-sd-lanes" type="number" min="0" value="' + BDPG.escHtml(sd.actualLanes) + '" oninput="BDPG.state.supportingDetails.actualLanes=this.value" onblur="BDPG.render()"></div>' +
        laneWarning +
        '<div class="fg"><label style="font-size:.72em">Prospect Name</label>' +
          // Step 3's duplicate name field is the second half of
          // resolveProspectName()'s precedence, so it can move the hero too
          // (whenever the ⓪ card's name is empty) -- same targeted patch.
          '<input id="bdpg-sd-name" value="' + BDPG.escHtml(sd.prospectName) + '" oninput="BDPG.state.supportingDetails.prospectName=this.value;BDPG.refreshPitchHero()"></div>' +
        '<div class="fg"><label style="font-size:.72em">City</label>' +
          '<input id="bdpg-sd-city" value="' + BDPG.escHtml(sd.prospectCity) + '" oninput="BDPG.state.supportingDetails.prospectCity=this.value"></div>' +
        '<div class="fg"><label style="font-size:.72em">State</label>' +
          '<input id="bdpg-sd-pstate" value="' + BDPG.escHtml(sd.prospectState) + '" oninput="BDPG.state.supportingDetails.prospectState=this.value"></div>' +
      '</div>';
  };

  // The five signal selects this handles (condition, hours, distance,
  // corridor, competition) are all read by calculateNetworkFitGrade, and
  // `condition` also by conditionAdjustedGallons -- both parts of
  // state.result. The Step 3 free-text fields do NOT route through here
  // (they write supportingDetails directly from their own oninput) and are
  // correctly left alone: nothing in the result derives from them.
  BDPG.onSupportingSelect = function (field, value) {
    if (BDPG.state.supportingDetails[field] !== value) BDPG.invalidateResult();
    BDPG.state.supportingDetails[field] = value;
    BDPG.render();
  };

  BDPG.generateButtonHtml = function () {
    var s = BDPG.state;
    var can = !!(BDPG.prospectDone() && s.profile && s.roadway && s.state);
    return '<button id="bdpg-generate-btn" class="bdpg-go"' + (can ? '' : ' disabled title="Complete Prospect Profile, Steps 1 and 2 to generate."') +
      ' onclick="BDPG.onGenerate()">🚛 Generate Value Profile</button>';
  };

  // ── Result ↔ input coupling ────────────────────────────────────────────
  // BDPG.state.result is the engine's answer for ONE exact set of inputs,
  // while BDPG.trackerSummary() pairs it with the *live* profile / roadway /
  // state / city. So the moment an input that feeds the engine changes while
  // a result is still sitting in state, Save Profile would freeze a
  // mismatched pair into a durable record — a tracker row stating an
  // Official Subtotal that the location profile printed beside it could
  // never produce (measured: 14,250 stored against a Fuel stop whose real
  // subtotal is 2,375). That is the one number that has to match Roady's
  // published calculator in front of a customer.
  //
  // The fix is at the root: every handler that changes an engine input calls
  // this, which drops the result and says so on screen. Recomputing silently
  // at Save time was rejected on purpose — that would rewrite the number the
  // rep just read off the screen, which is a different lie, not a fix.
  //
  // Inputs that invalidate — precisely what onGenerate() feeds the engine:
  //   profile / roadway ...... calculateEstimate + calculateNetworkFitGrade
  //   state .................. regionPct, and result.region
  //   truckerPathRating ...... calculateEstimate
  //   pricingLevel ........... calculateEstimate
  //   rewardsLevel ........... calculateEstimate
  //   amenityLevel ........... calculateEstimate
  //   amenityDetails ......... feeds amenityLevel whenever the rep hasn't
  //                            overridden the suggestion, and the results
  //                            panel's own amenity chart reads it directly
  //                            either way
  //   supportingDetails' five signal selects ... calculateNetworkFitGrade,
  //                            and `condition` also conditionAdjustedGallons
  //   the region-variance override ... effectiveRegionPct()
  //
  // Inputs that deliberately do NOT invalidate, because nothing in
  // state.result derives from them: prospect name / street / city / notes
  // (display only, and read live by displayName() / trackerSummary(), so
  // they cannot go stale against the result); prospect.locationType on its
  // own (it matters only when it auto-sets profile/roadway, and
  // onLocationType invalidates in exactly that case); Step 3's
  // prospectName / prospectCity / prospectState (display-only duplicates);
  // actualLanes (drives only Step 3's lane-mismatch warning); and every
  // panel open/closed toggle.
  BDPG.invalidateResult = function () {
    if (!BDPG.state.result) return;
    BDPG.state.result = null;
    BDPG.state.resultStale = true;
    // The handlers that patch the DOM instead of calling render() (the state
    // field, the rating slider) would otherwise leave the old results panel
    // on screen describing inputs that no longer exist.
    var wrap = document.getElementById('bdpg-results-wrap');
    if (wrap) wrap.innerHTML = BDPG.resultsWrapHtml();
  };

  BDPG.resultsWrapHtml = function () {
    if (BDPG.state.result) {
      return BDPG.resultsHtml() +
        '<button class="btn btn-accent" onclick="BDPG.onExportPdf()">Export Pitch Summary</button> ' +
        '<button class="btn" onclick="BDPG.onCopySummary()">Copy Summary</button>' +
        BDPG.exportPdfHtml();
    }
    if (BDPG.state.resultStale) {
      return '<div class="bdpg-box" style="margin-top:14px;border-color:var(--yellow);color:var(--yellow)">' +
        '⚠ An input changed after the last Generate, so those results no longer describe this prospect and have been cleared. ' +
        'Click <b>Generate Value Profile</b> to recalculate before saving or exporting.</div>';
    }
    return '';
  };

  // ── Unsaved-work detection ─────────────────────────────────────────────
  // Signature of everything a saved record actually carries. Panel
  // open/closed flags and the derived result are excluded: toggling a
  // disclosure triangle is not unsaved work, and the result is rebuilt by
  // Generate. Keys are walked in sorted order so a freshly-typed state and a
  // JSON round-tripped one produce the same string for the same data.
  // myProfilesOpen is kept deliberately: the modal it belonged to is gone, but
  // records saved before its removal still carry the key in their snapshot,
  // and onLoadProfile copies the snapshot into BDPG.state wholesale. Skipping
  // it keeps a legacy record's signature comparable with a fresh one.
  BDPG.SIG_SKIP = {
    result: 1, resultStale: 1, adminOpen: 1, adminSavedJson: 1,
    ncGeneratorOpen: 1, myProfilesOpen: 1, supportingOpen: 1, preEvalOpen: 1
  };
  BDPG.stateSig = function () {
    var s = BDPG.state, out = {};
    Object.keys(s).sort().forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(BDPG.SIG_SKIP, k)) out[k] = s[k];
    });
    try { return JSON.stringify(out); } catch (e) { return ''; }
  };
  // null means "no baseline captured yet" (the very first render hasn't
  // finished), which must not be reported as unsaved work.
  BDPG.savedSig = null;
  BDPG.hasUnsavedWork = function () {
    return BDPG.savedSig !== null && BDPG.stateSig() !== BDPG.savedSig;
  };
  BDPG.confirmDiscard = function (msg) {
    if (!BDPG.hasUnsavedWork()) return true;
    return confirm(msg);
  };

  // Id of the saved record the current state came from (an explicit Load, or
  // this page's own last Save), so a re-save updates that record instead of
  // appending a second row for the same prospect. Lives on BDPG, not on
  // BDPG.state, so it is never serialized into a snapshot.
  BDPG.currentProfileId = null;

  BDPG.onGenerate = function () {
    var s = BDPG.state;
    // Before anything reads them: the estimate below, and the pitch builders
    // that read s.pricingLevel / s.rewardsLevel live off state once a result
    // exists, must all see the same in-list value. See BDPG.normalizeLevels().
    BDPG.normalizeLevels();
    var region = BusDevGallonsCalc.resolveRegion(s.state);
    var regionPct = region ? BDPG.effectiveRegionPct(region) : 0;

    var estimate = BusDevGallonsCalc.calculateEstimate({
      profile: s.profile, roadway: s.roadway, regionPct: regionPct,
      amenityLevel: s.amenityLevel, reviewRating: s.truckerPathRating === '' ? null : Number(s.truckerPathRating),
      pricingLevel: s.pricingLevel || BDPG_CONFIG.PRICING_DEFAULT,
      rewardsLevel: s.rewardsLevel || BDPG_CONFIG.REWARDS_DEFAULT
    });
    if (!estimate) { alert('Pick a valid Location Profile + Roadway combination first.'); return; }

    var grade = BusDevGallonsCalc.calculateNetworkFitGrade({
      profile: s.profile, officialSubtotal: estimate.officialSubtotal, supportingDetails: s.supportingDetails
    });
    var conditionAdjusted = BusDevGallonsCalc.conditionAdjustedGallons(estimate.finalGallons, s.supportingDetails.condition);
    var membership = BusDevGallonsCalc.calculateMembershipFit(estimate.finalGallons);

    s.result = { estimate: estimate, grade: grade, conditionAdjusted: conditionAdjusted, membership: membership, region: region };
    // The result and the inputs are back in step, so the "results cleared"
    // notice must go with them.
    s.resultStale = false;
    BDPG.render();
  };

  // Mirrors the six rows of the on-screen waterfall table exactly, so the chart
  // and the table can never disagree. Presentation arithmetic only -- every
  // number comes from the engine's estimate object.
  //
  // Pricing and Rewards both use the difference form (this step's own
  // to - from), not a fresh Math.round(baseline * pct). Each of baseline,
  // pricingAdjusted and finalGallons is already independently rounded by the
  // engine, so a step computed from a re-multiplied percentage can land a
  // gallon off from what its own bar spans -- and the column would stop
  // summing to the stated total. The difference form keeps every step
  // chained to the one before it, which is the property a waterfall actually
  // promises; a one-gallon disagreement with a recomputed percentage is
  // invisible, but rows that don't add up to the total is not. (See Task 3
  // ruling in .superpowers/sdd/2026-09-23-bdpg-rewards-and-b2b-pitch/task-1-rulings.md.)
  BDPG.waterfallData = function (e) {
    var regionAdj = Math.round(e.baseline * (1 + e.regionPct));
    var steps = [
      { label: 'Baseline',    from: 0,                   to: e.baseline,          neutral: true },
      { label: 'Region',      from: e.baseline,          to: regionAdj },
      // Spelled out: this label used to carry an internal abbreviation, and
      // onExportPdf() rasterises this canvas straight into the prospect's
      // leave-behind, so it is customer-facing text. Two-element array rather
      // than one long string -- Chart.js renders an array tick label as
      // stacked lines, which keeps it upright (labelRotation 0) and readable
      // at font-size 9 instead of rotating it.
      { label: ['Amenities', '+ Review'], from: regionAdj, to: e.officialSubtotal },
      { label: 'Pricing',     from: e.officialSubtotal,  to: e.pricingAdjusted },
      { label: 'Rewards',     from: e.pricingAdjusted,   to: e.finalGallons },
      { label: 'Final',       from: 0,                   to: e.finalGallons,      neutral: true, accent: true }
    ];
    return {
      labels: steps.map(function (s) { return s.label; }),
      data: steps.map(function (s) { return [s.from, s.to]; }),
      colors: steps.map(function (s) {
        if (s.accent) return 'rgba(0,200,255,.75)';
        if (s.neutral) return 'rgba(58,74,107,.85)';
        return s.to >= s.from ? 'rgba(0,214,143,.7)' : 'rgba(255,71,87,.7)';
      })
    };
  };

  // Ordinal position of each selected option within its own config array, 0-100.
  // Presentation-only: this scale is not an engine concept and feeds no formula.
  // `compare` is the clean hook for a future per-region average dataset.
  //
  // Two of the six AMENITY_DETAIL_OPTIONS arrays are ordered best-to-worst
  // (scale: 'yes' first; defReefer: 'both' first) while the other four run
  // worst-to-best. The chart scores by quality, so those two need their
  // index flipped before normalizing -- the option *values* still come
  // straight from config, only the scoring direction is a UI concern.
  BDPG.AMENITY_SCORE_DESC = { scale: true, defReefer: true };

  BDPG.amenityProfileData = function (details, compare) {
    var fields = ['showers','food','scale','parking','service','defReefer'];
    var labels = { showers:'Showers', food:'Food', scale:'Scale', parking:'Parking', service:'Service', defReefer:'DEF/Reefer' };
    return {
      labels: fields.map(function (f) { return labels[f]; }),
      data: fields.map(function (f) {
        var opts = BDPG_CONFIG.AMENITY_DETAIL_OPTIONS[f] || [];
        var i = opts.indexOf(details[f]);
        if (i < 0 || opts.length < 2) return 0;
        var pos = BDPG.AMENITY_SCORE_DESC[f] ? (opts.length - 1 - i) : i;
        return Math.round((pos / (opts.length - 1)) * 100);
      }),
      compare: compare || null
    };
  };

  // Two label palettes for one chart. The on-screen one is the app's muted
  // token (#6B7A99) on the dark shell; the print one is near-black on white,
  // because Export Pitch Summary rasterises this canvas with toBase64Image()
  // and an <img> is pixels -- neither the @media print token repaint nor any
  // CSS rule can reach inside it, so the dark-theme ticks were printing pale
  // grey next to black body text on a document handed to a prospect.
  BDPG.CHART_INK_SCREEN = { tick: '#6B7A99', grid: 'rgba(255,255,255,.05)' };
  BDPG.CHART_INK_PRINT = { tick: '#333333', grid: 'rgba(0,0,0,.15)' };

  // Only the ink changes between the two. The bar colours are deliberately
  // NOT swapped: they encode up/down/total the same way the waterfall table's
  // rows do, and the printed chart has to be recognisable as the one the rep
  // just had on screen.
  BDPG.waterfallChartConfig = function (e, ink) {
    var w = BDPG.waterfallData(e);
    return {
      type: 'bar',
      data: { labels: w.labels, datasets: [{ label: 'gal/mo', data: w.data, backgroundColor: w.colors, borderRadius: 3 }] },
      // animation:{duration:0} -- Export Pitch Summary grabs this canvas via toBase64Image()
      // for the print packet. Chart.js's default 1000ms grow-in animation means a
      // rep clicking Generate then Export within about a second (verified: calling
      // chart.update('none') right before the capture does NOT reliably jump an
      // already-in-flight animation to its finished values -- toBase64Image() still
      // returned the mid-animation frame in testing) would otherwise ship a
      // partially-drawn waterfall to a prospect-facing leave-behind. Disabling the
      // animation on this one chart removes the race entirely: the canvas is
      // always fully drawn on the very first frame, whenever it's captured --
      // which is also what makes the print/screen swap in onExportPdf() safe
      // to do synchronously.
      options: Object.assign({}, CDO, {
        animation: { duration: 0 },
        plugins: { legend: { display: false } },
        // Fresh plain-literal scale objects rather than CDO.scales, for the
        // reason spelled out at length on the amenity chart below: Chart.js
        // bakes resolved, type-specific config onto whatever scale objects it
        // is handed, and CDO.scales is shared, mutable state that every other
        // chart in the app also passes in by reference. This chart now needs
        // per-render tick colours anyway, which is impossible to express on a
        // shared object without writing through to every other chart.
        scales: {
          x: { ticks: { color: ink.tick, font: { size: 9 } }, grid: { color: ink.grid } },
          y: { ticks: { color: ink.tick, font: { size: 9 } }, grid: { color: ink.grid } }
        }
      })
    };
  };

  BDPG.drawCharts = function () {
    var r = BDPG.state.result;
    if (!r) return;
    if (document.getElementById('bdpg-waterfall')) {
      mkchart('bdpg-waterfall', BDPG.waterfallChartConfig(r.estimate, BDPG.CHART_INK_SCREEN));
    }
    if (document.getElementById('bdpg-amenity')) {
      var a = BDPG.amenityProfileData(BDPG.state.amenityDetails);
      mkchart('bdpg-amenity', {
        type: 'bar',
        data: { labels: a.labels, datasets: [{ label: 'Score', data: a.data, backgroundColor: 'rgba(0,200,255,.6)', borderRadius: 3 }] },
        options: Object.assign({}, CDO, {
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          // Deliberately NOT built from CDO.scales.x/y here. Those nested tick/grid
          // objects are shared, mutable state that every other chart on the page
          // also passes to Chart.js by reference, and Chart.js bakes resolved,
          // type-specific config (scale `type`, and a category/linear-specific
          // ticks.callback) directly onto whatever objects it's given. This is the
          // only horizontal (indexAxis:'y') chart in the file, so reusing CDO's
          // y-scale config here would inherit a linear-axis tick callback (or leave
          // this axis typed 'linear') and print raw indices ("0".."5") instead of
          // the category labels -- and could just as easily corrupt CDO.scales.y
          // for every other (vertical) chart that reads it afterward. Fresh,
          // plain-literal style objects keep the same visual look with none of that
          // shared-reference risk.
          scales: {
            x: { type: 'linear', max: 100, ticks: { color: '#6B7A99', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,.04)' } },
            y: { type: 'category', ticks: { color: '#6B7A99', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,.05)' } }
          }
        })
      });
    }
  };

  BDPG.GRADE_COLORS = { A: 'var(--accent)', B: 'var(--green)', C: 'var(--yellow)', D: 'var(--orange)', E: 'var(--red)' };

  BDPG.gradeBadgeHtml = function (g) {
    var col = BDPG.GRADE_COLORS[g.grade] || 'var(--muted)';
    return '<div class="bdpg-grade" style="border-color:' + col + '">' +
      '<div class="bdpg-grade-l" style="color:' + col + '">' + BDPG.escHtml(g.grade) + '</div>' +
      '<div class="bdpg-grade-lbl" style="color:' + col + '">' + BDPG.escHtml(g.gradeLabel) + '</div>' +
    '</div>';
  };

  BDPG.rangeBarHtml = function (e) {
    function pos(v) { return Math.max(0, Math.min(100, ((v - 2500) / 12500) * 100)); }
    return '<div class="bdpg-nrange">' +
        '<div class="bdpg-nrange-m official" style="left:' + pos(e.officialSubtotal).toFixed(1) + '%"></div>' +
        '<div class="bdpg-nrange-m final" style="left:' + pos(e.finalGallons).toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="bdpg-rangebar-ends"><span>2,500</span><span>15,000</span></div>' +
      '<div class="bdpg-nrange-key">' +
        '<span><span class="bdpg-nrange-key-sw final" style="display:inline-block;width:10px;height:3px;background:var(--accent);vertical-align:middle"></span> Final ' + BDPG.fmtGal(e.finalGallons) + '</span>' +
        '<span><span class="bdpg-nrange-key-sw official" style="display:inline-block;width:10px;height:3px;background:var(--text);vertical-align:middle"></span> Official ' + BDPG.fmtGal(e.officialSubtotal) + '</span>' +
      '</div>';
  };

  // Prospect-facing hero. Extracted so the Export Pitch Summary renders the
  // identical block rather than a hand-maintained second copy that could
  // drift from what the rep saw on screen.
  BDPG.pitchHeroHtml = function () {
    var e = BDPG.state.result.estimate;
    var annual = e.finalGallons * 12;
    // displayName() falls back to the literal "Prospect" when nothing is
    // entered, which reads badly mid-sentence -- use a neutral phrase instead.
    // See resolveProspectName() for the shared precedence both draw from.
    var raw = BDPG.resolveProspectName();
    var who = raw ? BDPG.escHtml(raw) : 'this location';

    // The name sits in its own span so BDPG.refreshPitchHero() can retarget it
    // after an edit without re-rendering (and without stealing the caret from
    // the field being typed in). A class, not an id: this same markup is
    // rendered twice at once -- once on screen and once inside
    // #bdpg-print-only -- and duplicate ids would be a lie about which one
    // getElementById returns.
    return '<div class="bdpg-hero-card final" style="margin-bottom:14px">' +
      '<div class="bdpg-hero-num" style="font-size:2.3em;line-height:1.15">' +
        'Roady\'s can drive ' + BDPG.fmtGal(e.finalGallons) + ' gallons/month to ' +
        '<span class="bdpg-hero-who">' + who + '</span></div>' +
      '<div style="font-size:.95em;color:var(--muted);margin-top:8px">That\'s ' + BDPG.fmtGal(annual) +
        ' gallons annually — based on your location profile, region, and network data.</div>' +
      '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">' +
        '<span class="bdpg-lbl" style="display:inline">Roady\'s Published Calculator Figure:</span> ' +
        '<b style="font-size:1.15em">' + BDPG.fmtGal(e.officialSubtotal) + ' gal/mo</b>' +
        '<div style="font-size:.72em;color:var(--muted);margin-top:3px">' +
          'Matches Roady\'s published prospective-member calculator.</div>' +
      '</div>' +
    '</div>';
  };

  // Targeted patch for the one piece of the rendered hero that a keystroke can
  // change: the prospect's name. The name is display-only, so editing it
  // deliberately does NOT invalidate the result -- but onExportPdf() rebuilds
  // the packet from live state, so without this the laptop showed one name
  // while the sheet handed over carried another. Same shape as
  // refreshPreEvalCard(): patch the node, never BDPG.render(), which would
  // destroy the input mid-word.
  //
  // textContent, not innerHTML: the value comes straight from a text field, so
  // this is the one write that must not be able to introduce markup. It also
  // updates the copy inside #bdpg-print-only, so the two can't drift between
  // renders.
  BDPG.refreshPitchHero = function () {
    var who = BDPG.resolveProspectName() || 'this location';
    var els = document.querySelectorAll('.bdpg-hero-who');
    for (var i = 0; i < els.length; i++) { els[i].textContent = who; }
  };

  // The single definition of "what the prospect sees". resultsHtml() renders
  // it above the divider and the export renders exactly this -- so the
  // leave-behind can never drift from what the rep showed on screen. Guarded
  // here (rather than trusting every caller) because this is the function
  // that decides when the pitch block renders at all -- Task 10 adds a
  // second caller, and neither one should be able to invoke the builders
  // below against a null result.
  BDPG.pitchSectionsHtml = function () {
    if (!BDPG.state.result) return '';
    return BDPG.pitchHeroHtml() +
      BDPG.pitchDriversHtml() +
      BDPG.pitchOpportunitiesHtml() +
      BDPG.pitchBusinessCaseHtml() +
      BDPG.pitchNetworkStripHtml();
  };

  // Unmistakably "internal, not for the prospect" -- the Network Fit Grade,
  // amenity chart, network-context table, condition-adjusted view and
  // analysis all live below this and would actively damage a sales call if
  // shown to the owner (a grade letter, "non-official", deficiency framing).
  BDPG.internalDividerHtml = function () {
    return '<div style="margin:26px 0 14px;padding-top:12px;border-top:2px dashed var(--border2);' +
      'display:flex;align-items:center;gap:10px">' +
      '<span class="badge tag-yellow">INTERNAL</span>' +
      '<span style="font-size:.8em;color:var(--muted)">Not shown to the prospect — excluded from the Export Pitch Summary.</span>' +
    '</div>';
  };

  BDPG.resultsHtml = function () {
    var r = BDPG.state.result, e = r.estimate, g = r.grade;
    var regionAdjusted = Math.round(e.baseline * (1 + e.regionPct));

    var waterfall = '<div class="cc" style="margin-top:14px"><div class="cc-lbl">Adjustment Waterfall</div>' +
      '<div class="cw" style="height:220px"><canvas id="bdpg-waterfall"></canvas></div>' +
      '<table class="dt" style="width:100%;font-size:.85em;margin-top:10px"><tbody>' +
        '<tr><td>1. Baseline</td><td style="text-align:right">' + BDPG.fmtGal(e.baseline) + '</td></tr>' +
        '<tr><td>2. Region-adjusted (' + (e.regionPct >= 0 ? '+' : '') + (e.regionPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + BDPG.fmtGal(regionAdjusted) + '</td></tr>' +
        '<tr style="font-weight:700"><td>3. Official calculator subtotal (+ Amenities ' + (e.amenityPct >= 0 ? '+' : '') + (e.amenityPct * 100).toFixed(1) + '% + Review ' + (e.reviewPct >= 0 ? '+' : '') + (e.reviewPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + BDPG.fmtGal(e.officialSubtotal) + '</td></tr>' +
        '<tr><td>4. Pricing adjustment (' + (e.pricingPct >= 0 ? '+' : '') + (e.pricingPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + (e.pricingAdjusted - e.officialSubtotal >= 0 ? '+' : '') + BDPG.fmtGal(e.pricingAdjusted - e.officialSubtotal) + '</td></tr>' +
        // Difference form (finalGallons - pricingAdjusted), not Math.round(baseline * rewardsPct):
        // each figure is independently rounded, so a recomputed-percentage step can land a
        // gallon off from the bar it's supposed to label and break "rows sum to the total".
        // See the comment atop BDPG.waterfallData.
        '<tr><td>5. Rewards adjustment (' + (e.rewardsPct >= 0 ? '+' : '') + (e.rewardsPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + (e.finalGallons - e.pricingAdjusted >= 0 ? '+' : '') + BDPG.fmtGal(e.finalGallons - e.pricingAdjusted) + '</td></tr>' +
        '<tr style="font-weight:700;border-top:1px solid var(--border)"><td>6. Final Potential Gallons</td><td style="text-align:right">' + BDPG.fmtGal(e.finalGallons) + '</td></tr>' +
      '</tbody></table></div>';

    var rangeSection = '<div class="bdpg-hero" style="margin-top:14px">' +
      '<div class="cc"><div class="cc-lbl">Position in Network Range</div>' + BDPG.rangeBarHtml(e) +
        '<div style="font-size:.68em;color:var(--muted);margin-top:6px">Grade is scored from the official subtotal and is never affected by Pricing Strategy.</div></div>' +
      BDPG.gradeBadgeHtml(g) +
    '</div>';

    var amenitySection = '<div class="cc" style="margin-top:14px"><div class="cc-lbl">Your Amenity Profile</div>' +
      '<div class="cw" style="height:180px"><canvas id="bdpg-amenity"></canvas></div>' +
      '<div style="font-size:.68em;color:var(--muted)">This prospect’s own amenity levels. No network average available yet.</div></div>';

    var netCtx = BDPG.networkContextHtml();

    // The as-of disclosure appears on both halves, in each half's own voice:
    // the plain-language date above the divider (and in the packet, which is
    // built from the same pitch wording), the internal "Region variance ...
    // not set (0% adjustment)" line below it. '' above the divider when there
    // is no date, so no empty grey strip is emitted.
    var asOfPitch = BDPG.regionVarianceAsOfLinePitch();
    var asOfPitchLine = asOfPitch
      ? '<div style="margin-top:8px;font-size:.75em;color:var(--muted)">' + BDPG.escHtml(asOfPitch) + '</div>' : '';

    return '<div class="bdpg-results">' +
      BDPG.pitchSectionsHtml() +
      asOfPitchLine +
      (e.reviewFlagged ? '<div style="margin-top:6px;color:var(--yellow);font-size:.8em">No Trucker Path rating found — Review% treated as 0%.</div>' : '') +
      waterfall +
      BDPG.internalDividerHtml() +
      rangeSection + amenitySection + netCtx +
      BDPG.conditionAdjustedHtml() + BDPG.membershipFitHtml() + BDPG.analysisNarrativeHtml() +
      '<div style="margin-top:8px;font-size:.75em;color:var(--muted)">' + BDPG.escHtml(BDPG.regionVarianceAsOfLine()) + '</div>' +
    '</div>';
  };

  BDPG.conditionAdjustedHtml = function () {
    var r = BDPG.state.result, e = r.estimate;
    var delta = r.conditionAdjusted - e.finalGallons;
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Condition-Adjusted View <span style="font-size:.85em;color:var(--yellow);font-weight:400">(non-official)</span></div></div>' +
      '<div style="font-size:1.3em;font-weight:700">' + BDPG.fmtGal(r.conditionAdjusted) + ' gal/mo</div>' +
      '<div style="font-size:.8em;color:var(--muted)">' + (delta >= 0 ? '+' : '') + BDPG.fmtGal(delta) + ' vs. Final Potential Gallons, based on condition: ' +
        BDPG.escHtml(BDPG.state.supportingDetails.condition || 'not set') + '</div>' +
    '</div>';
  };

  BDPG.membershipFitHtml = function () {
    var m = BDPG.state.result.membership;
    if (!m.valuePerGallonConfigured) {
      return '<div class="bdpg-box" style="margin-top:14px"><div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Membership Fit</div></div>' +
        '<div style="color:var(--muted)">Membership pricing not configured.</div></div>';
    }
    var rows = m.plans.map(function (p) {
      if (!p.configured) return '<tr><td>' + BDPG.escHtml(p.name) + '</td><td colspan="2" style="color:var(--muted)">Not configured</td></tr>';
      return '<tr><td>' + BDPG.escHtml(p.name) + '</td>' +
        '<td style="text-align:right">' + BDPG.fmtGal(p.breakevenGallons) + ' gal/mo breakeven</td>' +
        '<td style="text-align:right">' + p.coverageMultiple + '×</td></tr>';
    }).join('');
    var best = m.plans.filter(function (p) { return p.configured; }).sort(function (a, b) { return b.coverageMultiple - a.coverageMultiple; })[0];
    var recommendation = best
      ? '<div style="margin-top:8px;font-weight:700">Membership pays for itself at ' + BDPG.fmtGal(best.breakevenGallons) + ' gal/mo — final potential estimate is ' +
        BDPG.fmtGal(BDPG.state.result.estimate.finalGallons) + ' (' + best.coverageMultiple + '× coverage).</div>'
      : '';
    return '<div class="bdpg-box" style="margin-top:14px"><div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Membership Fit</div></div>' +
      '<table class="dt" style="width:100%;font-size:.85em"><tbody>' + rows + '</tbody></table>' + recommendation + '</div>';
  };

  // Prospect-facing business case. Mirrors membershipFitHtml()'s payback math
  // but never shows the internal "Membership pricing not configured" notice --
  // MEMBERSHIP_CONFIG ships all zeros today, so this line simply does not
  // render. That is the expected state, not a bug; the internal Membership
  // Fit panel above keeps the notice for the rep.
  BDPG.pitchBusinessCaseHtml = function () {
    var r = BDPG.state.result, e = r.estimate, m = r.membership;
    var annual = e.finalGallons * 12;

    var payback = '';
    var best = m.valuePerGallonConfigured
      ? m.plans.filter(function (p) { return p.configured; })
               .sort(function (a, b) { return b.coverageMultiple - a.coverageMultiple; })[0]
      : null;
    if (best) {
      payback = '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:.9em">' +
        // "At the X membership, your membership pays for itself" said
        // membership twice in nine words. The plan is the subject now, so it
        // is named once.
        'The <b>' + BDPG.escHtml(best.name) + '</b> membership pays for itself at ' +
        BDPG.fmtGal(best.breakevenGallons) + ' gal/mo — your projection is <b>' + best.coverageMultiple +
        '×</b> that.</div>';
    }

    var stat = 'font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px';
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:4px"><div class="sec-title" style="font-size:.85em">What This Means For Your Business</div></div>' +
      '<div style="font-size:.82em;color:var(--muted);margin-bottom:12px">Join Roady\'s and here\'s what your first year looks like.</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:34px">' +
        '<div><div style="' + stat + '">Monthly potential</div>' +
          '<div style="font-family:var(--ff);font-size:1.9em;font-weight:800;color:var(--accent);line-height:1">' +
          BDPG.fmtGal(e.finalGallons) + '<span style="font-size:.4em;color:var(--muted);margin-left:6px">gal/mo</span></div></div>' +
        '<div><div style="' + stat + '">Annual potential</div>' +
          '<div style="font-family:var(--ff);font-size:1.9em;font-weight:800;color:var(--accent);line-height:1">' +
          BDPG.fmtGal(annual) + '<span style="font-size:.4em;color:var(--muted);margin-left:6px">gal/yr</span></div></div>' +
      '</div>' + payback +
    '</div>';
  };

  // The prospect's leave-behind. Everything below resultsHtml()'s INTERNAL
  // divider -- the Network Fit Grade, the network range bar, the
  // condition-adjusted view, the amenity chart, the network-context table and
  // the Analysis block -- is deliberately absent: an owner reading a grade
  // letter or the word "non-official" about their own site loses the room.
  // The pitch itself comes from BDPG.pitchSectionsHtml(), the same call
  // resultsHtml() makes, so the page and the packet cannot drift. That
  // function returns '' when there is no result, and pitchDriversHtml() /
  // pitchOpportunitiesHtml() each legitimately return '' on their own (a
  // top-band prospect has no opportunities, a weak one has no drivers), so
  // nothing here may assume a fixed section count.
  BDPG.exportPdfHtml = function () {
    var r = BDPG.state.result;
    if (!r) return '';
    var e = r.estimate, loc = BDPG.displayLocation();

    var chartImg = BDPG.printChartImg
      ? '<div style="margin-top:14px"><img src="' + BDPG.printChartImg + '" alt="Adjustment waterfall chart" style="width:100%;max-width:560px;border:1px solid #999"></div>'
      : '';

    // The rep's local calendar date, NOT toISOString().slice(0,10) -- that is
    // UTC, so for everyone west of it the last hours of every working day
    // stamp a document handed to a customer with tomorrow's date. (The
    // tracker's savedAt stays ISO/UTC on purpose: it is a lexicographic sort
    // key, not a date a human reads. Different job, different rule.)
    var now = new Date();
    var today = now.getFullYear() + '-' +
      ('0' + (now.getMonth() + 1)).slice(-2) + '-' +
      ('0' + now.getDate()).slice(-2);
    // Omitted entirely when unset, so the header closes on the date with no
    // blank line where a name would have been.
    var preparedBy = BDPG.state.prospect.gsName
      ? '<p style="font-size:.9em">Prepared by ' + BDPG.escHtml(BDPG.state.prospect.gsName) + '</p>' : '';
    var asOfPitch = BDPG.regionVarianceAsOfLinePitch();

    return '<div id="bdpg-print-only">' +
      '<h1>Roady\'s Fuel Network — Value Proposition for ' + BDPG.escHtml(BDPG.displayName()) + '</h1>' +
      (loc ? '<h2>' + BDPG.escHtml(loc) + '</h2>' : '') +
      '<p style="font-size:.9em">' + today + '</p>' + preparedBy +
      // Exactly the sections shown above the INTERNAL divider on screen --
      // same function, not a second copy, so the two cannot drift.
      BDPG.pitchSectionsHtml() +
      '<h3>How the number is built</h3>' +
      '<p>' + BDPG.escHtml(BDPG.state.profile) + ' / ' + BDPG.escHtml(BDPG.state.roadway) +
        ' — Baseline ' + BDPG.fmtGal(e.baseline) + ' gal/mo</p>' +
      '<p>Official calculator: ' + BDPG.escHtml(e.officialMathLine) + '</p>' +
      '<p>With pricing: ' + BDPG.escHtml(e.pricingMathLine) + '</p>' +
      '<p>With Roady\'s Rewards (' + BDPG.escHtml(BDPG.state.rewardsLevel) + '): ' + BDPG.escHtml(e.finalMathLine) + '</p>' +
      // Pitch wording, and omitted entirely when there is no date -- the
      // internal "not set (0% adjustment)" phrasing is a rep-facing note and
      // stays below the divider on screen. See regionVarianceAsOfLinePitch().
      (asOfPitch ? '<p style="font-size:.85em;color:#666">' + BDPG.escHtml(asOfPitch) + '</p>' : '') +
      chartImg +
    '</div>';
  };

  BDPG.onExportPdf = function () {
    if (!BDPG.state.result) { alert('Generate a Value Profile first.'); return; }
    // A live <canvas> doesn't reproduce reliably across print pipelines, so grab
    // a static image of the waterfall chart before anything else changes. This
    // has to happen before the #bdpg-print-only rebuild below so exportPdfHtml()
    // can inline it as an <img>; if it fails for any reason the packet still
    // prints, just without the chart image.
    // The waterfall chart is built with animation:{duration:0} (see
    // BDPG.waterfallChartConfig) specifically so this capture is always
    // complete no matter how soon after Generate the rep clicks Export -- see
    // the comment there for why.
    // Captured in print ink, then put straight back: see BDPG.CHART_INK_PRINT.
    // mkchart() destroys and recreates, and this chart is animation:{duration:0},
    // so both passes are complete on their first frame -- the whole swap
    // finishes inside this synchronous block and the rep never sees it.
    BDPG.printChartImg = '';
    if (typeof CHS !== 'undefined' && CHS['bdpg-waterfall'] && document.getElementById('bdpg-waterfall')) {
      try {
        mkchart('bdpg-waterfall', BDPG.waterfallChartConfig(BDPG.state.result.estimate, BDPG.CHART_INK_PRINT));
        BDPG.printChartImg = CHS['bdpg-waterfall'].toBase64Image();
      } catch (err) { BDPG.printChartImg = ''; }
      // Unconditional, including after a failed capture -- the rep must never
      // be left looking at the print-ink chart because the export threw.
      try {
        mkchart('bdpg-waterfall', BDPG.waterfallChartConfig(BDPG.state.result.estimate, BDPG.CHART_INK_SCREEN));
      } catch (err2) { /* screen chart is cosmetic; the packet still prints */ }
    }

    // Rebuild just the print-only block (not a full BDPG.render(), which would
    // tear down and recreate the on-screen charts) so the freshly-captured
    // chart image is actually in the DOM before window.print() opens.
    var printOnly = document.getElementById('bdpg-print-only');
    if (printOnly) printOnly.outerHTML = BDPG.exportPdfHtml();

    // bdpg-print-mode is what the @media print rules key off of (see <style>),
    // so a plain browser File > Print on some other page never gets caught by
    // these rules — only a print triggered through this button does.
    // It goes on BOTH elements: body gates every rule about what is shown,
    // and html gates the one rule that has to reach the print canvas's
    // background (body's own background does not propagate past an html that
    // sets its own). They are set and cleared together, always.
    document.documentElement.classList.add('bdpg-print-mode');
    document.body.classList.add('bdpg-print-mode');
    window.print();
  };

  if (!BDPG._printModeCleanupBound) {
    BDPG._printModeCleanupBound = true;
    window.addEventListener('afterprint', function () {
      document.documentElement.classList.remove('bdpg-print-mode');
      document.body.classList.remove('bdpg-print-mode');
    });
  }

  BDPG.summaryText = function () {
    var r = BDPG.state.result, e = r.estimate, loc = BDPG.displayLocation();
    // This gets pasted into prospect-facing email, so it follows the same
    // pitch-only rule as the Export Pitch Summary packet: no Network Fit
    // Grade line. The grade is an internal score and reads to an owner as a
    // report card on their own site.
    var lines = [
      'Roady\'s Fuel Network — Value Proposition for ' + BDPG.displayName(),
      loc || '',
      BDPG.state.prospect.gsName ? 'Prepared by ' + BDPG.state.prospect.gsName : '',
      '',
      'Roady\'s can drive ' + BDPG.fmtGal(e.finalGallons) + ' gal/mo — ' + BDPG.fmtGal(e.finalGallons * 12) + ' gal/yr.',
      '',
      'Location Profile: ' + BDPG.state.profile + ' / ' + BDPG.state.roadway,
      'Official calculator math: ' + e.officialMathLine,
      'Roady\'s Published Calculator Figure: ' + BDPG.fmtGal(e.officialSubtotal),
      'Pricing Strategy: ' + BDPG.state.pricingLevel,
      'Roady\'s Rewards: ' + BDPG.state.rewardsLevel,
      'Final Potential Gallons math: ' + e.finalMathLine,
      'Final Potential Gallons: ' + BDPG.fmtGal(e.finalGallons)
    ];
    if (r.membership.valuePerGallonConfigured && r.membership.plans.some(function (p) { return p.configured; })) {
      var best = r.membership.plans.filter(function (p) { return p.configured; }).sort(function (a, b) { return b.coverageMultiple - a.coverageMultiple; })[0];
      lines.push('Membership pays for itself at ' + BDPG.fmtGal(best.breakevenGallons) + ' gal/mo (' + best.coverageMultiple + '× coverage).');
    }
    // An absent location or GS name leaves its slot as '' next to the
    // deliberate blank separator below it. Collapse only those runs -- the
    // single blanks that structure the message stay.
    return lines.filter(function (l, i) { return !(l === '' && lines[i - 1] === ''); }).join('\n');
  };

  BDPG.onCopySummary = function () {
    var text = BDPG.summaryText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Copied to clipboard'); }, function () { BDPG.fallbackCopy(text); });
    } else {
      BDPG.fallbackCopy(text);
    }
  };

  BDPG.fallbackCopy = function (text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e) { alert(text); }
    document.body.removeChild(ta);
  };

  // Every bullet is generated from the actual selected values -- never a
  // hardcoded list -- and appears ONLY when its signal is positive. Negative
  // and neutral signals are handled by pitchOpportunitiesHtml() instead, so
  // this section never tells a prospect what is wrong with their site.
  BDPG.pitchDrivers = function () {
    var s = BDPG.state, e = s.result.estimate, out = [];

    if (s.roadway === 'Interstate') {
      out.push('Your Interstate location puts you in the path of high-volume fleet corridors — the strongest traffic signal in our network.');
    } else if (s.roadway === 'Highway') {
      out.push('Your Highway location sits on a steady regional freight corridor.');
    }
    if (e.regionPct > 0) {
      out.push('The ' + s.result.region + ' region runs ' + (e.regionPct * 100).toFixed(1) +
        '% above the network average — your geography works in your favor.');
    }
    if (e.amenityPct > 0) {
      out.push('Your amenity level — ' + s.amenityLevel + ' — already places you above the network average for driver satisfaction.');
    }
    if (e.reviewPct > 0) {
      // Never name the 3.6 threshold here: (3.55).toFixed(1) displays "3.5"
      // while its reviewPct is already positive, which would make this bullet
      // self-contradicting for a saved record at that exact value.
      out.push('Your ' + Number(s.truckerPathRating).toFixed(1) +
        ' Trucker Path rating already places you in our top service band — drivers rate you well.');
    }
    if (e.pricingPct > 0) {
      out.push('Your ' + s.pricingLevel.replace(' (deepest discounts)', '') + ' pricing posture is projected to add ' +
        (e.pricingPct * 100).toFixed(1) + '% in gallon volume.');
    }
    if (e.rewardsPct > 0) {
      out.push('Participating in Roady\'s Rewards adds an estimated +' + (e.rewardsPct * 100).toFixed(1) +
        '% volume uplift as loyalty members are directed to your stop.');
    }
    return out;
  };

  BDPG.pitchDriversHtml = function () {
    var items = BDPG.pitchDrivers();
    // Omit the whole section rather than render an empty heading.
    if (!items.length) return '';
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">How We Get There</div></div>' +
      '<ul style="margin:0 0 0 18px;font-size:.8em;line-height:1.7">' +
        items.map(function (t) { return '<li>' + BDPG.escHtml(t) + '</li>'; }).join('') +
      '</ul></div>';
  };

  // The mirror of pitchDrivers(): everything that is NOT already a positive
  // signal, phrased as upside the prospect can capture -- never as a
  // diagnosis of what is wrong with their site.
  BDPG.pitchOpportunities = function () {
    var s = BDPG.state, e = s.result.estimate, out = [];

    // These three are swing bullets: the percentage is the change to the
    // prospect's own projection from where it stands today (e.g. Not
    // participating at -5% to Participating at +5% is a 10-point swing), not
    // a second, larger quote of the program's band -- see the footnote below.
    if (e.rewardsPct < 0.05) {
      out.push('Joining Roady\'s Rewards moves your projection by ' +
        ((0.05 - e.rewardsPct) * 100).toFixed(1) + '% — about ' +
        BDPG.fmtGal(Math.round(e.baseline * (0.05 - e.rewardsPct))) + ' gal/mo.');
    }
    if (e.amenityPct < 0.02) {
      out.push('Reaching a "Good / full service" amenity level moves your projection by ' +
        ((0.02 - e.amenityPct) * 100).toFixed(1) + '% — about ' +
        BDPG.fmtGal(Math.round(e.baseline * (0.02 - e.amenityPct))) + ' gal/mo.');
    }
    if (e.reviewPct < 0.02) {
      out.push('Reaching a 3.6+ Trucker Path rating moves your projection by ' +
        ((0.02 - e.reviewPct) * 100).toFixed(1) + '% — about ' +
        BDPG.fmtGal(Math.round(e.baseline * (0.02 - e.reviewPct))) + ' gal/mo.');
    }
    var levels = BDPG_CONFIG.PRICING_LEVELS;
    var nextIdx = levels.indexOf(s.pricingLevel) - 1;
    if (nextIdx >= 0) {
      var nextPct = BDPG_CONFIG.PRICING_ADJUST[levels[nextIdx]];
      var fromLabel = s.pricingLevel.replace(' (deepest discounts)', '');
      var toLabel = levels[nextIdx].replace(' (deepest discounts)', '');
      // Pricing and Rewards are deliberately outside officialSubtotal (see
      // busDevGallonsCalculator.js), so this caveat has to survive here too --
      // otherwise a prospect reads this gain against the Published Calculator
      // Figure, the one number that provably never moves.
      out.push('Moving from "' + fromLabel + '" to "' + toLabel + '" could add about ' +
        BDPG.fmtGal(Math.round(e.baseline * (nextPct - e.pricingPct))) +
        ' gal/mo to your Final Potential Gallons estimate — this does not change Roady\'s Published Calculator Figure.');
    }
    return out;
  };

  BDPG.pitchOpportunitiesHtml = function () {
    var items = BDPG.pitchOpportunities();
    if (!items.length) return '';
    // The footnote only applies when a swing-percentage bullet is actually on
    // screen (the pricing bullet carries no percentage), so check rather than
    // always appending it.
    var hasPct = items.some(function (t) { return t.indexOf('%') !== -1; });
    var footnote = hasPct
      ? '<div style="margin-top:8px;font-size:.75em;color:var(--muted)">Percentages show the change to your projection from where it stands today.</div>'
      : '';
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Opportunities to Grow</div></div>' +
      '<ul style="margin:0 0 0 18px;font-size:.8em;line-height:1.7">' +
        items.map(function (t) { return '<li>' + BDPG.escHtml(t) + '</li>'; }).join('') +
      '</ul>' + footnote + '</div>';
  };

  BDPG.analysisNarrativeHtml = function () {
    var r = BDPG.state.result, e = r.estimate;

    return '<div class="bdpg-box" style="margin-top:14px"><div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Analysis</div></div>' +
      '<p style="font-size:.85em">' + BDPG.escHtml(e.officialMathLine) + '</p>' +
      '<p style="font-size:.85em">' + BDPG.escHtml(e.finalMathLine) + '</p>' +
      '<div style="margin-top:8px;font-size:.85em"><b>Network Fit:</b> Grade ' + r.grade.grade + ' (' + BDPG.escHtml(r.grade.gradeLabel) + '), ' +
        Math.round(r.grade.rangePositionPct) + '% of its profile\'s range, ' + Math.round(r.grade.signalAvg) + '/100 avg on Supporting Details.</div>' +
    '</div>';
  };

  BDPG.networkContextHtml = function () {
    var r = BDPG.state.result;
    if (!BDPG.networkContext || !r.region) return '';
    var regionData = BDPG.networkContext.byRegion[r.region];
    if (!regionData) return '';

    var typeRows = Object.keys(regionData.byType).map(function (t) {
      return '<tr><td>' + BDPG.escHtml(t) + '</td><td style="text-align:right">' + regionData.byType[t] + '</td></tr>';
    }).join('');

    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Network Context — ' + BDPG.escHtml(r.region) + '</div></div>' +
      '<div style="font-size:.85em;margin-bottom:8px">' + regionData.total + ' active locations in this region ' +
      '(as of ' + BDPG.escHtml(BDPG.networkContext.asOf) + ')</div>' +
      '<table class="dt" style="width:100%;font-size:.82em"><thead><tr><th>Type</th><th style="text-align:right">Count</th></tr></thead><tbody>' + typeRows + '</tbody></table>' +
    '</div>';
  };

  // Facts about the network, not projections about this prospect -- the point
  // is to establish Roady's scale. A missing figure is OMITTED, never rendered
  // as "—": a dash in a credibility strip shown to a customer reads as a
  // broken page. If there is no network data or no resolved region at all,
  // the whole strip is dropped.
  BDPG.pitchNetworkStripHtml = function () {
    var nc = BDPG.networkContext, r = BDPG.state.result;
    if (!nc || !r.region || !nc.byRegion) return '';
    var rd = nc.byRegion[r.region];
    if (!rd) return '';

    var stats = [];
    if (typeof nc.activeTotal === 'number') {
      stats.push([BDPG.fmtGal(nc.activeTotal), 'active locations across the Roady\'s network']);
    }
    if (typeof rd.total === 'number') {
      stats.push([BDPG.fmtGal(rd.total), 'locations in your region (' + r.region + ')']);
    }
    // byType keys come from the source CSV's Type column while locationType
    // comes from the ⓪ card's own list; they do not always match, which is why
    // this is a hasOwnProperty check and not a plain lookup.
    var lt = BDPG.state.prospect.locationType;
    if (lt && rd.byType && Object.prototype.hasOwnProperty.call(rd.byType, lt)) {
      stats.push([BDPG.fmtGal(rd.byType[lt]), BDPG.escHtml(lt) + ' locations like yours already in the network']);
    }
    if (!stats.length) return '';

    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:10px"><div class="sec-title" style="font-size:.85em">About the Roady\'s Network</div></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:34px">' +
        stats.map(function (s) {
          return '<div><div style="font-family:var(--ff);font-size:1.9em;font-weight:800;color:var(--accent);line-height:1">' +
            s[0] + '</div><div style="font-size:.78em;color:var(--muted);margin-top:3px;max-width:200px">' + s[1] + '</div></div>';
        }).join('') +
      '</div>' +
      (nc.asOf ? '<div style="font-size:.68em;color:var(--muted);margin-top:10px">Network figures as of ' + BDPG.escHtml(nc.asOf) + '.</div>' : '') +
    '</div>';
  };

  BDPG.getSavedProfiles = function () {
    try {
      var v = JSON.parse(localStorage.getItem('roadysBDPGProfiles') || '[]');
      // A corrupted value (e.g. hand-edited to "{}" or "x") must not take
      // down every caller -- getSavedProfiles() is the one place all of
      // them read through, so guarding here fixes it everywhere at once.
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  };

  // Captures what the Prospects tracker table shows, from the *current*
  // state and result, so the tracker never has to re-derive it. A profile
  // saved before Generate has run has null gallons and an empty grade --
  // that is legitimate data, not corruption.
  BDPG.trackerSummary = function () {
    var s = BDPG.state, r = s.result, e = r ? r.estimate : null;
    return {
      name: BDPG.displayName(),
      locationType: s.prospect.locationType || '',
      city: s.prospect.city || '',
      stateCode: s.state || '',
      region: s.state ? BusDevGallonsCalc.resolveRegion(s.state) : '',
      profile: s.profile || '', roadway: s.roadway || '',
      officialSubtotal: e ? e.officialSubtotal : null,
      finalGallons: e ? e.finalGallons : null,
      grade: r && r.grade ? r.grade.grade : '', gradeLabel: r && r.grade ? r.grade.gradeLabel : '',
      preEvalSignal: s.prospect.preEvalSignal || '',
      amenityLevel: s.amenityLevel || '', pricingLevel: s.pricingLevel || '',
      rewardsLevel: s.rewardsLevel || ''
    };
  };

  // Profiles saved before this release have no `prospect` and no `summary`.
  // Every field falls back to a dash or empty string; nothing here may ever
  // render "undefined", and a legitimate zero (=== 0) must not collapse to
  // the "missing" fallback the way `|| null` would.
  //
  // The string fields all read through str(), the third member of this file's
  // guard set alongside isNum() for stored numbers and hasOwn() for stored
  // map keys. A hand-edited record holding an object where a label belongs
  // (e.g. rewardsLevel: {}) is truthy, so every `||` chain below used to pass
  // it straight to escHtml() and the tracker printed the literal
  // "[object Object]" -- a string this branch's own constraints forbid
  // rendering anywhere. Coercing a non-string to '' also lets the chain fall
  // through to the next source rather than stopping on the corrupt one, and
  // lands on the same "—" the rest of the table uses for missing data.
  function str(v) { return typeof v === 'string' ? v : ''; }
  BDPG.readSummary = function (p) {
    var sum = p.summary || {};
    var st = p.state || {};
    var pr = st.prospect || {};
    var stateCode = str(sum.stateCode) || str(st.state);
    return {
      name: str(sum.name) || str(p.name) || str(pr.name) || '—',
      locationType: str(sum.locationType) || str(pr.locationType),
      city: str(sum.city) || str(pr.city),
      stateCode: stateCode,
      region: str(sum.region) || (stateCode ? str(BusDevGallonsCalc.resolveRegion(stateCode)) : ''),
      profile: str(sum.profile) || str(st.profile), roadway: str(sum.roadway) || str(st.roadway),
      officialSubtotal: (sum.officialSubtotal === 0 || sum.officialSubtotal) ? sum.officialSubtotal : null,
      finalGallons: (sum.finalGallons === 0 || sum.finalGallons) ? sum.finalGallons : null,
      grade: str(sum.grade), gradeLabel: str(sum.gradeLabel),
      preEvalSignal: str(sum.preEvalSignal) || str(pr.preEvalSignal),
      amenityLevel: str(sum.amenityLevel) || str(st.amenityLevel),
      pricingLevel: str(sum.pricingLevel) || str(st.pricingLevel),
      rewardsLevel: str(sum.rewardsLevel) || str(st.rewardsLevel),
      savedAt: str(p.savedAt)
    };
  };

  BDPG.onSaveProfile = function () {
    var name = BDPG.resolveProspectName() || prompt('Name this profile:');
    if (!name) return;
    // The prompt fallback above is otherwise a dead end: BDPG.displayName()
    // (used for both the record's `name` and `summary.name` below) only
    // ever reads through BDPG.resolveProspectName() (prospect.name /
    // supportingDetails.prospectName), so a typed prompt answer has to be
    // written back into state or it vanishes and every display falls back
    // to the literal "Prospect". Guard runs before the write below, so the
    // write can't make its own condition false.
    if (!BDPG.resolveProspectName()) {
      BDPG.state.prospect.name = name;
    }
    var profiles = BDPG.getSavedProfiles();

    // Re-saving a prospect that came from the tracker (or that this page
    // saved a moment ago) updates that record instead of appending another
    // one. The tracker's averages and its grade/signal distributions count
    // rows, so three rows for one prospect misreports the pipeline
    // threefold -- the natural "pull it up, refresh the numbers, save" loop
    // used to do exactly that.
    //
    // The binding is dropped the moment the displayed name stops matching
    // the record's: a rep who types a different prospect over the top of a
    // loaded one is starting a new record and must never overwrite the old
    // one. That errs toward an extra row (harmless, deletable) rather than
    // toward silent data loss.
    var idx = -1;
    if (BDPG.currentProfileId) {
      for (var i = 0; i < profiles.length; i++) {
        if (profiles[i].id === BDPG.currentProfileId) { idx = i; break; }
      }
      if (idx >= 0 && profiles[idx].name !== BDPG.displayName()) idx = -1;
    }

    // Nothing may be stored that describes a different input set than the
    // result it carries. By the time Save runs, that can only be true one
    // way -- an input changed after Generate, so invalidateResult() already
    // dropped the result -- and the two honest outcomes are "store it blank"
    // or "go back and Generate". Which one it is has to be the rep's call,
    // never a silent recompute of the number they last read on screen.
    if (!BDPG.state.result) {
      var prevSum = (idx >= 0 && profiles[idx].summary) ? profiles[idx].summary : null;
      var wouldBlankStoredFigures = !!prevSum &&
        (isNum(prevSum.officialSubtotal) || isNum(prevSum.finalGallons));
      if (BDPG.state.resultStale || wouldBlankStoredFigures) {
        var why = BDPG.state.resultStale
          ? 'An input changed after the last Generate, so there are no current results to save.'
          : 'No value profile has been generated since this prospect was loaded, so there are no current results to save.';
        if (!confirm(why + '\n\nSaving now stores this prospect with BLANK gallon figures and no grade.\n\n' +
                     'OK — save it blank.\nCancel — go back and click Generate Value Profile first.')) return;
      }
    }

    var snapshot = JSON.parse(JSON.stringify(BDPG.state));
    delete snapshot.result;
    delete snapshot.resultStale;
    var record = {
      id: idx >= 0 ? profiles[idx].id : 'bdpg_' + Date.now(),
      name: BDPG.displayName(),
      savedAt: new Date().toISOString(),
      state: snapshot,
      summary: BDPG.trackerSummary()
    };
    if (idx >= 0) profiles[idx] = record; else profiles.push(record);
    localStorage.setItem('roadysBDPGProfiles', JSON.stringify(profiles));
    BDPG.currentProfileId = record.id;
    toast(idx >= 0 ? 'Profile updated' : 'Profile saved');
    BDPG.render();
    // After the render, so step2Html()'s pricingLevel/amenityLevel defaults
    // are already settled and the baseline matches what is now on screen.
    BDPG.savedSig = BDPG.stateSig();
  };

  // Returns true only if the profile was actually loaded, so callers that
  // do more afterwards (onTrackerLoad's tab switch, onTrackerExport's
  // generate-and-print) stop when the rep declines.
  // `skipConfirm` is for callers that have already asked with a message of
  // their own -- never a way to skip the question altogether.
  BDPG.onLoadProfile = function (id, skipConfirm) {
    var profiles = BDPG.getSavedProfiles();
    var found = profiles.filter(function (p) { return p.id === id; })[0];
    if (!found) return false;
    // Loading replaces BDPG.state wholesale and there is no undo and no
    // history in roadysBDPGProfiles -- an in-progress prospect that was
    // never saved is simply gone. Ask first.
    if (!skipConfirm && !BDPG.confirmDiscard(
      'You have unsaved changes on the Potential Gallons tab.\n\n' +
      'Loading "' + (found.name || 'this prospect') + '" replaces them, and they cannot be recovered.\n\nContinue?')) return false;
    BDPG.state = JSON.parse(JSON.stringify(found.state));
    BDPG.state.result = null;
    // A deliberate load is not a stale result -- there is simply no result
    // yet. (And a record saved by an older build could carry the flag in its
    // snapshot; it must not resurrect a warning about someone else's edit.)
    BDPG.state.resultStale = false;
    BDPG.currentProfileId = found.id;
    // ── Migration guards for records saved by older builds ───────────────
    // These used to mix `=== undefined` and `!` from line to line; both were
    // correct for their own field, but the adjacency made the next one added
    // a coin flip. One rule now, no exceptions: each guard tests that the
    // field HAS THE TYPE it must have, never whether it is truthy. That keeps
    // a legitimate falsy value (preEvalOpen:false means the rep collapsed the
    // panel; gsName:'' means no name) and still replaces a missing field --
    // or a hand-edited one of the wrong type, which `=== undefined` would
    // have waved through into the DOM as "[object Object]".
    if (typeof BDPG.state.preEvalOpen !== 'boolean') BDPG.state.preEvalOpen = true;
    // A profile saved before the rewards term existed has no rewardsLevel;
    // one saved with a since-renamed label carries an orphan string. Both
    // resolve to the documented default here (and pricingLevel with it), so
    // the loaded record's stored numbers stay put and Step 2 shows the value
    // actually in force. See BDPG.normalizeLevels().
    BDPG.normalizeLevels();
    // A profile saved before Task 4 has no `prospect` at all -- default it
    // to the same empty shape the page starts with, so prospect-reading
    // code (the Step 0 card, the badge, trackerSummary) never throws on
    // a pre-Task-4 record.
    // (typeof null === 'object', hence both halves.)
    if (!BDPG.state.prospect || typeof BDPG.state.prospect !== 'object') {
      BDPG.state.prospect = { name: '', street: '', city: '', locationType: '', notes: '', gsName: '' };
    }
    // ...and then seed the name from the record itself. A pre-Task-4 record
    // carries the prospect's name at the TOP level (`found.name`) -- which is
    // exactly what the tracker row prints, via readSummary()'s `str(p.name)`
    // fallback -- but nothing copied it into the `prospect` shape above, so
    // resolveProspectName() returned '' and the record loaded anonymous.
    // Harmless before this branch (the name only appeared in an internal
    // header); now the hero, the packet <h1> and Copy Summary all read through
    // resolveProspectName(), so the same record exported a leave-behind headed
    // "Value Proposition for Prospect" while the row it was launched from said
    // "Old Record Diner".
    // `||`-chained, so a record that HAS a prospect.name keeps it -- this only
    // fills a blank. str-guarded like readSummary(): a hand-edited non-string
    // `name` must not reach escHtml() as "[object Object]".
    if (typeof BDPG.state.prospect.name !== 'string' || !BDPG.state.prospect.name) {
      BDPG.state.prospect.name = (typeof found.name === 'string' ? found.name : '');
    }
    // A profile saved before Task 10 has a `prospect` but no gsName. Default
    // it so the field renders empty rather than the literal "undefined", and
    // so summaryText()'s Prepared-by line stays absent instead of printing it.
    if (typeof BDPG.state.prospect.gsName !== 'string') BDPG.state.prospect.gsName = '';
    BDPG.render();
    BDPG.savedSig = BDPG.stateSig();
    return true;
  };

  BDPG.onDeleteProfile = function (id) {
    if (!confirm('Delete this saved profile?')) return;
    var profiles = BDPG.getSavedProfiles().filter(function (p) { return p.id !== id; });
    localStorage.setItem('roadysBDPGProfiles', JSON.stringify(profiles));
    if (BDPG.currentProfileId === id) {
      // What is on the calculator tab came from the record just deleted, so
      // it is no longer stored anywhere: drop the update binding (a later
      // Save must create a new record, not resurrect this id) and mark the
      // state as unsaved work. '' can never equal a real signature, so
      // hasUnsavedWork() reports true until the next Save or Load.
      BDPG.currentProfileId = null;
      BDPG.savedSig = '';
    }
    BDPG.render();
  };

  BDPG.activeTab = 'calc';
  BDPG.switchTab = function (name) {
    BDPG.activeTab = name;
    document.getElementById('bdpg-tab-calc').classList.toggle('active', name === 'calc');
    document.getElementById('bdpg-tab-prospects').classList.toggle('active', name === 'prospects');
    BDPG.render();
  };

  // Signal -> chip tone, mirrors the tones BDPG.preEval() itself assigns
  // (see the c7 overall-signal chip): Strong=green, Moderate=yellow, Review=red.
  BDPG.PREEVAL_SIGNAL_TONES = { Strong: 'green', Moderate: 'yellow', Review: 'red' };

  // Rewards posture -> chip/segment tone. Keyed by level name (matching
  // BDPG_CONFIG.REWARDS_LEVELS), not position, so this one map serves both
  // the tracker's Rewards column badge below and the Step 2 segmented
  // control's selected-background color (see rcol in step2Html) -- an
  // index-keyed array next to this would just invite the same reordering
  // hazard this map exists to avoid.
  //
  // CONSTRAINT ON THE VALUES, which nothing enforces at runtime: each tone
  // word is used in TWO different grammars and must be valid in both --
  //   * `var(--<tone>)`  -- the Step 2 segment background (rcol in step2Html)
  //   * `.tag-<tone>`    -- the tracker's Rewards badge class
  // and the two vocabularies are NOT the same set. `.tag-gray` exists while
  // `--gray` does not, which is exactly why the miss fallbacks are written
  // asymmetrically ('gray' for the class, a hardcoded var(--muted) for the
  // colour) instead of sharing one word. A fourth level whose tone word has
  // only one of the two definitions fails silently in the other place -- an
  // unstyled badge or a transparent segment, no console error. Before adding
  // one, confirm BOTH `--<tone>` (in :root AND the day-mode block) and
  // `.tag-<tone>` exist.
  BDPG.REWARDS_TONES = {
    "Participating in Roady's Rewards": 'green',
    'Undecided / unknown': 'yellow',
    'Not participating': 'red'
  };

  // Plain `[]` lookups on REGION_COLORS/GRADE_COLORS/PREEVAL_SIGNAL_TONES
  // would resolve a stored value of "constructor" or "toString" to an
  // inherited Object.prototype function instead of undefined, which then
  // blows up the caller (e.g. hexToRgba(fn, ...) calling fn.startsWith).
  // Requires hand-edited storage to reach, but the table must never break
  // on one bad cell, so every map lookup below goes through this.
  function hasOwn(obj, key) { return !!key && Object.prototype.hasOwnProperty.call(obj, key); }

  // Same reasoning, for the stored gallons values. BDPG.readSummary() only
  // screens out null/undefined, so a hand-edited record can hand the table a
  // string, an object or NaN. `!= null` would let all three through into
  // fmtGal() and print the literal "NaN" -- and in the diff-arrow chain a NaN
  // difference compares false against both `> 0` and `< 0` and lands on the
  // `else`, so corrupt data would render as the confident business claim
  // "No pricing adjustment". Every numeric cell tests the value itself with
  // the same guard trackerStatsHtml uses for the averages, and falls back to
  // the same "—" the rest of the table uses for missing data.
  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  // One row of the Prospects tracker, built entirely from BDPG.readSummary()
  // -- never from p.state/p.summary directly -- so a pre-Task-7 record
  // renders dashes instead of throwing or printing "undefined".
  BDPG.trackerRowHtml = function (p) {
    var sum = BDPG.readSummary(p);

    var typeBadge = sum.locationType
      ? ' <span class="badge tag-gray">' + BDPG.escHtml(sum.locationType) + '</span>' : '';
    var nameCell = BDPG.escHtml(sum.name) + typeBadge;

    var cityState = (!sum.city && !sum.stateCode) ? '—' :
      BDPG.escHtml(sum.city || '') + (sum.city && sum.stateCode ? ', ' : '') + BDPG.escHtml(sum.stateCode || '');
    // Only append the region chip when there's a real city/state to append it
    // to -- otherwise the cell could read "— Southeast", which defeats the
    // sort handler's exact `=== '—'` "dashes sort last" check (currently
    // unreachable since readSummary derives region from the same state field
    // as stateCode, but one line of defence costs nothing).
    var regionChip = '';
    if (cityState !== '—' && sum.region && hasOwn(BDPG.REGION_COLORS, sum.region)) {
      var rc = BDPG.REGION_COLORS[sum.region];
      regionChip = ' <span class="badge" style="background:' + hexToRgba(rc, 0.18) + ';color:' + rc + '">' +
        BDPG.escHtml(sum.region) + '</span>';
    }
    var locationCell = cityState + regionChip;

    var profileCell = (sum.profile && sum.roadway)
      ? BDPG.escHtml(sum.profile) + ' · ' + BDPG.escHtml(sum.roadway) : '—';

    var officialCell = isNum(sum.officialSubtotal) ? BDPG.fmtGal(sum.officialSubtotal) : '—';

    var finalCell = isNum(sum.finalGallons) ? BDPG.fmtGal(sum.finalGallons) : '—';
    if (isNum(sum.finalGallons) && isNum(sum.officialSubtotal)) {
      // finalGallons - officialSubtotal was purely the pricing delta before
      // this branch, and the tooltips said so. It is now pricing AND rewards,
      // and the two can pull in opposite directions -- measured on a saved row
      // with Aggressive (+2.5%) and Not participating (-5%), the old wording
      // read "Pricing posture removes 313 gal/mo" while pricing was in fact
      // ADDING 313 and rewards removing 626, with the row's own Pricing
      // Posture column contradicting it two cells to the right.
      //
      // The two non-zero branches are worded for what the number actually is
      // rather than split into GALLONS per term: a per-term gallon figure would
      // have to come from a stored pricingAdjusted (which no already-saved
      // record carries) or from re-multiplying the percentages, and a
      // re-multiplied step can land a gallon off the independently-rounded
      // engine figures -- the same rounding seam the waterfall's difference
      // form exists to avoid.
      //
      // The zero branch is different, and the first pass at this fix got it
      // wrong in exactly the way the original defect did. A zero DELTA is not
      // the same fact as zero ADJUSTMENTS: Most aggressive (+5%) with Not
      // participating (-5%) cancels to 13,000 == 13,000, and the row then said
      // "No pricing or rewards adjustment" while its own Pricing Posture and
      // Rewards columns both showed maximum magnitude. Two of the fifteen
      // pairings land here (the other is No discounts + Participating).
      //
      // Distinguishing them needs no stored figure and no gallon arithmetic --
      // only the two PERCENTAGES, which come straight from the config maps the
      // levels are keyed by. hasOwn-guarded like every other name-keyed lookup
      // in this file, falling back to 0 so a legacy row with no rewardsLevel
      // (or a hand-edited orphan string, already coerced to '' by
      // readSummary's str()) reads as the 0% it is actually computed at,
      // rather than printing undefined.
      var pPct = hasOwn(BDPG_CONFIG.PRICING_ADJUST, sum.pricingLevel) ? BDPG_CONFIG.PRICING_ADJUST[sum.pricingLevel] : 0;
      var rPct = hasOwn(BDPG_CONFIG.REWARDS_ADJUST, sum.rewardsLevel) ? BDPG_CONFIG.REWARDS_ADJUST[sum.rewardsLevel] : 0;
      function pctTxt(v) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; }
      var diff = sum.finalGallons - sum.officialSubtotal;
      if (diff > 0) {
        finalCell += ' <span style="color:var(--green)" title="Pricing and Rewards together add ' + BDPG.fmtGal(diff) + ' gal/mo above the published figure">▲</span>';
      } else if (diff < 0) {
        finalCell += ' <span style="color:var(--red)" title="Pricing and Rewards together remove ' + BDPG.fmtGal(Math.abs(diff)) + ' gal/mo below the published figure">▼</span>';
      } else if (pPct === 0 && rPct === 0) {
        finalCell += ' <span style="color:var(--muted)" title="No pricing or rewards adjustment">●</span>';
      } else if (pPct + rPct === 0) {
        finalCell += ' <span style="color:var(--muted)" title="Pricing ' + pctTxt(pPct) + ' and Rewards ' + pctTxt(rPct) + ' cancel out — no net change from the published figure">●</span>';
      } else {
        // Unreachable from real data -- a record whose stored gallons agree
        // while its two percentages do not sum to zero has been hand-edited
        // (every real save computes finalGallons through both terms). Kept as
        // its own branch anyway because "cancel out" would be a false
        // mechanism claim on, say, +2.5% and +0.0%, and this file's whole
        // stance is that corrupt input degrades to a true statement rather
        // than a confident wrong one. States the two percentages and the
        // observed net, and asserts nothing about why.
        finalCell += ' <span style="color:var(--muted)" title="Pricing ' + pctTxt(pPct) + ' and Rewards ' + pctTxt(rPct) + ' — no net change from the published figure">●</span>';
      }
    }

    var gradeCell = '—';
    if (sum.grade) {
      var gcol = hasOwn(BDPG.GRADE_COLORS, sum.grade) ? BDPG.GRADE_COLORS[sum.grade] : 'var(--muted)';
      gradeCell = '<span class="badge" title="' + BDPG.escHtml(sum.gradeLabel || '') + '" style="background:rgba(255,255,255,.08);color:' +
        gcol + ';border:1px solid ' + gcol + '">' + BDPG.escHtml(sum.grade) + '</span>';
    }

    var signalCell = '—';
    if (sum.preEvalSignal) {
      var tone = hasOwn(BDPG.PREEVAL_SIGNAL_TONES, sum.preEvalSignal) ? BDPG.PREEVAL_SIGNAL_TONES[sum.preEvalSignal] : 'gray';
      signalCell = '<span class="badge tag-' + tone + '">' + BDPG.escHtml(sum.preEvalSignal) + '</span>';
    }

    var amenityCell = sum.amenityLevel ? BDPG.escHtml(sum.amenityLevel) : '—';
    var pricingCell = sum.pricingLevel ? BDPG.escHtml(sum.pricingLevel) : '—';

    // Tone by posture, via the same hasOwn-guarded map style every other
    // lookup in this file uses, so a hand-edited value can't resolve to an
    // inherited Object.prototype member.
    var rewardsCell = '—';
    if (sum.rewardsLevel) {
      var rtone = hasOwn(BDPG.REWARDS_TONES, sum.rewardsLevel) ? BDPG.REWARDS_TONES[sum.rewardsLevel] : 'gray';
      rewardsCell = '<span class="badge tag-' + rtone + '">' + BDPG.escHtml(sum.rewardsLevel) + '</span>';
    }
    // "YYYY MM DD" sliced straight from the stored ISO string -- not
    // `new Date(...).toLocaleDateString()` -- for three reasons (see
    // task-8-ruling.md): (1) the shared sort handler's numeric-parse strips
    // whitespace but not "/" or "-", so this is the one digit-grouping that
    // collapses to a single chronologically-correct integer instead of
    // tying same-year or same-month rows; (2) slicing never produces the
    // literal string "Invalid Date" for a non-empty-but-unparseable value;
    // (3) it sidesteps the UTC-stored/local-rendered day-shift a Date
    // conversion could introduce for a timestamp saved late in the day.
    var savedCell = (typeof sum.savedAt === 'string' && sum.savedAt.length >= 10)
      ? sum.savedAt.slice(0, 10).replace(/-/g, ' ') : '—';

    // A record missing its id (unreachable from any real Save Profile,
    // which always writes 'bdpg_' + Date.now(), but hand-edited storage
    // could produce one) must not render action buttons that silently
    // no-op or, worse, consume a Delete confirmation and delete nothing.
    var pid = p.id || '';
    var actionsCell;
    if (pid) {
      // JSON.stringify + escaping only the HTML-attribute-delimiting `"`
      // (matching the existing onLocationType(...) pattern elsewhere in
      // this file) is what actually neutralizes an id containing a quote
      // inside this onclick="..." attribute -- HTML-entity-escaping the id
      // itself (BDPG.escHtml) would not, because the browser decodes
      // entities in the attribute value before compiling it as JS, so an
      // escaped `'` would decode right back into a string-breaking quote.
      var idJs = JSON.stringify(pid).replace(/"/g, '&quot;');
      actionsCell =
        '<button class="btn btn-accent" onclick="BDPG.onTrackerLoad(' + idJs + ')">Load</button> ' +
        '<button class="btn" onclick="BDPG.onTrackerExport(' + idJs + ')">Export Pitch Summary</button> ' +
        '<button class="btn" onclick="BDPG.onDeleteProfile(' + idJs + ')">Delete</button>';
    } else {
      actionsCell = '<span style="color:var(--muted);font-size:.8em">No id — can’t act</span>';
    }

    return '<tr>' +
      '<td>' + nameCell + '</td>' +
      '<td>' + locationCell + '</td>' +
      '<td>' + profileCell + '</td>' +
      '<td>' + officialCell + '</td>' +
