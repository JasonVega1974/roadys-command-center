<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bus Dev Potential Gallons — Roady's Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.0/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="../busDevGallonsConfig.js"></script>
<script src="../busDevGallonsCalculator.js"></script>
<style>
:root{
  --bg:#080C18;--surface:#0D1225;--surface2:#121830;--border:#1E2A45;--border2:#2A3A5C;
  --accent:#00C8FF;--green:#00D68F;--red:#FF4757;--yellow:#FFD60A;--orange:#FF6B35;
  --purple:#7C3AED;--teal:#0891B2;--text:#E8EDF8;--muted:#6B7A99;--dim:#3A4A6B;
  --ff:'Barlow Condensed','Arial Narrow',sans-serif;
  --fb:'DM Sans','Segoe UI',sans-serif;
}
body.day-mode{
  --bg:#F0F2F5;--surface:#FFFFFF;--surface2:#F7F8FA;--border:#D8DCE3;--border2:#C0C7D3;
  --accent:#0078D4;--green:#0B8A50;--red:#D32F2F;--yellow:#E6A800;--orange:#D4520A;
  --purple:#6528C7;--teal:#067A8B;--text:#1A1D24;--muted:#5A6170;--dim:#9AA0AD;
}
body.day-mode ::-webkit-scrollbar-track{background:#E8EBF0;}
body.day-mode ::-webkit-scrollbar-thumb{background:#C0C7D3;}
body.day-mode #bdpg-usa-svg path{stroke:#D8DCE3;}
body.day-mode .map-tooltip{background:rgba(255,255,255,.96);border-color:#D8DCE3;color:#1A1D24;}
*{box-sizing:border-box;margin:0;padding:0;}
html{color-scheme:dark;}
body.day-mode{color-scheme:light;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;}
select option{background:var(--surface);color:var(--text);}
body.day-mode select option{background:#FFFFFF;color:#1A1D24;}
a{color:var(--accent);text-decoration:none;}

body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);}
.bdpg-page-hd{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);}
.bdpg-page-title{font-family:var(--ff);font-size:1.4em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
.container{max-width:1500px;margin:0 auto;padding:18px 22px;}

.btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:5px;cursor:pointer;font-size:.75em;font-weight:600;letter-spacing:.04em;transition:all .15s;display:flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--border2);color:var(--text);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#000;}
.btn-accent:hover{opacity:.9;}
.badge{padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:700;letter-spacing:.05em;}

.fg label{display:block;font-size:.7em;color:var(--muted);margin-bottom:3px;}
.fg input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:.85em;}
.fg input:focus{outline:none;border-color:var(--accent);}

table th[data-sort]{cursor:pointer;user-select:none;position:relative;padding-right:18px!important;}
table th[data-sort]:hover{color:var(--accent);}
table th[data-sort]::after{content:'⇅';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:.65em;opacity:.4;}
table th[data-sort].sort-asc::after{content:'▲';opacity:.9;color:var(--accent);}
table th[data-sort].sort-desc::after{content:'▼';opacity:.9;color:var(--accent);}

.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sec-title{font-family:var(--ff);font-size:1.3em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}

.cg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.cg4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.cc-lbl{font-size:.7em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.cw{height:160px;position:relative;}

.tw{overflow-x:auto;margin-bottom:20px;}
.dt{width:100%;border-collapse:collapse;font-size:.88em;}
.dt th{background:var(--surface2);color:var(--muted);font-size:.78em;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.dt td{padding:8px 12px;border-bottom:1px solid rgba(30,42,69,.5);color:var(--text);}
.dt tr:hover td{background:rgba(255,255,255,.02);}
.dt td.up{color:var(--green);}
.dt td.dn{color:var(--red);}
.dt td.fl{color:var(--yellow);}
.bdpg-box{background:var(--bg2,rgba(255,255,255,.03));border:1px solid var(--border);border-radius:8px;padding:12px 14px}

/* ── Bus Dev Potential Gallons — wizard shell ── */
.bdpg-step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;position:relative;}
.bdpg-step.done{border-left:3px solid var(--green);}
.bdpg-step-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.bdpg-badge{width:28px;height:28px;flex:0 0 auto;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--ff);font-weight:800;font-size:1em;}
.bdpg-step.done .bdpg-badge{background:rgba(0,214,143,.15);border-color:var(--green);color:var(--green);}
.bdpg-step-title{font-family:var(--ff);font-size:1.15em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text);}
.bdpg-check{color:var(--green);font-size:.9em;font-weight:700;margin-left:auto;}
.bdpg-grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.bdpg-callout{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px;}
.bdpg-lbl{font-size:.7em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.bdpg-bcard{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;text-align:left;}
.bdpg-bcard:hover{border-color:var(--border2);transform:translateY(-1px);}
.bdpg-bcard.dim{opacity:.45;}
.bdpg-bcard.on{border-color:var(--accent);background:rgba(0,200,255,.08);box-shadow:0 0 14px rgba(0,200,255,.25);}
/* :not(.on) makes the "selected beats suggested" rule live in the CSS itself.
   Both selectors set border-color at equal specificity, so without it the
   winner is decided by source order, and the only reason a card never carries
   both classes is step1Html's `suggest = !on && …` boolean -- a JS guard one
   simplification away from turning a selected card yellow. */
.bdpg-bcard.suggest:not(.on){border-color:var(--yellow);box-shadow:0 0 10px rgba(255,214,10,.2);}
.bdpg-bcard-ico{font-size:1.3em;line-height:1;margin-bottom:6px;}
.bdpg-bcard-name{font-family:var(--ff);font-size:1em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text);}
.bdpg-bcard-sub{font-size:.72em;color:var(--muted);margin-top:2px;}
.bdpg-bcard-gal{font-family:var(--ff);font-size:1.35em;font-weight:800;color:var(--muted);margin-top:8px;}
.bdpg-bcard.on .bdpg-bcard-gal{color:var(--accent);}
.bdpg-rangebar{position:relative;height:8px;background:var(--surface);border:1px solid var(--border);border-radius:5px;margin-top:8px;}
.bdpg-rangebar-tick{position:absolute;top:-4px;width:3px;height:14px;background:var(--accent);border-radius:2px;}
.bdpg-rangebar-ends{display:flex;justify-content:space-between;font-size:.66em;color:var(--muted);margin-top:4px;}
#bdpg-usa-svg{width:100%;height:auto;display:block;}
#bdpg-usa-svg path{cursor:pointer;stroke:#0A0E1A;stroke-width:.5;transition:all .15s;}
#bdpg-usa-svg path:hover{opacity:.85;stroke-width:1.5;stroke:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.3));}
#bdpg-usa-svg path.sel{stroke:var(--accent);stroke-width:2.2;filter:drop-shadow(0 0 7px rgba(0,200,255,.7));}
#bdpg-usa-svg path.nomap{cursor:default;}
/* .nomap paths (AK, HI, DC -- states with no network region) would otherwise
   inherit the generic path:hover glow above, which reads as "clickable" even
   though onclick is a no-op for them. Opt them back out of the hover styling
   while leaving the tooltip in place -- it usefully explains why nothing
   happens. */
#bdpg-usa-svg path.nomap:hover{opacity:1;stroke-width:.5;stroke:#0A0E1A;filter:none;}
body.day-mode #bdpg-usa-svg path.nomap:hover{stroke:#D8DCE3;}
.bdpg-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.bdpg-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.72em;}
.bdpg-chip.on{border-color:var(--accent);box-shadow:0 0 10px rgba(0,200,255,.3);}
.bdpg-chip-dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.bdpg-chip-name{font-weight:700;color:var(--text);}
.bdpg-chip-meta{color:var(--muted);}
.bdpg-2col{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;}
@media(max-width:1000px){.bdpg-2col{grid-template-columns:1fr;}}
.bdpg-seg{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.bdpg-seg button{flex:1;background:var(--surface2);border:none;border-right:1px solid var(--border);color:var(--muted);padding:9px 4px;font-family:var(--fb);font-size:.68em;font-weight:700;cursor:pointer;transition:all .15s;line-height:1.3;}
.bdpg-seg button:last-child{border-right:none;}
.bdpg-seg button:hover{color:var(--text);}
/* #000 (not a --token) matches the project convention used for text on every
   other saturated accent-colored button/badge in this file (e.g. .btn-accent
   above, the map's TAP TO REDEEM chip) -- it has to stay dark regardless of
   theme since the segmented button's "on" background cycles through green,
   yellow, orange and red in both day and night mode, and no --root token
   evaluates to a theme-stable dark. */
.bdpg-seg button.on{color:#000;}
.bdpg-stars{font-size:1.15em;letter-spacing:2px;color:var(--yellow);}
.bdpg-star-half{position:relative;display:inline-block;}
.bdpg-star-half>span{position:absolute;left:0;top:0;width:50%;overflow:hidden;}
.bdpg-acard{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px;cursor:pointer;text-align:center;transition:all .15s;}
.bdpg-acard:hover{border-color:var(--border2);}
.bdpg-acard.set{border-color:var(--accent);background:rgba(0,200,255,.07);}
.bdpg-acard-ico{font-size:1.4em;line-height:1;}
.bdpg-acard-f{font-size:.64em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:5px;}
.bdpg-acard-v{font-size:.76em;font-weight:700;color:var(--text);margin-top:3px;min-height:1.1em;}
.bdpg-acard:not(.set) .bdpg-acard-v{color:var(--dim);}
.bdpg-go{width:100%;padding:15px;margin:16px 0;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:var(--ff);font-size:1.3em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.bdpg-go:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 0 22px rgba(0,200,255,.45);}
.bdpg-go:disabled{opacity:.45;cursor:not-allowed;background:var(--surface2);color:var(--muted);}
.bdpg-results{animation:bdpgIn .22s ease-out;}
@keyframes bdpgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bdpg-hero{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;}
@media(max-width:820px){.bdpg-hero{grid-template-columns:1fr;}}
.bdpg-hero-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
.bdpg-hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.bdpg-hero-card.final::before{background:var(--accent);}
.bdpg-hero-card.official::before{background:var(--muted);}
.bdpg-hero-num{font-family:var(--ff);font-weight:800;line-height:1;}
.bdpg-hero-card.final .bdpg-hero-num{font-size:3.2em;color:var(--accent);}
.bdpg-hero-card.official .bdpg-hero-num{font-size:2.2em;color:var(--text);}
.bdpg-grade{text-align:center;padding:16px;border-radius:10px;border:1px solid var(--border);}
.bdpg-grade-l{font-family:var(--ff);font-size:3.4em;font-weight:800;line-height:1;}
.bdpg-grade-lbl{font-family:var(--ff);font-size:1em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}
.bdpg-nrange{position:relative;height:30px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin:10px 0 4px;}
.bdpg-nrange-m{position:absolute;top:-5px;height:40px;width:3px;border-radius:2px;}
/* When pricing is Standard AND rewards is Undecided / unknown -- i.e. every
   adjustment outside the official subtotal is 0% -- officialSubtotal ===
   finalGallons and both markers land at the identical left%. A small
   opposite-direction nudge keeps both visible edge-to-edge instead of the
   cyan Final marker fully eclipsing the Official one -- harmless at any
   other position too, since it's a couple px against a track hundreds of
   px wide. (Pricing alone was the whole condition before the rewards term
   existed; both have to be neutral now.) */
.bdpg-nrange-m.final{background:var(--accent);box-shadow:0 0 8px rgba(0,200,255,.7);transform:translateX(1.5px);}
.bdpg-nrange-m.official{background:var(--text);opacity:.85;transform:translateX(-1.5px);}
.bdpg-nrange-key{display:flex;gap:16px;font-size:.7em;color:var(--muted);margin-top:8px;}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.68em;font-weight:700;letter-spacing:.04em;}
.tag-green{background:rgba(0,214,143,.15);color:var(--green);}
.tag-red{background:rgba(255,71,87,.15);color:var(--red);}
.tag-yellow{background:rgba(255,214,10,.15);color:var(--yellow);}
.tag-blue{background:rgba(0,200,255,.15);color:var(--accent);}
.tag-orange{background:rgba(255,107,53,.15);color:var(--orange);}
.tag-gray{background:rgba(107,122,153,.15);color:var(--muted);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:.82em;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;}
.toast.show{opacity:1;}
.toast.tok{border-color:var(--green);color:var(--green);}
.toast.terr{border-color:var(--red);color:var(--red);}

.map-tooltip { position:fixed; background:rgba(8,12,24,.95); border:1px solid var(--border2); border-radius:8px; padding:10px 14px; font-size:.78em; pointer-events:none; z-index:9999; display:none; min-width:160px; }
.map-tooltip-state { font-family:var(--ff); font-size:1.1em; font-weight:800; letter-spacing:.06em; margin-bottom:4px; }
.map-tooltip-row { display:flex; justify-content:space-between; gap:16px; color:var(--muted); margin-top:2px; }
.map-tooltip-val { color:var(--text); font-weight:600; }

.impl-sub-tab{padding:9px 20px;border:none;border-bottom:3px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:.88em;font-weight:600;transition:.15s;margin-bottom:-2px;}
.impl-sub-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.impl-sub-tab:hover{color:var(--text);}
.bdpg-subtabs{display:flex;gap:4px;padding:0 22px;border-bottom:2px solid var(--border);background:var(--surface);}

/* Bus Dev Potential Gallons — Export Pitch Summary.
   Gated on body.bdpg-print-mode (set by BDPG.onExportPdf, cleared on
   'afterprint') rather than unconditionally, so a plain browser File > Print
   keeps behaving normally -- only a print triggered through the Export Pitch
   Summary button gets caught by these rules.
   The dashboard-only selectors this block used to carry (.sidebar, .topbar,
   .page, #pg-bus-dev-potential-gallons) came over verbatim with the
   extraction and match 0 elements on this standalone page; they were removed
   rather than left reading as load-bearing. #toast is kept: this page does
   have one. */
@media print {
  body.bdpg-print-mode #toast { display: none !important; }
  /* The app chrome (page title bar, Potential Gallons / Prospects tabs) sits
     outside #bdpg-content, so the rules below never reached it and it printed
     as a navigation band across the top of a document handed to a prospect. */
  body.bdpg-print-mode > *:not(#bdpg-content) { display: none !important; }
  /* html carries its own background:var(--bg) (see the :root block), so body's
     white does NOT propagate to the print canvas -- everything past the first
     viewport-height prints on the dark app background.
     This needs a class ON html, not html:has(body.bdpg-print-mode): a missing
     :has() would make the selector no-op silently, and the failure mode is a
     packet printed on a dark ground with no error to notice. onExportPdf()
     and the 'afterprint' handler already toggle body.bdpg-print-mode, so they
     set and clear this one in the same two places -- same gate, one mechanism,
     no selector-support question. */
  html.bdpg-print-mode { background: #fff !important; }
  /* #bdpg-print-only is built by resultsWrapHtml(), so it lives one level
     down inside #bdpg-results-wrap -- not as a direct child of #bdpg-content.
     Hiding every #bdpg-content child except #bdpg-print-only therefore hid
     the wrap, and display:block on a descendant cannot resurrect a hidden
     ancestor: the packet printed as a blank page. Both levels have to be
     walked -- exempt the wrap here, then hide the on-screen results inside
     it below. The #bdpg-print-only exemption is kept in the first rule so
     the block still prints if it is ever hoisted to the top level. */
  body.bdpg-print-mode #bdpg-content > *:not(#bdpg-print-only):not(#bdpg-results-wrap) { display: none !important; }
  body.bdpg-print-mode #bdpg-results-wrap > *:not(#bdpg-print-only) { display: none !important; }
  body.bdpg-print-mode #bdpg-results-wrap { display: block !important; }
  body.bdpg-print-mode #bdpg-print-only { display: block !important; }
  body.bdpg-print-mode { background: #fff !important; color: #000 !important; }
  body.bdpg-print-mode #bdpg-print-only .bdpg-box { border: 1px solid #999 !important; page-break-inside: avoid; }
  /* The hero card reuses the on-screen classes so the print layout stays in
     lockstep with the pitch markup, but the glow/accent styling those classes
     carry on-screen (box-shadow, var(--accent) text) has to become plain
     black-on-white with a border for a leave-behind.
     The grade-badge and network-range rules this block used to carry were
     removed with Task 10: the packet is prospect-facing and no longer renders
     .bdpg-grade or .bdpg-nrange at all, so those selectors matched nothing. */
  body.bdpg-print-mode #bdpg-print-only .bdpg-hero-card { background: #fff !important; border: 1px solid #999 !important; page-break-inside: avoid; }
  body.bdpg-print-mode #bdpg-print-only .bdpg-hero-card::before { display: none !important; }
  body.bdpg-print-mode #bdpg-print-only .bdpg-hero-num,
  body.bdpg-print-mode #bdpg-print-only .bdpg-lbl { color: #000 !important; }
  /* The pitch sections come from BDPG.pitchSectionsHtml(), which is written
     for the dark UI and carries inline color:var(--accent) / var(--muted) /
     var(--border). On white those resolve to #00C8FF (under 2:1) and #6B7A99
     -- a pale smear on the largest numbers an owner is meant to read. An
     inline style can only be beaten by !important, and there is no selector
     for "elements whose inline style mentions --accent", so re-point the
     tokens themselves for the duration of the packet. Repainting the palette
     rather than the rules is also what keeps this from having to be updated
     every time a pitch section adds a colored element.
     Only the color tokens are re-pointed: --ff / --fb are fonts and must
     survive. */
  body.bdpg-print-mode #bdpg-print-only {
    --accent: #000; --text: #000; --muted: #555;
    --bg: #fff; --surface: #fff; --surface2: #fff;
    --border: #999; --border2: #999;
  }
}
#bdpg-print-only { display: none; }
</style>
</head>
<body>
  <div class="bdpg-page-hd">
    <div class="bdpg-page-title">⛽ Bus Dev Potential Gallons</div>
    <div style="flex:1"></div>
    <button class="btn" onclick="BDPG.toggleTheme()">🌙</button>
  </div>
  <div class="bdpg-subtabs">
    <button id="bdpg-tab-calc" class="impl-sub-tab active" onclick="BDPG.switchTab('calc')">⛽ Potential Gallons</button>
    <button id="bdpg-tab-prospects" class="impl-sub-tab" onclick="BDPG.switchTab('prospects')">📋 Prospects</button>
  </div>
  <div class="container" id="bdpg-content"></div>
  <div class="toast" id="toast"></div>
<script>
// restore saved theme before first render
try { if (localStorage.getItem('roadysBDPGTheme') === 'day') document.body.classList.add('day-mode'); } catch (e) {}

// Charts
const CHS={};
const CDO={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6B7A99',font:{size:10},boxWidth:12}}},scales:{x:{ticks:{color:'#6B7A99',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#6B7A99',font:{size:9}},grid:{color:'rgba(255,255,255,.05)'}}}};
function mkchart(id,cfg){
  try{if(CHS[id])CHS[id].destroy();const c=document.getElementById(id);if(!c||typeof Chart==='undefined')return;CHS[id]=new Chart(c,cfg);}catch(e){console.warn('chart err',id,e);}
}

function toast(msg,type='tok'){
  const t=document.getElementById('toast');
  t.textContent=(type==='tok'?'✓ ':'⚠ ')+msg;
  t.className='toast show '+type;

let STATE_PATHS = {}; // Will be populated from topojson
let usTopoLoaded = false;
let usTopoPromise = null;

function loadUSTopojson(){
  if(usTopoPromise) return usTopoPromise;
  usTopoPromise = fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    .then(r=>r.json())
    .then(us=>{
      const states = topojson.feature(us, us.objects.states);
      const projection = d3.geoAlbersUsa().fitSize([900, 550], states);
      const path = d3.geoPath().projection(projection);
      states.features.forEach(f=>{
        const fips = String(f.id).padStart(2,'0');
        const abbr = FIPS_TO_STATE[fips];
        if(abbr){
          const d = path(f);
          if(d) STATE_PATHS[abbr] = d;
        }
      });
      usTopoLoaded = true;
      return STATE_PATHS;
    })
    .catch(e=>{
      console.error('Failed to load US topojson:', e);
      usTopoLoaded = false;
    });
  return usTopoPromise;
}

function hexToRgba(hex, alpha){
  if(hex.startsWith('rgb')) return hex.replace(')',`,${alpha})`).replace('rgb(','rgba(');
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function getCentroid(pathStr, axis){
  // Parse all numeric coordinates from the path
  const parts = pathStr.split(/[MLZCQASTHVmlzcqasthv,\s]+/).filter(s=>s&&!isNaN(parseFloat(s)));
  const nums = parts.map(Number);
  // Extract x,y pairs (skip single values from H/V commands by pairing sequentially)
  let xs=[], ys=[];
  for(let i=0;i<nums.length-1;i+=2){ xs.push(nums[i]); ys.push(nums[i+1]); }
  if(xs.length===0) return 0;
  // Use bounding box center
  if(axis==='x') return (Math.min(...xs)+Math.max(...xs))/2;
  return (Math.min(...ys)+Math.max(...ys))/2;
}

// ═══════════════════════════════════════════════
// SORTABLE TABLES — event delegation (survives re-renders)
// ═══════════════════════════════════════════════
(function(){
  // Single delegated click handler on document for all table headers
  document.addEventListener('click',function(e){
    const th=e.target.closest('table.dt thead th, table.sortable thead th');
    if(!th) return;
    const tbl=th.closest('table');
    if(!tbl) return;
    const thead=th.closest('thead');
    if(!thead) return;
    // Skip toggle columns (width:50px)
    if(th.style.width==='50px') return;
    const ths=Array.from(thead.querySelectorAll('th'));
    const ci=ths.indexOf(th);
    if(ci<0) return;
    const tbody=tbl.querySelector('tbody');
    if(!tbody) return;
    const rows=Array.from(tbody.querySelectorAll('tr'));
    if(rows.length===0) return;

    const wasAsc=th.classList.contains('sort-asc');
    ths.forEach(t=>t.classList.remove('sort-asc','sort-desc'));
    th.classList.add(wasAsc?'sort-desc':'sort-asc');
    const dir=wasAsc?-1:1;

    rows.sort((a,b)=>{
      const ac=a.cells[ci], bc=b.cells[ci];
      if(!ac||!bc) return 0;
      let av=ac.textContent.trim(), bv=bc.textContent.trim();
      // N/A and — always sort last
      const aNA=(av==='N/A'||av==='—'||av===''), bNA=(bv==='N/A'||bv==='—'||bv==='');
      if(aNA&&!bNA) return 1;
      if(bNA&&!aNA) return -1;
      if(aNA&&bNA) return 0;
      // Try numeric: strip $, commas, %, K, M, arrows, spaces
      const an=parseFloat(av.replace(/[,$%▲▼●KM—\s]/g,'')),
            bn=parseFloat(bv.replace(/[,$%▲▼●KM—\s]/g,''));
      if(!isNaN(an)&&!isNaN(bn)) return (an-bn)*dir;
      // Alphabetical
      return av.localeCompare(bv,undefined,{numeric:true,sensitivity:'base'})*dir;
    });
    rows.forEach(r=>tbody.appendChild(r));
  });

  // Add data-sort attribute to all table headers for CSS styling (cursor, arrows)
  function markSortableHeaders(){
    document.querySelectorAll('table.dt thead th, table.sortable thead th').forEach(th=>{
      if(th.style.width==='50px') return;
      if(!th.hasAttribute('data-sort')) th.setAttribute('data-sort','');
    });
  }

  // Run on page changes and periodically catch new tables
  const _obsTarget=document.querySelector('.main')||document.body;
  const _obs=new MutationObserver(()=>{ markSortableHeaders(); });
  _obs.observe(_obsTarget,{childList:true,subtree:true});
  setTimeout(markSortableHeaders,300);
})();

  BDPG.onNetworkContextCsvCompute = function () {
    var h = BDPG.ncCsv.headers;
    var idx = {
      company: h.indexOf('Company'), name: h.indexOf('Name'), type: h.indexOf('Type'),
      group: h.indexOf('Group'), state: h.indexOf('State'), status: h.indexOf('Status')
    };
    var byRegion = {};
    ['West', 'Southwest', 'Midwest', 'Northeast', 'Southeast'].forEach(function (r) {
      byRegion[r] = { total: 0, byType: {}, byGroup: {}, byTypeGroup: {} };
    });

    BDPG.ncCsv.rows.forEach(function (row) {
      var status = (row[idx.status] || '').trim().toLowerCase();
      var company = (row[idx.company] || '').toLowerCase();
      var name = (row[idx.name] || '').toLowerCase();

      if (company.indexOf('demo') !== -1 || name.indexOf('demo') !== -1) return;

      var region = BusDevGallonsCalc.resolveRegion(row[idx.state]);
      if (!region) return;
      var type = (row[idx.type] || '').trim() || 'Unknown';
      var group = (row[idx.group] || '').trim() || 'Unknown';

      rd.byType[type] = (rd.byType[type] || 0) + 1;
      rd.byGroup[group] = (rd.byGroup[group] || 0) + 1;

    // above BDPG.ncCsv) -- reset now that the result is rendered, matching
    // the sibling BDPG.onRegionCsvCompute reset below.
    BDPG.ncCsv = { rows: null, headers: [] };
  };

  // Minimal CSV line parser (no library). Handles a quoted field containing a
  // comma or an escaped `""` inside quotes; not a full RFC 4180 parser (no
  // embedded newlines inside a quoted field), which is fine for the simple
  // per-location gallons/state exports this feeds.
  BDPG.parseCsv = function (text) {
    // Strip a leading UTF-8 BOM -- an Excel export otherwise makes the first
    // header read as "﻿Company", which breaks exact indexOf() header
    // matching in both CSV consumers (network-context generator, region CSV).
    text = text.replace(/^﻿/, '');
    var lines = text.replace(/\r\n/g, '\n').split('\n').filter(function (l) { return l.length; });
    return lines.map(function (line) {
      var out = [], cur = '', inQ = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; continue; }
          inQ = !inQ;
          continue;
        }
        if (c === ',' && !inQ) { out.push(cur); cur = ''; continue; }
        cur += c;
      }
      out.push(cur);
      return out;
    });
  };

  // Uploaded rows live only in memory for the duration of the mapping +
  // compute step. They are never written to localStorage or sent anywhere —
  // only the five resulting percentages (plus asOf) are persisted, and this
  // object is reset back to empty immediately after BDPG.onRegionCsvCompute
  // finishes, win or lose. See CLAUDE.md privacy note for gs-travel-planner-
  // style handling of anything that could be internal business data.
  BDPG.regionCsv = { rows: null, headers: [], stateCol: '', gallonsCol: '' };

  BDPG.regionCsvHtml = function () {
    if (!BDPG.regionCsv.headers.length) {
      return '<div class="fg" style="margin-top:14px"><label>Optional: compute Region % from an Interstate export (per-location gallons + state)</label>' +
        '<input type="file" accept=".csv" onchange="BDPG.onRegionCsvFile(this)"></div>';
    }
    var h = BDPG.regionCsv.headers;
    function opt(v, selected) { return '<option value="' + BDPG.escHtml(v) + '"' + (selected ? ' selected' : '') + '>' + BDPG.escHtml(v) + '</option>'; }
    return '<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px">' +
      '<div style="font-size:.8em;margin-bottom:6px">Which column is <b>State</b>? ' +
        '<select id="bdpg-csv-state-col" onchange="BDPG.regionCsv.stateCol=this.value">' +
          h.map(function (col) { return opt(col, col === BDPG.regionCsv.stateCol); }).join('') + '</select></div>' +
      '<div style="font-size:.8em;margin-bottom:6px">Which column is <b>Gallons</b>? ' +
        '<select id="bdpg-csv-gal-col" onchange="BDPG.regionCsv.gallonsCol=this.value">' +
          h.map(function (col) { return opt(col, col === BDPG.regionCsv.gallonsCol); }).join('') + '</select></div>' +
      '<button class="btn btn-accent" onclick="BDPG.onRegionCsvCompute()">Compute Region %</button>' +
      '<div id="bdpg-csv-result" style="margin-top:8px;font-size:.8em"></div>' +
    '</div>';
  };

  BDPG.onRegionCsvFile = function (input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = BDPG.parseCsv(String(reader.result));
      if (!rows.length) return;
      BDPG.regionCsv.headers = rows[0];
      BDPG.regionCsv.rows = rows.slice(1);
      BDPG.regionCsv.stateCol = rows[0].filter(function (col) { return /state/i.test(col); })[0] || rows[0][0];
      BDPG.regionCsv.gallonsCol = rows[0].filter(function (col) { return /gallon/i.test(col); })[0] || rows[0][0];
      BDPG.render();
    };
    reader.readAsText(file);
  };

  BDPG.onRegionCsvCompute = function () {
    var headers = BDPG.regionCsv.headers;
    var stateIdx = headers.indexOf(BDPG.regionCsv.stateCol);
    var galIdx = headers.indexOf(BDPG.regionCsv.gallonsCol);
    var sums = {}, counts = {};
    var netSum = 0, netCount = 0;

    BDPG.regionCsv.rows.forEach(function (row) {
      var st = (row[stateIdx] || '').trim().toUpperCase();
      var gal = Number(row[galIdx]);
      var region = BusDevGallonsCalc.resolveRegion(st);
      if (!region || !isFinite(gal)) return;
      sums[region] = (sums[region] || 0) + gal;
      counts[region] = (counts[region] || 0) + 1;
      netSum += gal;
      netCount += 1;
    });

    if (!netCount) {
      document.getElementById('bdpg-csv-result').textContent = 'No usable rows found — check the column mapping.';
      return;
    }

    var networkAvg = netSum / netCount;
    var out = { west: 0, southwest: 0, midwest: 0, northeast: 0, southeast: 0, asOf: (new Date()).toISOString().slice(0, 7) };
    Object.keys(sums).forEach(function (region) {
      var regionAvg = sums[region] / counts[region];
      var pct = Math.round(((regionAvg / networkAvg) - 1) * 1000) / 10;
      out[region.toLowerCase()] = pct;
    });

    localStorage.setItem('roadysBDPGRegionOverride', JSON.stringify(out));
    BDPG.regionVariance.override = out;
    // Third writer of the region % set (with onSaveRegionOverride and
    // onClearRegionOverride) -- same reason it has to invalidate.
    BDPG.invalidateResult();
    BDPG.regionCsv = { rows: null, headers: [], stateCol: '', gallonsCol: '' };
    // BDPG.render() rebuilds adminPanelHtml()'s innerHTML wholesale, and with
    // regionCsv.headers now empty it reverts to the plain file-input markup
    // (no #bdpg-csv-result element in it) — that's the whole point, it's the
    // proof the uploaded rows were discarded rather than left mapped on
    // screen. So the confirmation message has to be set on the OLD DOM
    // before render() replaces it; setting it after would hit a null element.
    var resultEl = document.getElementById('bdpg-csv-result');
    if (resultEl) resultEl.textContent = 'Computed and saved locally: ' + JSON.stringify(out);
    BDPG.render();
  };

  BDPG.escHtml = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  BDPG.fmtGal = function (n) { return Math.round(n).toLocaleString(); };

  // Step cards are built by every step-rendering function; keeping the chrome in
  // one helper is what stops the three cards from drifting apart visually.
  BDPG.stepCardOpen = function (num, title, isDone) {
    // Indexed by num directly (⓪=0 … ③=3) rather than num-1, so the Task 4
    // Prospect Profile card (num 0) gets a real glyph instead of falling
    // through to String(num) === "0". The three pre-existing call sites keep
    // passing num 1/2/3 unchanged and still land on ①/②/③.
    var glyph = ['⓪', '①', '②', '③'][num] || String(num);
    return '<div class="bdpg-step' + (isDone ? ' done' : '') + '" id="bdpg-step-card-' + num + '">' +
      '<div class="bdpg-step-hd">' +
        '<div class="bdpg-badge">' + glyph + '</div>' +
        '<div class="bdpg-step-title">' + BDPG.escHtml(title) + '</div>' +
        (isDone ? '<div class="bdpg-check">✓</div>' : '') +
      '</div>';
  };
  BDPG.stepCardClose = function () { return '</div>'; };

  // Flips one step card's "done" styling (left border + checkmark) without a
  // full BDPG.render() -- shared by every targeted DOM patch that can change
  // a card's completion state while the user is mid-keystroke elsewhere
  // (Step 2's typed state field, the Prospect Profile card's fields).
  BDPG.updateStepCardBadge = function (num, isDone) {
    var card = document.getElementById('bdpg-step-card-' + num);
    if (!card) return;
    card.classList.toggle('done', isDone);
    var hd = card.querySelector('.bdpg-step-hd');
    var check = hd ? hd.querySelector('.bdpg-check') : null;
    if (isDone && hd && !check) {
      hd.insertAdjacentHTML('beforeend', '<div class="bdpg-check">✓</div>');
    } else if (!isDone && check) {
      check.remove();
    }
  };

  // Step completion: Step 1 done when profile+roadway resolve to a real baseline
  // row; Step 2 done when the typed/clicked state resolves to a known region.
  BDPG.step1Done = function () {
    var s = BDPG.state;
    return !!(s.profile && s.roadway && BusDevGallonsCalc.getBaselineRow(s.profile, s.roadway));
  };
  BDPG.step2Done = function () {
    return !!(BDPG.state.state && BusDevGallonsCalc.resolveRegion(BDPG.state.state));
  };

  BDPG.LOCATION_TYPES = ['Truck Stop', 'Fuel Stop', 'Service Center', 'Truck Stop / Service Center', 'C-Store'];

  // Prospect Profile (⓪) done when the three required fields are filled. State
  // is BDPG.state.state itself -- there is no prospect.state -- so this stays
  // true the instant the same field Step 2's map/typed-fallback write is set.
  BDPG.prospectDone = function () {
    var p = BDPG.state.prospect;
    return !!(p.name && p.city && BDPG.state.state);
  };

  // Single source of the prospect-name precedence: the ⓪ card's name first,
  // then the older Step 3 "Prospect Name" field (pre-Task-4 data), else ''.
  // Every caller (displayName(), pitchHeroHtml(), and any future one such as
  // the print packet) must resolve the name through this helper rather than
  // re-reading prospect.name / supportingDetails.prospectName directly --
  // otherwise the hero, the print header and the tracker could disagree about
  // who the prospect is. Returns the raw name with no fallback wording of its
  // own: callers differ only in what they show when it's empty (see below).
  BDPG.resolveProspectName = function () {
    return BDPG.state.prospect.name || BDPG.state.supportingDetails.prospectName || '';
  };

  // Single place every prospect-name display reads from, so results/export/
  // summary can never show a different name than the ⓪ card holds. 'Prospect'
  // reads fine as a heading, which is why this fallback differs from
  // pitchHeroHtml()'s -- see resolveProspectName().
  BDPG.displayName = function () {
    return BDPG.resolveProspectName() || 'Prospect';
  };

  // City/State counterpart to displayName(), for the print header and Copy
  // Summary. Both used to read only Step 3's older, optional
  // supportingDetails.prospectCity/prospectState -- but the ⓪ Prospect
  // Profile card now carries a *required* City and State, so a rep who fills
  // the required fields and skips Step 3's duplicates got a packet headed
  // "Pilot Travel Center — , ", which reads as a rendering bug on a
  // prospect-facing leave-behind. Same precedence as displayName(): the ⓪
  // card first, Step 3 as fallback. State comes from BDPG.state.state (what
  // the ⓪ card's State field actually writes, via onStateInput), not
  // prospect.stateCode, which nothing sets. Returns '' when both halves are
  // empty so callers can drop the separator entirely rather than print a
  // dangling dash and comma.
  BDPG.displayLocation = function () {
    var city = BDPG.state.prospect.city || BDPG.state.supportingDetails.prospectCity || '';
    var st = BDPG.state.state || BDPG.state.supportingDetails.prospectState || '';
    if (!city && !st) return '';
    return city + (city && st ? ', ' : '') + st;
  };

  // Continuous text fields: write state, refresh the Generate button when a
  // required field just changed, and keep the ⓪ badge current -- never a
  // full BDPG.render() (that would steal focus mid-word).
  BDPG.onProspectInput = function (field, value) {
    BDPG.state.prospect[field] = value;
    // The rendered hero names the prospect, and the packet reads live state at
    // export -- so a name typed after Generate has to reach the already-drawn
    // hero or the screen and the leave-behind disagree. Targeted patch only.
    if (field === 'name') BDPG.refreshPitchHero();
    if (field === 'name' || field === 'city') {
      var btn = document.getElementById('bdpg-generate-btn');
      if (btn) { btn.outerHTML = BDPG.generateButtonHtml(); }
      // Name/city are two of the Pre-Evaluation panel's four prerequisites --
      // refresh it so the "what's missing" prompt clears the instant the last
      // one is filled, without stealing focus via a full BDPG.render().
      BDPG.refreshPreEvalCard();
    }
    BDPG.updateStepCardBadge(0, BDPG.prospectDone());
  };

  // Location Type -> Step 1 baseline coupling. Fuel Stop auto-selects a
  // baseline card; Service Center / Truck Stop-Service Center only suggest
  // (outline, no selection); Truck Stop / C-Store couple to nothing. This
  // lives ONLY in the change handler, never in a render path -- a manual
  // card click (BDPG.onBaselineCardClick) always overrides it, and the only
  // way that can hold is if this logic fires once, on change, not on every
  // re-render.
  BDPG.LOCTYPE_PROFILE = {
    'Fuel Stop':                   { auto: 'Fuel stop', roadway: 'Any' },
    'Service Center':              { suggest: ['Medium truck stop', 'Large truck stop'] },
    'Truck Stop / Service Center': { suggest: ['Medium truck stop', 'Large truck stop'] }
  };

  BDPG.onLocationType = function (v) {
    var s = BDPG.state;
    s.prospect.locationType = v;
    var rule = BDPG.LOCTYPE_PROFILE[v];
    s.autoSetNote = '';
    s.suggestProfiles = [];
    if (rule && rule.auto) {
      // The ⓪ card's only coupling into the engine: this is the one branch
      // where picking a Location Type rewrites Step 1's baseline, so it is
      // the one branch that can strand a generated result. A `suggest` rule
      // (below) only outlines cards and changes no input.
      if (s.profile !== rule.auto || s.roadway !== rule.roadway) BDPG.invalidateResult();
      s.profile = rule.auto; s.roadway = rule.roadway;
      s.autoSetNote = v + ' type selected — baseline auto-set.';
    } else if (rule && rule.suggest) {
      s.suggestProfiles = rule.suggest;
    }
    BDPG.render();
  };

  // ── Pre-Evaluation panel (spec §4.5) ──────────────────────────────────
  // Read-only summary computed from data the tool already has (region map,
  // network-context.json, region_variance.json, BASELINE_TABLE). Never
  // writes anything the calculator consumes -- the only state it touches is
  // BDPG.state.prospect.preEvalSignal (for the Prospects tracker) and its
  // own open/closed flag.

  BDPG.preEvalPrereqsMissing = function () {
    var p = BDPG.state.prospect;
    var missing = [];
    if (!p.name) missing.push('Truck Stop Name');
    if (!p.city) missing.push('City');
    if (!BDPG.state.state) missing.push('State');
    if (!p.locationType) missing.push('Location Type');
    return missing;
  };

  // Reuses the Task 5 Location Type -> profile coupling as the only source of
  // "what profile does this location type suggest" -- never invents a new
  // mapping for the types LOCTYPE_PROFILE doesn't cover (plain 'Truck Stop',
  // 'C-Store'), which is why those two correctly fall through to null (chips
  // 5/6 render '—') rather than guessing a business rule that doesn't exist
  // anywhere else in the app.
  BDPG.preEvalMappedProfile = function (locationType) {
    var rule = BDPG.LOCTYPE_PROFILE[locationType];
    if (!rule) return null;
    if (rule.auto) return { profile: rule.auto, roadway: rule.roadway };
    if (rule.suggest && rule.suggest.length) {
      var profile = rule.suggest[0];
      var roadways = BusDevGallonsCalc.getValidRoadways(profile);
      if (!roadways.length) return null;
      return { profile: profile, roadway: roadways[0] };
    }
    return null;
  };

  BDPG.preEval = function () {
    var s = BDPG.state, p = s.prospect;
    var region = s.state ? BusDevGallonsCalc.resolveRegion(s.state) : null;
    var nc = BDPG.networkContext;

    function countTone(n) { return n > 20 ? 'green' : (n >= 10 ? 'yellow' : 'red'); }

    // #1 Region identified
    var c1;
    if (region) c1 = { label: 'Region identified', text: region, tone: 'green' };
    else if (!s.state) c1 = { label: 'Region identified', text: 'State not entered', tone: 'yellow' };
    else c1 = { label: 'Region identified', text: 'Not a recognized state code', tone: 'yellow' };

    // #2 Region performance
    var pct = region ? BDPG.effectiveRegionPct(region) * 100 : null;
    var c2;
    if (pct === null) c2 = { label: 'Region performance', text: '—', tone: 'yellow' };
    else if (pct > 0) c2 = { label: 'Region performance', text: '+' + pct.toFixed(1) + '%', tone: 'green' };
    else if (pct === 0) c2 = { label: 'Region performance', text: '0% (not configured)', tone: 'yellow' };
    else c2 = { label: 'Region performance', text: pct.toFixed(1) + '%', tone: 'red' };

    // #3 Network presence (region total)
    var c3;
    var regionData = (region && nc && nc.byRegion) ? nc.byRegion[region] : null;
    if (!regionData) c3 = { label: 'Network presence (region total)', text: '—', tone: 'yellow' };
    else c3 = { label: 'Network presence (region total)', text: regionData.total + ' locations in ' + region, tone: countTone(regionData.total) };

    // #4 Location type in network
    var c4;
    var locType = p.locationType;
    if (!locType) {
      c4 = { label: 'Location type in network', text: 'Location type not set', tone: 'yellow' };
    } else if (!regionData || !regionData.byType || !regionData.byType.hasOwnProperty(locType)) {
      c4 = { label: 'Location type in network', text: '—', tone: 'yellow' };
    } else {
      var typeCount = regionData.byType[locType];
      c4 = { label: 'Location type in network', text: typeCount + ' ' + locType + ' in ' + region, tone: countTone(typeCount) };
    }

    // #5 Baseline range for type -- always blue, informational only
    var mapped = BDPG.preEvalMappedProfile(locType);
    var c5;
    if (mapped) {
      var rows = BDPG_CONFIG.BASELINE_TABLE.filter(function (r) { return r.profile === mapped.profile; });
      var baselines = rows.map(function (r) { return r.baseline; });
      var lo = Math.min.apply(null, baselines), hi = Math.max.apply(null, baselines);
      c5 = { label: 'Baseline range for type', text: BDPG.fmtGal(lo) + '–' + BDPG.fmtGal(hi), tone: 'blue' };
    } else {
      c5 = { label: 'Baseline range for type', text: '—', tone: 'blue' };
    }

    // #6 Estimated profile -- always blue, suggestion only
    var c6;
    var mappedRow = mapped ? BusDevGallonsCalc.getBaselineRow(mapped.profile, mapped.roadway) : null;
    if (mappedRow) {
      var lanesDisp = String(mappedRow.lanes).replace('-', '–');
      c6 = { label: 'Estimated profile', text: mappedRow.profile + ' · ' + mappedRow.roadway + ' · ' + lanesDisp + ' lanes · ' + BDPG.fmtGal(mappedRow.baseline) + ' baseline', tone: 'blue' };
    } else {
      c6 = { label: 'Estimated profile', text: '—', tone: 'blue' };
    }

    // Rewards posture -- informational only. Deliberately NOT part of the
    // `judged` roll-up below: rewards is a posture the rep sets, not a fact
    // about the prospect's market, and folding it in would let that choice
    // flip a "Strong candidate" verdict.
    //
    // The percentage is rendered from rewardsPct itself, never a literal: the
    // band lives in BDPG_CONFIG.REWARDS_ADJUST, and a hardcoded "+5%" here
    // would keep saying 5% with no error the day that config changes. Same
    // drift class as the index-keyed REWARD_COLS Task 5 was sent to fix.
    // Math.abs + the typographic minus keeps the existing chip typography
    // (−5%, not -5.0%) while the number itself stays derived.
    var rewardsPct = BusDevGallonsCalc.rewardsAdjustment(s.rewardsLevel);
    var rewardsPctTxt = 'Rewards: ' + (rewardsPct > 0 ? '+' : '−') +
      (Math.abs(rewardsPct) * 100).toFixed(1).replace(/\.0$/, '') + '%';
    var cRewards;
    if (rewardsPct > 0) cRewards = { label: 'Rewards signal', text: rewardsPctTxt, tone: 'green' };
    else if (rewardsPct < 0) cRewards = { label: 'Rewards signal', text: rewardsPctTxt, tone: 'red' };
    else cRewards = { label: 'Rewards signal', text: 'Rewards: undecided', tone: 'yellow' };

    // #7 Overall signal -- rolled up from #1-4 only; #5/#6/rewards carry no judgement.
    var judged = [c1, c2, c3, c4];
    var anyRed = judged.some(function (c) { return c.tone === 'red'; });
    var allGreen = judged.every(function (c) { return c.tone === 'green'; });
    var signal, c7;
    if (anyRed) { signal = 'Review'; c7 = { label: 'Overall signal', text: 'Review carefully', tone: 'red' }; }
    else if (allGreen) { signal = 'Strong'; c7 = { label: 'Overall signal', text: 'Strong candidate', tone: 'green' }; }
    else { signal = 'Moderate'; c7 = { label: 'Overall signal', text: 'Moderate opportunity', tone: 'yellow' }; }

    return { chips: [c1, c2, c3, c4, c5, c6, cRewards, c7], signal: signal };
  };

  BDPG.togglePreEval = function () {
    BDPG.state.preEvalOpen = !BDPG.state.preEvalOpen;
    BDPG.refreshPreEvalCard();
  };

  // Targeted DOM patch -- shared by every field that can change what the
  // pre-eval panel shows (name/city gating, typed state, location type via
  // full render()) without forcing an unrelated full-panel rebuild.
  BDPG.refreshPreEvalCard = function () {
    var card = document.getElementById('bdpg-preeval-card');
    if (!card) return;
    card.outerHTML = BDPG.preEvalCardHtml();
  };

  // Keeps BDPG.state.prospect.preEvalSignal in sync with the four
  // prerequisites and BDPG.preEval() *regardless of whether the card is
  // currently rendered open* -- Task 7 saves this value into the record,
  // Task 8 shows it as the tracker's Pre-Eval column, and Task 9 counts it
  // in the summary chips, so it must never go stale just because the panel
  // is collapsed. Clears the signal back to '' the moment a prerequisite
  // stops being met, rather than leaving a previously-computed value
  // sitting there. BDPG.preEval() itself stays a pure function -- this is
  // the one and only place that writes to state.
  BDPG.updatePreEvalSignal = function () {
    var missing = BDPG.preEvalPrereqsMissing();
    if (missing.length) {
      BDPG.state.prospect.preEvalSignal = '';
      return null;
    }
    var result = BDPG.preEval();
    BDPG.state.prospect.preEvalSignal = result.signal;
    return result;
  };

  // Purely presentational -- takes the already-computed result (or null,
  // when prerequisites aren't met) rather than computing/assigning anything
  // itself.
  BDPG.preEvalHtml = function (result) {
    var missing = BDPG.preEvalPrereqsMissing();
    if (!result || missing.length) {
      return '<div style="color:var(--muted);font-size:.85em">Fill in ' + missing.map(BDPG.escHtml).join(', ') +
        ' above to see a pre-evaluation.</div>';
    }

    var judged = result.chips.slice(0, result.chips.length - 1);
    var overall = result.chips[result.chips.length - 1];
    var judgementChips = judged.map(function (c) {
      return '<div>' +
        '<div style="font-size:.68em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px">' +
          BDPG.escHtml(c.label) + '</div>' +
        '<span class="badge tag-' + c.tone + '">' + BDPG.escHtml(c.text) + '</span>' +
      '</div>';
    }).join('');
    return '<div class="bdpg-grid-3">' + judgementChips + '</div>' +
      '<div class="bdpg-callout" style="text-align:center">' +
        '<div class="bdpg-lbl">' + BDPG.escHtml(overall.label) + '</div>' +
        '<span class="badge tag-' + overall.tone + '" style="font-size:1.1em;padding:6px 16px">' + BDPG.escHtml(overall.text) + '</span>' +
      '</div>';
  };

  BDPG.preEvalCardHtml = function () {
    var open = BDPG.state.preEvalOpen;
    // Computed unconditionally -- must happen whether or not the card is
    // open, so state.prospect.preEvalSignal never freezes at a stale value
    // while collapsed (see BDPG.updatePreEvalSignal's comment).
    var result = BDPG.updatePreEvalSignal();
    return '<div class="bdpg-step" id="bdpg-preeval-card">' +
      '<div class="bdpg-step-hd" style="cursor:pointer" onclick="BDPG.togglePreEval()">' +
        '<div class="bdpg-badge">' + (open ? '▾' : '▸') + '</div>' +
        '<div class="bdpg-step-title">Pre-Evaluation</div>' +
      '</div>' +
      '<div style="font-size:.78em;color:var(--muted);margin:-8px 0 12px">complete the calculator below for a full analysis.</div>' +
      (open ? BDPG.preEvalHtml(result) : '') +
    '</div>';
  };

  BDPG.prospectHtml = function () {
    var p = BDPG.state.prospect;
    var req = ' <span style="color:var(--red)">*</span>';

    var segs = BDPG.LOCATION_TYPES.map(function (t) {
      var on = (p.locationType === t);
      return '<button class="' + (on ? 'on' : '') + '"' + (on ? ' style="background:var(--accent)"' : '') +
        ' onclick="BDPG.onLocationType(' + JSON.stringify(t).replace(/"/g, '&quot;') + ')">' + BDPG.escHtml(t) + '</button>';
    }).join('');

    return '<div class="bdpg-grid-3">' +
        '<div class="fg"><label>Truck Stop Name' + req + '</label>' +
          '<input id="bdpg-prospect-name" value="' + BDPG.escHtml(p.name) + '" oninput="BDPG.onProspectInput(\'name\', this.value)"></div>' +
        '<div class="fg"><label>Street Address</label>' +
          '<input id="bdpg-prospect-street" value="' + BDPG.escHtml(p.street) + '" oninput="BDPG.onProspectInput(\'street\', this.value)"></div>' +
        '<div class="fg"><label>City' + req + '</label>' +
          '<input id="bdpg-prospect-city" value="' + BDPG.escHtml(p.city) + '" oninput="BDPG.onProspectInput(\'city\', this.value)"></div>' +
        // Same field Step 2's map click and typed fallback write -- routed
        // through the existing BDPG.onStateInput, not a parallel handler, so
        // typing a code here resolves the region and updates the map for free.
        '<div class="fg"><label>State' + req + '</label>' +
          '<input id="bdpg-prospect-state" maxlength="2" placeholder="e.g. ID" value="' + BDPG.escHtml(BDPG.state.state) + '" ' +
          'oninput="BDPG.onStateInput(this.value)" style="text-transform:uppercase"></div>' +
        // Display-only: it names the rep on the Export Pitch Summary and in
        // Copy Summary and feeds no calculation, so it deliberately routes
        // through onProspectInput (no render(), no invalidateResult()) --
        // typing a name must never throw away a generated result. Placed
        // after State rather than mid-address so the four address fields
        // (name / street / city / state) stay contiguous in the 3-up grid.
        '<div class="fg"><label>Prepared by (GS Name)</label>' +
          '<input id="bdpg-prospect-gsname" value="' + BDPG.escHtml(p.gsName || '') + '" oninput="BDPG.onProspectInput(\'gsName\', this.value)"></div>' +
      '</div>' +
      '<div class="fg" style="margin-top:12px"><label>Location Type</label><div class="bdpg-seg">' + segs + '</div></div>' +
      '<div class="fg" style="margin-top:12px"><label>Notes</label>' +
        '<textarea id="bdpg-prospect-notes" rows="2" style="width:100%;background:var(--bg);border:1px solid var(--border);' +
        'border-radius:5px;color:var(--text);padding:6px 8px;font-size:.85em;font-family:var(--fb)" ' +
        'oninput="BDPG.onProspectInput(\'notes\', this.value)">' + BDPG.escHtml(p.notes) + '</textarea></div>';
  };

  // BDPG region fills. Cyan (--accent) is deliberately NOT here: it is reserved
  // for the selected-state highlight, which must read against every region color.
  BDPG.REGION_COLORS = {
    West: '#00D68F', Southwest: '#FF6B35', Midwest: '#FFD60A',
    Northeast: '#7C3AED', Southeast: '#FF4757'
  };

  BDPG.mapHtml = function () {
    return '<div style="position:relative">' +
      '<svg id="bdpg-usa-svg" viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg"><g id="bdpg-states-group"></g></svg>' +
      '<div class="map-tooltip" id="bdpg-map-tip"></div>' +
    '</div>';
  };

  // Third instance of the shared TopoJSON map (Territory and GS Metrics are the
  // other two). loadUSTopojson() is memoized, so this costs no extra fetch.
  BDPG.renderMap = function () {
    var sg = document.getElementById('bdpg-states-group');
    if (!sg) return;
    if (typeof usTopoLoaded === 'undefined' || !usTopoLoaded) {
      sg.innerHTML = '<text x="450" y="280" text-anchor="middle" fill="var(--muted)" font-size="14">Loading map…</text>';
      loadUSTopojson().then(function () { if (usTopoLoaded) BDPG.renderMap(); });
      return;
    }
    var sel = BDPG.state.state;
    var activeRegion = sel ? BusDevGallonsCalc.resolveRegion(sel) : null;
    var html = '';
    Object.keys(STATE_PATHS).forEach(function (st) {
      var region = BusDevGallonsCalc.resolveRegion(st);
      var isSel = (st === sel);
      var fill, cls;
      if (!region) {
        fill = hexToRgba('#3A4A6B', 0.35); cls = 'nomap';
      } else {
        fill = hexToRgba(BDPG.REGION_COLORS[region], region === activeRegion ? 0.85 : 0.55);
        cls = isSel ? 'sel' : '';
      }
      html += '<path id="bdpg-st-' + st + '" d="' + STATE_PATHS[st] + '" fill="' + fill + '" class="' + cls + '"' +
        ' onmouseenter="BDPG.mapTip(event,\'' + st + '\')" onmouseleave="BDPG.mapTipHide()"' +
        (region ? ' onclick="BDPG.onMapStateClick(\'' + st + '\')"' : '') + '/>' +
        '<text x="' + getCentroid(STATE_PATHS[st], 'x') + '" y="' + getCentroid(STATE_PATHS[st], 'y') +
        '" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,.9)" font-size="9" font-weight="600"' +
        ' font-family="var(--ff)" pointer-events="none" style="text-shadow:0 1px 2px rgba(0,0,0,.6)">' + st + '</text>';
    });
    sg.innerHTML = html;
  };

  BDPG.mapTip = function (e, st) {
    var tt = document.getElementById('bdpg-map-tip');
    if (!tt) return;
    var region = BusDevGallonsCalc.resolveRegion(st);
    var name = (typeof STATE_NAMES !== 'undefined' && STATE_NAMES[st]) ? STATE_NAMES[st] : st;
    var body;
    if (region) {
      var pct = BDPG.effectiveRegionPct(region) * 100;
      body = BDPG.escHtml(name) + ' — ' + BDPG.escHtml(region) + ' — ' +
             (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
    } else {
      body = BDPG.escHtml(name) + ' — not in any network region';
    }
    tt.innerHTML = '<div class="map-tooltip-state">' + body + '</div>';
    tt.style.display = 'block';
    tt.style.left = (e.clientX + 12) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
  };
  BDPG.mapTipHide = function () {
    var tt = document.getElementById('bdpg-map-tip');
    if (tt) tt.style.display = 'none';
  };

  BDPG.onMapStateClick = function (st) {
    // Same field the typed input sets; a click is just a second path to it.
    if (BDPG.state.state !== st) BDPG.invalidateResult();
    BDPG.state.state = st;
    BDPG.render();
  };

  BDPG.regionChipsHtml = function () {
    var active = BDPG.state.state ? BusDevGallonsCalc.resolveRegion(BDPG.state.state) : null;
    var nc = BDPG.networkContext;
    return '<div class="bdpg-chips">' + Object.keys(BDPG.REGION_COLORS).map(function (r) {
      var pct = BDPG.effectiveRegionPct(r) * 100;
      var count = (nc && nc.byRegion && nc.byRegion[r]) ? nc.byRegion[r].total : null;
      return '<div class="bdpg-chip' + (r === active ? ' on' : '') + '">' +
        '<span class="bdpg-chip-dot" style="background:' + BDPG.REGION_COLORS[r] + '"></span>' +
        '<span class="bdpg-chip-name">' + BDPG.escHtml(r) + '</span>' +
        '<span class="bdpg-chip-meta">' + (pct >= 0 ? '+' : '') + pct.toFixed(1) + '% · ' +
          (count === null ? '—' : count + ' loc') + '</span>' +
      '</div>';
    }).join('') + '</div>';
  };

  BDPG.step1Html = function () {
    var s = BDPG.state;
    var ICONS = { 'Fuel stop': '⛽', 'Small truck stop': '🚏',
                  'Medium truck stop': '🚛', 'Large truck stop': '🏙' };
    // Cards are generated from BASELINE_TABLE itself -- never a hand-copied
    // duplicate of it, so the grid can't drift from the config.
    var cards = BDPG_CONFIG.BASELINE_TABLE.map(function (r) {
      var on = (r.profile === s.profile && r.roadway === s.roadway);
      var dim = (s.profile && r.profile !== s.profile && !on);
      var suggest = !on && (s.suggestProfiles || []).indexOf(r.profile) !== -1;
      return '<div class="bdpg-bcard' + (on ? ' on' : '') + (dim ? ' dim' : '') + (suggest ? ' suggest' : '') + '" ' +
        'onclick="BDPG.onBaselineCardClick(' + JSON.stringify(r.profile).replace(/"/g, '&quot;') +
        ',' + JSON.stringify(r.roadway).replace(/"/g, '&quot;') + ')">' +
        '<div class="bdpg-bcard-ico">' + (ICONS[r.profile] || '📍') + '</div>' +
        '<div class="bdpg-bcard-name">' + BDPG.escHtml(r.profile) + '</div>' +
        '<div class="bdpg-bcard-sub">' + BDPG.escHtml(r.roadway) + ' · ' + BDPG.escHtml(r.lanes) + ' lanes</div>' +
        '<div class="bdpg-bcard-gal">' + BDPG.fmtGal(r.baseline) + '</div>' +
        '<div class="bdpg-bcard-sub">avg gal/mo</div>' +
      '</div>';
    }).join('');

    var row = (s.profile && s.roadway) ? BusDevGallonsCalc.getBaselineRow(s.profile, s.roadway) : null;
    var callout = '';
    if (row) {
      var pos = Math.max(0, Math.min(100, ((row.baseline - 2500) / 12500) * 100));
      callout = '<div class="bdpg-callout">' +
        '<div class="bdpg-lbl">Selected Baseline</div>' +
        '<div style="font-family:var(--ff);font-size:2em;font-weight:800;color:var(--accent);line-height:1">' +
          BDPG.fmtGal(row.baseline) + '<span style="font-size:.45em;color:var(--muted);margin-left:8px">avg gal/mo baseline</span></div>' +
        '<div class="bdpg-rangebar"><div class="bdpg-rangebar-tick" style="left:' + pos.toFixed(1) + '%"></div></div>' +
        '<div class="bdpg-rangebar-ends"><span>2,500</span><span>15,000</span></div>' +
      '</div>';
    } else {
      callout = '<div class="bdpg-callout" style="color:var(--muted);font-size:.85em">Pick a location profile above to set the baseline.</div>';
    }

    var note = s.autoSetNote
      ? '<div style="margin-top:10px;font-size:.82em;color:var(--accent)">' + BDPG.escHtml(s.autoSetNote) + '</div>'
      : (s.suggestProfiles && s.suggestProfiles.length
          ? '<div style="margin-top:10px;font-size:.82em;color:var(--yellow)">Suggested starting point for this location type.</div>'
          : '');

    return '<div class="bdpg-grid-3">' + cards + '</div>' + note + callout;
  };

  BDPG.onBaselineCardClick = function (profile, roadway) {
    // Sets the same two fields the old cascading selects set -- one click instead
    // of two, same resulting state. A manual pick always wins over an earlier
    // Location Type auto-set, so any stale "baseline auto-set" note must not
    // linger next to a contradicting selection.
    // Only a real change invalidates: re-clicking the already-selected card
    // must not throw away results it still describes exactly.
    if (BDPG.state.profile !== profile || BDPG.state.roadway !== roadway) BDPG.invalidateResult();
    BDPG.state.profile = profile;
    BDPG.state.roadway = roadway;
    BDPG.state.autoSetNote = '';
    BDPG.render();
  };

  // Step 2's Pricing and Rewards controls are segmented buttons driven by a
  // fixed option list, so a stored value that is not *in* that list has no
  // segment to light up: the control rendered with nothing selected while the
  // engine quietly computed at the 0% band, and a Save persisted the orphan
  // string. Unreachable from the UI itself (every write comes from a button
  // carrying one of the listed labels) but reachable by a hand-edited record
  // or a future label rename -- the same class of silent failure this file
  // already hardens with hasOwn() on every map lookup and isNum() on every
  // stored gallons value. Snapping an unrecognised value back to the
  // documented default makes the fallback visible on screen rather than
  // presenting as "nothing chosen".
  //
  // `indexOf(...) < 0` rather than a truthiness test, so it covers the empty
  // first-render case, an orphan label AND a non-string (a hand-edited object
  // would otherwise reach the engine and the tracker verbatim).
  //
  // Called from the two chokepoints that between them cover every consumer:
  // step2Html() (so the control always shows the value actually in force) and
  // onGenerate() (so the pitch builders, which read live state rather than
  // the estimate's own inputs, can never see an orphan -- an unrecognised
  // pricingLevel made PRICING_LEVELS.indexOf() return -1 in
  // pitchOpportunities() and silently dropped the pricing bullet).
  BDPG.normalizeLevels = function () {
    var s = BDPG.state;
    if (BDPG_CONFIG.PRICING_LEVELS.indexOf(s.pricingLevel) < 0) s.pricingLevel = BDPG_CONFIG.PRICING_DEFAULT;
    if (BDPG_CONFIG.REWARDS_LEVELS.indexOf(s.rewardsLevel) < 0) s.rewardsLevel = BDPG_CONFIG.REWARDS_DEFAULT;
  };

  BDPG.step2Html = function () {
    var s = BDPG.state;
    var region = s.state ? BusDevGallonsCalc.resolveRegion(s.state) : null;
    var regionPct = region ? BDPG.effectiveRegionPct(region) : 0;

    BDPG.normalizeLevels();

    function selectHtml(id, options, current, handler) {
      return '<select id="' + id + '" onchange="' + handler + '(this.value)">' +
        '<option value="">Select…</option>' +
        options.map(function (o) { return '<option value="' + BDPG.escHtml(o) + '"' + (o === current ? ' selected' : '') + '>' + BDPG.escHtml(o) + '</option>'; }).join('') +
        '</select>';
    }

    // The Confirmed Amenity Level only ever *defaults* to the suggestion (spec §8) --
    // it does not get silently overwritten once the rep has manually confirmed/overridden it.
    var suggestion = BusDevGallonsCalc.suggestAmenityLevel(s.amenityDetails);
    if (!s.amenityOverridden) {
      s.amenityLevel = suggestion.level;
    }

    // suggestAmenityLevel({}) returns the BOTTOM band ("Very limited", -5%):
    // an empty details object satisfies every "no showers / no truck parking /
    // no real food" test at once, so *unanswered* reads identically to
    // *answered badly*. Because the block above adopts the suggestion whenever
    // the rep hasn't confirmed a level, an unsurveyed prospect used to pick up
    // that -5% silently -- and amenities are INSIDE officialSubtotal, the one
    // figure the packet advertises as reproducing Roady's published
    // calculator. The prospect-facing sheet then asserted they are bottom-band
    // on the strength of questions nobody had asked yet.
    //
    // Deliberately NOT fixed in suggestAmenityLevel(): that function has always
    // behaved this way, and changing it would move officialSubtotal on every
    // already-saved profile. Silently shifting a stored customer-facing number
    // is worse than the defect. So the arithmetic is left exactly as it was and
    // the fix is visibility -- the rep can still Generate (they may well know
    // the site is sparse), but not without being told the level is an
    // assumption and what it is costing.
    var amenityAnswered = Object.keys(s.amenityDetails || {}).filter(function (f) {
      return s.amenityDetails[f];
    }).length;
    var amenityAssumed = (amenityAnswered === 0 && !s.amenityOverridden);
    // Read from config, never a literal -5%: this sentence names a number the
    // rep will compare against the results panel, and AMENITY_ADJUST is where
    // that number actually lives.
    var assumedPct = hasOwn(BDPG_CONFIG.AMENITY_ADJUST, suggestion.level)
      ? BDPG_CONFIG.AMENITY_ADJUST[suggestion.level] : 0;
    var assumedPctTxt = (assumedPct >= 0 ? '+' : '') + (assumedPct * 100).toFixed(1) + '%';
    var amenityNotice = amenityAssumed
      ? '<div class="bdpg-box" style="margin-top:10px;border-color:var(--yellow);color:var(--yellow);font-size:.8em;line-height:1.55">' +
          '⚠ <b>No amenity details entered — the level below is an assumption, not an observation of this site.</b><br>' +
          'With all six cards untouched the calculator falls back to <b>' + BDPG.escHtml(suggestion.level) + '</b>, and that ' +
          '<b>' + assumedPctTxt + '</b> is being applied inside the Roady\'s Published Calculator Figure shown on the results ' +
          'and in the printed packet. Tap the six cards above, or pick a Confirmed Amenity Level below, before handing the ' +
          'packet to an owner.' +
        '</div>'
      : '';
    // The suggestion's own reason string ("No showers, no truck parking, and no
    // real food service.") is a statement of fact about the site. It is only
    // true when somebody answered -- so it is replaced, not merely annotated,
    // when nothing was.
    var suggestLine = amenityAssumed
      ? '<div style="margin-top:8px;font-size:.82em;color:var(--yellow)">Assumed with no data: <b>' +
          BDPG.escHtml(suggestion.level) + '</b> (' + assumedPctTxt + ') — not based on anything observed here.</div>'
      : '<div style="margin-top:10px;font-size:.82em;color:var(--muted)">Suggested: <b>' +
          BDPG.escHtml(suggestion.level) + '</b> — ' + BDPG.escHtml(suggestion.reason) + '</div>';

    var left = '<div class="fg">' +
        '<label>State</label>' +
        (region ? ('<div style="margin-bottom:6px;display:inline-block;color:var(--accent);border-color:var(--accent)" class="btn">Network Region: ' + region + ' (' + (regionPct * 100).toFixed(1) + '%)</div>') :
          (s.state ? '<div style="margin-bottom:6px;color:var(--red);font-size:.8em">Not a recognized state code</div>' : '')) +
        BDPG.mapHtml() +
        '<div class="fg" style="margin-top:8px;max-width:180px"><label>Or type state code</label>' +
          '<input id="bdpg-state" maxlength="2" placeholder="e.g. ID" value="' + BDPG.escHtml(s.state) + '" ' +
          'oninput="BDPG.onStateInput(this.value)" style="text-transform:uppercase"></div>' +
        BDPG.regionChipsHtml() +
      '</div>';

    var rv = s.truckerPathRating;
    var AICONS = { showers:'🚿', food:'🍔', scale:'⚖️',
                   parking:'🅿️', service:'🔧', defReefer:'❄️' };
    var ALABELS = { showers:'Showers', food:'Food', scale:'Scale',
                    parking:'Parking', service:'Service', defReefer:'DEF / Reefer' };

    var ratingBlock =
      '<div class="bdpg-lbl">Trucker Path Rating</div>' +
      '<div style="display:flex;align-items:center;gap:12px">' +
        '<input type="range" min="1" max="5" step="0.1" style="flex:1" ' +
          'value="' + (rv === '' ? '3' : BDPG.escHtml(rv)) + '" oninput="BDPG.onRatingSlider(this.value)">' +
        '<span id="bdpg-tp-num" style="font-family:var(--ff);font-size:1.5em;font-weight:800;color:var(--text);min-width:2.2em;text-align:right">' +
          (rv === '' ? '—' : Number(rv).toFixed(1)) + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:4px">' +
        '<span id="bdpg-tp-stars">' + BDPG.starsHtml(rv) + '</span>' +
        '<span id="bdpg-tp-band" style="font-size:.76em">' + BDPG.ratingBandHtml(rv) + '</span>' +
        '<button class="btn" style="margin-left:auto;font-size:.66em" onclick="BDPG.onRatingClear()">No rating found</button>' +
      '</div>';

    var segs = BDPG_CONFIG.PRICING_LEVELS.map(function (lvl, i) {
      var pct = BDPG_CONFIG.PRICING_ADJUST[lvl];
      var on = (s.pricingLevel === lvl);
      // green -> yellow -> red across the row, matching the waterfall's
      // positive-adjustment-is-green convention. The 2nd stop has no direct
      // token (it's a green/yellow midpoint), so it's derived from --green
      // and --yellow with color-mix() -- same technique already used for
      // the badge tint above -- so it re-tints with the theme instead of
      // sitting as an untethered literal.
      var col = ['var(--green)','color-mix(in srgb, var(--green) 55%, var(--yellow))','var(--yellow)','var(--orange)','var(--red)'][i];
      return '<button class="' + (on ? 'on' : '') + '"' +
        (on ? ' style="background:' + col + '"' : '') +
        ' onclick="BDPG.onPricingChange(' + JSON.stringify(lvl).replace(/"/g,'&quot;') + ')">' +
        BDPG.escHtml(lvl.replace(' (deepest discounts)','')) + '<br>' +
        '<span style="opacity:.85">' + (pct >= 0 ? '+' : '') + (pct * 100).toFixed(1) + '%</span></button>';
    }).join('');

    // Three fixed tones rather than the pricing row's five-stop gradient:
    // this is a yes / unknown / no posture, not a scale. Keyed by level
    // *name*, not position, and shared with the tracker's Rewards column
    // (BDPG.REWARDS_TONES, defined below) so there is one map of posture ->
    // tone instead of two parallel ones that could drift out of sync --
    // hasOwn-guarded the same way every other name-keyed lookup in this file
    // is, so reordering BDPG_CONFIG.REWARDS_LEVELS (or a hand-edited state)
    // can't silently mis-tint this control the way an index-keyed array
    // would.
    var rsegs = BDPG_CONFIG.REWARDS_LEVELS.map(function (lvl, i) {
      var pct = BDPG_CONFIG.REWARDS_ADJUST[lvl];
      var on = (s.rewardsLevel === lvl);
      // Unreachable via REWARDS_LEVELS.map itself (every lvl here is by
      // definition a key of the map it drives), but rtone is looked up
      // through the same hasOwn guard as every other name-keyed lookup for
      // consistency, and a miss falls back to a real CSS var (there is no
      // --gray token) rather than an inert var(--gray).
      var rcol = hasOwn(BDPG.REWARDS_TONES, lvl) ? 'var(--' + BDPG.REWARDS_TONES[lvl] + ')' : 'var(--muted)';
      return '<button class="' + (on ? 'on' : '') + '"' +
        (on ? ' style="background:' + rcol + '"' : '') +
        ' onclick="BDPG.onRewardsChange(' + JSON.stringify(lvl).replace(/"/g, '&quot;') + ')">' +
        BDPG.escHtml(lvl.replace("Participating in Roady's Rewards", 'Participating')) + '<br>' +
        '<span style="opacity:.85">' + (pct >= 0 ? '+' : '') + (pct * 100).toFixed(1) + '%</span></button>';
    }).join('');

    var acards = Object.keys(AICONS).map(function (f) {
      var v = s.amenityDetails[f];
      return '<div class="bdpg-acard' + (v ? ' set' : '') + '" onclick="BDPG.onAmenityCycle(\'' + f + '\')">' +
        '<div class="bdpg-acard-ico">' + AICONS[f] + '</div>' +
        '<div class="bdpg-acard-f">' + ALABELS[f] + '</div>' +
        '<div class="bdpg-acard-v">' + BDPG.escHtml(v || 'tap to set') + '</div>' +
      '</div>';
    }).join('');

    var right = '<div class="fg">' +
        ratingBlock +
        '<label style="margin-top:14px;display:block">Discount / Pricing Posture</label>' +
        '<div class="bdpg-seg">' + segs + '</div>' +
        '<label style="margin-top:14px;display:block">Roady\'s Rewards Participation</label>' +
        '<div class="bdpg-seg">' + rsegs + '</div>' +
        '<div class="bdpg-lbl" style="margin-top:14px">Amenity Details</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' + acards + '</div>' +
        amenityNotice + suggestLine +
        '<div class="fg" style="margin-top:6px"><label>Confirmed Amenity Level</label>' +
          selectHtml('bdpg-amenity-confirm', BDPG_CONFIG.AMENITY_LEVELS, s.amenityLevel, 'BDPG.onAmenityConfirm') + '</div>' +
      '</div>';

    return '<div id="bdpg-step2" class="bdpg-2col">' + left + right + '</div>';
  };

  // Re-renders only the Step 2 box (via outerHTML), not the whole page, and
  // restores focus + cursor position afterward -- typing a 2-letter state code
  // must not visibly lose focus after the first keystroke.
  BDPG.onStateInput = function (val) {
    var next = val.toUpperCase();
    // State selects the region, which sets regionPct in the estimate and
    // result.region on the record. Guarded on a real change so a keystroke
    // that re-types the same letter is a no-op.
    if (BDPG.state.state !== next) BDPG.invalidateResult();
    BDPG.state.state = next;
    // Two inputs can call this now (Step 2's own "type a state code" field,
    // and the Prospect Profile card's State field added in Task 4) -- only
    // refocus Step 2's field below if it was the one actually being typed
    // in, never unconditionally, or typing in the OTHER field would get its
    // focus yanked away after every keystroke.
    var wasStep2Field = document.activeElement && document.activeElement.id === 'bdpg-state';
    var stepEl = document.getElementById('bdpg-step2');
    if (!stepEl) return;
    stepEl.outerHTML = BDPG.step2Html();
    if (wasStep2Field) {
      var input = document.getElementById('bdpg-state');
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }
    // The Generate button lives outside #bdpg-step2, so its disabled state
    // (which depends on s.state) would otherwise go stale until some other
    // control triggers a full BDPG.render() -- update just the button here
    // instead of calling render(), which would steal focus from the input above.
    var btn = document.getElementById('bdpg-generate-btn');
    if (btn) { btn.outerHTML = BDPG.generateButtonHtml(); }
    // Step 2's done badge/checkmark live in the surrounding .bdpg-step card,
    // outside the #bdpg-step2 content div just replaced above.
    BDPG.updateStepCardBadge(2, BDPG.step2Done());
    // Mirror the value into whichever of the two State inputs did NOT just
    // trigger this call, so both stay showing the same single source of
    // truth -- but never touch the one currently focused, or its cursor
    // position would jump while the user is still typing in it.
    var pInput = document.getElementById('bdpg-prospect-state');
    if (pInput && document.activeElement !== pInput) pInput.value = BDPG.state.state;
    BDPG.updateStepCardBadge(0, BDPG.prospectDone());
    // The outerHTML swap above destroyed the map's <svg> along with the rest
    // of #bdpg-step2 -- rebuild it so typing a state code updates the map too.
    BDPG.renderMap();
    // State drives three of the seven Pre-Evaluation chips (region, region
    // performance, network presence) -- keep it in step with every other
    // targeted patch this handler already does.
    BDPG.refreshPreEvalCard();
  };

  BDPG.starsHtml = function (v) {
    var n = Number(v) || 0, out = '';
    for (var i = 1; i <= 5; i++) {
      if (n >= i) out += '★';
      else if (n >= i - 0.5) out += '<span class="bdpg-star-half">☆<span>★</span></span>';
      else out += '☆';
    }
    return '<span class="bdpg-stars">' + out + '</span>';
  };
  BDPG.ratingBandHtml = function (v) {
    var info = BusDevGallonsCalc.reviewAdjustment(v === '' ? null : Number(v));
    var txt, col;
    if (info.flagged) { txt = 'No rating found — 0%'; col = 'var(--muted)'; }
    else if (info.pct < 0) { txt = 'Below 3.0 — −5%'; col = 'var(--red)'; }
    else if (info.pct > 0) { txt = '3.6+ — +2%'; col = 'var(--green)'; }
    else { txt = '3.0–3.5 — 0%'; col = 'var(--muted)'; }
    return '<span style="color:' + col + ';font-weight:700">' + txt + '</span>';
  };

  // Targeted DOM update only -- a slider drag must never rebuild the panel.
  BDPG.onRatingSlider = function (v) {
    // Review % is an engine input. invalidateResult() patches the results
    // container rather than re-rendering, so a drag keeps its grip on the
    // slider while the stale panel is replaced by the notice.
    if (String(BDPG.state.truckerPathRating) !== String(v)) BDPG.invalidateResult();
    BDPG.state.truckerPathRating = v;
    var num = document.getElementById('bdpg-tp-num');
    var st = document.getElementById('bdpg-tp-stars');
    var band = document.getElementById('bdpg-tp-band');
    if (num) num.textContent = v === '' ? '—' : Number(v).toFixed(1);
    if (st) st.innerHTML = BDPG.starsHtml(v);
    if (band) band.innerHTML = BDPG.ratingBandHtml(v);
  };
  BDPG.onRatingClear = function () {
    if (BDPG.state.truckerPathRating !== '') BDPG.invalidateResult();
    BDPG.state.truckerPathRating = '';
    BDPG.render();
  };

  // Each click advances to the next option for that field, wrapping. Writes the
  // same amenityDetails values the old <select>s wrote.
  BDPG.onAmenityCycle = function (field) {
    var opts = BDPG_CONFIG.AMENITY_DETAIL_OPTIONS[field] || [];
    if (!opts.length) return;
    var cur = BDPG.state.amenityDetails[field];
    var i = opts.indexOf(cur);
    // Always a real change (the cycle always advances). Invalidates even when
    // the rep has overridden the Confirmed Amenity Level -- the results
    // panel's own amenity chart is drawn straight from amenityDetails, so it
    // would go stale regardless of whether the estimate did.
    BDPG.invalidateResult();
    BDPG.state.amenityDetails[field] = opts[(i + 1) % opts.length];
    BDPG.render();
  };

  // Pricing is a <select> -- no cursor/focus to preserve, full re-render is fine.
  BDPG.onPricingChange = function (value) {
    if (BDPG.state.pricingLevel !== value) BDPG.invalidateResult();
    BDPG.state.pricingLevel = value;
    BDPG.render();
  };

  // Mirrors onPricingChange exactly, invalidation guard included -- rewards is
