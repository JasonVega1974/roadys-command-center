        'This table is frozen. For the live computation over per-location data — which ' +
        'recomputes as locations are edited and can push its averages into the baselines — see the ' +
        '<button class="btn" style="padding:1px 7px;font-size:.92em" onclick="BDPG.switchTab(\'locations\')">🗺 Network Locations</button> tab.</div>' +
      notices +
      '<div class="tw" style="margin-bottom:10px"><table class="dt" style="font-size:.8em">' +
        '<thead><tr>' +
          '<th>Profile</th>' +
          '<th style="text-align:right">BD Calculator Baseline</th>' +
          '<th style="text-align:right">Live Baseline</th>' +
          '<th>Lane Tier</th>' +
          '<th style="text-align:right" title="Average monthly gallons across every matched location in this lane tier, not this profile">Lane-tier Average</th>' +
          '<th style="text-align:right">Network P25</th>' +
          '<th style="text-align:right">Network P75</th>' +
          '<th style="text-align:right" title="Matched locations in this lane tier. Rows sharing a tier share this count.">Lane-tier n</th>' +
          '<th>Status</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div id="bdpg-bl-msg" style="font-size:.8em;margin-bottom:8px"></div>' +
      // Stated because the opposite is the natural assumption: the PIN looks
      // like it protects the numbers, and it does not. It protects the edit.
      '<div style="font-size:.74em;color:var(--muted);margin-bottom:10px">Overrides are stored in ' +
        'this browser under <code>' + BDPG.escHtml(BDPG.ADMIN_BASELINE_KEY) + '</code> and are ' +
        'applied to every estimate on every load, including while this tab is PIN-locked. Locking ' +
        'the tab stops further edits; it does not restore the config figures.</div>' +
      BDPG.baselineCommitNoteHtml() +
      '<div style="font-size:.76em;color:var(--muted);line-height:1.6;margin-top:12px">' +
        '<div style="font-weight:700;margin-bottom:4px">Methodology</div>' +
        '<ul style="margin:0 0 0 18px">' + notes + '</ul>' +
      '</div>' +
    '</div>';
  };

  // ══ Network Locations tab ═══════════════════════════════════════════════
  //
  // Per-location detail, and the live baseline analysis computed from it. The
  // loop this closes: edit a location -> the medians recompute -> optionally
  // push them into the baseline override store -> the calculator uses them.
  //
  // THE CIRCULARITY THIS TAB HAS TO KEEP VISIBLE. Size (Small/Medium/Large) is
  // not in any source system; it is hand-set here, and it is also what the
  // medians are grouped by. Set Size by glancing at the gallons column on the
  // same screen and the analysis simply replays that assignment back -- the
  // Larges will read higher than the Smalls because they were put there, not
  // because anything measured it. Three deliberate choices follow from that:
  //   * Size is derived from the measured diesel lane count on ingest, not
  //     judged, so the circularity that made its provenance matter is gone;
  //   * the derivation is stated at the point of editing;
  //   * there is still NO "assign Size from gallons" anything, and adding one
  //     would destroy the analysis it appears to accelerate.
  //
  // PII. The committed network-locations.json carries an anonymised id plus
  // city/state only. The allowlist below is enforced at load: unknown keys are
  // stripped from the in-memory rows and reported by NAME (never by value --
  // echoing the value of a leaked `memberName` into the page is the one thing
  // worse than loading it). PIN-gating this tab does not protect the file:
  // it is committed to a public GitHub Pages repo and served at a guessable
  // URL, and the PIN is an accident guard by its own documentation. The
  // allowlist is the actual protection.
  BDPG.LOCATIONS_URL = '../network-locations.json';
  BDPG.LOCATIONS_SAMPLE_URL = '../network-locations.sample.json';
  BDPG.LOCATION_EDITS_KEY = 'roadysBDPGLocationEdits';
  // Set by the DATA_ASOF migration when it discards a stale store, so the
  // data-trust banner can say what happened rather than the clearing being
  // invisible to the person whose figures just changed.
  BDPG.locationEditsClearedForAsOf = null;
  BDPG.hiddenClearedForAsOf = null;

  // `name` is deliberately NOT here, and stays out now that `id` carries the
  // real Roady's LID. The LID is the human-readable reference this tab needs
  // -- an admin recognises R03650 -- so there is nothing left for a name
  // field to add, and a regeneration that starts emitting business names
  // should still trip the unexpected-key warning rather than pass validation
  // silently.
  //
  // `id` is accepted as any non-empty string and has never been pattern
  // checked. It held LOC-nnn until 2026-09-29 and holds LIDs (R03650, P03654)
  // now; nothing in this page or in bdpgStats.js parses its shape. Do not add
  // a format check -- the id's only contract is that it is unique per row and
  // stable between regenerations.
  BDPG.LOCATION_FIELDS = ['id', 'city', 'state', 'group', 'type', 'dieselLanes',
    'size', 'roadway', 'distanceToInterstate', 'gallons12mo', 'avgGalMo',
    // Months in the 12-month gallon report where this location reported
    // above zero. Half of the qualifying rule -- see
    // BDPG_STATS.locationQualifies.
    'reportingMonths'];

  // Escapes a value for use as an argument inside a single-quoted JS string
  // that itself sits inside a double-quoted HTML attribute -- the shape every
  // onclick="BDPG.fn('<id>')" in this tab has.
  //
  // escHtml alone is not enough there. It turns ' into &#39;, the browser
  // decodes that back to a bare ' before the JS is parsed, and the string
  // literal terminates early. Backslash-escaping first and HTML-escaping
  // second survives both passes. Roady's LIDs will not contain an apostrophe,
  // but the id is now an externally supplied identifier rather than one this
  // code generates, so it is no longer ours to assume.
  BDPG.jsAttr = function (s) {
    return BDPG.escHtml(String(s == null ? '' : s)
      .replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
  };

  BDPG.LOCATION_EDITABLE = ['dieselLanes', 'size', 'roadway', 'distanceToInterstate'];
  // C-Store and PPO removed 2026-09-30 -- the regenerated file carries none
  // of either, and they are filtered out of the network counts as well
  // (BDPG_STATS.EXCLUDED_NETWORK_TYPES).
  BDPG.LOCATION_TYPES = ['Truck Stop', 'Truck Stop / Service Center', 'Fuel Stop'];
  BDPG.DISTANCE_OPTIONS = ['On exit', '1-5 mi', '5-15 mi', '15+ mi'];

  BDPG.locations = [];
  BDPG.locationsMeta = null;
  BDPG.locationsSourceLabel = '';
  BDPG.locationsUnexpectedKeys = [];
  BDPG.locationsDropped = 0;
  // File-sourced Size problems, each reported rather than swallowed.
  BDPG.locationsBackroadOver = 0;   // backroad with 5+ lanes -- no profile exists
  BDPG._locationsLoaded = false;
  BDPG.locationEdits = {};
  BDPG.locationEditsDropped = 0;
  BDPG.locationEditsWereReset = false;
  // Filter and confirmation state live on BDPG, not BDPG.state: they are view
  // chrome, and stateSig() must never read a filter change as unsaved work.
  BDPG.locFilter = { region: '', type: '', size: '', completeness: '' };
  BDPG.locApplyPending = null;
  // Row selection for bulk sizing. On BDPG rather than BDPG.state for the
  // same reason as the filters: ticking a checkbox is not unsaved work.
  BDPG.locSelected = {};
  BDPG.locBulkSize = '';

  // The single entry point both tabs use. The Network Locations tab calls it
  // when it first renders; the calculator calls it the first time it needs a
  // baseline. The _locationsLoaded guard means the second caller waits on the
  // first one's fetch rather than issuing its own -- the file is read once per
  // page load whichever tab is opened first, and never twice.
  //
  // Callers waiting on an in-flight fetch are queued rather than dropped: the
  // guard flips before the request resolves, so an early return would leave
  // the calculator rendering a static baseline and never re-rendering when
  // the data arrived.
  BDPG._locationsWaiters = [];
  BDPG.ensureLocations = function (onDone) {
    if (BDPG._locationsReady) { if (onDone) onDone(); return; }
    if (onDone) BDPG._locationsWaiters.push(onDone);
    BDPG.loadLocations(null);
  };

  BDPG._locationsReady = false;
  // True when neither the real file nor the sample yielded anything usable.
  // Distinct from "not loaded yet": after a failed load _locationsReady is
  // true and BDPG.locations is empty, which used to be indistinguishable from
  // a profile that simply has no locations -- so every median quietly fell
  // back to BASELINE_TABLE and the page displayed static figures as though
  // they were measured. Tracked so that state can say so instead.
  BDPG.locationsLoadFailed = false;

  // The one question every figure surface asks before it prints a number:
  // is there real committed data behind this?
  BDPG.dataReady = function () {
    return BDPG._locationsReady && !BDPG.locationsLoadFailed && BDPG.locations.length > 0;
  };

  BDPG.loadLocations = function (onDone) {
    if (BDPG._locationsLoaded) { if (onDone) onDone(); return; }
    BDPG._locationsLoaded = true;
    BDPG.loadLocationEdits();
    // Before ingest: effectiveLocations() consults the hidden set, and the
    // first render after accept() must already reflect it rather than
    // briefly showing figures over the unfiltered file.
    BDPG.readHiddenLocations();
    BDPG.readAddedLocations();

    function accept(json, label) {
      BDPG.locationsSourceLabel = label;
      BDPG.ingestLocations(json);
      BDPG.locationsLoadFailed = !json || !BDPG.locations.length;
      BDPG._locationsReady = true;
      if (onDone) onDone();
      var waiters = BDPG._locationsWaiters;
      BDPG._locationsWaiters = [];
      waiters.forEach(function (fn) { try { fn(); } catch (e) {} });
    }
    fetch(BDPG.dataUrl(BDPG.LOCATIONS_URL)).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (json) {
        if (json) { accept(json, 'network-locations.json'); return; }
        // Falling back is announced on the card, never silent: an analysis run
        // against ten invented rows must not be mistaken for the real network.
        return fetch(BDPG.dataUrl(BDPG.LOCATIONS_SAMPLE_URL)).then(function (r2) { return r2.ok ? r2.json() : null; })
          .then(function (s) { accept(s, s ? 'network-locations.sample.json' : ''); });
      })
      .catch(function () { accept(null, ''); });
  };

  BDPG.ingestLocations = function (json) {
    BDPG.locations = [];
    BDPG.locationsMeta = null;
    BDPG.locationsUnexpectedKeys = [];
    BDPG.locationsDropped = 0;
    BDPG.locationsBackroadOver = 0;
    if (!json || typeof json !== 'object') return;

    BDPG.locationsMeta = {
      asOf: str(json.asOf), source: str(json.source), sample: json.sample === true
    };
    var raw = json.locations;
    if (Object.prototype.toString.call(raw) !== '[object Array]') return;

    var seenUnexpected = {};
    raw.forEach(function (row) {
      if (!row || typeof row !== 'object') { BDPG.locationsDropped++; return; }
      var id = str(row.id).trim();
      if (!id) { BDPG.locationsDropped++; return; }
      var clean = {};
      BDPG.LOCATION_FIELDS.forEach(function (k) { clean[k] = row[k]; });
      Object.keys(row).forEach(function (k) {
        if (BDPG.LOCATION_FIELDS.indexOf(k) === -1 && !hasOwn(seenUnexpected, k)) {
          seenUnexpected[k] = 1;
          BDPG.locationsUnexpectedKeys.push(k);
        }
      });
      clean.id = id;
      // Size is DERIVED, never trusted from the file. It is a pure function
      // of the diesel lane count and the roadway now, so recomputing it here
      // means the page and the file can never disagree about a definition
      // that changed once already. A `size` in the file is ignored.
      //
      // The sizeSource / 'hand-set vs lane-rule' distinction is retired with
      // the old definition: when size WAS a judgement, its provenance decided
      // whether a median meant anything. Now it is arithmetic on a measured
      // lane count, so every location's size is equally well-founded.
      var derived = BDPG_STATS.sizeForLanes(clean.dieselLanes, clean.roadway);
      clean.size = (derived === null || derived === 'over') ? '' : derived;
      if (derived === 'over') BDPG.locationsBackroadOver++;
      BDPG.locations.push(clean);
    });
    BDPG.findOrphanedLocationEdits();
  };

  // Stored edits whose location id is not in the file that just loaded.
  //
  // loadLocationEdits() cannot do this itself: it runs before the fetch
  // resolves, so there is no location set to check against yet. Hence a
  // second pass here, once ingest has finished.
  //
  // The state is real and silent without it. Edits are keyed by location id,
  // so anything that changes an id strands them -- they stay in localStorage
  // indefinitely, contribute to nothing, and the admin simply finds their
  // sizing work gone. Worse, a later file that reused a stranded id would
  // reanimate the old edit against a different location. This happened
  // wholesale on 2026-09-29 when ids moved from LOC-nnn to real LIDs, and
  // happens one row at a time whenever a location leaves the network.
  //
  // Reported, never auto-deleted: the edits might be the only record of
  // someone's afternoon, and which id they belonged to is information a
  // silent cleanup would destroy.
  BDPG.locationEditOrphans = [];
  BDPG.findOrphanedLocationEdits = function () {
    BDPG.locationEditOrphans = [];
    // With nothing loaded, every edit would look orphaned -- a failed fetch
    // must not present as "all your work is stale".
    if (!BDPG.locations.length) return;
    var known = {};
    BDPG.locations.forEach(function (l) { known[l.id] = 1; });
    Object.keys(BDPG.locationEdits).forEach(function (id) {
      if (!hasOwn(known, id)) BDPG.locationEditOrphans.push(id);
    });
  };

  BDPG.onClearOrphanedEdits = function () {
    if (!BDPG.locationEditOrphans.length) return;
    var next = BDPG.cloneLocationEdits();
    var n = 0;
    BDPG.locationEditOrphans.forEach(function (id) {
      if (hasOwn(next, id)) { delete next[id]; n++; }
    });
    if (!BDPG.commitLocationEdits(next)) {
      BDPG.locMsg('Could not clear the stale edits in this browser — nothing was changed.', true);
      return;
    }
    BDPG.findOrphanedLocationEdits();
    BDPG.render();
    BDPG.locMsg(n + ' stale edit' + (n === 1 ? '' : 's') + ' cleared.', false);
  };

  // ── Edit overlay ────────────────────────────────────────────────────────
  //
  // Deltas only, keyed by location id, so regenerating network-locations.json
  // never clobbers an admin's work and "reset row" is a delete rather than a
  // reconstruction. The trade is that a source value arriving later for a
  // field somebody already guessed stays hidden behind the guess -- which is
  // why the row's marker tooltip names the source value it is overriding.
  // Stored shape, as of the DATA_ASOF migration:
  //
  //   { asOf: '2026-09-30', edits: { '<lid>': {...}, ... } }
  //
  // The bare map it used to be is still read, but only to be discarded: an
  // undated blob was written against a file whose lane counts and roadways
  // have since been corrected wholesale, so the overrides in it describe rows
  // that no longer exist in that shape. Keeping them let a browser quietly
  // reassign profiles and move every median away from the committed figures
  // with nothing on screen to say so -- measured at up to 1,500 gal/mo on a
  // profile median and 12 points on a region delta.
  BDPG.unwrapDatedStore = function (parsed) {
    return BDPG_STATS.datedStoreState(parsed, BDPG_CONFIG.DATA_ASOF, 'edits');
  };

  BDPG.loadLocationEdits = function () {
    var raw = null;
    try { raw = localStorage.getItem(BDPG.LOCATION_EDITS_KEY); } catch (e) { return; }
    if (!raw) return;
    var outer = null;
    try { outer = JSON.parse(raw); } catch (e2) { outer = null; }
    var un = BDPG.unwrapDatedStore(outer);
    if (un.stale && un.body && Object.keys(un.body).length) {
      // Cleared, not merged: an override made against the previous data set
      // cannot be known to still mean anything, and silently keeping it is
      // the exact failure this migration exists to end.
      try { localStorage.removeItem(BDPG.LOCATION_EDITS_KEY); } catch (e3) {}
      BDPG.locationEditsClearedForAsOf = { count: Object.keys(un.body).length, asOf: un.asOf };
      return;
    }
    var parsed = un.body;
    if (!parsed || typeof parsed !== 'object' ||
        Object.prototype.toString.call(parsed) === '[object Array]') {
      try { localStorage.removeItem(BDPG.LOCATION_EDITS_KEY); } catch (e3) {}
      BDPG.locationEditsWereReset = true;
      return;
    }
    var kept = {}, dropped = 0;
    Object.keys(parsed).forEach(function (id) {
      var e = parsed[id];
      if (!e || typeof e !== 'object') { dropped++; return; }
      var row = {}, any = false;
      BDPG.LOCATION_EDITABLE.forEach(function (f) {
        if (!hasOwn(e, f)) return;
        var v = BDPG.validLocationField(f, e[f]);
        if (v === undefined) { dropped++; return; }
        row[f] = v; any = true;
      });
      // The old 'manual' vs 'lanes' provenance is retired; an edit is
      // simply an override of the derived size.
      if (hasOwn(e, 'size') && e.size) row.sizeOverridden = true;
      if (any) kept[id] = row;
    });
    BDPG.locationEdits = kept;
    BDPG.locationEditsDropped = dropped;
    // Storage never keeps what the page refuses to apply, so a hand edit that
    // looks saved never silently isn't -- same rule as the baseline overrides.
    if (dropped > 0) BDPG.writeLocationEdits();
  };

  // Returns the cleaned value, or undefined for "refuse this". '' means the
  // field was explicitly cleared back to Unknown, which is a legitimate value
  // and is NOT the same as undefined.
  BDPG.validLocationField = function (field, v) {
    if (field === 'dieselLanes') {
      if (v === '' || v === null || v === undefined) return '';
      var n = Number(v);
      if (!isFinite(n) || n < 0 || n > 99) return undefined;
      return Math.floor(n);
    }
    if (field === 'size') {
      if (v === '' || v === 'Unknown') return '';
      return BDPG_STATS.SIZES.indexOf(v) === -1 ? undefined : v;
    }
    if (field === 'roadway') {
      if (v === '' || v === 'Unknown') return '';
      return BDPG_STATS.ROADWAYS.indexOf(v) === -1 ? undefined : v;
    }
    if (field === 'distanceToInterstate') {
      if (v === '' || v === 'Unknown') return '';
      return BDPG.DISTANCE_OPTIONS.indexOf(v) === -1 ? undefined : v;
    }
    return undefined;
  };

  BDPG.writeLocationEdits = function () {
    try {
      if (Object.keys(BDPG.locationEdits).length === 0) {
        localStorage.removeItem(BDPG.LOCATION_EDITS_KEY);
      } else {
        // Stamped with the data set it was made against, so the next deploy
        // can tell whether these overrides still describe the file.
        localStorage.setItem(BDPG.LOCATION_EDITS_KEY, JSON.stringify({
          asOf: BDPG_CONFIG.DATA_ASOF, edits: BDPG.locationEdits
        }));
      }
      return true;
    } catch (e) { return false; }
  };

  // Storage first, memory second, rolled back together -- the same contract as
  // commitBaselineOverrides(). An edit live on screen but absent from storage
  // is one that vanishes on reload after the medians were already read off it.
  BDPG.commitLocationEdits = function (next) {
    var prev = BDPG.locationEdits;
    BDPG.locationEdits = next;
    if (!BDPG.writeLocationEdits()) { BDPG.locationEdits = prev; return false; }
    return true;
  };

  BDPG.cloneLocationEdits = function () {
    var out = {};
    Object.keys(BDPG.locationEdits).forEach(function (id) {
      var src = BDPG.locationEdits[id], row = {};
      Object.keys(src).forEach(function (k) { row[k] = src[k]; });
      out[id] = row;
    });
    return out;
  };

  // Source row + admin overlay. Region is derived here and never stored, so
  // it cannot drift from BDPG_REGION_MAP.
  BDPG.effectiveLocation = function (loc) {
    var e = hasOwn(BDPG.locationEdits, loc.id) ? BDPG.locationEdits[loc.id] : null;
    var out = {
      id: loc.id, city: str(loc.city), state: str(loc.state),
      group: str(loc.group), type: str(loc.type),
      gallons12mo: loc.gallons12mo, avgGalMo: loc.avgGalMo,
      reportingMonths: loc.reportingMonths,
      dieselLanes: loc.dieselLanes, roadway: str(loc.roadway),
      distanceToInterstate: str(loc.distanceToInterstate),
      // Seeded from the file, then overridden below by any admin edit. The
      // edit wins because it is an observation of the site; the file value is
      // a derivation from the pump count.
      size: str(loc.size), sizeOverridden: false
    };
    if (e) {
      BDPG.LOCATION_EDITABLE.forEach(function (f) { if (hasOwn(e, f)) out[f] = e[f]; });
      if (hasOwn(e, 'size')) out.sizeOverridden = !!e.size;
    }
    if (!out.size) out.sizeOverridden = false;
    out.region = out.state ? BusDevGallonsCalc.resolveRegion(out.state) : null;
    // Carried through the allowlist deliberately: the table marks these rows
    // LOCAL, and a flag that got stripped here would leave a locally added
    // location indistinguishable from a committed one.
    out.addedLocally = loc.addedLocally === true;
    return out;
  };

  // ── hidden locations (this browser only) ──────────────────────────────────
  //
  // A per-browser suppression list, stored as location ids under
  // HIDDEN_LOCATIONS_KEY. Never a change to network-locations.json: the file
  // is committed and served to everyone, and one admin deciding a row looks
  // wrong is not grounds for removing it from every other browser. Hiding is
  // the staging step -- the export button hands the ids over for a real,
  // reviewed removal from the file later.
  //
  // The filter lives in effectiveLocations() because that is the single
  // function every consumer already reads through: the table, the
  // completeness line, the profile medians, the region deltas, the region
  // display figures, the baseline analysis panel and the pitch. Filtering
  // here means a hidden row is gone from all of them at once and cannot be
  // half-applied -- which is the whole hazard of a feature that changes what
  // the numbers mean.
  BDPG.HIDDEN_LOCATIONS_KEY = 'roadysBDPGHiddenLocations';
  BDPG.hiddenLocations = {};
  BDPG.hiddenLocationsWereReset = false;
  // When on, the table (and only the table) lists hidden rows too, so they
  // can be restored. Never persisted: a filtered view is a thing you should
  // have to re-open deliberately.
  BDPG.showHidden = false;

  BDPG.readHiddenLocations = function () {
    var raw;
    try { raw = localStorage.getItem(BDPG.HIDDEN_LOCATIONS_KEY); } catch (e) { return; }
    if (raw === null) return;
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { BDPG.hiddenLocationsWereReset = true; return; }
    // Dated the same way as the edits, and cleared on the same rule: a row
    // hidden because it looked wrong under the previous data set may be
    // perfectly ordinary under this one, and an unexplained suppression that
    // moves every median is the problem this migration exists to end.
    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) &&
        hasOwn(parsed, 'asOf') && hasOwn(parsed, 'ids')) {
      if (String(parsed.asOf) !== String(BDPG_CONFIG.DATA_ASOF)) {
        try { localStorage.removeItem(BDPG.HIDDEN_LOCATIONS_KEY); } catch (e2) {}
        var n = Array.isArray(parsed.ids) ? parsed.ids.length : 0;
        if (n) BDPG.hiddenClearedForAsOf = { count: n, asOf: str(parsed.asOf) };
        return;
      }
      parsed = parsed.ids;
    } else {
      // Undated -- written before the migration, against a different file.
      var legacy = Array.isArray(parsed) ? parsed
        : (parsed && typeof parsed === 'object' ? Object.keys(parsed) : null);
      try { localStorage.removeItem(BDPG.HIDDEN_LOCATIONS_KEY); } catch (e3) {}
      if (legacy && legacy.length) BDPG.hiddenClearedForAsOf = { count: legacy.length, asOf: null };
      return;
    }
    // Accepts the array it writes; tolerates an object map from a hand edit.
    var ids = Array.isArray(parsed) ? parsed
      : (parsed && typeof parsed === 'object' ? Object.keys(parsed) : null);
    if (!ids) { BDPG.hiddenLocationsWereReset = true; return; }
    var out = {};
    ids.forEach(function (id) { if (typeof id === 'string' && id) out[id] = 1; });
    BDPG.hiddenLocations = out;
  };

  BDPG.writeHiddenLocations = function () {
    var ids = Object.keys(BDPG.hiddenLocations);
    try {
      if (!ids.length) localStorage.removeItem(BDPG.HIDDEN_LOCATIONS_KEY);
      else localStorage.setItem(BDPG.HIDDEN_LOCATIONS_KEY,
        JSON.stringify({ asOf: BDPG_CONFIG.DATA_ASOF, ids: ids }));
      return true;
    } catch (e) { return false; }
  };

  // ── one source of truth, visibly ──────────────────────────────────────────
  //
  // Rendered at the top of EVERY tab, not just Network Locations. That is the
  // whole point: the per-row edit notice and the hidden-rows banner both lived
  // inside locationsTabHtml(), the one tab a GS never opens, so a browser
  // carrying stale overrides showed shifted medians on the calculator with
  // nothing to say they were local. Measured: 10 stale edits and 5 hidden rows
  // moved Medium/Interstate by 690 gal/mo, Small/Backroad by 1,523, and the
  // Midwest delta by 12 points -- all silently.
  //
  // Two separate conditions, deliberately not merged. A failed load means the
  // figures on screen are not the committed ones at all; a local override
  // means they are the committed ones plus this browser's edits. Collapsing
  // them into one "data warning" would lose the distinction that decides what
  // a reader should do about it.
  BDPG.dataTrustBannerHtml = function () {
    var out = '';

    if (BDPG._locationsReady && BDPG.locationsLoadFailed) {
      out += '<div class="bdpg-box" style="border-color:var(--red);margin-bottom:10px;font-size:.85em">' +
        '<b>⚠ The network data file did not load.</b> ' +
        'Every baseline, range and regional figure on this page is a static fallback, not a ' +
        'measurement — do not quote them to a prospect. Expected <code>' +
        BDPG.escHtml(BDPG.LOCATIONS_URL) + '</code>. Reload; if it persists, the file is missing ' +
        'or the deploy is incomplete.</div>';
    }

    var cleared = [];
    if (BDPG.locationEditsClearedForAsOf) {
      cleared.push(BDPG.locationEditsClearedForAsOf.count + ' per-row edit' +
        (BDPG.locationEditsClearedForAsOf.count === 1 ? '' : 's'));
    }
    if (BDPG.hiddenClearedForAsOf) {
      cleared.push(BDPG.hiddenClearedForAsOf.count + ' hidden row' +
        (BDPG.hiddenClearedForAsOf.count === 1 ? '' : 's'));
    }
    if (cleared.length) {
      out += '<div class="bdpg-box" style="border-color:var(--teal);margin-bottom:10px;font-size:.82em">' +
        '<b>This browser has been brought back in step with the committed data.</b> ' +
        BDPG.escHtml(cleared.join(' and ')) + ' saved here were made against an earlier version of ' +
        '<code>network-locations.json</code> and have been cleared, because the lane counts and ' +
        'roadways they overrode have since been corrected in the file itself. Nothing was lost that ' +
        'the committed data does not already carry.</div>';
    }

    var edits = Object.keys(BDPG.locationEdits).length;
    var hidden = BDPG.hiddenActiveCount();
    var added = BDPG.addedCount ? BDPG.addedCount() : 0;
    if (edits || hidden || added) {
      var bits = [];
      if (edits) bits.push(edits + ' edited row' + (edits === 1 ? '' : 's'));
      if (hidden) bits.push(hidden + ' hidden row' + (hidden === 1 ? '' : 's'));
      if (added) bits.push(added + ' locally added location' + (added === 1 ? '' : 's'));
      out += '<div class="bdpg-box" style="border-color:var(--yellow);margin-bottom:10px;font-size:.82em">' +
        '<b>⚠ This browser is not showing the committed figures.</b> ' +
        BDPG.escHtml(bits.join(', ')) + ' stored only in this browser are changing the baselines, ' +
        'ranges, region deltas and counts on this page. Nobody else sees these numbers. ' +
        '<a href="#" onclick="BDPG.goLocationsTab();return false" style="color:var(--accent)">' +
        'Review or clear them on the Network Locations tab</a>.</div>';
    }
    return out;
  };

  BDPG.goLocationsTab = function () {
    BDPG.activeTab = 'locations';
    BDPG.render();
  };

  BDPG.hiddenCount = function () { return Object.keys(BDPG.hiddenLocations).length; };
  BDPG.locationIsHidden = function (id) { return hasOwn(BDPG.hiddenLocations, id); };

  // Hidden ids that no longer match a row in the file. Counted separately so
  // "Hidden: 4" can never exceed the number of rows actually suppressed.
  BDPG.hiddenOrphanIds = function () {
    var live = {};
    BDPG.locations.forEach(function (l) { live[l.id] = 1; });
    return Object.keys(BDPG.hiddenLocations).filter(function (id) { return !hasOwn(live, id); });
  };

  BDPG.hiddenActiveCount = function () {
    return BDPG.hiddenCount() - BDPG.hiddenOrphanIds().length;
  };

  BDPG.onToggleLocationHidden = function (id) {
    var prev = BDPG.hiddenLocations;
    var next = {};
    Object.keys(prev).forEach(function (k) { next[k] = 1; });
    if (hasOwn(next, id)) delete next[id]; else next[id] = 1;
    BDPG.hiddenLocations = next;
    if (!BDPG.writeHiddenLocations()) { BDPG.hiddenLocations = prev; return; }
    BDPG.render();
  };

  BDPG.onToggleShowHidden = function () {
    BDPG.showHidden = !BDPG.showHidden;
    BDPG.render();
  };

  BDPG.onRestoreAllHidden = function () {
    if (!BDPG.hiddenCount()) return;
    var prev = BDPG.hiddenLocations;
    BDPG.hiddenLocations = {};
    if (!BDPG.writeHiddenLocations()) { BDPG.hiddenLocations = prev; return; }
    BDPG.showHidden = false;
    BDPG.render();
  };

  // The staging-to-permanent handoff: the ids, newline separated, ready to
  // paste into whatever regenerates network-locations.json. Orphans are
  // listed apart rather than mixed in -- an id the file no longer contains
  // is not something to remove from it.
  BDPG.hiddenExportText = function () {
    var orphans = BDPG.hiddenOrphanIds();
    var orphanSet = {};
    orphans.forEach(function (id) { orphanSet[id] = 1; });
    var active = Object.keys(BDPG.hiddenLocations)
      .filter(function (id) { return !hasOwn(orphanSet, id); }).sort();
    var out = '# Locations hidden in this browser, for removal from network-locations.json\n' +
      '# ' + active.length + ' id' + (active.length === 1 ? '' : 's') + '\n' +
      active.join('\n');
    if (orphans.length) {
      out += '\n\n# Not in the current file -- already removed, or the id changed. ' +
        'Nothing to do with these.\n' + orphans.sort().map(function (id) { return '# ' + id; }).join('\n');
    }
    return out + '\n';
  };

  BDPG.onExportHidden = function () {
    BDPG.copyText(BDPG.hiddenExportText(), 'Hidden location ids copied.');
  };

  // ── locally added locations ───────────────────────────────────────────────
  //
  // Rows a DEV user added in this browser. They join the in-memory set so
  // every figure recomputes around them, and they are stored in localStorage
  // so the work survives a reload -- which makes them the same class of
  // problem as the stale edits above: this browser now shows numbers nobody
  // else does. The mitigations are deliberate and all three are needed:
  //
  //   * every added row is marked LOCAL in the table,
  //   * the count appears in the data-trust banner on every tab, and
  //   * an export emits them as JSON to merge into network-locations.json,
  //     which is the only way they become real for anyone else.
  //
  // Dated with DATA_ASOF like the other stores, but NOT cleared when it
  // changes: an added location is original work, not an override of a file
  // row, so discarding it would destroy something the committed data never
  // had. A stale added row whose LID has since appeared in the file is
  // reported as a collision instead -- see addedCollisions().
  BDPG.ADDED_LOCATIONS_KEY = 'roadysBDPGAddedLocations';
  BDPG.addedLocations = [];
  BDPG.addedLocationsWereReset = false;

  BDPG.readAddedLocations = function () {
    var raw;
    try { raw = localStorage.getItem(BDPG.ADDED_LOCATIONS_KEY); } catch (e) { return; }
    if (!raw) return;
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { BDPG.addedLocationsWereReset = true; return; }
    var rows = Array.isArray(parsed) ? parsed
      : (parsed && Array.isArray(parsed.locations) ? parsed.locations : null);
    if (!rows) { BDPG.addedLocationsWereReset = true; return; }
    var out = [];
    rows.forEach(function (r) {
      var clean = BDPG.sanitizeAddedLocation(r);
      if (clean) out.push(clean);
    });
    BDPG.addedLocations = out;
  };

  // Same allowlist discipline as ingestLocations: only known fields survive,
  // so a hand-edited blob cannot introduce a member name or a stray key that
  // the rest of the page would then render.
  BDPG.sanitizeAddedLocation = function (r) {
    return BDPG_STATS.normalizeAddedLocation(r, { allowedTypes: BDPG.LOCATION_TYPES });
  };

  BDPG.writeAddedLocations = function () {
    try {
      if (!BDPG.addedLocations.length) localStorage.removeItem(BDPG.ADDED_LOCATIONS_KEY);
      else localStorage.setItem(BDPG.ADDED_LOCATIONS_KEY, JSON.stringify({
        asOf: BDPG_CONFIG.DATA_ASOF, locations: BDPG.addedLocations
      }));
      return true;
    } catch (e) { return false; }
  };

  BDPG.addedCount = function () { return BDPG.addedLocations.length; };
  BDPG.locationWasAddedLocally = function (id) {
    for (var i = 0; i < BDPG.addedLocations.length; i++) {
      if (BDPG.addedLocations[i].id === id) return true;
    }
    return false;
  };

  // An added LID that has since turned up in the committed file. The file
  // wins -- it is the shared truth -- so the local copy is suppressed rather
  // than duplicating the row, and reported so it can be cleared.
  BDPG.addedCollisions = function () {
    var inFile = {};
    BDPG.locations.forEach(function (l) { inFile[l.id] = 1; });
    return BDPG.addedLocations.filter(function (a) { return hasOwn(inFile, a.id); })
      .map(function (a) { return a.id; });
  };

  // Every consumer of the network data reads through here. `all` is the
  // deliberate escape hatch for the table's Show-hidden view -- nothing that
  // computes a statistic may pass it.
  //
  // Locally added rows are appended AFTER the file rows and after a collision
  // check, so an added LID can never shadow a committed one: if the file has
  // since gained that id, the file's row is the one that counts.
  BDPG.effectiveLocations = function (all) {
    var rows = BDPG.locations.map(BDPG.effectiveLocation);
    var inFile = {};
    rows.forEach(function (r) { inFile[r.id] = 1; });
    BDPG.addedLocations.forEach(function (a) {
      if (hasOwn(inFile, a.id)) return;
      rows.push(BDPG.effectiveLocation(a));
    });
    if (all) return rows;
    return rows.filter(function (r) { return !BDPG.locationIsHidden(r.id); });
  };

  BDPG.sourceLocation = function (id) {
    for (var i = 0; i < BDPG.locations.length; i++) {
      if (BDPG.locations[i].id === id) return BDPG.locations[i];
    }
    return null;
  };

  BDPG.locationIsEdited = function (id) {
    return hasOwn(BDPG.locationEdits, id) &&
      BDPG.LOCATION_EDITABLE.some(function (f) { return hasOwn(BDPG.locationEdits[id], f); });
  };

  BDPG.adminTabHtml = function () {
    if (!BDPG.adminAccessible()) return BDPG.adminLockedHtml();
    return BDPG.defInsideCardHtml() +
      BDPG.hiddenLocationsAdminHtml() +
      BDPG.networkBaselinePanelHtml() +
      BDPG.adminPanelHtml() +
      BDPG.networkContextGeneratorHtml() +
      BDPG.adminPinCardHtml();
  };

  // The same control as the banner on the Network Locations tab, surfaced
  // here too. Deliberately duplicated rather than cross-referenced: an admin
  // who hid rows weeks ago and is now looking at a baseline that seems wrong
  // will be on this tab, and "why is this number odd" is answered by finding
  // the filter without having to know to go looking for it.
  BDPG.hiddenLocationsAdminHtml = function () {
    var active = BDPG.hiddenActiveCount();
    var orphans = BDPG.hiddenOrphanIds().length;
    var total = BDPG.hiddenCount();
    return '<div class="bdpg-box" style="margin-top:14px' +
        (total ? ';border-color:var(--yellow)' : '') + '">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">' +
        'Hidden locations</div></div>' +
      '<div style="font-size:.84em">' +
        (total
          ? '<b>' + active + ' location' + (active === 1 ? '' : 's') + ' hidden</b> in this browser' +
            (orphans ? ' (plus ' + orphans + ' stale id' + (orphans === 1 ? '' : 's') +
              ' not in the current file)' : '') + '. ' +
            'Every average, count and region delta on this page and in the calculator is computed ' +
            'over the remaining ' + (BDPG._locationsReady ? BDPG.effectiveLocations().length : '—') + '.'
          : 'None. Every location in <code>network-locations.json</code> is counted.') +
      '</div>' +
      '<div style="font-size:.76em;color:var(--muted);margin-top:6px">' +
        'Hiding is per-browser and never changes the committed file — see the ✕ column on the ' +
        '🗺 Network Locations tab. Stored under <code>' +
        BDPG.escHtml(BDPG.HIDDEN_LOCATIONS_KEY) + '</code>.</div>' +
      (total
        ? '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<button class="btn" onclick="BDPG.onRestoreAllHidden()">Restore all ' + total + '</button>' +
            '<button class="btn" onclick="BDPG.onExportHidden()">Export hidden ids</button>' +
          '</div>'
        : '') +
    '</div>';
  };

  BDPG.escHtml = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  // ── Network Locations: rendering ────────────────────────────────────────

  // Guidance shown at the point of editing, per the brief. It is deliberately
  // adjacent to the Size control rather than in the analysis footnote: by the
  // time someone reads a footnote they have already sized 169 rows off the
  // gallons column and the analysis is circular.
  BDPG.SIZE_GUIDANCE = 'Size is derived from the diesel lane count: Small 1-3, Medium 4-6, ' +
    'Large 7+. Backroad is the exception — 1-4 lanes is Small/Backroad, and 5+ has no profile. ' +
    'Correct the lane count to change the size; the override below is for a location whose ' +
    'lane count is right but whose size genuinely is not.';

  BDPG.LOC_STATUS_LABEL = {
    'need-lanes': 'Needs Diesel Lanes',
    'need-roadway': 'Needs Roadway',
    'no-profile': 'No matching profile',
    'not-applicable': 'N/A for baselines',
    'backroad-over': '⚠ Backroad with 5+ lanes — review'
  };
  BDPG.LOC_STATUS_TONE = {
    'ok': 'green', 'need-lanes': 'yellow', 'need-roadway': 'yellow',
    'no-profile': 'gray', 'not-applicable': 'gray', 'backroad-over': 'red'
  };

  BDPG.locFitCellHtml = function (eff) {
    var m = BDPG_STATS.matchBaselineProfile(eff, BDPG_CONFIG.BASELINE_TABLE);
    var tone = hasOwn(BDPG.LOC_STATUS_TONE, m.status) ? BDPG.LOC_STATUS_TONE[m.status] : 'gray';
    if (m.status === 'ok') {
      return '<span class="badge tag-green">' + BDPG.escHtml(m.row.profile + ' · ' + m.row.roadway) + '</span>';
    }
    var title = '';
    if (m.status === 'backroad-over') {
      title = 'A Backroad location with ' + m.lanes + ' diesel lanes. Backroad has no Medium or ' +
        'Large profile -- 1-4 lanes is Small/Backroad and there is nothing above it -- so this ' +
        'is left unmapped for review rather than forced into a profile it does not fit.';
    } else if (m.status === 'no-profile') {
      title = 'BASELINE_TABLE has no ' + (m.profile || 'matching') + ' / ' + (m.roadway || '?') +
        ' row — Medium and Large truck stops exist only on Highway and Interstate. ' +
        'Filling in more fields cannot fix this.';
    } else if (m.status === 'not-applicable') {
      title = 'Only Truck Stop and Fuel Stop map to a baseline profile. This row is not counted as incomplete.';
    }
    return '<span class="badge tag-' + tone + '"' + (title ? ' title="' + BDPG.escHtml(title) + '"' : '') +
      '>' + BDPG.escHtml(BDPG.LOC_STATUS_LABEL[m.status] || '—') + '</span>';
  };

  // Size is derived from the lane count, so only a deliberate override is
  // worth marking now -- the derived value is the norm, not the exception.
  BDPG.locHandSetHtml = function (eff) {
    return eff.sizeOverridden
      ? ' <span style="font-size:.66em;color:var(--yellow)" title="Overridden here. The diesel lane count implies a different size; correcting the lane count is usually the better fix.">override</span>'
      : '';
  };

  BDPG.locMarkCellHtml = function (eff) {
    if (!BDPG.locationIsEdited(eff.id)) return '';
    var src = null;
    for (var i = 0; i < BDPG.locations.length; i++) {
      if (BDPG.locations[i].id === eff.id) { src = BDPG.locations[i]; break; }
    }
    var parts = [];
    BDPG.LOCATION_EDITABLE.forEach(function (f) {
      if (!hasOwn(BDPG.locationEdits[eff.id], f)) return;
      if (f === 'size') {
        parts.push(src && str(src.size)
          ? 'Size: the file suggests ' + str(src.size) + ' from its pump count'
          : 'Size: not suggested by the file');
        return;
      }
      var was = (src && src[f] !== null && src[f] !== undefined && src[f] !== '') ? String(src[f]) : 'unset';
      parts.push(f + ': source value was ' + was);
    });
    return '<span class="bdpg-bl-dot" title="Edited in this browser. ' +
        BDPG.escHtml(parts.join(' · ')) + '">●</span>' +
      '<button class="bdpg-bl-reset" onclick="BDPG.onLocationReset(\'' +
        BDPG.jsAttr(eff.id) + '\')" title="Discard every edit on this row and restore the source values">Reset row</button>';
  };

  BDPG.locSelectHtml = function (id, field, options, value, extra) {
    var opts = ['<option value=""' + (value ? '' : ' selected') + '>Unknown</option>'];
    options.forEach(function (o) {
      opts.push('<option value="' + BDPG.escHtml(o) + '"' + (o === value ? ' selected' : '') + '>' +
        BDPG.escHtml(o) + '</option>');
    });
    return '<select style="font-size:.9em;padding:2px 4px"' + (extra || '') +
      ' onchange="BDPG.onLocationEdit(\'' + BDPG.jsAttr(id) + '\',\'' + field + '\',this.value)">' +
      opts.join('') + '</select>';
  };

  BDPG.locationRowHtml = function (eff) {
    // idAttr for HTML attribute values (DOM ids, aria-labels); jsId for the
    // JS string arguments inside onclick/onchange -- see BDPG.jsAttr.
    var idAttr = BDPG.escHtml(eff.id);
    var jsId = BDPG.jsAttr(eff.id);
    var lanes = (eff.dieselLanes === null || eff.dieselLanes === undefined || eff.dieselLanes === '')
      ? '' : String(eff.dieselLanes);
    var hidden = BDPG.locationIsHidden(eff.id);
    // A hidden row only ever reaches here via the Show-hidden view. Dimmed
    // and struck so it cannot be mistaken for one that is still counting.
    return '<tr' + (hidden ? ' style="opacity:.45;text-decoration:line-through"' : '') + '>' +
      '<td style="width:50px;text-align:center">' +
        '<input type="checkbox" id="bdpg-nl-sel-' + idAttr + '"' +
          (BDPG.locSelected[eff.id] ? ' checked' : '') +
          ' aria-label="Select ' + idAttr + '"' +
          ' onchange="BDPG.onLocationSelect(\'' + jsId + '\',this.checked)"></td>' +
      '<td style="font-family:var(--ff);white-space:nowrap">' + BDPG.escHtml(eff.id) +
        // Marked on the row itself, not only in the banner above: this is the
        // one place a reader is looking at an individual location and asking
        // whether it is real, and a row that counts toward every average while
        // existing in no other browser has to say so where it is read.
        (eff.addedLocally
          ? ' <span class="badge tag-yellow" title="Added in this browser only. It counts toward ' +
            'every average, range and count on this page, and exists in no other browser. Not in ' +
            'network-locations.json until exported and committed.">LOCAL</span>'
          : '') + '</td>' +
      '<td>' + BDPG.escHtml(eff.city) + ', ' + BDPG.escHtml(eff.state) + '</td>' +
      '<td style="color:var(--muted)">' + BDPG.escHtml(eff.region || '—') + '</td>' +
      '<td style="color:var(--muted)">' + BDPG.escHtml(eff.group || '—') + '</td>' +
      '<td>' + BDPG.escHtml(eff.type || '—') + '</td>' +
      '<td style="text-align:right">' +
        '<input type="number" min="0" max="99" step="1" value="' + BDPG.escHtml(lanes) + '" ' +
          'style="width:4.5em;text-align:right;font-size:.9em;padding:2px 4px" ' +
          'aria-label="Diesel lanes for ' + idAttr + '" ' +
          'onchange="BDPG.onLocationEdit(\'' + jsId + '\',\'dieselLanes\',this.value)"></td>' +
      // The hand-set marker gets its own span so patchLocationRow() can update
      // it without rebuilding the <select> beside it -- rebuilding would take
      // the focus off the control the admin just used.
      '<td>' + BDPG.locSelectHtml(eff.id, 'size', BDPG_STATS.SIZES, eff.size,
          ' title="' + BDPG.escHtml(BDPG.SIZE_GUIDANCE) + '"') +
        '<span id="bdpg-nl-hand-' + idAttr + '">' + BDPG.locHandSetHtml(eff) + '</span></td>' +
      '<td id="bdpg-nl-fit-' + idAttr + '">' + BDPG.locFitCellHtml(eff) + '</td>' +
      '<td style="text-align:right">' + (isNum(Number(eff.gallons12mo)) && eff.gallons12mo !== null
          ? BDPG.fmtGal(eff.gallons12mo) : '—') + '</td>' +
      '<td style="text-align:right;white-space:nowrap">' +
        (BDPG_STATS.toFinite(eff.avgGalMo) !== null ? BDPG.fmtGal(eff.avgGalMo) : '—') +
        // Number first, marker after -- the delegated sorter parseFloats this
        // cell, so a leading badge would make the column sort as text.
        BDPG.locDisqualifiedBadgeHtml(eff) + '</td>' +
      '<td style="text-align:right">' +
        (BDPG_STATS.toFinite(eff.reportingMonths) !== null
          ? BDPG_STATS.toFinite(eff.reportingMonths) : '—') + '</td>' +
      '<td>' + BDPG.locSelectHtml(eff.id, 'roadway', BDPG_STATS.ROADWAYS, eff.roadway, '') + '</td>' +
      '<td>' + BDPG.locSelectHtml(eff.id, 'distanceToInterstate', BDPG.DISTANCE_OPTIONS, eff.distanceToInterstate, '') + '</td>' +
      '<td id="bdpg-nl-mark-' + idAttr + '" style="white-space:nowrap">' + BDPG.locMarkCellHtml(eff) + '</td>' +
      // Hide / restore. Always rendered because the whole tab is already
      // behind the admin PIN -- adminAccessible() gates locationsTabHtml(),
      // so there is no unlocked-but-not-admin state in which this column
      // could appear. Gating it a second time here would read as a real
      // permission boundary and it is not one.
      '<td style="text-align:center">' + (hidden
        ? '<button class="btn" style="padding:1px 7px;font-size:.9em" ' +
            'title="Restore this location to every count and average" ' +
            'onclick="BDPG.onToggleLocationHidden(\'' + jsId + '\')">↩</button>'
        : '<button class="btn" style="padding:1px 7px;font-size:.9em;color:var(--red)" ' +
            'title="Hide this location in this browser only. It drops out of every average, ' +
            'count and the baseline analysis. network-locations.json is not changed." ' +
            'onclick="BDPG.onToggleLocationHidden(\'' + jsId + '\')">&#10005;</button>') +
      '</td>' +
    '</tr>';
  };

  // Why a row feeds nothing, said in the row itself.
  //
  // A bare "non-reporting" was enough when there was one floor. There are two
  // rules now and they fail for different reasons -- a site doing 400 gal/mo
  // across the full year and a site doing 9,000 gal/mo for three months are
  // both excluded, and telling them apart is the difference between "this
  // location is quiet" and "we have not measured this location yet". Failing
  // both is its own case and reads as such rather than picking one.
  BDPG.locDisqualifiedBadgeHtml = function (eff) {
    var q = BDPG_STATS.locationQualifies(eff);
    if (q.ok) return '';
    var lowGal = q.reasons.indexOf('below-gallons') !== -1;
    var noGal = q.reasons.indexOf('no-gallons') !== -1;
    var lowMon = q.reasons.indexOf('below-months') !== -1;
    var noMon = q.reasons.indexOf('no-months') !== -1;

    var label, why;
    if ((lowGal || noGal) && (lowMon || noMon)) {
      // "under both" claims a measured figure that came in below the floor.
      // A row with no figure at all was never measured, so it keeps the
      // stronger and more accurate label and lets the tooltip carry the
      // months half -- otherwise six unmeasured locations read on screen as
      // six quiet ones.
      label = noGal ? 'no gallons' : 'under both';
      why = 'Fails both halves of the qualifying rule: ' +
        (noGal ? 'no gallons figure' : 'under ' + BDPG.fmtGal(q.minGalMo) + ' gal/mo') + ', and ' +
        (noMon ? 'no reporting-month count' : 'only ' + q.reportingMonths + ' reporting month' +
          (q.reportingMonths === 1 ? '' : 's')) + '.';
    } else if (lowGal || noGal) {
      label = noGal ? 'no gallons' : 'under ' + BDPG.fmtGal(q.minGalMo);
      why = noGal
        ? 'No gallons figure at all, which is not the same as reporting a zero.'
        : 'Under the ' + BDPG.fmtGal(q.minGalMo) + ' gal/mo floor. A site that sells almost ' +
          'nothing is not a measurement of a working location.';
    } else {
      label = noMon ? 'no months' : q.reportingMonths + ' of ' + q.minMonths + ' months';
      why = noMon
        ? 'No reporting-month count on this row, so it cannot be shown to be representative.'
        : 'Reported in only ' + q.reportingMonths + ' of the 12 months, under the ' +
          q.minMonths + '-month floor. Its monthly average describes part of a year, not a year.';
    }
    return ' <span class="badge tag-gray" title="' + BDPG.escHtml(why) +
      ' Excluded from every average, median, range, region delta and count — but still ' +
      'listed and counted here.">' + BDPG.escHtml(label) + '</span>';
  };

  // One clipboard path for every copy button on the page.
  BDPG.copyText = function (text, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { toast(okMsg || 'Copied to clipboard'); },
        function () { BDPG.fallbackCopy(text); });
      return;
    }
    BDPG.fallbackCopy(text);
  };

  BDPG.locationPassesFilter = function (eff) {
    var f = BDPG.locFilter;
    if (f.region && eff.region !== f.region) return false;
    if (f.type && eff.type !== f.type) return false;
    if (f.size && (f.size === 'Unknown' ? !!eff.size : eff.size !== f.size)) return false;
    if (f.completeness) {
      var st = BDPG_STATS.matchBaselineProfile(eff, BDPG_CONFIG.BASELINE_TABLE).status;
      if (f.completeness === 'complete' && st !== 'ok') return false;
      if (f.completeness === 'incomplete' && (st === 'ok' || st === 'not-applicable')) return false;
      if (f.completeness === 'na' && st !== 'not-applicable') return false;
    }
    return true;
  };

  BDPG.onLocationFilter = function (key, value) {
    if (!hasOwn(BDPG.locFilter, key)) return;
    BDPG.locFilter[key] = value;
    // Only the table body moves. The analysis below is deliberately computed
    // over every location regardless of the filter -- see locAnalysisHtml().
    var body = document.getElementById('bdpg-nl-body');
    if (body) body.innerHTML = BDPG.locationRowsHtml();
    BDPG.refreshLocationFilterCount();
  };

  BDPG.onLocationEdit = function (id, field, value) {
    var clean = BDPG.validLocationField(field, value);
    if (clean === undefined) { BDPG.locMsg('That value was not accepted — nothing was saved.', true); return; }

    var next = BDPG.cloneLocationEdits();
    var row = hasOwn(next, id) ? next[id] : {};
    var src = BDPG.sourceLocation(id);
    var srcHasValue = !!(src && str(src[field]));
    if (clean === '') {
      // Choosing "Unknown" over a value the FILE supplies is itself an edit,
      // and has to be stored as an explicit empty rather than deleted --
      // deleting the key just falls back to the file value, so the control
      // would snap straight back and the rep could never un-set it. Where the
      // file supplies nothing, deleting is right: there is no value to
      // suppress and a stored '' would mark the row edited for nothing.
      if (srcHasValue) row[field] = ''; else delete row[field];
    } else {
      row[field] = clean;
    }
    if (field === 'size') { if (clean === '') delete row.sizeOverridden; else row.sizeOverridden = true; }
    if (Object.keys(row).length === 0) delete next[id]; else next[id] = row;

    if (!BDPG.commitLocationEdits(next)) {
      BDPG.locMsg('Could not save the edit in this browser — nothing was changed.', true);
      return;
    }
    BDPG.patchLocationRow(id);
    BDPG.refreshLocationAnalysis();
    BDPG.locMsg('', false);
  };

  // ── Lane-rule sizing (triage) ───────────────────────────────────────────

  // ── Multi-select bulk sizing ────────────────────────────────────────────

  BDPG.onLocationSelect = function (id, checked) {
    if (checked) BDPG.locSelected[id] = 1; else delete BDPG.locSelected[id];
    BDPG.refreshLocationSelectionUi();
  };

  // "Select all" means all VISIBLE rows -- the point of the control is to
  // filter down to a comparable set and size it together, so it must never
  // reach past the filter into rows the admin cannot see.
  BDPG.onLocationSelectAll = function (checked) {
    var visible = BDPG.effectiveLocations().filter(BDPG.locationPassesFilter);
    visible.forEach(function (eff) {
      if (checked) BDPG.locSelected[eff.id] = 1; else delete BDPG.locSelected[eff.id];
      var box = document.getElementById('bdpg-nl-sel-' + eff.id);
      if (box) box.checked = !!checked;
    });
    BDPG.refreshLocationSelectionUi();
  };

  BDPG.selectedLocationIds = function () { return Object.keys(BDPG.locSelected); };

  BDPG.refreshLocationSelectionUi = function () {
    var n = BDPG.selectedLocationIds().length;
    var lbl = document.getElementById('bdpg-nl-selcount');
    if (lbl) lbl.textContent = n ? (n + ' selected') : 'none selected';
    var btn = document.getElementById('bdpg-nl-bulk-apply');
    if (btn) btn.disabled = !(n && BDPG.locBulkSize);
    // The header box reflects the visible set, not the whole file.
    var visible = BDPG.effectiveLocations().filter(BDPG.locationPassesFilter);
    var all = visible.length > 0 && visible.every(function (e) { return !!BDPG.locSelected[e.id]; });
    var head = document.getElementById('bdpg-nl-selall');
    if (head) {
      head.checked = all;
      head.indeterminate = !all && visible.some(function (e) { return !!BDPG.locSelected[e.id]; });
    }
  };

  BDPG.onBulkSizeChange = function (v) {
    BDPG.locBulkSize = BDPG_STATS.SIZES.indexOf(v) === -1 ? '' : v;
    BDPG.refreshLocationSelectionUi();
  };

  // Bulk sizing is MANUAL origin: the admin picked the size and chose the
  // rows, which is a judgement about those sites -- unlike the lane rule,
  // which derives one mechanically.
  BDPG.onBulkSetSize = function () {
    var ids = BDPG.selectedLocationIds();
    var size = BDPG.locBulkSize;
    if (!ids.length || BDPG_STATS.SIZES.indexOf(size) === -1) return;
    var next = BDPG.cloneLocationEdits();
    ids.forEach(function (id) {
      var row = hasOwn(next, id) ? next[id] : {};
      row.size = size;
      row.sizeOverridden = true;
      next[id] = row;
    });
    if (!BDPG.commitLocationEdits(next)) {
      BDPG.locMsg('Could not save the sizes in this browser — nothing was changed.', true);
      return;
    }
    BDPG.locSelected = {};
    BDPG.render();
    BDPG.locMsg(ids.length + ' locations set to ' + size + ' (hand-set). Selection cleared.', false);
  };

  BDPG.onLocationReset = function (id) {
    var next = BDPG.cloneLocationEdits();
    delete next[id];
    if (!BDPG.commitLocationEdits(next)) {
      BDPG.locMsg('Could not clear the edits in this browser — nothing was changed.', true);
      return;
    }
    // A reset changes the inputs themselves, so this row is rebuilt whole --
    // unlike an edit, where the input the admin just used must keep its focus.
    var tr = document.getElementById('bdpg-nl-fit-' + id);
    tr = tr ? tr.parentNode : null;
    var src = null;
    for (var i = 0; i < BDPG.locations.length; i++) {
      if (BDPG.locations[i].id === id) { src = BDPG.locations[i]; break; }
    }
    if (tr && src) {
      var html = BDPG.locationRowHtml(BDPG.effectiveLocation(src));
      var tmp = document.createElement('tbody');
      tmp.innerHTML = html;
      if (tmp.firstChild) tr.parentNode.replaceChild(tmp.firstChild, tr);
    }
    BDPG.refreshLocationAnalysis();
    BDPG.locMsg('', false);
  };

  // Patches only the derived cells. Rebuilding the whole <tr> would blow away
  // the focus on the select the admin just used, and re-rendering the page
  // would lose their scroll position 140 rows down.
  BDPG.patchLocationRow = function (id) {
    var src = null;
    for (var i = 0; i < BDPG.locations.length; i++) {
      if (BDPG.locations[i].id === id) { src = BDPG.locations[i]; break; }
    }
    if (!src) return;
    var eff = BDPG.effectiveLocation(src);
    var fit = document.getElementById('bdpg-nl-fit-' + id);
    if (fit) fit.innerHTML = BDPG.locFitCellHtml(eff);
    var mark = document.getElementById('bdpg-nl-mark-' + id);
    if (mark) mark.innerHTML = BDPG.locMarkCellHtml(eff);
    var hand = document.getElementById('bdpg-nl-hand-' + id);
    if (hand) hand.innerHTML = BDPG.locHandSetHtml(eff);
  };

  BDPG.locMsg = function (text, isErr) {
    var el = document.getElementById('bdpg-nl-msg');
    if (!el) return;
    el.textContent = text;
    el.style.color = isErr ? 'var(--red)' : 'var(--green)';
  };

  BDPG.refreshLocationAnalysis = function () {
    var el = document.getElementById('bdpg-nl-analysis');
    if (el) el.innerHTML = BDPG.locAnalysisInnerHtml();
    var c = document.getElementById('bdpg-nl-completeness');
    if (c) c.innerHTML = BDPG.locCompletenessInnerHtml();
    BDPG.refreshLocationFilterCount();
  };

  BDPG.refreshLocationFilterCount = function () {
    var el = document.getElementById('bdpg-nl-shown');
    if (!el) return;
    var all = BDPG.effectiveLocations(BDPG.showHidden);
    var shown = all.filter(BDPG.locationPassesFilter).length;
    var h = BDPG.hiddenActiveCount();
    el.textContent = (shown === all.length
      ? ('Showing all ' + all.length + ' locations')
      : ('Showing ' + shown + ' of ' + all.length + ' locations')) +
      (h && !BDPG.showHidden ? ' · ' + h + ' hidden' : '');
  };

  BDPG.locationRowsHtml = function () {
    // The one place allowed to ask for hidden rows: you cannot restore what
    // you cannot see. Every statistic still reads the filtered set.
    var rows = BDPG.effectiveLocations(BDPG.showHidden).filter(BDPG.locationPassesFilter);
    if (!rows.length) {
      return '<tr><td colspan="16" style="text-align:center;padding:20px;color:var(--muted)">' +
        'No locations match the current filters.</td></tr>';
    }
    return rows.map(BDPG.locationRowHtml).join('');
  };

  BDPG.locCompletenessInnerHtml = function () {
    var c = BDPG_STATS.completenessCounts(BDPG.effectiveLocations(), BDPG_CONFIG.BASELINE_TABLE);
    // complete / notApplicable / incomplete partition the set exactly, and
    // withGallons is reported apart from complete because mapping to a profile
    // and having a gallon figure are two different things -- a median
    // captioned with the larger count overstates its own evidence.
    return '<b>' + c.complete + ' of ' + c.total + '</b> locations have complete profile data' +
      ' <span style="color:var(--muted)">(' + c.withGallons + ' of those also qualify — at least ' +
      BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo and at least ' +
      BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months — and feed an average)</span>' +
      '<div style="font-size:.78em;color:var(--muted);margin-top:4px">' +
        c.incomplete + ' incomplete — ' + c.needLanes + ' need a diesel lane count, ' + c.needRoadway +
        ' need Roadway, ' + c.backroadOver + ' are Backroad with 5+ lanes (no profile exists), ' +
        c.noProfile + ' have no matching profile. ' + c.notApplicable +
        ' not applicable (a location type no baseline profile describes, so they are not counted as incomplete).</div>' +
      '<div style="font-size:.78em;color:var(--muted);margin-top:4px">' +
        c.nonReporting + ' of ' + c.total + ' locations have a gallon figure but do not qualify — ' +
        'under ' + BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo, under ' +
        BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months, or both' +
        (c.missingGallons ? '; a further ' + c.missingGallons + ' have no gallon figure at all' : '') +
        '. Excluded from every average and from Apply, counted here instead.</div>';
  };

  // The single Apply gate. Three independent conditions, each of which has
  // already been shown to matter on real data:
  //   * a median exists at all
  //   * n>=5 usable locations behind it (sample size)
  //   * the usable sample is not majority lane-rule-sized (information)
  // The third is the one proved by the collinearity property test: for a
  // non-conflicted location the lane rule relabels Roadway, so a median
  // resting mostly on rule-sized rows is a roadway average wearing a profile
  // name. It must not reach the calculator.
  BDPG.baselineApplyEligible = function (r) {
    return r.median !== null && r.n >= 5;
  };

  BDPG.baselineApplySkipReason = function (r) {
    if (r.median === null) {
      return r.nNonReporting > 0
        ? 'no mapped location qualifies — each is under ' +
          BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo, under ' +
          BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months, or has no gallon figure'
        : 'no locations with a gallon figure';
    }
    if (r.n < 5) return 'n=' + r.n + ' usable, below the n≥5 floor';
    return 'not eligible';
  };

  BDPG.locAnalysisInnerHtml = function () {
    var all = BDPG.effectiveLocations();
    var sum = BDPG_STATS.summarizeByProfile(all, BDPG_CONFIG.BASELINE_TABLE);
    var counts = BDPG_STATS.completenessCounts(all, BDPG_CONFIG.BASELINE_TABLE);
    var eligible = sum.filter(BDPG.baselineApplyEligible);

    // Surfaced as a standing line, not buried in the per-row markers. On the
    // real 249-location file this reads 69, and that is a finding about the
    // baseline model rather than a data defect to clean up: BASELINE_TABLE
    // pairs Interstate with 6+ lanes, while roughly half the network's
    // Interstate locations carry fewer than six diesel pumps. Those rows are
    // excluded from every median by design. Note that the exclusion is
    // systematic -- it removes exactly the locations that contradict the
    // model's assumption -- so the medians that survive are drawn from a
    // sample selected for agreeing with it.
    var conflictLine = counts.backroadOver > 0
      ? '<div style="font-size:.78em;color:var(--yellow);margin-bottom:10px">' +
          counts.backroadOver + ' Backroad location' + (counts.backroadOver === 1 ? ' has' : 's have') +
          ' 5+ diesel lanes and no profile to map to — reviewed by hand, not forced into Small.</div>'
      : '';

    var rows = sum.map(function (r) {
      var trust = BDPG.baselineApplyEligible(r);
      var med = r.median === null ? '—' : BDPG.fmtGal(r.median);
      var delta = r.delta === null ? '—'
        : (r.delta > 0 ? '+' : '') + BDPG.fmtGal(r.delta);
      var deltaColor = r.delta === null ? 'var(--muted)' : (r.delta > 0 ? 'var(--green)' : (r.delta < 0 ? 'var(--red)' : 'var(--muted)'));
      // The usable count leads; everything excluded is stated beside it
      // rather than folded away, so "n" can never read as the whole sample.
      var nCell = r.n + ' usable' +
        (r.nNonReporting > 0
          ? '<span style="font-size:.72em;color:var(--muted)" title="Do not qualify — under ' +
            BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo, under ' +
            BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months, or both: ' +
            BDPG.escHtml(r.nonReportingIds.join(', ')) + '">, ' + r.nNonReporting +
            ' excluded</span>'
          : '') +
        (r.nMissingGallons > 0
          ? '<span style="font-size:.72em;color:var(--muted)" title="Mapped to this profile but carrying no gallon figure at all.">, ' +
            r.nMissingGallons + ' no gallons</span>'
          : '') +

        '';
      return '<tr>' +
        '<td>' + BDPG.escHtml(r.profile + ' · ' + r.roadway + ' · ' + r.lanes) + '</td>' +
        '<td style="text-align:right">' + nCell + '</td>' +
        '<td style="text-align:right">' + med + '</td>' +
        '<td style="text-align:right">' + (r.p25 === null ? '—' : BDPG.fmtGal(r.p25)) + '</td>' +
        '<td style="text-align:right">' + (r.p75 === null ? '—' : BDPG.fmtGal(r.p75)) + '</td>' +
        '<td style="text-align:right">' + BDPG.fmtGal(r.currentBaseline) + '</td>' +
        '<td style="text-align:right;color:' + deltaColor + '">' + delta + '</td>' +
        '<td><span class="badge tag-' + (trust ? 'green' : 'gray') + '">' +
          (trust ? 'n≥5' : 'n<5 — not applied') + '</span></td>' +
      '</tr>';
    }).join('');

    return '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
        '<div style="font-weight:700">📈 Baseline Analysis (from this data)</div>' +
        '<div style="font-size:.78em;color:var(--muted)">recomputes on every edit</div>' +
      '</div>' +
      '<div style="font-size:.8em;color:var(--muted);margin:6px 0 10px">' +
        'Computed over <b>all ' + all.length + ' locations</b>, not the current filter — a filtered ' +
        'average must never be the one pushed into the baselines. Only locations that map to a ' +
        'profile <i>and</i> carry a gallon figure are counted.</div>' +
      conflictLine +
      '<div style="font-size:.78em;color:var(--muted);margin-bottom:10px">' +
        'A location feeds the averages only if it reports at least ' +
        BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo and at least ' +
        BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months. ' +
        'Anything failing either is excluded from every average and from Apply (' +
        counts.nonReporting + ' of ' + all.length + ' across the file). The gallons floor keeps a site ' +
        'that sold almost nothing out of a median; the months floor keeps out a part-year site whose ' +
        'monthly average describes a few weeks rather than a year.</div>' +
      '<div class="tw" style="margin-bottom:10px"><table class="dt" style="font-size:.8em">' +
        '<thead><tr>' +
          '<th>Baseline Profile</th>' +
          '<th style="text-align:right">n</th>' +
          '<th style="text-align:right">Suggested Baseline (average)</th>' +
          '<th style="text-align:right">P25</th>' +
          '<th style="text-align:right">P75</th>' +
          '<th style="text-align:right">Current Live Baseline</th>' +
          '<th style="text-align:right">Delta</th>' +
          '<th>Apply?</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (BDPG.locApplyPending
        ? BDPG.locApplyConfirmHtml()
        : '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
            '<button class="btn btn-accent" onclick="BDPG.onApplySuggestedBaselines()"' +
              (eligible.length ? '' : ' disabled') + '>Apply suggested baselines</button>' +
            '<span style="font-size:.78em;color:var(--muted)">' +
              (eligible.length
                ? eligible.length + ' of 8 profiles are eligible and would be applied. The other ' +
                  (8 - eligible.length) + ' are skipped — see the confirmation for which and why.'
                : 'No profile is eligible yet — each is short of n≥5 usable locations, has no average, ' +
                  'or rests mostly on lane-rule sizes. Nothing to apply.') +
            '</span>' +
          '</div>') +
      '<div id="bdpg-nl-apply-msg" style="font-size:.8em;margin-top:8px"></div>';
  };

  // n<5 profiles are EXCLUDED from the write, not merely annotated. A note
  // saying "only trust n≥5" beside a button that applies n=2 anyway is the
  // silent-cap pattern this project has already been bitten by -- so the
  // skipped profiles are named, with their counts, rather than dropped
  // quietly.
  BDPG.onApplySuggestedBaselines = function () {
    var sum = BDPG_STATS.summarizeByProfile(BDPG.effectiveLocations(), BDPG_CONFIG.BASELINE_TABLE);
    BDPG.locApplyPending = sum;
    BDPG.refreshLocationAnalysis();
  };

  BDPG.onCancelApplyBaselines = function () {
    BDPG.locApplyPending = null;
    BDPG.refreshLocationAnalysis();
  };

  BDPG.locApplyConfirmHtml = function () {
    var sum = BDPG.locApplyPending || [];
    var apply = sum.filter(BDPG.baselineApplyEligible);
    var skip = sum.filter(function (r) { return !BDPG.baselineApplyEligible(r); });

    var applyRows = apply.map(function (r) {
      return '<tr><td>' + BDPG.escHtml(r.profile + ' · ' + r.roadway) + '</td>' +
        '<td style="text-align:right">' + BDPG.fmtGal(r.currentBaseline) + '</td>' +
        '<td style="text-align:right">→</td>' +
        '<td style="text-align:right;font-weight:700">' + BDPG.fmtGal(r.median) + '</td>' +
        '<td style="text-align:right">n=' + r.n +
          '</td></tr>';
    }).join('');

    var skipRows = skip.map(function (r) {
      var why = BDPG.baselineApplySkipReason(r);
      return '<li>' + BDPG.escHtml(r.profile + ' · ' + r.roadway) + ' — ' + why +
        '. Stays at ' + BDPG.fmtGal(r.currentBaseline) + '.</li>';
    }).join('');

    // Every location the floor kept out of an applied median, named. A count
    // alone would let an admin approve a change without being able to check
    // which sites were dropped to produce it -- and the floor is the guard
    // standing between this button and a 94% baseline cut, so what it removed
    // has to be inspectable at the moment of approval, not afterwards.
    var excluded = [];
    apply.forEach(function (r) {
      if (r.nNonReporting > 0) {
        excluded.push('<li><b>' + BDPG.escHtml(r.profile + ' · ' + r.roadway) + '</b> — ' +
          r.nNonReporting + ' excluded from its average: ' +
          BDPG.escHtml(r.nonReportingIds.join(', ')) + '</li>');
      }
    });
    var excludedBlock = excluded.length
      ? '<div style="font-size:.78em;color:var(--muted);margin-top:10px">' +
          '<b>Non-reporting locations excluded from the averages above:</b>' +
          '<ul style="margin:4px 0 0 18px">' + excluded.join('') + '</ul></div>'
      : '';

    return '<div class="bdpg-box" style="border-color:var(--accent);margin-top:10px">' +
      '<div style="font-weight:700;margin-bottom:6px">Confirm baseline changes</div>' +
      (apply.length
        ? '<div style="font-size:.8em;color:var(--muted);margin-bottom:8px">These ' + apply.length +
            ' profile' + (apply.length === 1 ? '' : 's') + ' will be written to the baseline override ' +
            'store in this browser. The calculator uses them immediately; saved prospects are NOT ' +
            'recomputed, they are marked stale.</div>' +
          '<div class="tw"><table class="dt" style="font-size:.8em"><thead><tr>' +
            '<th>Profile</th><th style="text-align:right">Now</th><th></th>' +
            '<th style="text-align:right">After</th><th style="text-align:right">Sample</th>' +
          '</tr></thead><tbody>' + applyRows + '</tbody></table></div>' + excludedBlock
        : '<div style="font-size:.8em;color:var(--yellow);margin-bottom:8px">No profile is eligible, so no baseline would change.</div>') +
      (skip.length
        ? '<div style="font-size:.78em;color:var(--muted);margin-top:10px">' +
            '<b>Skipped (' + skip.length + '):</b><ul style="margin:4px 0 0 18px">' + skipRows + '</ul></div>'
        : '') +
      '<div style="display:flex;gap:10px;margin-top:12px">' +
        (apply.length ? '<button class="btn btn-accent" onclick="BDPG.onConfirmApplyBaselines()">Confirm and apply</button>' : '') +
        '<button class="btn" onclick="BDPG.onCancelApplyBaselines()">Cancel</button>' +
      '</div>' +
    '</div>';
  };

  BDPG.onConfirmApplyBaselines = function () {
    var sum = BDPG.locApplyPending || [];
    var apply = sum.filter(BDPG.baselineApplyEligible);
    if (!apply.length) { BDPG.locApplyPending = null; BDPG.refreshLocationAnalysis(); return; }

    // Written through the existing override store, so this lands in exactly
    // the same place the inline baseline editor writes -- one override system,
    // one amber dot, one "to make these permanent" note listing what to commit.
    var next = {};
    Object.keys(BDPG.baselineOverrides).forEach(function (k) { next[k] = BDPG.baselineOverrides[k]; });
    var applied = 0;
    apply.forEach(function (r) {
      var key = BDPG.baselineKey(r.profile, r.roadway);
      if (!hasOwn(BDPG.BASELINE_DEFAULTS, key)) return;
      var v = BDPG.validBaselineValue(r.median);
      if (v === null) return;
      if (v === BDPG.BASELINE_DEFAULTS[key]) delete next[key]; else next[key] = v;
      applied++;
    });

    if (!BDPG.commitBaselineOverrides(next)) {
      BDPG.locApplyPending = null;
      BDPG.refreshLocationAnalysis();
      BDPG.applyMsg('Could not write the baselines in this browser — nothing was changed.', true);
      return;
    }
    BDPG.locApplyPending = null;
    // Baselines are the first term of officialSubtotal, so anything on screen
    // was computed under the old ones -- same rule as every other writer.
    BDPG.invalidateResult();
    BDPG.refreshLocationAnalysis();
    BDPG.applyMsg(applied + ' baseline' + (applied === 1 ? '' : 's') +
      ' applied. The ⚙ Admin tab now lists them under “To make these permanent” — ' +
      'commit those into busDevGallonsConfig.js to share them beyond this browser.', false);
  };

  BDPG.applyMsg = function (text, isErr) {
    var el = document.getElementById('bdpg-nl-apply-msg');
    if (!el) return;
    el.textContent = text;
    el.style.color = isErr ? 'var(--red)' : 'var(--green)';
  };

  // The whole network's spread, one row per baseline profile.
  //
  // Same numbers as the Step 1 cards -- one profileRanges() call feeds both
  // -- but laid out for comparison rather than for choosing. On the cards
  // each bar is scaled to its own profile, because a card is read against
  // its own figures; here every bar shares ONE axis running from the
  // smallest p10 to the largest p90 across all profiles, because the point
  // of stacking them is to see that Large/Interstate spans further than
  // Fuel stop. Per-profile scaling would draw every row the same width and
  // destroy exactly the comparison the panel exists for.
  //
  // Sits on the Network Locations tab, already behind the admin PIN via
  // locationsTabHtml()'s adminAccessible() gate.
  BDPG.networkDistributionPanelHtml = function () {
    if (!BDPG._locationsReady) return '';
    var ranges = BDPG.profileRangeMap();
    var rows = BDPG_CONFIG.BASELINE_TABLE.map(function (r) {
      return { row: r, rg: ranges[BDPG_STATS.baselineKeyFor(r.profile, r.roadway)] || { n: 0 } };
    });
    var drawable = rows.filter(function (x) { return x.rg.low !== null && x.rg.low !== undefined; });
    if (!drawable.length) return '';

    // The shared axis. Derived from what is actually drawn, so one profile
    // dropping below the threshold cannot leave dead space at either end.
    var lo = null, hi = null;
    drawable.forEach(function (x) {
      if (lo === null || x.rg.low < lo) lo = x.rg.low;
      if (hi === null || x.rg.high > hi) hi = x.rg.high;
    });
    var span = hi - lo;
    function pct(v) {
      if (span <= 0) return 0;
      return Math.max(0, Math.min(100, ((v - lo) / span) * 100));
    }

    var body = rows.map(function (x) {
      var label = '<div style="font-size:.76em;line-height:1.25">' +
        '<div style="font-weight:600">' + BDPG.escHtml(x.row.profile) + '</div>' +
        '<div style="color:var(--muted);font-size:.9em">' + BDPG.escHtml(x.row.roadway) + '</div></div>';

      if (x.rg.low === null || x.rg.low === undefined) {
        return '<div style="display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;' +
            'padding:7px 0;border-top:1px solid var(--border)">' + label +
          '<div style="font-size:.74em;color:var(--muted);font-style:italic">' +
            'insufficient data (n=' + (x.rg.n || 0) + ')</div></div>';
      }

      var l = pct(x.rg.low), m = pct(x.rg.mid), h = pct(x.rg.high);
      return '<div style="display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;' +
          'padding:7px 0;border-top:1px solid var(--border)">' + label +
        '<div>' +
          '<div style="position:relative;height:14px" title="' + x.rg.n +
              ' reporting locations. Bar spans the 10th to the 90th percentile; the marker is the average.">' +
            // The track: full width, so every row is visibly measured
            // against the same axis rather than against itself.
            '<div style="position:absolute;top:6px;left:0;right:0;height:3px;border-radius:2px;' +
              'background:var(--border)"></div>' +
            '<div style="position:absolute;top:4px;height:7px;border-radius:4px;' +
              'background:linear-gradient(90deg,var(--dim),var(--teal));' +
              'left:' + l.toFixed(1) + '%;width:' + Math.max(0.6, h - l).toFixed(1) + '%"></div>' +
            '<div style="position:absolute;top:0;width:3px;height:14px;border-radius:2px;' +
              'background:var(--accent);left:' + m.toFixed(1) + '%;transform:translateX(-50%)"></div>' +
          '</div>' +
          '<div style="font-size:.7em;color:var(--muted);margin-top:2px">' +
            'Low ' + BDPG.fmtGal(x.rg.low) + ' · <span style="color:var(--accent)">Avg ' +
            BDPG.fmtGal(x.rg.mid) + '</span> · High ' + BDPG.fmtGal(x.rg.high) +
            ' <span style="opacity:.75">(n=' + x.rg.n + ')</span></div>' +
        '</div></div>';
    }).join('');

    return '<div class="bdpg-box" style="margin-bottom:10px">' +
      '<div class="sec-hdr" style="margin-bottom:6px"><div class="sec-title" style="font-size:.85em">' +
        'Distribution by Baseline Profile</div></div>' +
      '<div style="font-size:.74em;color:var(--muted);margin-bottom:4px">' +
        'Each bar spans the 10th to 90th percentile of QUALIFYING locations in that profile — at ' +
        'least ' + BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo and at least ' +
        BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months — with the average marked in amber. ' +
        'All eight share one axis (' + BDPG.fmtGal(lo) + '–' + BDPG.fmtGal(hi) +
        ' gal/mo) so the spreads are comparable to each other.</div>' +
      body +
