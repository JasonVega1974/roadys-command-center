  // (display only, and read live by displayName() / trackerSummary(), so
  // they cannot go stale against the result); prospect.locationType on its
  // own (it matters only when it auto-sets profile/roadway, and
  // onLocationType invalidates in exactly that case); Step 3's
  // prospectName / prospectCity / prospectState (display-only duplicates);
  // actualLanes (drives only Step 3's lane-mismatch warning); and every
  // panel open/closed toggle.
  BDPG.invalidateResult = function () {
    if (!BDPG.state.result) return;
    BDPG.state.result = null;
    BDPG.state.resultStale = true;
    // The handlers that patch the DOM instead of calling render() (the state
    // field, the rating slider) would otherwise leave the old results panel
    // on screen describing inputs that no longer exist.
    var wrap = document.getElementById('bdpg-results-wrap');
    if (wrap) wrap.innerHTML = BDPG.resultsWrapHtml();
  };

  BDPG.resultsWrapHtml = function () {
    if (BDPG.state.result) {
      return BDPG.resultsHtml() +
        '<button class="btn btn-accent" onclick="BDPG.onExportPdf()">Export PDF</button> ' +
        '<button class="btn" onclick="BDPG.onCopySummary()">Copy Summary</button>' +
        BDPG.exportPdfHtml();
    }
    if (BDPG.state.resultStale) {
      return '<div class="bdpg-box" style="margin-top:14px;border-color:var(--yellow);color:var(--yellow)">' +
        '⚠ An input changed after the last Generate, so those results no longer describe this prospect and have been cleared. ' +
        'Click <b>Generate Value Profile</b> to recalculate before saving or exporting.</div>';
    }
    return '';
  };

  // ── Unsaved-work detection ─────────────────────────────────────────────
  // Signature of everything a saved record actually carries. Panel
  // open/closed flags and the derived result are excluded: toggling a
  // disclosure triangle is not unsaved work, and the result is rebuilt by
  // Generate. Keys are walked in sorted order so a freshly-typed state and a
  // JSON round-tripped one produce the same string for the same data.
  // myProfilesOpen is kept deliberately: the modal it belonged to is gone, but
  // records saved before its removal still carry the key in their snapshot,
  // and onLoadProfile copies the snapshot into BDPG.state wholesale. Skipping
  // it keeps a legacy record's signature comparable with a fresh one.
  BDPG.SIG_SKIP = {
    result: 1, resultStale: 1, adminOpen: 1, adminSavedJson: 1,
    ncGeneratorOpen: 1, myProfilesOpen: 1, supportingOpen: 1, preEvalOpen: 1
  };
  BDPG.stateSig = function () {
    var s = BDPG.state, out = {};
    Object.keys(s).sort().forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(BDPG.SIG_SKIP, k)) out[k] = s[k];
    });
    try { return JSON.stringify(out); } catch (e) { return ''; }
  };
  // null means "no baseline captured yet" (the very first render hasn't
  // finished), which must not be reported as unsaved work.
  BDPG.savedSig = null;
  BDPG.hasUnsavedWork = function () {
    return BDPG.savedSig !== null && BDPG.stateSig() !== BDPG.savedSig;
  };
  BDPG.confirmDiscard = function (msg) {
    if (!BDPG.hasUnsavedWork()) return true;
    return confirm(msg);
  };

  // Id of the saved record the current state came from (an explicit Load, or
  // this page's own last Save), so a re-save updates that record instead of
  // appending a second row for the same prospect. Lives on BDPG, not on
  // BDPG.state, so it is never serialized into a snapshot.
  BDPG.currentProfileId = null;

  BDPG.onGenerate = function () {
    var s = BDPG.state;
    var region = BusDevGallonsCalc.resolveRegion(s.state);
    var regionPct = region ? BDPG.effectiveRegionPct(region) : 0;

    var estimate = BusDevGallonsCalc.calculateEstimate({
      profile: s.profile, roadway: s.roadway, regionPct: regionPct,
      amenityLevel: s.amenityLevel, reviewRating: s.truckerPathRating === '' ? null : Number(s.truckerPathRating),
      pricingLevel: s.pricingLevel || BDPG_CONFIG.PRICING_DEFAULT,
      rewardsLevel: s.rewardsLevel || BDPG_CONFIG.REWARDS_DEFAULT
    });
    if (!estimate) { alert('Pick a valid Location Profile + Roadway combination first.'); return; }

    var grade = BusDevGallonsCalc.calculateNetworkFitGrade({
      profile: s.profile, officialSubtotal: estimate.officialSubtotal, supportingDetails: s.supportingDetails
    });
    var conditionAdjusted = BusDevGallonsCalc.conditionAdjustedGallons(estimate.finalGallons, s.supportingDetails.condition);
    var membership = BusDevGallonsCalc.calculateMembershipFit(estimate.finalGallons);

    s.result = { estimate: estimate, grade: grade, conditionAdjusted: conditionAdjusted, membership: membership, region: region };
    // The result and the inputs are back in step, so the "results cleared"
    // notice must go with them.
    s.resultStale = false;
    BDPG.render();
  };

  // Mirrors the six rows of the on-screen waterfall table exactly, so the chart
  // and the table can never disagree. Presentation arithmetic only -- every
  // number comes from the engine's estimate object.
  //
  // Pricing and Rewards both use the difference form (this step's own
  // to - from), not a fresh Math.round(baseline * pct). Each of baseline,
  // pricingAdjusted and finalGallons is already independently rounded by the
  // engine, so a step computed from a re-multiplied percentage can land a
  // gallon off from what its own bar spans -- and the column would stop
  // summing to the stated total. The difference form keeps every step
  // chained to the one before it, which is the property a waterfall actually
  // promises; a one-gallon disagreement with a recomputed percentage is
  // invisible, but rows that don't add up to the total is not. (See Task 3
  // ruling in .superpowers/sdd/2026-09-23-bdpg-rewards-and-b2b-pitch/task-1-rulings.md.)
  BDPG.waterfallData = function (e) {
    var regionAdj = Math.round(e.baseline * (1 + e.regionPct));
    var steps = [
      { label: 'Baseline',    from: 0,                   to: e.baseline,          neutral: true },
      { label: 'Region',      from: e.baseline,          to: regionAdj },
      { label: 'Amen+Review', from: regionAdj,           to: e.officialSubtotal },
      { label: 'Pricing',     from: e.officialSubtotal,  to: e.pricingAdjusted },
      { label: 'Rewards',     from: e.pricingAdjusted,   to: e.finalGallons },
      { label: 'Final',       from: 0,                   to: e.finalGallons,      neutral: true, accent: true }
    ];
    return {
      labels: steps.map(function (s) { return s.label; }),
      data: steps.map(function (s) { return [s.from, s.to]; }),
      colors: steps.map(function (s) {
        if (s.accent) return 'rgba(0,200,255,.75)';
        if (s.neutral) return 'rgba(58,74,107,.85)';
        return s.to >= s.from ? 'rgba(0,214,143,.7)' : 'rgba(255,71,87,.7)';
      })
    };
  };

  // Ordinal position of each selected option within its own config array, 0-100.
  // Presentation-only: this scale is not an engine concept and feeds no formula.
  // `compare` is the clean hook for a future per-region average dataset.
  //
  // Two of the six AMENITY_DETAIL_OPTIONS arrays are ordered best-to-worst
  // (scale: 'yes' first; defReefer: 'both' first) while the other four run
  // worst-to-best. The chart scores by quality, so those two need their
  // index flipped before normalizing -- the option *values* still come
  // straight from config, only the scoring direction is a UI concern.
  BDPG.AMENITY_SCORE_DESC = { scale: true, defReefer: true };

  BDPG.amenityProfileData = function (details, compare) {
    var fields = ['showers','food','scale','parking','service','defReefer'];
    var labels = { showers:'Showers', food:'Food', scale:'Scale', parking:'Parking', service:'Service', defReefer:'DEF/Reefer' };
    return {
      labels: fields.map(function (f) { return labels[f]; }),
      data: fields.map(function (f) {
        var opts = BDPG_CONFIG.AMENITY_DETAIL_OPTIONS[f] || [];
        var i = opts.indexOf(details[f]);
        if (i < 0 || opts.length < 2) return 0;
        var pos = BDPG.AMENITY_SCORE_DESC[f] ? (opts.length - 1 - i) : i;
        return Math.round((pos / (opts.length - 1)) * 100);
      }),
      compare: compare || null
    };
  };

  BDPG.drawCharts = function () {
    var r = BDPG.state.result;
    if (!r) return;
    if (document.getElementById('bdpg-waterfall')) {
      var w = BDPG.waterfallData(r.estimate);
      mkchart('bdpg-waterfall', {
        type: 'bar',
        data: { labels: w.labels, datasets: [{ label: 'gal/mo', data: w.data, backgroundColor: w.colors, borderRadius: 3 }] },
        // animation:{duration:0} -- Export PDF grabs this canvas via toBase64Image()
        // for the print packet. Chart.js's default 1000ms grow-in animation means a
        // rep clicking Generate then Export within about a second (verified: calling
        // chart.update('none') right before the capture does NOT reliably jump an
        // already-in-flight animation to its finished values -- toBase64Image() still
        // returned the mid-animation frame in testing) would otherwise ship a
        // partially-drawn waterfall to a prospect-facing leave-behind. Disabling the
        // animation on this one chart removes the race entirely: the canvas is
        // always fully drawn on the very first frame, whenever it's captured.
        options: Object.assign({}, CDO, { animation: { duration: 0 }, plugins: { legend: { display: false } } })
      });
    }
    if (document.getElementById('bdpg-amenity')) {
      var a = BDPG.amenityProfileData(BDPG.state.amenityDetails);
      mkchart('bdpg-amenity', {
        type: 'bar',
        data: { labels: a.labels, datasets: [{ label: 'Score', data: a.data, backgroundColor: 'rgba(0,200,255,.6)', borderRadius: 3 }] },
        options: Object.assign({}, CDO, {
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          // Deliberately NOT built from CDO.scales.x/y here. Those nested tick/grid
          // objects are shared, mutable state that every other chart on the page
          // also passes to Chart.js by reference, and Chart.js bakes resolved,
          // type-specific config (scale `type`, and a category/linear-specific
          // ticks.callback) directly onto whatever objects it's given. This is the
          // only horizontal (indexAxis:'y') chart in the file, so reusing CDO's
          // y-scale config here would inherit a linear-axis tick callback (or leave
          // this axis typed 'linear') and print raw indices ("0".."5") instead of
          // the category labels -- and could just as easily corrupt CDO.scales.y
          // for every other (vertical) chart that reads it afterward. Fresh,
          // plain-literal style objects keep the same visual look with none of that
          // shared-reference risk.
          scales: {
            x: { type: 'linear', max: 100, ticks: { color: '#6B7A99', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,.04)' } },
            y: { type: 'category', ticks: { color: '#6B7A99', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,.05)' } }
          }
        })
      });
    }
  };

  BDPG.GRADE_COLORS = { A: 'var(--accent)', B: 'var(--green)', C: 'var(--yellow)', D: 'var(--orange)', E: 'var(--red)' };

  BDPG.gradeBadgeHtml = function (g) {
    var col = BDPG.GRADE_COLORS[g.grade] || 'var(--muted)';
    return '<div class="bdpg-grade" style="border-color:' + col + '">' +
      '<div class="bdpg-grade-l" style="color:' + col + '">' + BDPG.escHtml(g.grade) + '</div>' +
      '<div class="bdpg-grade-lbl" style="color:' + col + '">' + BDPG.escHtml(g.gradeLabel) + '</div>' +
    '</div>';
  };

  BDPG.rangeBarHtml = function (e) {
    function pos(v) { return Math.max(0, Math.min(100, ((v - 2500) / 12500) * 100)); }
    return '<div class="bdpg-nrange">' +
        '<div class="bdpg-nrange-m official" style="left:' + pos(e.officialSubtotal).toFixed(1) + '%"></div>' +
        '<div class="bdpg-nrange-m final" style="left:' + pos(e.finalGallons).toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="bdpg-rangebar-ends"><span>2,500</span><span>15,000</span></div>' +
      '<div class="bdpg-nrange-key">' +
        '<span><span class="bdpg-nrange-key-sw final" style="display:inline-block;width:10px;height:3px;background:var(--accent);vertical-align:middle"></span> Final ' + BDPG.fmtGal(e.finalGallons) + '</span>' +
        '<span><span class="bdpg-nrange-key-sw official" style="display:inline-block;width:10px;height:3px;background:var(--text);vertical-align:middle"></span> Official ' + BDPG.fmtGal(e.officialSubtotal) + '</span>' +
      '</div>';
  };

  // Prospect-facing hero. Extracted so the Export Pitch Summary renders the
  // identical block rather than a hand-maintained second copy that could
  // drift from what the rep saw on screen.
  BDPG.pitchHeroHtml = function () {
    var e = BDPG.state.result.estimate;
    var annual = e.finalGallons * 12;
    // displayName() falls back to the literal "Prospect" when nothing is
    // entered, which reads badly mid-sentence -- use a neutral phrase instead.
    // See resolveProspectName() for the shared precedence both draw from.
    var raw = BDPG.resolveProspectName();
    var who = raw ? BDPG.escHtml(raw) : 'this location';

    return '<div class="bdpg-hero-card final" style="margin-bottom:14px">' +
      '<div class="bdpg-hero-num" style="font-size:2.3em;line-height:1.15">' +
        'Roady\'s can drive ' + BDPG.fmtGal(e.finalGallons) + ' gallons/month to ' + who + '</div>' +
      '<div style="font-size:.95em;color:var(--muted);margin-top:8px">That\'s ' + BDPG.fmtGal(annual) +
        ' gallons annually — based on your location profile, region, and network data.</div>' +
      '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">' +
        '<span class="bdpg-lbl" style="display:inline">Roady\'s Published Calculator Figure:</span> ' +
        '<b style="font-size:1.15em">' + BDPG.fmtGal(e.officialSubtotal) + ' gal/mo</b>' +
        '<div style="font-size:.72em;color:var(--muted);margin-top:3px">' +
          'Matches Roady\'s published prospective-member calculator.</div>' +
      '</div>' +
    '</div>';
  };

  BDPG.resultsHtml = function () {
    var r = BDPG.state.result, e = r.estimate, g = r.grade;
    var regionAdjusted = Math.round(e.baseline * (1 + e.regionPct));

    var hero = BDPG.pitchHeroHtml() +
    '<div style="margin-top:8px;font-size:.75em;color:var(--muted)">' + BDPG.escHtml(BDPG.regionVarianceAsOfLine()) + '</div>' +
    (e.reviewFlagged ? '<div style="margin-top:6px;color:var(--yellow);font-size:.8em">No Trucker Path rating found — Review% treated as 0%.</div>' : '');

    var waterfall = '<div class="cc" style="margin-top:14px"><div class="cc-lbl">Adjustment Waterfall</div>' +
      '<div class="cw" style="height:220px"><canvas id="bdpg-waterfall"></canvas></div>' +
      '<table class="dt" style="width:100%;font-size:.85em;margin-top:10px"><tbody>' +
        '<tr><td>1. Baseline</td><td style="text-align:right">' + BDPG.fmtGal(e.baseline) + '</td></tr>' +
        '<tr><td>2. Region-adjusted (' + (e.regionPct >= 0 ? '+' : '') + (e.regionPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + BDPG.fmtGal(regionAdjusted) + '</td></tr>' +
        '<tr style="font-weight:700"><td>3. Official calculator subtotal (+ Amenities ' + (e.amenityPct >= 0 ? '+' : '') + (e.amenityPct * 100).toFixed(1) + '% + Review ' + (e.reviewPct >= 0 ? '+' : '') + (e.reviewPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + BDPG.fmtGal(e.officialSubtotal) + '</td></tr>' +
        '<tr><td>4. Pricing adjustment (' + (e.pricingPct >= 0 ? '+' : '') + (e.pricingPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + (e.pricingAdjusted - e.officialSubtotal >= 0 ? '+' : '') + BDPG.fmtGal(e.pricingAdjusted - e.officialSubtotal) + '</td></tr>' +
        // Difference form (finalGallons - pricingAdjusted), not Math.round(baseline * rewardsPct):
        // each figure is independently rounded, so a recomputed-percentage step can land a
        // gallon off from the bar it's supposed to label and break "rows sum to the total".
        // See the comment atop BDPG.waterfallData.
        '<tr><td>5. Rewards adjustment (' + (e.rewardsPct >= 0 ? '+' : '') + (e.rewardsPct * 100).toFixed(1) + '%)</td><td style="text-align:right">' + (e.finalGallons - e.pricingAdjusted >= 0 ? '+' : '') + BDPG.fmtGal(e.finalGallons - e.pricingAdjusted) + '</td></tr>' +
        '<tr style="font-weight:700;border-top:1px solid var(--border)"><td>6. Final Potential Gallons</td><td style="text-align:right">' + BDPG.fmtGal(e.finalGallons) + '</td></tr>' +
      '</tbody></table></div>';

    var rangeSection = '<div class="bdpg-hero" style="margin-top:14px">' +
      '<div class="cc"><div class="cc-lbl">Position in Network Range</div>' + BDPG.rangeBarHtml(e) +
        '<div style="font-size:.68em;color:var(--muted);margin-top:6px">Grade is scored from the official subtotal and is never affected by Pricing Strategy.</div></div>' +
      BDPG.gradeBadgeHtml(g) +
    '</div>';

    var amenitySection = '<div class="cc" style="margin-top:14px"><div class="cc-lbl">Your Amenity Profile</div>' +
      '<div class="cw" style="height:180px"><canvas id="bdpg-amenity"></canvas></div>' +
      '<div style="font-size:.68em;color:var(--muted)">This prospect’s own amenity levels. No network average available yet.</div></div>';

    var netCtx = BDPG.networkContextHtml();

    return '<div class="bdpg-results">' + hero + waterfall + rangeSection + amenitySection + netCtx + BDPG.conditionAdjustedHtml() + BDPG.membershipFitHtml() + BDPG.analysisNarrativeHtml() + '</div>';
  };

  BDPG.conditionAdjustedHtml = function () {
    var r = BDPG.state.result, e = r.estimate;
    var delta = r.conditionAdjusted - e.finalGallons;
    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Condition-Adjusted View <span style="font-size:.85em;color:var(--yellow);font-weight:400">(non-official)</span></div></div>' +
      '<div style="font-size:1.3em;font-weight:700">' + BDPG.fmtGal(r.conditionAdjusted) + ' gal/mo</div>' +
      '<div style="font-size:.8em;color:var(--muted)">' + (delta >= 0 ? '+' : '') + BDPG.fmtGal(delta) + ' vs. Final Potential Gallons, based on condition: ' +
        BDPG.escHtml(BDPG.state.supportingDetails.condition || 'not set') + '</div>' +
    '</div>';
  };

  BDPG.membershipFitHtml = function () {
    var m = BDPG.state.result.membership;
    if (!m.valuePerGallonConfigured) {
      return '<div class="bdpg-box" style="margin-top:14px"><div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Membership Fit</div></div>' +
        '<div style="color:var(--muted)">Membership pricing not configured.</div></div>';
    }
    var rows = m.plans.map(function (p) {
      if (!p.configured) return '<tr><td>' + BDPG.escHtml(p.name) + '</td><td colspan="2" style="color:var(--muted)">Not configured</td></tr>';
      return '<tr><td>' + BDPG.escHtml(p.name) + '</td>' +
        '<td style="text-align:right">' + BDPG.fmtGal(p.breakevenGallons) + ' gal/mo breakeven</td>' +
        '<td style="text-align:right">' + p.coverageMultiple + '×</td></tr>';
    }).join('');
    var best = m.plans.filter(function (p) { return p.configured; }).sort(function (a, b) { return b.coverageMultiple - a.coverageMultiple; })[0];
    var recommendation = best
      ? '<div style="margin-top:8px;font-weight:700">Membership pays for itself at ' + BDPG.fmtGal(best.breakevenGallons) + ' gal/mo — final potential estimate is ' +
        BDPG.fmtGal(BDPG.state.result.estimate.finalGallons) + ' (' + best.coverageMultiple + '× coverage).</div>'
      : '';
    return '<div class="bdpg-box" style="margin-top:14px"><div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Membership Fit</div></div>' +
      '<table class="dt" style="width:100%;font-size:.85em"><tbody>' + rows + '</tbody></table>' + recommendation + '</div>';
  };

  BDPG.exportPdfHtml = function () {
    var r = BDPG.state.result;
    if (!r) return '';
    var e = r.estimate, g = r.grade, loc = BDPG.displayLocation();
    var membershipLine = r.membership.valuePerGallonConfigured && r.membership.plans.some(function (p) { return p.configured; })
      ? BDPG.membershipFitHtml()
      : '';

    var heroPrint = '<div class="bdpg-hero" style="margin:14px 0">' +
      '<div class="bdpg-hero-card final"><div class="bdpg-lbl">Final Potential Gallons</div>' +
        '<div class="bdpg-hero-num">' + BDPG.fmtGal(e.finalGallons) + '</div>' +
        '<div style="font-size:.8em;color:#333;margin-top:4px">gal/mo</div>' +
        '<div class="bdpg-hero-math">' + BDPG.escHtml(e.finalMathLine) + '</div>' +
      '</div>' +
      '<div class="bdpg-hero-card official"><div class="bdpg-lbl">Official Calculator Subtotal</div>' +
        '<div class="bdpg-hero-num">' + BDPG.fmtGal(e.officialSubtotal) + '</div>' +
        '<div style="font-size:.8em;color:#333;margin-top:4px">gal/mo · traces to the printed calculator</div>' +
        '<div class="bdpg-hero-math">' + BDPG.escHtml(e.officialMathLine) + '</div>' +
      '</div>' +
    '</div>';

    var chartImg = BDPG.printChartImg
      ? '<div style="margin-top:14px"><img src="' + BDPG.printChartImg + '" alt="Adjustment waterfall chart" style="width:100%;max-width:560px;border:1px solid #999"></div>'
      : '';

    var gradeSection = '<div class="bdpg-hero" style="margin-top:14px">' +
      '<div class="bdpg-box"><div class="bdpg-lbl">Position in Network Range</div>' + BDPG.rangeBarHtml(e) + '</div>' +
      BDPG.gradeBadgeHtml(g) +
    '</div>';

    return '<div id="bdpg-print-only">' +
      '<h1>Roady\'s Prospective Member Gallons Calculator</h1>' +
      '<h2>' + BDPG.escHtml(BDPG.displayName()) + (loc ? ' — ' + BDPG.escHtml(loc) : '') + '</h2>' +
      '<h3>Step 1</h3><p>' + BDPG.escHtml(BDPG.state.profile) + ' / ' + BDPG.escHtml(BDPG.state.roadway) + ' — Baseline ' + BDPG.fmtGal(e.baseline) + ' gal/mo</p>' +
      '<h3>Step 2 — Official Calculator</h3><p>' + BDPG.escHtml(e.officialMathLine) + '</p>' +
      '<p style="font-size:.85em;color:#666">' + BDPG.escHtml(BDPG.regionVarianceAsOfLine()) + '</p>' +
      '<h3>Official Calculator Subtotal: ' + BDPG.fmtGal(e.officialSubtotal) + '</h3>' +
      '<h3>Step 3 — Pricing Strategy: ' + BDPG.escHtml(BDPG.state.pricingLevel) + '</h3><p>' + BDPG.escHtml(e.finalMathLine) + '</p>' +
      '<h3>Final Potential Gallons: ' + BDPG.fmtGal(e.finalGallons) + '</h3>' +
      heroPrint + chartImg + gradeSection +
      membershipLine +
    '</div>';
  };

  BDPG.onExportPdf = function () {
    if (!BDPG.state.result) { alert('Generate a Value Profile first.'); return; }
    // A live <canvas> doesn't reproduce reliably across print pipelines, so grab
    // a static image of the waterfall chart before anything else changes. This
    // has to happen before the #bdpg-print-only rebuild below so exportPdfHtml()
    // can inline it as an <img>; if it fails for any reason the packet still
    // prints, just without the chart image.
    // The waterfall chart is built with animation:{duration:0} (see drawCharts)
    // specifically so this capture is always complete no matter how soon after
    // Generate the rep clicks Export -- see the comment there for why.
    BDPG.printChartImg = '';
    try {
      if (typeof CHS !== 'undefined' && CHS['bdpg-waterfall']) {
        BDPG.printChartImg = CHS['bdpg-waterfall'].toBase64Image();
      }
    } catch (err) { BDPG.printChartImg = ''; }

    // Rebuild just the print-only block (not a full BDPG.render(), which would
    // tear down and recreate the on-screen charts) so the freshly-captured
    // chart image is actually in the DOM before window.print() opens.
    var printOnly = document.getElementById('bdpg-print-only');
    if (printOnly) printOnly.outerHTML = BDPG.exportPdfHtml();

    // body.bdpg-print-mode is what the @media print rules key off of (see <style>),
    // so a plain browser File > Print on some other page never gets caught by
    // these rules — only a print triggered through this button does.
    document.body.classList.add('bdpg-print-mode');
    window.print();
  };

  if (!BDPG._printModeCleanupBound) {
    BDPG._printModeCleanupBound = true;
    window.addEventListener('afterprint', function () {
      document.body.classList.remove('bdpg-print-mode');
    });
  }

  BDPG.summaryText = function () {
    var r = BDPG.state.result, e = r.estimate, loc = BDPG.displayLocation();
    var lines = [
      'Roady\'s Prospective Member Gallons Calculator',
      BDPG.displayName() + (loc ? ' — ' + loc : ''),
      '',
      'Location Profile: ' + BDPG.state.profile + ' / ' + BDPG.state.roadway,
      'Official calculator math: ' + e.officialMathLine,
      'Official Calculator Subtotal: ' + BDPG.fmtGal(e.officialSubtotal),
      'Pricing Strategy: ' + BDPG.state.pricingLevel,
      'Final Potential Gallons math: ' + e.finalMathLine,
      'Final Potential Gallons: ' + BDPG.fmtGal(e.finalGallons),
      'Network Fit Grade: ' + r.grade.grade + ' (' + r.grade.gradeLabel + ')'
    ];
    if (r.membership.valuePerGallonConfigured && r.membership.plans.some(function (p) { return p.configured; })) {
      var best = r.membership.plans.filter(function (p) { return p.configured; }).sort(function (a, b) { return b.coverageMultiple - a.coverageMultiple; })[0];
      lines.push('Membership pays for itself at ' + BDPG.fmtGal(best.breakevenGallons) + ' gal/mo (' + best.coverageMultiple + '× coverage).');
    }
    return lines.join('\n');
  };

  BDPG.onCopySummary = function () {
    var text = BDPG.summaryText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Copied to clipboard'); }, function () { BDPG.fallbackCopy(text); });
    } else {
      BDPG.fallbackCopy(text);
    }
  };

  BDPG.fallbackCopy = function (text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e) { alert(text); }
    document.body.removeChild(ta);
  };

  BDPG.analysisNarrativeHtml = function () {
    var r = BDPG.state.result, e = r.estimate;
    var levers = [];
    if (e.amenityPct < 0.02) {
      var gain = Math.round(e.baseline * (0.02 - e.amenityPct));
      levers.push('Reaching "Good / full service" amenities adds up to +2% ≈ ' + BDPG.fmtGal(gain) + ' gal/mo.');
    }
    if (e.reviewPct < 0.02) {
      var rgain = Math.round(e.baseline * (0.02 - e.reviewPct));
      levers.push('Reaching a 3.6+ Trucker Path rating adds +2% ≈ ' + BDPG.fmtGal(rgain) + ' gal/mo.');
    }
    var pricingLevels = BDPG_CONFIG.PRICING_LEVELS;
    var moreAggressiveIdx = pricingLevels.indexOf(BDPG.state.pricingLevel) - 1;
    if (moreAggressiveIdx >= 0) {
      var nextLevel = pricingLevels[moreAggressiveIdx];
      var nextPct = BDPG_CONFIG.PRICING_ADJUST[nextLevel];
      var pgain = Math.round(e.baseline * (nextPct - e.pricingPct));
      levers.push('Moving from "' + BDPG.state.pricingLevel + '" to "' + nextLevel + '" pricing adds ' +
        (pgain >= 0 ? '+' : '') + BDPG.fmtGal(pgain) + ' gal/mo to the Final Potential Gallons (does not change the official calculator subtotal).');
    }
    var leverHtml = levers.length ? '<ul>' + levers.map(function (l) { return '<li>' + BDPG.escHtml(l) + '</li>'; }).join('') + '</ul>' : '<p>Already at the top band for Amenities, Review, and Pricing.</p>';

    return '<div class="bdpg-box" style="margin-top:14px"><div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Analysis</div></div>' +
      '<p style="font-size:.85em">' + BDPG.escHtml(e.officialMathLine) + '</p>' +
      '<p style="font-size:.85em">' + BDPG.escHtml(e.finalMathLine) + '</p>' +
      '<div style="margin-top:8px;font-size:.85em"><b>Levers that would move the number:</b>' + leverHtml + '</div>' +
      '<div style="margin-top:8px;font-size:.85em"><b>Network Fit:</b> Grade ' + r.grade.grade + ' (' + BDPG.escHtml(r.grade.gradeLabel) + '), ' +
        Math.round(r.grade.rangePositionPct) + '% of its profile\'s range, ' + Math.round(r.grade.signalAvg) + '/100 avg on Supporting Details.</div>' +
    '</div>';
  };

  BDPG.networkContextHtml = function () {
    var r = BDPG.state.result;
    if (!BDPG.networkContext || !r.region) return '';
    var regionData = BDPG.networkContext.byRegion[r.region];
    if (!regionData) return '';

    var typeRows = Object.keys(regionData.byType).map(function (t) {
      return '<tr><td>' + BDPG.escHtml(t) + '</td><td style="text-align:right">' + regionData.byType[t] + '</td></tr>';
    }).join('');

    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div class="sec-hdr" style="margin-bottom:8px"><div class="sec-title" style="font-size:.85em">Network Context — ' + BDPG.escHtml(r.region) + '</div></div>' +
      '<div style="font-size:.85em;margin-bottom:8px">' + regionData.total + ' active locations in this region ' +
      '(as of ' + BDPG.escHtml(BDPG.networkContext.asOf) + ')</div>' +
      '<table class="dt" style="width:100%;font-size:.82em"><thead><tr><th>Type</th><th style="text-align:right">Count</th></tr></thead><tbody>' + typeRows + '</tbody></table>' +
    '</div>';
  };

  BDPG.getSavedProfiles = function () {
    try {
      var v = JSON.parse(localStorage.getItem('roadysBDPGProfiles') || '[]');
      // A corrupted value (e.g. hand-edited to "{}" or "x") must not take
      // down every caller -- getSavedProfiles() is the one place all of
      // them read through, so guarding here fixes it everywhere at once.
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  };

  // Captures what the Prospects tracker table shows, from the *current*
  // state and result, so the tracker never has to re-derive it. A profile
  // saved before Generate has run has null gallons and an empty grade --
  // that is legitimate data, not corruption.
  BDPG.trackerSummary = function () {
    var s = BDPG.state, r = s.result, e = r ? r.estimate : null;
    return {
      name: BDPG.displayName(),
      locationType: s.prospect.locationType || '',
      city: s.prospect.city || '',
      stateCode: s.state || '',
      region: s.state ? BusDevGallonsCalc.resolveRegion(s.state) : '',
      profile: s.profile || '', roadway: s.roadway || '',
      officialSubtotal: e ? e.officialSubtotal : null,
      finalGallons: e ? e.finalGallons : null,
      grade: r && r.grade ? r.grade.grade : '', gradeLabel: r && r.grade ? r.grade.gradeLabel : '',
      preEvalSignal: s.prospect.preEvalSignal || '',
      amenityLevel: s.amenityLevel || '', pricingLevel: s.pricingLevel || '',
      rewardsLevel: s.rewardsLevel || ''
    };
  };

  // Profiles saved before this release have no `prospect` and no `summary`.
  // Every field falls back to a dash or empty string; nothing here may ever
  // render "undefined", and a legitimate zero (=== 0) must not collapse to
  // the "missing" fallback the way `|| null` would.
  BDPG.readSummary = function (p) {
    var sum = p.summary || {};
    var st = p.state || {};
    var pr = st.prospect || {};
    return {
      name: sum.name || p.name || pr.name || '—',
      locationType: sum.locationType || pr.locationType || '',
      city: sum.city || pr.city || '',
      stateCode: sum.stateCode || st.state || '',
      region: sum.region || (st.state ? BusDevGallonsCalc.resolveRegion(st.state) : '') || '',
      profile: sum.profile || st.profile || '', roadway: sum.roadway || st.roadway || '',
      officialSubtotal: (sum.officialSubtotal === 0 || sum.officialSubtotal) ? sum.officialSubtotal : null,
      finalGallons: (sum.finalGallons === 0 || sum.finalGallons) ? sum.finalGallons : null,
      grade: sum.grade || '', gradeLabel: sum.gradeLabel || '',
      preEvalSignal: sum.preEvalSignal || pr.preEvalSignal || '',
      amenityLevel: sum.amenityLevel || st.amenityLevel || '',
      pricingLevel: sum.pricingLevel || st.pricingLevel || '',
      rewardsLevel: sum.rewardsLevel || st.rewardsLevel || '',
      savedAt: p.savedAt || ''
    };
  };

  BDPG.onSaveProfile = function () {
    var name = BDPG.resolveProspectName() || prompt('Name this profile:');
    if (!name) return;
    // The prompt fallback above is otherwise a dead end: BDPG.displayName()
    // (used for both the record's `name` and `summary.name` below) only
    // ever reads through BDPG.resolveProspectName() (prospect.name /
    // supportingDetails.prospectName), so a typed prompt answer has to be
    // written back into state or it vanishes and every display falls back
    // to the literal "Prospect". Guard runs before the write below, so the
    // write can't make its own condition false.
    if (!BDPG.resolveProspectName()) {
      BDPG.state.prospect.name = name;
    }
    var profiles = BDPG.getSavedProfiles();

    // Re-saving a prospect that came from the tracker (or that this page
    // saved a moment ago) updates that record instead of appending another
    // one. The tracker's averages and its grade/signal distributions count
    // rows, so three rows for one prospect misreports the pipeline
    // threefold -- the natural "pull it up, refresh the numbers, save" loop
    // used to do exactly that.
    //
    // The binding is dropped the moment the displayed name stops matching
    // the record's: a rep who types a different prospect over the top of a
    // loaded one is starting a new record and must never overwrite the old
    // one. That errs toward an extra row (harmless, deletable) rather than
    // toward silent data loss.
    var idx = -1;
    if (BDPG.currentProfileId) {
      for (var i = 0; i < profiles.length; i++) {
        if (profiles[i].id === BDPG.currentProfileId) { idx = i; break; }
      }
      if (idx >= 0 && profiles[idx].name !== BDPG.displayName()) idx = -1;
    }

    // Nothing may be stored that describes a different input set than the
    // result it carries. By the time Save runs, that can only be true one
    // way -- an input changed after Generate, so invalidateResult() already
    // dropped the result -- and the two honest outcomes are "store it blank"
    // or "go back and Generate". Which one it is has to be the rep's call,
    // never a silent recompute of the number they last read on screen.
    if (!BDPG.state.result) {
      var prevSum = (idx >= 0 && profiles[idx].summary) ? profiles[idx].summary : null;
      var wouldBlankStoredFigures = !!prevSum &&
        (isNum(prevSum.officialSubtotal) || isNum(prevSum.finalGallons));
      if (BDPG.state.resultStale || wouldBlankStoredFigures) {
        var why = BDPG.state.resultStale
          ? 'An input changed after the last Generate, so there are no current results to save.'
          : 'No value profile has been generated since this prospect was loaded, so there are no current results to save.';
        if (!confirm(why + '\n\nSaving now stores this prospect with BLANK gallon figures and no grade.\n\n' +
                     'OK — save it blank.\nCancel — go back and click Generate Value Profile first.')) return;
      }
    }

    var snapshot = JSON.parse(JSON.stringify(BDPG.state));
    delete snapshot.result;
    delete snapshot.resultStale;
    var record = {
      id: idx >= 0 ? profiles[idx].id : 'bdpg_' + Date.now(),
      name: BDPG.displayName(),
      savedAt: new Date().toISOString(),
      state: snapshot,
      summary: BDPG.trackerSummary()
    };
    if (idx >= 0) profiles[idx] = record; else profiles.push(record);
    localStorage.setItem('roadysBDPGProfiles', JSON.stringify(profiles));
    BDPG.currentProfileId = record.id;
    toast(idx >= 0 ? 'Profile updated' : 'Profile saved');
    BDPG.render();
    // After the render, so step2Html()'s pricingLevel/amenityLevel defaults
    // are already settled and the baseline matches what is now on screen.
    BDPG.savedSig = BDPG.stateSig();
  };

  // Returns true only if the profile was actually loaded, so callers that
  // do more afterwards (onTrackerLoad's tab switch, onTrackerExport's
  // generate-and-print) stop when the rep declines.
  // `skipConfirm` is for callers that have already asked with a message of
  // their own -- never a way to skip the question altogether.
  BDPG.onLoadProfile = function (id, skipConfirm) {
    var profiles = BDPG.getSavedProfiles();
    var found = profiles.filter(function (p) { return p.id === id; })[0];
    if (!found) return false;
    // Loading replaces BDPG.state wholesale and there is no undo and no
    // history in roadysBDPGProfiles -- an in-progress prospect that was
    // never saved is simply gone. Ask first.
    if (!skipConfirm && !BDPG.confirmDiscard(
      'You have unsaved changes on the Potential Gallons tab.\n\n' +
      'Loading "' + (found.name || 'this prospect') + '" replaces them, and they cannot be recovered.\n\nContinue?')) return false;
    BDPG.state = JSON.parse(JSON.stringify(found.state));
    BDPG.state.result = null;
    // A deliberate load is not a stale result -- there is simply no result
    // yet. (And a record saved by an older build could carry the flag in its
    // snapshot; it must not resurrect a warning about someone else's edit.)
    BDPG.state.resultStale = false;
    BDPG.currentProfileId = found.id;
    // A profile saved before Task 6 has no preEvalOpen at all -- default it
    // to open, matching the documented default for every other page load.
    if (BDPG.state.preEvalOpen === undefined) BDPG.state.preEvalOpen = true;
    // A profile saved before the rewards term existed has no rewardsLevel;
    // default it so it resolves to 0% and its stored numbers stay put.
    if (!BDPG.state.rewardsLevel) BDPG.state.rewardsLevel = BDPG_CONFIG.REWARDS_DEFAULT;
    // A profile saved before Task 4 has no `prospect` at all -- default it
    // to the same empty shape the page starts with, so prospect-reading
    // code (the Step 0 card, the badge, trackerSummary) never throws on
    // a pre-Task-4 record.
    if (!BDPG.state.prospect) {
      BDPG.state.prospect = { name: '', street: '', city: '', locationType: '', notes: '' };
    }
    BDPG.render();
    BDPG.savedSig = BDPG.stateSig();
    return true;
  };

  BDPG.onDeleteProfile = function (id) {
    if (!confirm('Delete this saved profile?')) return;
    var profiles = BDPG.getSavedProfiles().filter(function (p) { return p.id !== id; });
    localStorage.setItem('roadysBDPGProfiles', JSON.stringify(profiles));
    if (BDPG.currentProfileId === id) {
      // What is on the calculator tab came from the record just deleted, so
      // it is no longer stored anywhere: drop the update binding (a later
      // Save must create a new record, not resurrect this id) and mark the
      // state as unsaved work. '' can never equal a real signature, so
      // hasUnsavedWork() reports true until the next Save or Load.
      BDPG.currentProfileId = null;
      BDPG.savedSig = '';
    }
    BDPG.render();
  };

  BDPG.activeTab = 'calc';
  BDPG.switchTab = function (name) {
    BDPG.activeTab = name;
    document.getElementById('bdpg-tab-calc').classList.toggle('active', name === 'calc');
    document.getElementById('bdpg-tab-prospects').classList.toggle('active', name === 'prospects');
    BDPG.render();
  };

  // Signal -> chip tone, mirrors the tones BDPG.preEval() itself assigns
  // (see the c7 overall-signal chip): Strong=green, Moderate=yellow, Review=red.
  BDPG.PREEVAL_SIGNAL_TONES = { Strong: 'green', Moderate: 'yellow', Review: 'red' };

  // Rewards posture -> chip/segment tone. Keyed by level name (matching
  // BDPG_CONFIG.REWARDS_LEVELS), not position, so this one map serves both
  // the tracker's Rewards column badge below and the Step 2 segmented
  // control's selected-background color (see rcol in step2Html) -- an
  // index-keyed array next to this would just invite the same reordering
  // hazard this map exists to avoid.
  BDPG.REWARDS_TONES = {
    "Participating in Roady's Rewards": 'green',
    'Undecided / unknown': 'yellow',
    'Not participating': 'red'
  };

  // Plain `[]` lookups on REGION_COLORS/GRADE_COLORS/PREEVAL_SIGNAL_TONES
  // would resolve a stored value of "constructor" or "toString" to an
  // inherited Object.prototype function instead of undefined, which then
  // blows up the caller (e.g. hexToRgba(fn, ...) calling fn.startsWith).
  // Requires hand-edited storage to reach, but the table must never break
  // on one bad cell, so every map lookup below goes through this.
  function hasOwn(obj, key) { return !!key && Object.prototype.hasOwnProperty.call(obj, key); }

  // Same reasoning, for the stored gallons values. BDPG.readSummary() only
  // screens out null/undefined, so a hand-edited record can hand the table a
  // string, an object or NaN. `!= null` would let all three through into
  // fmtGal() and print the literal "NaN" -- and in the diff-arrow chain a NaN
  // difference compares false against both `> 0` and `< 0` and lands on the
  // `else`, so corrupt data would render as the confident business claim
  // "No pricing adjustment". Every numeric cell tests the value itself with
  // the same guard trackerStatsHtml uses for the averages, and falls back to
  // the same "—" the rest of the table uses for missing data.
  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  // One row of the Prospects tracker, built entirely from BDPG.readSummary()
  // -- never from p.state/p.summary directly -- so a pre-Task-7 record
  // renders dashes instead of throwing or printing "undefined".
  BDPG.trackerRowHtml = function (p) {
    var sum = BDPG.readSummary(p);

    var typeBadge = sum.locationType
      ? ' <span class="badge tag-gray">' + BDPG.escHtml(sum.locationType) + '</span>' : '';
    var nameCell = BDPG.escHtml(sum.name) + typeBadge;

    var cityState = (!sum.city && !sum.stateCode) ? '—' :
      BDPG.escHtml(sum.city || '') + (sum.city && sum.stateCode ? ', ' : '') + BDPG.escHtml(sum.stateCode || '');
    // Only append the region chip when there's a real city/state to append it
    // to -- otherwise the cell could read "— Southeast", which defeats the
    // sort handler's exact `=== '—'` "dashes sort last" check (currently
    // unreachable since readSummary derives region from the same state field
    // as stateCode, but one line of defence costs nothing).
    var regionChip = '';
    if (cityState !== '—' && sum.region && hasOwn(BDPG.REGION_COLORS, sum.region)) {
      var rc = BDPG.REGION_COLORS[sum.region];
      regionChip = ' <span class="badge" style="background:' + hexToRgba(rc, 0.18) + ';color:' + rc + '">' +
        BDPG.escHtml(sum.region) + '</span>';
    }
    var locationCell = cityState + regionChip;

    var profileCell = (sum.profile && sum.roadway)
      ? BDPG.escHtml(sum.profile) + ' · ' + BDPG.escHtml(sum.roadway) : '—';

    var officialCell = isNum(sum.officialSubtotal) ? BDPG.fmtGal(sum.officialSubtotal) : '—';

    var finalCell = isNum(sum.finalGallons) ? BDPG.fmtGal(sum.finalGallons) : '—';
    if (isNum(sum.finalGallons) && isNum(sum.officialSubtotal)) {
      var diff = sum.finalGallons - sum.officialSubtotal;
      if (diff > 0) {
        finalCell += ' <span style="color:var(--green)" title="Pricing posture adds ' + BDPG.fmtGal(diff) + ' gal/mo">▲</span>';
      } else if (diff < 0) {
        finalCell += ' <span style="color:var(--red)" title="Pricing posture removes ' + BDPG.fmtGal(Math.abs(diff)) + ' gal/mo">▼</span>';
      } else {
        finalCell += ' <span style="color:var(--muted)" title="No pricing adjustment">●</span>';
      }
    }

    var gradeCell = '—';
    if (sum.grade) {
      var gcol = hasOwn(BDPG.GRADE_COLORS, sum.grade) ? BDPG.GRADE_COLORS[sum.grade] : 'var(--muted)';
      gradeCell = '<span class="badge" title="' + BDPG.escHtml(sum.gradeLabel || '') + '" style="background:rgba(255,255,255,.08);color:' +
        gcol + ';border:1px solid ' + gcol + '">' + BDPG.escHtml(sum.grade) + '</span>';
    }

    var signalCell = '—';
    if (sum.preEvalSignal) {
      var tone = hasOwn(BDPG.PREEVAL_SIGNAL_TONES, sum.preEvalSignal) ? BDPG.PREEVAL_SIGNAL_TONES[sum.preEvalSignal] : 'gray';
      signalCell = '<span class="badge tag-' + tone + '">' + BDPG.escHtml(sum.preEvalSignal) + '</span>';
    }

    var amenityCell = sum.amenityLevel ? BDPG.escHtml(sum.amenityLevel) : '—';
    var pricingCell = sum.pricingLevel ? BDPG.escHtml(sum.pricingLevel) : '—';

    // Tone by posture, via the same hasOwn-guarded map style every other
    // lookup in this file uses, so a hand-edited value can't resolve to an
    // inherited Object.prototype member.
    var rewardsCell = '—';
    if (sum.rewardsLevel) {
      var rtone = hasOwn(BDPG.REWARDS_TONES, sum.rewardsLevel) ? BDPG.REWARDS_TONES[sum.rewardsLevel] : 'gray';
      rewardsCell = '<span class="badge tag-' + rtone + '">' + BDPG.escHtml(sum.rewardsLevel) + '</span>';
    }
    // "YYYY MM DD" sliced straight from the stored ISO string -- not
    // `new Date(...).toLocaleDateString()` -- for three reasons (see
    // task-8-ruling.md): (1) the shared sort handler's numeric-parse strips
    // whitespace but not "/" or "-", so this is the one digit-grouping that
    // collapses to a single chronologically-correct integer instead of
    // tying same-year or same-month rows; (2) slicing never produces the
    // literal string "Invalid Date" for a non-empty-but-unparseable value;
    // (3) it sidesteps the UTC-stored/local-rendered day-shift a Date
    // conversion could introduce for a timestamp saved late in the day.
    var savedCell = (typeof sum.savedAt === 'string' && sum.savedAt.length >= 10)
      ? sum.savedAt.slice(0, 10).replace(/-/g, ' ') : '—';

    // A record missing its id (unreachable from any real Save Profile,
    // which always writes 'bdpg_' + Date.now(), but hand-edited storage
    // could produce one) must not render action buttons that silently
    // no-op or, worse, consume a Delete confirmation and delete nothing.
    var pid = p.id || '';
    var actionsCell;
    if (pid) {
      // JSON.stringify + escaping only the HTML-attribute-delimiting `"`
      // (matching the existing onLocationType(...) pattern elsewhere in
      // this file) is what actually neutralizes an id containing a quote
      // inside this onclick="..." attribute -- HTML-entity-escaping the id
      // itself (BDPG.escHtml) would not, because the browser decodes
      // entities in the attribute value before compiling it as JS, so an
      // escaped `'` would decode right back into a string-breaking quote.
      var idJs = JSON.stringify(pid).replace(/"/g, '&quot;');
      actionsCell =
        '<button class="btn btn-accent" onclick="BDPG.onTrackerLoad(' + idJs + ')">Load</button> ' +
        '<button class="btn" onclick="BDPG.onTrackerExport(' + idJs + ')">Export PDF</button> ' +
        '<button class="btn" onclick="BDPG.onDeleteProfile(' + idJs + ')">Delete</button>';
    } else {
      actionsCell = '<span style="color:var(--muted);font-size:.8em">No id — can’t act</span>';
    }

    return '<tr>' +
      '<td>' + nameCell + '</td>' +
      '<td>' + locationCell + '</td>' +
      '<td>' + profileCell + '</td>' +
      '<td>' + officialCell + '</td>' +
      '<td>' + finalCell + '</td>' +
      '<td>' + gradeCell + '</td>' +
      '<td>' + signalCell + '</td>' +
      '<td>' + amenityCell + '</td>' +
      '<td>' + pricingCell + '</td>' +
      '<td>' + rewardsCell + '</td>' +
      '<td>' + savedCell + '</td>' +
      '<td>' + actionsCell + '</td>' +
    '</tr>';
  };

  // Roll-up beneath the Prospects table: five grade chips + three signal
  // chips (always all eight, even at zero, per the user's ruling that the
  // shape must stay fixed and comparable) plus the two averages. Every
  // field comes from BDPG.readSummary(p) -- never p.state/p.summary
  // directly -- so a legacy record (no `prospect`, no `summary`) degrades
  // exactly like it does in trackerRowHtml: an empty grade/signal is
  // excluded from its distribution (never miscounted as 'A' or 'Strong'),
  // and a null gallons value is excluded from the averages' denominator
  // rather than counted as zero -- a profile saved before Generate has run
  // has null gallons, and averaging it in as 0 would silently drag every
  // average down and misreport the pipeline.
  BDPG.trackerStatsHtml = function (profiles) {
    var gradeOrder = ['A', 'B', 'C', 'D', 'E'];
    var gradeCounts = { A: 0, B: 0, C: 0, D: 0, E: 0 };
    var signalOrder = ['Strong', 'Moderate', 'Review'];
    var signalCounts = { Strong: 0, Moderate: 0, Review: 0 };
    var officialSum = 0, officialN = 0, finalSum = 0, finalN = 0;

    profiles.forEach(function (p) {
      var sum = BDPG.readSummary(p);
      // hasOwn guards against a stored grade/signal that isn't one of the
      // known five/three (or a prototype-polluting key like "constructor")
      // silently landing in the wrong bucket -- an unrecognized value is
      // simply excluded, same treatment as an empty one.
      if (hasOwn(gradeCounts, sum.grade)) gradeCounts[sum.grade]++;
      if (hasOwn(signalCounts, sum.preEvalSignal)) signalCounts[sum.preEvalSignal]++;
      // isNum(), not just `!= null`: readSummary only guards against
      // null/undefined, so a hand-edited record holding a numeric *string*
      // ('5000') would pass `!= null` and then `+=` would concatenate
      // instead of add, and any other non-numeric value would poison both
      // averages to NaN for the whole tracker. A rejected value must not
      // inflate the denominator either, so the count only increments
      // alongside the sum. Same guard the row cells above use, so a value
      // the table prints as "—" is also the one the averages skip.
      if (isNum(sum.officialSubtotal)) { officialSum += sum.officialSubtotal; officialN++; }
      if (isNum(sum.finalGallons)) { finalSum += sum.finalGallons; finalN++; }
    });

    var avgOfficial = officialN ? BDPG.fmtGal(officialSum / officialN) + ' gal/mo' : '—';
    var avgFinal = finalN ? BDPG.fmtGal(finalSum / finalN) + ' gal/mo' : '—';

    var gradeChips = gradeOrder.map(function (g) {
      // hasOwn for consistency with every other GRADE_COLORS/PREEVAL_SIGNAL_TONES
      // lookup in this file (see the comment on hasOwn above) -- unreachable
      // today since gradeOrder is this function's own fixed literal, but one
      // lookup style for this map beats two.
      var col = hasOwn(BDPG.GRADE_COLORS, g) ? BDPG.GRADE_COLORS[g] : 'var(--muted)';
      return '<span class="badge" style="background:rgba(255,255,255,.08);color:' + col +
        ';border:1px solid ' + col + ';margin:0 6px 6px 0;display:inline-block">' +
        BDPG.escHtml(g) + ' ×' + gradeCounts[g] + '</span>';
    }).join('');

    var signalChips = signalOrder.map(function (s) {
      var tone = BDPG.PREEVAL_SIGNAL_TONES[s];
      return '<span class="badge tag-' + tone + '" style="margin:0 6px 6px 0;display:inline-block">' +
        BDPG.escHtml(s) + ' ×' + signalCounts[s] + '</span>';
    }).join('');

    var statLbl = 'font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px';

    return '<div class="cc" style="margin-top:16px">' +
      '<div class="cc-lbl">Tracker Summary</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">' +
        '<div><div style="' + statLbl + '">Avg Official Subtotal</div>' +
          '<div style="font-size:1.2em;font-weight:700">' + avgOfficial + '</div></div>' +
        '<div><div style="' + statLbl + '">Avg Final Potential Gallons</div>' +
          '<div style="font-size:1.2em;font-weight:700">' + avgFinal + '</div></div>' +
        '<div><div style="' + statLbl + '">Grade Distribution</div>' +
          '<div>' + gradeChips + '</div></div>' +
        '<div><div style="' + statLbl + '">Pre-Eval Signal</div>' +
          '<div>' + signalChips + '</div></div>' +
      '</div></div>';
  };

  BDPG.prospectsHtml = function () {
    // Default sort: saved date descending (newest first). ISO 8601 strings
    // sort correctly lexicographically; a missing savedAt (pre-Task-7
    // record) sorts to the bottom since '' < any real timestamp. The
    // delegated table-header handler (bound once on document, see the
    // SORTABLE TABLES block near the top of this file) takes over from
    // here on any header click -- this only sets the order shown on load.
    var profiles = BDPG.getSavedProfiles().slice().sort(function (a, b) {
      return (b.savedAt || '').localeCompare(a.savedAt || '');
    });

    var rows = profiles.length
      ? profiles.map(BDPG.trackerRowHtml).join('')
      : '<tr><td colspan="12" style="text-align:center;padding:24px;color:var(--muted)">📋 No prospects evaluated yet — complete a profile above and save it.</td></tr>';

    // The summary card is a separate .cc sibling, not a <tr> in this table
    // -- the delegated sort handler operates on `tbody > tr` (see the
    // SORTABLE TABLES block), so keeping the roll-up entirely outside the
    // <table> means a header click can never sort it into the body,
    // duplicate it, or lose it. Hidden outright with zero profiles: an
    // average of nothing and all-zero chips would just be noise sitting
    // above the tracker's own "no prospects yet" empty state.
    var statsHtml = profiles.length ? BDPG.trackerStatsHtml(profiles) : '';

    return '<div class="cc"><div class="cc-lbl">Prospects Tracker</div>' +
      '<div class="tw"><table class="dt"><thead><tr>' +
        '<th>Prospect</th><th>Location</th><th>Location Profile</th>' +
        '<th>Official Subtotal</th><th>Final Potential Gallons</th>' +
        '<th>Grade</th><th>Pre-Eval</th><th>Amenity Level</th>' +
        '<th>Pricing Posture</th><th>Rewards</th><th>Saved</th><th style="width:50px">Actions</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' + statsHtml;
  };

  BDPG.onTrackerLoad = function (id) {
    if (!id) return;
    // onLoadProfile asks before discarding unsaved work and returns false if
    // the rep declines -- in which case we stay on the Prospects tab with
    // their in-progress calculation untouched.
    if (!BDPG.onLoadProfile(id)) return;
    BDPG.switchTab('calc');
    BDPG.savedSig = BDPG.stateSig();
  };

  // Export needs a generated result, and onLoadProfile deliberately clears
  // state.result (see its comment) -- but onLoadProfile also replaces the
  // *entire* BDPG.state wholesale. A REFUSED export must not do that: if a
  // rep has an in-progress, not-yet-saved profile on the Potential Gallons
  // tab and clicks Export PDF on some other tracker row that turns out to
  // be ungeneratable, the toast must be the only effect -- their unsaved
  // work has to survive. So the profile/roadway check has to run against
  // the *saved record itself* (via getSavedProfiles(), same as
  // onLoadProfile reads it) before anything touches BDPG.state, not against
  // BDPG.state after onLoadProfile has already overwritten it.
  BDPG.onTrackerExport = function (id) {
    if (!id) return;
    var found = BDPG.getSavedProfiles().filter(function (p) { return p.id === id; })[0];
    if (!found) return;
    var st = found.state || {};
    // BusDevGallonsCalc.getBaselineRow() is exactly the check
    // BDPG.onGenerate() itself uses to decide whether to bail with an
    // alert(), so checking it here first means that alert is never reached
    // and the tracker can show a clear toast instead of an empty print
    // dialog -- all before BDPG.state is touched.
    if (!BusDevGallonsCalc.getBaselineRow(st.profile, st.roadway)) {
      toast('This saved prospect is missing a Location Profile/Roadway and can\'t generate a PDF.', 'err');
      return;
    }

    // Only now, once the export is known to be possible, is anything about
    // to be discarded. "Export PDF" does not read as "throw away what I am
    // working on", so the rep has to be told that it does -- there is no
    // prompt, no toast and no undo on the other side of this.
    if (!BDPG.confirmDiscard(
      'You have unsaved changes on the Potential Gallons tab.\n\n' +
      'Exporting "' + (found.name || 'this prospect') + '" loads it over them, and they cannot be recovered.\n\nContinue?')) return;

    BDPG.onLoadProfile(id, true);
    try {
      BDPG.switchTab('calc');
      BDPG.onGenerate();
      BDPG.savedSig = BDPG.stateSig();
    } catch (err) {
      // The profile/roadway check above can pass yet render() still throw
      // deeper in -- e.g. a hand-edited record missing supportingDetails or
      // amenityDetails -- which would otherwise leave #bdpg-content stuck
      // mid-render and the page inert. Recover to a working tab and say so,
      // rather than leaving that promise conditional.
      BDPG.activeTab = 'prospects';
      BDPG.render();
      toast('Could not generate a value profile for this prospect.', 'err');
      return;
    }
    if (!BDPG.state.result) {
      toast('Could not generate a value profile for this prospect.', 'err');
      return;
    }
    BDPG.onExportPdf();
  };

  window.BDPG = BDPG;
})();

BDPG.toggleTheme = function () {
  document.body.classList.toggle('day-mode');
  try { localStorage.setItem('roadysBDPGTheme', document.body.classList.contains('day-mode') ? 'day' : 'night'); } catch (e) {}
};

document.addEventListener('DOMContentLoaded', function () { BDPG.render(); });
</script>
</body>
</html>
