      '<div style="font-size:.7em;color:var(--muted);margin-top:8px;padding-top:7px;' +
        'border-top:1px solid var(--border)">Profiles with fewer than ' +
        BDPG_STATS.DYNAMIC_BASELINE_MIN_N + ' reporting locations are not drawn — the same threshold ' +
        'that decides whether a profile gets an observed baseline at all.</div>' +
    '</div>';
  };

  // The at-a-glance benchmark: what does a Roady's truck stop move in a
  // month? Two figures, not one, and both labelled.
  //
  // The mean is what the brief asked for -- 12-month gallons / 12 / count --
  // and answers "how much volume does the network carry per site". The
  // median answers "what does a typical site do", and on this file they are
  // 17,003 against 7,829. Showing only the mean would put the single largest
  // number in the tool at the top of the tab, roughly double every baseline
  // and regional figure the same tool prints elsewhere, with nothing on
  // screen to explain the gap. Showing only the median would not answer the
  // question. The caption names what separates them.
  BDPG.networkSummaryCardHtml = function () {
    var s = BDPG_STATS.networkSummary(BDPG.effectiveLocations());
    if (!s.n) return '';
    var meta = BDPG.locationsMeta;
    function stat(value, label, accent) {
      return '<div><div style="font-family:var(--ff);font-size:1.75em;font-weight:800;line-height:1;' +
        'color:var(--' + (accent ? 'accent' : 'text') + ')">' + value + '</div>' +
        '<div style="font-size:.74em;color:var(--muted);margin-top:3px;max-width:190px">' + label + '</div></div>';
    }
    return '<div class="bdpg-box" style="margin-bottom:10px">' +
      '<div class="sec-hdr" style="margin-bottom:10px"><div class="sec-title" style="font-size:.85em">' +
        'Network Average — Truck Stops</div></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:30px">' +
        // "Median" is labelled Average everywhere in the UI now, which forces
        // a rename on this card specifically: it shows BOTH statistics side by
        // side, so calling one "Average" and leaving the other "Mean" would
        // put two different numbers under two words most readers treat as
        // synonyms. The mean therefore gets named by its arithmetic instead,
        // which is clearer than either label was.
        stat(BDPG.fmtGal(s.meanGalMo), '<b>Total ÷ locations</b> — all network volume ÷ 12 ÷ ' + s.n, true) +
        stat(BDPG.fmtGal(s.medianGalMo), '<b>Average</b> gal/mo — what a typical truck stop does', true) +
        stat(String(s.n), 'qualifying truck stops (at least ' +
          BDPG.fmtGal(BDPG_STATS.MIN_REPORTING_GAL_MO) + ' gal/mo and at least ' +
          BDPG_STATS.MIN_REPORTING_MONTHS + ' reporting months)') +
        stat(BDPG.fmtGal(s.gallons12mo), 'total 12-month gallons across those locations') +
      '</div>' +
      '<div style="font-size:.72em;color:var(--muted);margin-top:10px">' +
        'Truck Stop and Truck Stop / Service Center only — fuel stops are excluded from both the ' +
        'gallons and the count, so the figure matches its label. ' +
        'Total ÷ locations runs well above the Average because a small number of very large sites ' +
        'carry much of the volume. Every baseline and regional figure elsewhere in this tool is the ' +
        'Average, the typical-site number — not the total-divided figure.' +
        (meta && meta.asOf ? ' As of ' + BDPG.escHtml(meta.asOf) + '.' : '') +
      '</div></div>';
  };

  // Amber whenever the view is filtered, because every median on this tab
  // and every baseline in the calculator is then computed over a subset the
  // reader chose and may have forgotten choosing.
  BDPG.hiddenLocationsBarHtml = function () {
    var active = BDPG.hiddenActiveCount();
    var orphans = BDPG.hiddenOrphanIds().length;
    if (!active && !orphans) return '';
    return '<div class="bdpg-box" style="border-color:var(--yellow);margin-bottom:10px;font-size:.84em">' +
      '<b>⚠ ' + active + ' location' + (active === 1 ? ' is' : 's are') + ' hidden in this browser.</b> ' +
      'They are excluded from every average, count, region delta and the baseline analysis — the ' +
      'figures on this page and in the calculator describe the remaining ' +
      BDPG.effectiveLocations().length + '. Nothing has been removed from ' +
      '<code>network-locations.json</code>; this is local to this browser.' +
      (orphans ? ' <span style="color:var(--muted)">(' + orphans + ' more hidden id' +
        (orphans === 1 ? ' is' : 's are') + ' not in the current file and suppress nothing.)</span>' : '') +
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn" onclick="BDPG.onToggleShowHidden()">' +
          (BDPG.showHidden ? 'Hide them again' : 'Show hidden (' + active + ')') + '</button>' +
        '<button class="btn" onclick="BDPG.onRestoreAllHidden()">Restore all</button>' +
        '<button class="btn" onclick="BDPG.onExportHidden()" ' +
          'title="Copies the hidden ids, ready to paste into whatever regenerates ' +
          'network-locations.json for a permanent removal.">Export hidden ids</button>' +
      '</div></div>';
  };

  // ── Add Location ──────────────────────────────────────────────────────────
  //
  // DEV-gated, and local until committed. The modal says so in as many words,
  // because the failure mode here is not a bug but a misunderstanding: a rep
  // who adds six locations and quotes the resulting medians is quoting numbers
  // that exist in no other browser.
  BDPG.addFormOpen = false;
  BDPG.addForm = null;
  BDPG.addFormError = '';

  BDPG.blankAddForm = function () {
    return { id: '', city: '', state: '', group: "Roady's", type: 'Truck Stop',
             dieselLanes: '', roadway: '', gallons12mo: '', reportingMonths: '' };
  };

  BDPG.onOpenAddLocation = function () {
    BDPG.addFormOpen = true;
    BDPG.addForm = BDPG.blankAddForm();
    BDPG.addFormError = '';
    BDPG.render();
  };

  BDPG.onCloseAddLocation = function () {
    BDPG.addFormOpen = false;
    BDPG.addForm = null;
    BDPG.addFormError = '';
    BDPG.render();
  };

  BDPG.onAddFormChange = function (field, value) {
    if (!BDPG.addForm) return;
    BDPG.addForm[field] = value;
    // Size is derived, so it has to re-resolve as lanes or roadway change --
    // patched in place rather than re-rendering so the field being typed in
    // keeps focus.
    var el = document.getElementById('bdpg-add-size');
    if (el) el.innerHTML = BDPG.addFormSizeHtml();
  };

  BDPG.addFormSizeHtml = function () {
    var f = BDPG.addForm || {};
    var lanes = BDPG_STATS.toFinite(f.dieselLanes);
    var size = BDPG_STATS.sizeForLanes(lanes, f.roadway);
    if (!f.roadway) {
      return '<span style="color:var(--muted)">pick a Roadway to resolve</span>';
    }
    if (lanes === null) {
      return '<span style="color:var(--muted)">enter a diesel lane count to resolve</span>';
    }
    if (size === 'over') {
      return '<span style="color:var(--yellow)">&#9888; no profile — ' +
        BDPG_STATS.BACKROAD_MAX_LANES + '+ lanes on a Backroad is left unmapped for review</span>';
    }
    if (!size) return '<span style="color:var(--muted)">—</span>';
    return '<b style="color:var(--accent)">' + BDPG.escHtml(size) + '</b>' +
      '<span style="color:var(--muted)"> — derived from ' + lanes + ' lanes on ' +
      BDPG.escHtml(f.roadway) + ', by the same rule as every committed row</span>';
  };

  // Returns an error string, or '' when the form is good to save. The rules
  // live in BDPG_STATS.validateNewLocation so they can be tested without a
  // DOM; this adds only the context a person needs to act on the message.
  BDPG.validateAddForm = function (f) {
    var ids = BDPG.locations.map(function (l) { return l.id; })
      .concat(BDPG.addedLocations.map(function (a) { return a.id; }));
    var err = BDPG_STATS.validateNewLocation(f, {
      existingIds: ids,
      allowedTypes: BDPG.LOCATION_TYPES,
      roadways: BDPG_STATS.ROADWAYS,
      resolveRegion: BusDevGallonsCalc.resolveRegion
    });
    if (!err) return '';
    // Say WHERE a clashing id already lives -- the committed file and this
    // browser's own additions need different fixes.
    if (/already exists/.test(err)) {
      var id = str(f.id).trim();
      var inFile = BDPG.locations.some(function (l) { return l.id === id; });
      return 'LID ' + id + ' already exists in ' +
        (inFile ? 'the committed file' : 'a location already added in this browser') +
        '. Ids must be unique or the two rows would collide in every average.';
    }
    if (/Location ID/.test(err)) {
      return err + ' It is how every edit, hidden row and average keys back to this location.';
    }
    if (/state code/.test(err)) {
      return err + ' The region, and so the region delta, is derived from it.';
    }
    return err;
  };

  BDPG.onSaveAddLocation = function () {
    var f = BDPG.addForm;
    if (!f) return;
    // Read straight from the DOM: the per-field handlers patch state as you
    // type, but a field still focused on click may not have fired change yet.
    ['id', 'city', 'state', 'group', 'type', 'dieselLanes', 'roadway', 'gallons12mo',
      'reportingMonths'].forEach(function (k) {
      var el = document.getElementById('bdpg-add-' + k);
      if (el) f[k] = el.value;
    });
    var err = BDPG.validateAddForm(f);
    if (err) { BDPG.addFormError = err; BDPG.render(); return; }

    var row = BDPG.sanitizeAddedLocation(f);
    if (!row) { BDPG.addFormError = 'That could not be saved — check the LID.'; BDPG.render(); return; }

    var prev = BDPG.addedLocations;
    BDPG.addedLocations = prev.concat([row]);
    if (!BDPG.writeAddedLocations()) {
      BDPG.addedLocations = prev;
      BDPG.addFormError = 'This browser would not store the new location — nothing was added.';
      BDPG.render();
      return;
    }
    BDPG.addFormOpen = false;
    BDPG.addForm = null;
    BDPG.addFormError = '';
    BDPG.render();
    toast('Added ' + row.id + ' — local to this browser until committed.');
  };

  BDPG.onRemoveAddedLocation = function (id) {
    var prev = BDPG.addedLocations;
    BDPG.addedLocations = prev.filter(function (a) { return a.id !== id; });
    if (!BDPG.writeAddedLocations()) { BDPG.addedLocations = prev; return; }
    BDPG.render();
  };

  // The handoff to a real commit: the added rows in exactly the schema
  // network-locations.json uses, so they can be pasted into its `locations`
  // array without reshaping. addedLocally is stripped -- it describes where
  // the row lived before it was committed, which stops being true the moment
  // it is.
  BDPG.addedExportText = function () {
    var rows = BDPG.addedLocations.map(function (a) {
      return {
        id: a.id, city: a.city, state: a.state, group: a.group, type: a.type,
        dieselLanes: a.dieselLanes, size: a.size, roadway: a.roadway,
        distanceToInterstate: a.distanceToInterstate,
        gallons12mo: a.gallons12mo, avgGalMo: a.avgGalMo,
        reportingMonths: a.reportingMonths
      };
    });
    return JSON.stringify(rows, null, 2);
  };

  BDPG.onExportAdded = function () {
    if (!BDPG.addedLocations.length) return;
    BDPG.copyText(BDPG.addedExportText(),
      BDPG.addedLocations.length + ' added location' +
      (BDPG.addedLocations.length === 1 ? '' : 's') + ' copied as JSON.');
  };

  BDPG.addLocationModalHtml = function () {

        ' oninput="BDPG.onAddFormChange(\'' + key + '\',this.value)" style="width:100%">' +

        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">' +
          field('id', 'Location ID (LID) *', 'placeholder="e.g. R04312"',

          field('dieselLanes', 'Diesel lanes', 'type="number" min="0" max="99" step="1"',
            'Drives Size, and so the baseline profile.') +
          select('roadway', 'Roadway', [''].concat(BDPG_STATS.ROADWAYS), 'Drives Size with the lane count.') +
          field('gallons12mo', '12-month gallons', 'type="number" min="0" step="1"',

          field('reportingMonths', 'Reporting months', 'type="number" min="0" max="12" step="1"',

          '<button class="btn" onclick="BDPG.onCloseAddLocation()">Cancel</button>' +
        '</div>' +
      '</div></div>';
  };

  BDPG.addedLocationsBarHtml = function () {

    var compOpts = [['complete', 'Complete'], ['incomplete', 'Incomplete'], ['na', 'N/A for baselines']]
      .map(function (p) {
        return '<option value="' + p[0] + '"' + (BDPG.locFilter.completeness === p[0] ? ' selected' : '') +
          '>' + p[1] + '</option>';
      }).join('');

    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
        '<div style="font-weight:700">🗺 Network Locations</div>' +
        '<div style="font-size:.78em;color:var(--muted)">' +

      '<div class="tw"><table class="dt" style="font-size:.8em"><thead><tr>' +
        // width:50px is what the delegated sorter checks to skip a column --

        // HTML entities rather than backslash-escaped apostrophes: this is a

  // The asterisk that hangs off every headline gallons figure that leaves
  // this screen: the on-screen value profile, the exported packet and the
  // Copy Summary. ONE string, because three hand-written copies of a
  // disclosure drift, and the one that drifts is the one on the sheet a
  // prospect keeps.
  //
  // The wording is the client's, verbatim. Note it says "more than 1,000"
  // while the implemented rule is >= 1,000 -- the gap is one location at
  // exactly 1,000 gal/mo, of which the committed file has none.
  BDPG.QUALIFYING_NOTE = '* Based on Roady\'s locations with at least 6 months of reporting '
    + 'data and more than 1,000 gallons per month.';

  BDPG.fmtGal = function (n) { return Math.round(n).toLocaleString(); };

  // Prospect-facing copy uses the long display name ("Heartland / Central
  // Plains"); internal surfaces keep the short key, which matches the config
  // and the admin panel. Falls back to the key so an unmapped value degrades
  // to something readable rather than empty.
  BDPG.regionDisplayName = function (key) {
    return hasOwn(BDPG_CONFIG.BDPG_REGION_DISPLAY, key)
      ? BDPG_CONFIG.BDPG_REGION_DISPLAY[key] : (key || '');
  };

  // Step cards are built by every step-rendering function; keeping the chrome in
  // one helper is what stops the three cards from drifting apart visually.
  BDPG.stepCardOpen = function (num, title, isDone) {
    // Indexed by num directly (⓪=0 … ③=3) rather than num-1, so the Task 4
    // Prospect Profile card (num 0) gets a real glyph instead of falling
    // through to String(num) === "0". The three pre-existing call sites keep
    // passing num 1/2/3 unchanged and still land on ①/②/③.
    var glyph = ['⓪', '①', '②', '③'][num] || String(num);
    return '<div class="bdpg-step' + (isDone ? ' done' : '') + '" id="bdpg-step-card-' + num + '">' +
      '<div class="bdpg-step-hd">' +
        '<div class="bdpg-badge">' + glyph + '</div>' +
        '<div class="bdpg-step-title">' + BDPG.escHtml(title) + '</div>' +
        (isDone ? '<div class="bdpg-check">✓</div>' : '') +
      '</div>';
  };
  BDPG.stepCardClose = function () { return '</div>'; };

  // Flips one step card's "done" styling (left border + checkmark) without a
  // full BDPG.render() -- shared by every targeted DOM patch that can change
  // a card's completion state while the user is mid-keystroke elsewhere
  // (Step 2's typed state field, the Prospect Profile card's fields).
  BDPG.updateStepCardBadge = function (num, isDone) {
    var card = document.getElementById('bdpg-step-card-' + num);
    if (!card) return;
    card.classList.toggle('done', isDone);
    var hd = card.querySelector('.bdpg-step-hd');
    var check = hd ? hd.querySelector('.bdpg-check') : null;
    if (isDone && hd && !check) {
      hd.insertAdjacentHTML('beforeend', '<div class="bdpg-check">✓</div>');
    } else if (!isDone && check) {
      check.remove();
    }
  };

  // Step completion: Step 1 done when profile+roadway resolve to a real baseline
  // row; Step 2 done when the typed/clicked state resolves to a known region.
  BDPG.step1Done = function () {
    var s = BDPG.state;
    return !!(s.profile && s.roadway && BusDevGallonsCalc.getBaselineRow(s.profile, s.roadway));
  };
  BDPG.step2Done = function () {
    return !!(BDPG.state.state && BusDevGallonsCalc.resolveRegion(BDPG.state.state));
  };

  // Prospect Profile only. Scott removed Service Center, Truck Stop / Service
  // Center and C-Store: the tool estimates diesel gallons, and those three
  // never had a baseline profile to map to.
  //
  // Named separately from BDPG.LOCATION_TYPES (the Network Locations tab's
  // filter) because the two lists used to share that name -- this file
  // defined it twice and the later definition silently won, so the filter on
  // one tab was really driven by the selector on another.
  BDPG.PROSPECT_LOCATION_TYPES = ['Truck Stop', 'Fuel Stop'];

  // Prospect Profile (⓪) done when the three required fields are filled. State
  // is BDPG.state.state itself -- there is no prospect.state -- so this stays
  // true the instant the same field Step 2's map/typed-fallback write is set.
  BDPG.prospectDone = function () {
    var p = BDPG.state.prospect;
    return !!(p.name && p.city && BDPG.state.state);
  };

  // Single source of the prospect-name precedence: the ⓪ card's name first,
  // then the older Step 3 "Prospect Name" field (pre-Task-4 data), else ''.
  // Every caller (displayName(), pitchHeroHtml(), and any future one such as
  // the print packet) must resolve the name through this helper rather than
  // re-reading prospect.name / supportingDetails.prospectName directly --
  // otherwise the hero, the print header and the tracker could disagree about
  // who the prospect is. Returns the raw name with no fallback wording of its
  // own: callers differ only in what they show when it's empty (see below).
  BDPG.resolveProspectName = function () {
    return BDPG.state.prospect.name || BDPG.state.supportingDetails.prospectName || '';
  };

  // Single place every prospect-name display reads from, so results/export/
  // summary can never show a different name than the ⓪ card holds. 'Prospect'
  // reads fine as a heading, which is why this fallback differs from
  // pitchHeroHtml()'s -- see resolveProspectName().
  BDPG.displayName = function () {
    return BDPG.resolveProspectName() || 'Prospect';
  };

  // City/State counterpart to displayName(), for the print header and Copy
  // Summary. Both used to read only Step 3's older, optional
  // supportingDetails.prospectCity/prospectState -- but the ⓪ Prospect
  // Profile card now carries a *required* City and State, so a rep who fills
  // the required fields and skips Step 3's duplicates got a packet headed
  // "Pilot Travel Center — , ", which reads as a rendering bug on a
  // prospect-facing leave-behind. Same precedence as displayName(): the ⓪
  // card first, Step 3 as fallback. State comes from BDPG.state.state (what
  // the ⓪ card's State field actually writes, via onStateInput), not
  // prospect.stateCode, which nothing sets. Returns '' when both halves are
  // empty so callers can drop the separator entirely rather than print a
  // dangling dash and comma.
  BDPG.displayLocation = function () {
    var city = BDPG.state.prospect.city || BDPG.state.supportingDetails.prospectCity || '';
    var st = BDPG.state.state || BDPG.state.supportingDetails.prospectState || '';
    if (!city && !st) return '';
    return city + (city && st ? ', ' : '') + st;
  };

  // Continuous text fields: write state, refresh the Generate button when a
  // required field just changed, and keep the ⓪ badge current -- never a
  // full BDPG.render() (that would steal focus mid-word).
  BDPG.onProspectInput = function (field, value) {
    BDPG.state.prospect[field] = value;
    // The rendered hero names the prospect, and the packet reads live state at
    // export -- so a name typed after Generate has to reach the already-drawn
    // hero or the screen and the leave-behind disagree. Targeted patch only.
    if (field === 'name') BDPG.refreshPitchHero();
    if (field === 'name' || field === 'city') {
      var btn = document.getElementById('bdpg-generate-btn');
      if (btn) { btn.outerHTML = BDPG.generateButtonHtml(); }
    }
    // Name and city are two of the four inputs the tracker's Signal reads.
    // Nothing renders it here any more, but Save can happen without an
    // intervening render, so keep the stored value true to the fields.
    BDPG.updatePreEvalSignal();
    BDPG.updateStepCardBadge(0, BDPG.prospectDone());
    BDPG.markDraftDirty();
  };

  // Location Type -> Step 1 baseline coupling. Fuel Stop auto-selects a
  // baseline card; Truck Stop couples to nothing, since it spans every truck
  // stop size and the rep picks the row. The three "suggest" types went with
  // Change 7. This
  // lives ONLY in the change handler, never in a render path -- a manual
  // card click (BDPG.onBaselineCardClick) always overrides it, and the only
  // way that can hold is if this logic fires once, on change, not on every
  // re-render.
  BDPG.LOCTYPE_PROFILE = {
    'Fuel Stop': { auto: 'Fuel stop', roadway: 'Any' }
  };

  BDPG.onLocationType = function (v) {
    var s = BDPG.state;
    s.prospect.locationType = v;
    BDPG.updatePreEvalSignal();
    var rule = BDPG.LOCTYPE_PROFILE[v];
    s.autoSetNote = '';
    s.suggestProfiles = [];
    if (rule && rule.auto) {
      // The ⓪ card's only coupling into the engine: this is the one branch
      // where picking a Location Type rewrites Step 1's baseline, so it is
      // the one branch that can strand a generated result. A `suggest` rule
      // (below) only outlines cards and changes no input.
      if (s.profile !== rule.auto || s.roadway !== rule.roadway) BDPG.invalidateResult();
      s.profile = rule.auto; s.roadway = rule.roadway;
      s.autoSetNote = v + ' type selected — baseline auto-set.';
    } else if (rule && rule.suggest) {
      s.suggestProfiles = rule.suggest;
    }
    // Before the render, not after: markDraftDirty() sets the indicator's
    // message, and the render below reads it back out of BDPG._draftMsg when
    // it rebuilds the ⓪ card. The other order would paint the stale message.
    BDPG.markDraftDirty();
    BDPG.render();
  };

  // ── the prospect signal ───────────────────────────────────────────────
  //
  // This WAS the Pre-Evaluation panel, a card between Prospect Profile and
  // Step 1. The panel is gone; the Strong / Moderate / Review signal it
  // produced is not, because the Prospects tracker renders it per row,
  // counts it in the summary chips, and every saved record carries it.
  //
  // The rule itself now lives in BDPG_STATS.prospectSignal, under test. It
  // moved there because this was the last value the page wrote into a saved
  // record with nothing but a rendered card to prove it still worked -- and
  // that card no longer exists. All that remains here is gathering the five
  // page-level facts it needs.
  //
  // The card also drew three informational chips -- baseline range, estimated
  // profile, rewards posture -- which never fed the signal and which nothing
  // renders now. They are gone with it rather than left computing output no
  // caller reads.
  BDPG.prospectSignalInput = function () {
    var s = BDPG.state, p = s.prospect;
    var region = s.state ? BusDevGallonsCalc.resolveRegion(s.state) : null;
    var nc = BDPG.networkContext;
    return {
      name: p.name, city: p.city, stateCode: s.state, locationType: p.locationType,
      region: region,
      regionPct: region ? BDPG.effectiveRegionPct(region) : null,
      regionData: (region && nc && nc.byRegion) ? nc.byRegion[region] : null
    };
  };

  BDPG.preEvalPrereqsMissing = function () {
    return BDPG_STATS.prospectSignal(BDPG.prospectSignalInput()).missing;
  };

  // ── "How this calculator works" tutorial widget ─────────────────────────
  // Visible to everyone (not admin-gated), collapsed by default, toggled by
  // the ? button in the static page header. Five tabs inside one card; a tab
  // click swaps only the body. Every percentage/threshold quoted in the copy
  // below is read out of BDPG_CONFIG (or BDPG.REGION_PCT_BOUND) at render
  // time rather than typed as a literal, so a future band change can't leave
  // this widget quietly lying to the person using it to learn the tool.

  BDPG.TUTORIAL_TABS = [
    { key: 'overview', tab: 'Overview',  title: 'Overview' },
    { key: 'step1',    tab: 'Step 1',    title: 'Step 1 — Location Profile' },
    { key: 'step2',    tab: 'Step 2',    title: 'Step 2 — Adjustments' },
    { key: 'results',  tab: 'Results',   title: 'Results' },
    { key: 'saving',   tab: 'Saving',    title: 'Saving & Tracking' }
  ];

  // Shared by every section below so "+5.0%" / "-5.0%" / "+0.0%" always read
  // the same way as the rest of the page's percentage formatting (see the
  // waterfall table above).
  BDPG.tutorialPct = function (n) {
    n = Number(n) || 0;
    return (n >= 0 ? '+' : '') + (n * 100).toFixed(1) + '%';
  };

  // REVIEW_BANDS stores each band's inclusive max, not its lower bound, and
  // the config comment documents why the bands abut with no gap: Trucker
  // Path ratings are one-decimal, so the next band always starts one tenth
  // above the previous band's max. Deriving "3.6+" (etc.) here means a band
  // edit changes this display automatically instead of leaving a stale
  // "3.6+" sitting next to a config that now says something else.
  BDPG.tutorialReviewBandRows = function () {
    var bands = BDPG_CONFIG.REVIEW_BANDS;
    var STEP = 0.1;
    var rows = [];
    var prevMax = null;
    bands.forEach(function (b, i) {
      var label;
      if (i === 0) label = b.max.toFixed(1) + ' or below';
      else if (i === bands.length - 1) label = (prevMax + STEP).toFixed(1) + '+';
      else label = (prevMax + STEP).toFixed(1) + '–' + b.max.toFixed(1);
      rows.push({ label: label, pct: b.pct });
      prevMax = b.max;
    });
    return rows;
  };

  // ── help, behind the ? button only ───────────────────────────────────────
  //
  // This content used to sit collapsed at the top of every tab, above the
  // Prospect Profile card. A permanently-present "How This Calculator Works"
  // header is a row of furniture a rep scrolls past on every single visit to
  // reach the thing they came for, and it was closed essentially always. The
  // ? button in the header already existed and already opened it; now that
  // is the only way in, and the page opens on Prospect Profile.
  BDPG.toggleTutorial = function () {
    BDPG.state.tutorialOpen = !BDPG.state.tutorialOpen;
    BDPG.refreshTutorialCard();
  };

  BDPG.closeTutorial = function () {
    if (!BDPG.state.tutorialOpen) return;
    BDPG.state.tutorialOpen = false;
    BDPG.refreshTutorialCard();
  };

  BDPG.setTutorialTab = function (key) {
    BDPG.state.tutorialTab = key;
    BDPG.refreshTutorialCard();
  };

  // Targeted DOM patch, the same shape the prospect-field handlers use.
  // Neither
  // the ? header button nor a tab click may ever route through a full
  // BDPG.render(): that would blow away caret position in any field the rep
  // is mid-edit elsewhere on the page and re-run the map draw for no reason.
  BDPG.refreshTutorialCard = function () {
    var host = document.getElementById('bdpg-tutorial-host');
    if (!host) return;
    host.innerHTML = BDPG.tutorialModalHtml();
  };

  BDPG.tutorialModalHtml = function () {
    if (!BDPG.state.tutorialOpen) return '';
    var tab = BDPG.state.tutorialTab || 'overview';
    var active = null, i;
    for (i = 0; i < BDPG.TUTORIAL_TABS.length; i++) {
      if (BDPG.TUTORIAL_TABS[i].key === tab) { active = BDPG.TUTORIAL_TABS[i]; break; }
    }
    if (!active) { active = BDPG.TUTORIAL_TABS[0]; tab = active.key; }

    var tabBtns = BDPG.TUTORIAL_TABS.map(function (t) {
      var on = (t.key === tab);
      return '<button class="' + (on ? 'on' : '') + '"' + (on ? ' style="background:var(--accent)"' : '') +
        // JSON.stringify alone emits "step1" WITH its double quotes, which ends
        // this double-quoted attribute early -- the handler body becomes the
        // fragment `BDPG.setTutorialTab(` and every tab silently does nothing.
        // Overview masked it: tutorialTab defaults to 'overview', so that tab
        // renders active without a click ever having to succeed.
        // &quot;-escaping is the pattern the rest of this file already uses for
        // values interpolated into an onclick (onLocationType,
        // onBaselineCardClick, the tracker row actions).
        ' onclick="BDPG.setTutorialTab(' + JSON.stringify(t.key).replace(/"/g, '&quot;') + ')">' +
        BDPG.escHtml(t.tab) + '</button>';
    }).join('');

    // The backdrop closes on a click of ITSELF only -- event.target === this
    // -- so a click that lands on the panel, or a drag that starts inside it
    // and releases outside, does not dismiss a page of reference text the
    // reader is part-way through.
    return '<div id="bdpg-tutorial-modal" ' +
        'onclick="if(event.target===this)BDPG.closeTutorial()" ' +
        'role="dialog" aria-modal="true" aria-label="How this calculator works" ' +
        'style="position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.6);' +
          'display:flex;align-items:flex-start;justify-content:center;' +
          'overflow-y:auto;padding:4vh 12px">' +
      '<div class="bdpg-step" style="max-width:860px;width:100%;margin:0;' +
          'background:var(--surface2);max-height:92vh;overflow-y:auto">' +
        '<div class="bdpg-step-hd" style="margin-bottom:12px">' +
          '<div class="bdpg-step-title">How This Calculator Works</div>' +
          '<div style="flex:1"></div>' +
          '<button class="btn" aria-label="Close" ' +
            'onclick="BDPG.closeTutorial()">✕ Close</button>' +
        '</div>' +
        '<div class="bdpg-seg" style="margin-bottom:12px">' + tabBtns + '</div>' +
        '<div class="cc-lbl" style="margin-bottom:6px">' + BDPG.escHtml(active.title) + '</div>' +
        BDPG.tutorialTabBodyHtml(tab) +
      '</div>' +
    '</div>';
  };

  BDPG.tutorialTabBodyHtml = function (key) {
    if (key === 'step1') return BDPG.tutorialStep1Html();
    if (key === 'step2') return BDPG.tutorialStep2Html();
    if (key === 'results') return BDPG.tutorialResultsHtml();
    if (key === 'saving') return BDPG.tutorialSavingHtml();
    return BDPG.tutorialOverviewHtml();
  };

  BDPG.tutorialOverviewHtml = function () {
    return '<p style="font-size:.85em;color:var(--text);margin:0 0 8px">' +
      'This calculator estimates how many diesel gallons per month Roady’s could realistically drive to a prospective ' +
      'truck stop. It starts from a published baseline looked up by the location’s physical profile, then layers on ' +
      'adjustments for region, amenities, Trucker Path review score, discount pricing strategy and Rewards participation to produce ' +
      'a client-ready pitch number plus an internal-only breakdown of how it was built.' +
    '</p>' +
    '<div class="bdpg-callout" style="font-size:.8em;color:var(--muted)">' +
      '<b>Example:</b> Pick the location’s Profile / Roadway / Lanes in Step 1, tune the five adjustments in Step 2, fill ' +
      'in Step 3’s Supporting Details, then Generate — the Results panel shows both the Official Calculator figure ' +
      'and Final Potential Gallons, and Save Profile keeps it for later on the Prospects tab.' +
    '</div>';
  };

  BDPG.tutorialStep1Html = function () {
    var baselines = BDPG_CONFIG.BASELINE_TABLE.map(function (r) { return r.baseline; });
    var blMin = Math.min.apply(null, baselines);
    var blMax = Math.max.apply(null, baselines);
    var headerRow = '<tr style="color:var(--muted);font-size:.72em;text-transform:uppercase;letter-spacing:.06em">' +
      '<td>Profile</td><td>Roadway</td><td>Lanes</td><td style="text-align:right">Baseline</td></tr>';
    var rows = BDPG_CONFIG.BASELINE_TABLE.map(function (r) {
      return '<tr><td>' + BDPG.escHtml(r.profile) + '</td><td>' + BDPG.escHtml(r.roadway) + '</td>' +
        '<td>' + BDPG.escHtml(r.lanes) + '</td><td style="text-align:right">' + BDPG.fmtGal(r.baseline) + ' gal/mo</td></tr>';
    }).join('');
    // Picked from the table itself rather than hand-copied, so an edited
    // BASELINE_TABLE keeps this example in sync for free.
    var exRow = BDPG_CONFIG.BASELINE_TABLE[4];

    return '<p style="font-size:.85em;color:var(--text);margin:0 0 8px">' +
      'Every prospect starts from a baseline in gallons/month, looked up in Roady’s published table by three inputs: ' +
      '<b>Profile</b> (the size/class of location), <b>Roadway</b> (Backroad, Highway or Interstate) and <b>Lanes</b> ' +
      '(how many fuel lanes it has). Baselines across the table range from ' + BDPG.fmtGal(blMin) + ' to ' + BDPG.fmtGal(blMax) + ' gal/mo.' +
    '</p>' +
    '<table class="dt" style="width:100%;font-size:.8em;margin-bottom:10px"><tbody>' + headerRow + rows + '</tbody></table>' +
    '<div class="bdpg-callout" style="font-size:.8em;color:var(--muted)">' +
      '<b>Example:</b> A ' + BDPG.escHtml(exRow.profile) + ' on a ' + BDPG.escHtml(exRow.roadway) + ' with ' + BDPG.escHtml(exRow.lanes) +
      ' lanes starts at ' + BDPG.fmtGal(exRow.baseline) + ' gal/mo, before any Step 2 adjustments.' +
    '</div>';
  };

  BDPG.tutorialStep2Html = function () {
    var amenityRows = BDPG_CONFIG.AMENITY_LEVELS.map(function (lvl) {
      return { label: lvl, pct: BDPG_CONFIG.AMENITY_ADJUST[lvl] };
    });
    var reviewRows = BDPG.tutorialReviewBandRows();
    // The slider is continuous AND its ends are per-profile now, so the
    // tutorial can only describe the rule -- quoting one profile's numbers
    // here would be wrong for the other seven.
    var pricingRows = [
      { label: 'Slider at its lowest — this profile’s p10 (its weakest tenth)', pct: null },
      { label: 'Profile average — the default', pct: 0 },
      { label: 'Slider at its highest — this profile’s p90 (its strongest tenth)', pct: null }
    ];
    var rewardsRows = BDPG_CONFIG.REWARDS_LEVELS.map(function (lvl) {
      return { label: lvl, pct: BDPG_CONFIG.REWARDS_ADJUST[lvl] };
    });

    function termBlock(title, note, rows) {
      var lines = rows.map(function (r) {
        // pct null means "this end is derived per profile, so there is no one
        // number to print here" -- the pricing rows below are the only case.
        return '<div style="display:flex;justify-content:space-between;gap:10px">' +
          '<span>' + BDPG.escHtml(r.label) + '</span><span style="font-weight:700">' +
          (r.pct === null ? '<span style="color:var(--muted)">varies</span>' : BDPG.tutorialPct(r.pct)) +
          '</span></div>';
      }).join('');
      return '<div class="bdpg-callout" style="margin-top:10px">' +
        '<div style="font-weight:700;margin-bottom:4px">' + BDPG.escHtml(title) + '</div>' +
        '<div style="font-size:.78em;color:var(--muted);margin-bottom:6px">' + note + '</div>' +
        '<div style="font-size:.82em">' + lines + '</div>' +
      '</div>';
    }

    var body = '<p style="font-size:.85em;color:var(--text);margin:0 0 4px">' +
      'Five terms move the baseline. <b>Region</b> and <b>Amenities</b> (plus the <b>Trucker Path</b> review score) are ' +
      'folded into the Official Calculator figure; <b>Pricing Strategy</b> and <b>Rewards</b> participation are applied ' +
      'afterward, on top of that figure, to produce Final Potential Gallons.' +
    '</p>';

    body += '<div class="bdpg-callout" style="margin-top:10px">' +
      '<div style="font-weight:700;margin-bottom:4px">1. Region</div>' +
      '<div style="font-size:.82em">An admin-set slider carrying the measured per-region delta. ' +
      'Set from region_variance.json, and shown in Admin beside the network-average figure it ' +
      'came from — the two are different measurements and are never conflated.</div>' +
    '</div>';
    body += termBlock('2. Amenities', 'Set from the location’s amenity level.', amenityRows);
    body += termBlock('3. Trucker Path (review score)', 'Banded by the location’s Trucker Path rating.', reviewRows);
    body += termBlock('4. Pricing Strategy', 'Applied outside the Official Calculator figure.', pricingRows);
    body += termBlock('5. Rewards participation', 'Applied outside the Official Calculator figure, alongside Pricing.', rewardsRows);

    var exAmenity = amenityRows[amenityRows.length - 1];
    var exReview = reviewRows[reviewRows.length - 1];
    var exRewards = rewardsRows[0];
    body += '<div class="bdpg-callout" style="font-size:.8em;color:var(--muted);margin-top:10px">' +
      '<b>Example:</b> ' + BDPG.escHtml(exAmenity.label) + ' amenities (' + BDPG.tutorialPct(exAmenity.pct) + ') and a ' +
      BDPG.escHtml(exReview.label) + ' Trucker Path score (' + BDPG.tutorialPct(exReview.pct) + ') both land inside the ' +
      'Official Calculator figure; ' + BDPG.escHtml(exRewards.label) + ' (' + BDPG.tutorialPct(exRewards.pct) + ') is added ' +
      'afterward, on Final Potential Gallons only.' +
    '</div>';

    return body;
  };

  BDPG.tutorialResultsHtml = function () {
    var pDefaultPct = BusDevGallonsCalc.pricingAdjustment(BDPG_CONFIG.PRICING_DEFAULT);
    var rDefaultPct = hasOwn(BDPG_CONFIG.REWARDS_ADJUST, BDPG_CONFIG.REWARDS_DEFAULT) ? BDPG_CONFIG.REWARDS_ADJUST[BDPG_CONFIG.REWARDS_DEFAULT] : 0;
    // Derived, not asserted: only claim the two figures match at default
    // settings when the defaults themselves actually net to 0%. If a future
    // config ever ships a nonzero default, this stops claiming an equality
    // that would no longer be true.
    var bothZero = (pDefaultPct === 0 && rDefaultPct === 0);
    var divergeLine = bothZero
      ? 'Leave both at their defaults and Final Potential Gallons matches the Official Calculator figure exactly; move either one and the two numbers diverge.'
      : 'Even at their defaults, Final Potential Gallons already differs from the Official Calculator figure by these two adjustments.';

    return '<p style="font-size:.85em;color:var(--text);margin:0 0 8px">' +
      'Generate produces two numbers. The <b>Official Calculator figure</b> is the baseline adjusted only by Region, ' +
      'Amenities and the Trucker Path review score — it matches Roady’s BD Calculator. ' +
      '<b>Final Potential Gallons</b> takes that figure and layers on Pricing Strategy and Rewards, and is the headline ' +
      'number used in the pitch. Everything above the INTERNAL divider is written for the prospect and mirrors the Export ' +
      'Pitch Summary; everything below it (the adjustment waterfall, Network Fit Grade, amenity chart) is internal-only ' +
      'and never leaves the tool.' +
    '</p>' +
    '<div class="bdpg-callout" style="font-size:.8em;color:var(--muted)">' +
      '<b>Example:</b> Pricing Strategy defaults to “' + BDPG.escHtml(BDPG_CONFIG.PRICING_DEFAULT) + '” (' + BDPG.tutorialPct(pDefaultPct) +
      ') and Rewards defaults to “' + BDPG.escHtml(BDPG_CONFIG.REWARDS_DEFAULT) + '” (' + BDPG.tutorialPct(rDefaultPct) + '). ' + divergeLine +
    '</div>';
  };

  BDPG.tutorialSavingHtml = function () {
    return '<p style="font-size:.85em;color:var(--text);margin:0 0 8px">' +
      'Save Profile stores everything on this page — the prospect’s info, every adjustment, and any generated ' +
      'result — as one record kept in this browser. The Prospects tab lists every saved location side by side with ' +
      'its Official Calculator figure and Final Potential Gallons, and reopening a row loads it back into the calculator ' +
      'to keep refining or to re-export its Pitch Summary.' +
    '</p>' +
    '<div class="bdpg-callout" style="font-size:.8em;color:var(--muted)">' +
      '<b>Example:</b> Fill in a prospect, hit Generate, then Save Profile — switch to the Prospects tab and the new ' +
      'row is there immediately, ready to reopen or export any time, even after closing the browser.' +
    '</div>';
  };

  // The one and only writer of BDPG.state.prospect.preEvalSignal.
  //
  // Called from render() and from each prospect-field handler. Both matter:
  // render() covers tab switches and the initial paint, and the handlers
  // cover the case render() cannot -- Save can happen without an intervening
  // render, and a stale signal would be written straight into the record.
  //
  // The '' -on-incomplete gate lives in BDPG_STATS.prospectSignal and is
  // tested there; this function just stores what it is told.
  BDPG.updatePreEvalSignal = function () {
    var result = BDPG_STATS.prospectSignal(BDPG.prospectSignalInput());
    BDPG.state.prospect.preEvalSignal = result.signal;
    return result;
  };

  // ── Prospect Profile draft auto-save ──────────────────────────────────
  //
  // roadysBDPGDraft holds ONE in-progress Prospect Profile card and is kept
  // entirely separate from roadysBDPGProfiles, the saved-prospect array the
  // tracker reads. It exists so closing the tab (or a reload) mid-entry does
  // not lose the typing. It is not a second prospect store: nothing but the
  // ⓪ card reads or writes it, and promoting a draft to a real prospect is
  // Save to Prospects and nothing else.
  //
  // Only the ⓪ card's own inputs are drafted -- the five Prospect Profile
  // fields plus State, which lives at BDPG.state.state rather than on
  // `prospect` (see prospectHtml below). Step 1, Step 2 and the generated
  // result are deliberately NOT drafted: restoring a baseline and a set of
  // adjustments nobody chose in this session would put inputs on screen that
  // no rep selected, and a restored result would describe them. The one
  // derived value restoreDraft() does rebuild is Step 1's baseline when the
  // drafted Location Type auto-sets it -- that is a pure function of the
  // drafted field, not stored Step 1 data. See restoreDraft().
  BDPG.DRAFT_KEY = 'roadysBDPGDraft';

  // Long enough that a fast typist writes to localStorage once per pause
  // instead of once per keystroke, and the indicator cannot strobe. The
  // pending write is flushed on pagehide (see the listener at the bottom of
  // this file) and before Save, so this window is never a way to lose the
  // last thing typed.
  //
  // 800ms, down from 2000: the draft now lands in Supabase where the other
  // owner can see it, so the window where their screen is stale matters more
  // than the write volume. Still debounced, because this fires per keystroke.
  BDPG.DRAFT_DEBOUNCE_MS = 800;
  BDPG._draftTimer = null;
  BDPG._draftMsg = '';

  // Set from ?lead=<id> at boot, or by Save to Prospects once a lead is
  // linked. null means an unlinked draft, which the table keys by author.
  BDPG.currentLeadId = null;

  // Provenance of the draft currently on screen, from the last cloud read or
  // write. Null until one happens, so a brand-new unsaved draft shows nothing
  // rather than claiming an author it does not have.
  BDPG._draftAuthor = '';
  BDPG._draftUpdatedAt = '';

  // The state signature as it stood when the page finished its first render.
  // hydrateDraftFromCloud() compares against it to tell whether the rep has
  // touched ANYTHING since -- not just the six ⓪-card fields a per-handler
  // flag would cover. Captured after the render because the render itself
  // writes defaults into state (see the savedSig capture in render()).
  BDPG._bootSig = null;

  // The CRM lead this page was opened for, as the CRM described it. Kept
  // separate from BDPG.state.prospect on purpose: the rep may rename the
  // prospect on the card, and the banner must keep naming the LEAD it is
  // linked to rather than following the edit. null when opened directly.
  BDPG.leadContext = null;

  // Applies the CRM's "Value Prop" deep-link parameters to the ⓪ card.
  //
  // Runs after restoreDraft() and before the first render, so whatever it
  // writes is part of the baseline render() captures as _bootSig -- which
  // means hydrateDraftFromCloud() still treats a shared cloud draft for this
  // lead as newer and lets it win. A CRM snapshot should lose to someone's
  // actual in-progress work on the same lead.
  //
  // Returns true if anything was written.
  BDPG.applyLeadParams = function (p) {
    if (!p || (!p.leadId && !p.name && !p.city && !p.state && !p.street)) return false;

    var snap = BDPG.draftSnapshot();
    var hasContent = BDPG.draftHasContent(snap);
    var sameProspect = !!(p.name && snap.name &&
      snap.name.trim().toLowerCase() === p.name.trim().toLowerCase());

    // The card already holds work for a DIFFERENT prospect. Never discard it
    // silently -- same rule, and the same gate, onLoadProfile() uses.
    if (hasContent && !sameProspect) {
      if (!BDPG.confirmDiscard(
            'You have unsaved work for ' + (snap.name || 'an unnamed prospect') + '.\n\n' +
            'Opening ' + (p.name || 'this lead') + ' from the CRM replaces it, ' +
            'and it cannot be recovered.\n\nContinue?')) {
        // Declined. Crucially the lead is NOT linked: leaving currentLeadId
        // set here would attach the prospect still on screen to the lead the
        // rep just refused to open, which is how a profile ends up filed
        // against the wrong company.
        return false;
      }
      // Accepted -- clear the card and release every binding to the previous
      // prospect. The other prospect's CLOUD draft is deliberately left in
      // place: it is someone's work, possibly a colleague's, and this is a
      // navigation, not a delete.
      var pr = BDPG.state.prospect;
      pr.name = ''; pr.street = ''; pr.city = ''; pr.locationType = ''; pr.notes = '';
      if (BDPG.state.state) BDPG.invalidateResult();
      BDPG.state.state = '';
      BDPG.state.autoSetNote = '';
      BDPG.state.suggestProfiles = [];
      BDPG.currentProfileId = null;
      BDPG.currentCloudId = null;
      BDPG._draftAuthor = '';
      BDPG._draftUpdatedAt = '';
      snap = BDPG.draftSnapshot();
    }

    // Fill blanks only. A field the rep has already typed is theirs; a field
    // the CRM did not send arrives as null and is skipped (see
    // RoadysBD.leadParamsFrom -- null and '' mean different things there).
    var prospect = BDPG.state.prospect, wrote = false;
    if (!prospect.name   && p.name)   { prospect.name = p.name;     wrote = true; }
    if (!prospect.city   && p.city)   { prospect.city = p.city;     wrote = true; }
    if (!prospect.street && p.street) { prospect.street = p.street; wrote = true; }
    if (!BDPG.state.state && p.state) { BDPG.state.state = p.state; wrote = true; }

    BDPG.currentLeadId = p.leadId || null;
    BDPG.leadContext = p.leadId
      ? { id: p.leadId, name: p.name || '', city: p.city || '', state: p.state || '' }
      : null;

    if (wrote) {
      BDPG.updatePreEvalSignal();
      // Pre-filled from a lead is unsaved work, exactly like a restored draft:
      // savedSig = '' so Load and Export still prompt before discarding it.
      BDPG.savedSig = '';
    }
    return wrote;
  };

  // Banner shown whenever this page is linked to a CRM lead, so the rep can
  // see before saving that the profile will attach to that lead. Deliberately
  // not dismissible: it describes live state (currentLeadId), and a dismissed
  // banner over a live link is how a profile gets saved against the wrong
  // company.
  BDPG.leadBannerHtml = function () {
    var c = BDPG.leadContext;
    if (!c) return '';
    var where = [c.city, c.state].filter(Boolean).join(', ');
    return '<div class="bdpg-box" style="margin-bottom:12px;border-color:var(--accent);' +
      'display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<span style="font-size:1.1em">&#128279;</span>' +
      '<div style="flex:1;min-width:200px">' +
        '<div style="font-weight:700;font-size:.85em">Opened from CRM lead — ' +
          BDPG.escHtml(c.name || c.id) + (where ? ' <span style="color:var(--muted);font-weight:400">· ' + BDPG.escHtml(where) + '</span>' : '') +
        '</div>' +
        '<div style="font-size:.72em;color:var(--muted);margin-top:2px">' +
          'Saving will attach this value profile to that lead.</div>' +
      '</div>' +
      '<a href="../CRM.html?lead=' + encodeURIComponent(c.id) + '" target="_blank" ' +
        'style="color:var(--accent);font-size:.75em;font-weight:700;text-decoration:underline;white-space:nowrap">' +
        'open the lead &#8599;</a>' +
    '</div>';
  };

  BDPG.draftSnapshot = function () {
    var p = BDPG.state.prospect;
    return {
      name: str(p.name), street: str(p.street), city: str(p.city),
      locationType: str(p.locationType), notes: str(p.notes),
      stateCode: str(BDPG.state.state),
      savedAt: new Date().toISOString()
    };
  };

  // An all-blank card is not a draft. This is the guard that keeps an empty
  // draft from being written when a rep clears the fields -- which matters
  // beyond tidiness, because restoreDraft() marks a restored draft as
  // unsaved work, and an empty one would then prompt "discard unsaved
  // changes?" on a page with nothing on it.
  BDPG.draftHasContent = function (d) {
    return !!(d && (d.name || d.street || d.city || d.locationType || d.notes || d.stateCode));
  };

  BDPG.clearDraftStorage = function () {
    try { localStorage.removeItem(BDPG.DRAFT_KEY); } catch (e) {}
  };

  // Same discipline as getSavedProfiles() and readSummary(): a corrupted or
  // hand-edited value must not take down the page or reach the DOM. Every
  // field is coerced through str(), so an object where a label belongs can
  // never print as "[object Object]", and an unparseable draft is dropped
  // rather than carried forward to fail again on the next load.
  BDPG.readDraft = function () {
    var raw;
    try { raw = localStorage.getItem(BDPG.DRAFT_KEY); } catch (e) { return null; }
    if (!raw) return null;
    var d = null;
    try { d = JSON.parse(raw); } catch (e) { BDPG.clearDraftStorage(); return null; }
    if (!d || typeof d !== 'object' || Array.isArray(d)) { BDPG.clearDraftStorage(); return null; }
    var lt = str(d.locationType);
    var out = {
      name: str(d.name), street: str(d.street), city: str(d.city),
      // Validated against the live list rather than trusted: an orphaned or
      // hand-edited type would show no segment selected while still riding
      // into the saved record and the tracker's Location Type column.
      locationType: BDPG.PROSPECT_LOCATION_TYPES.indexOf(lt) !== -1 ? lt : '',
      notes: str(d.notes),
      // Normalized exactly as onStateInput() would have left it, so a
      // restored code resolves a region instead of missing the 8-region map.
      stateCode: str(d.stateCode).toUpperCase().slice(0, 2),
      savedAt: str(d.savedAt)
    };
    // Parsed fine but holds nothing a rep typed -- `{}`, or a record whose
    // every field was the wrong type. Dropped like the unparseable case
    // rather than left to be re-read on every load: readDraft() is also what
    // decides whether the "Clear draft" link appears, so a lingering empty
    // draft would be a key nobody could see or reach.
    if (!BDPG.draftHasContent(out)) { BDPG.clearDraftStorage(); return null; }
    return out;
  };

  BDPG.draftTimeLabel = function (iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return '';
    return 'at ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  };

  // Scheduled from every ⓪-card change handler. Shows the pending state
  // immediately so a rep can see the draft is live, then writes once the
  // typing stops.
  BDPG.markDraftDirty = function () {
    if (BDPG._draftTimer) clearTimeout(BDPG._draftTimer);
    BDPG.setDraftMsg('Saving draft…');
    BDPG._draftTimer = setTimeout(function () {
      BDPG._draftTimer = null;
      BDPG.flushDraft();
    }, BDPG.DRAFT_DEBOUNCE_MS);
  };

  // Writes the draft now, cancelling any pending debounce. Returns nothing:
  // the outcome is reported on the indicator, including the failure case --
  // a full quota or a private-mode browser must say so rather than show
  // "Draft saved" over a write that did not happen.
  BDPG.flushDraft = function () {
    if (BDPG._draftTimer) { clearTimeout(BDPG._draftTimer); BDPG._draftTimer = null; }
    var d = BDPG.draftSnapshot();
    if (!BDPG.draftHasContent(d)) {
      BDPG.clearDraftStorage();
      BDPG.setDraftMsg('');
      return;
    }
    // localStorage first and synchronously: it is the offline mirror, and it
    // is the only write that can still succeed inside a pagehide handler.
    var localOk = true;
    try { localStorage.setItem(BDPG.DRAFT_KEY, JSON.stringify(d)); } catch (e) { localOk = false; }

    RoadysBD.profiles.saveDraft(BDPG.draftProfile(d)).then(function (r) {
      if (r.ok) {
        if (r.profile && r.profile.id) BDPG.currentCloudId = r.profile.id;
        BDPG._draftAuthor = RoadysBD.auth.email() || '';
        BDPG._draftUpdatedAt = (r.profile && r.profile.updatedAt) || new Date().toISOString();
        BDPG.setDraftMsg('Draft saved ' + BDPG.draftTimeLabel(d.savedAt));
      } else {
        // Never report a cloud save that did not happen. The local mirror may
        // still have landed, and saying so is the difference between "your
        // work is safe here but not shared yet" and a false all-clear.
        BDPG.setDraftMsg(localOk
          ? 'Saved on this device only — not synced'
          : 'Draft could not be saved');
      }
    });
  };

  // The ⓪-card draft plus whatever the engine currently holds, in the shape
  // roadysBD.js stores. Results are included only when a result exists: a
  // draft with no Generate behind it must carry null gallons and no
  // recommendation, not zeros that read as a calculated answer.
  BDPG.draftProfile = function (d) {
    var s = BDPG.state, e = s.result ? s.result.estimate : null;
    return {
      id: BDPG.currentCloudId || '',
      leadId: BDPG.currentLeadId,
      status: 'draft',
      prospectName: d.name, city: d.city, stateCode: d.stateCode,
      locationType: d.locationType,
      region: s.state ? (BusDevGallonsCalc.resolveRegion(s.state) || '') : '',
      profile: s.profile || '', roadway: s.roadway || '',
      inputs: BDPG.profileInputs(),
      results: e ? JSON.parse(JSON.stringify(e)) : {},
      officialSubtotal: e ? e.officialSubtotal : null,
      finalGallons: e ? e.finalGallons : null,
      recommendation: e ? BDPG_STATS.recommendation(e.finalGallons) : '',
      regionPctStamp: e ? BDPG.regionPctStamp(e.regionPct) : '',
      baselineStamp: e ? BDPG.baselineStamp(e.baseline) : '',
      author: RoadysBD.auth.email() || ''
    };
  };

  // Every input the calculator needs to reopen this profile exactly as saved.
  // Deliberately NOT the whole of BDPG.state: result and resultStale are
  // derived, and the panel-open flags are not data (same rule as SIG_SKIP).
  BDPG.profileInputs = function () {
    var s = BDPG.state;
    return {
      profile: s.profile, roadway: s.roadway, state: s.state,
      amenityDetails: JSON.parse(JSON.stringify(s.amenityDetails || {})),
      amenityLevel: s.amenityLevel, restroomLevel: s.restroomLevel,
      truckerPathRating: s.truckerPathRating,
      pricingLevel: s.pricingLevel, rewardsLevel: s.rewardsLevel,
      supportingDetails: JSON.parse(JSON.stringify(s.supportingDetails || {})),
      prospect: JSON.parse(JSON.stringify(s.prospect || {}))
    };
  };

  // Key-order-insensitive serialization. p.inputs arrives from a Postgres
  // jsonb column, and jsonb does NOT preserve the key order it was written
  // with -- so a raw JSON.stringify comparison reports a difference on every
  // boot even when nothing changed.
  BDPG.stableStringify = function (v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(BDPG.stableStringify).join(',') + ']';
    return '{' + Object.keys(v).sort().map(function (k) {
      return JSON.stringify(k) + ':' + BDPG.stableStringify(v[k]);
    }).join(',') + '}';
  };

  // "by robert@example.com · today 1:30 PM" — date only when it is not today,
  // because the common case is a draft touched minutes ago and a full date
  // there is noise.
  BDPG.draftProvenanceLabel = function () {
    if (!BDPG._draftAuthor && !BDPG._draftUpdatedAt) return '';
    var who = BDPG._draftAuthor ? 'by ' + BDPG._draftAuthor : '';
    var when = '';
    if (BDPG._draftUpdatedAt) {
      var d = new Date(BDPG._draftUpdatedAt);
      if (!isNaN(d.getTime())) {
        var today = new Date();
        var sameDay = d.toDateString() === today.toDateString();
        when = (sameDay ? 'today ' : d.toLocaleDateString() + ' ') +
          d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }
    }
    return [who, when].filter(Boolean).join(' · ');
  };

  BDPG.draftStatusInnerHtml = function () {
    // The "Clear draft" link appears whenever there is something to clear --
    // a filled card, or a stored draft from an earlier session that the card
    // no longer shows.
    var showClear = BDPG.draftHasContent(BDPG.draftSnapshot()) || BDPG.readDraft() !== null;
    var msg = BDPG._draftMsg
      ? '<span>' + BDPG.escHtml(BDPG._draftMsg) + '</span>'
      : '<span>Draft saves automatically as you type</span>';
    var link = showClear
      ? ' <a href="#" onclick="BDPG.onClearDraft(); return false;" ' +
        'style="color:var(--accent);text-decoration:underline">Clear draft</a>'
      : '';
    var prov = BDPG.draftProvenanceLabel();
    // Flagged as someone else's work only when it IS someone else's: the
    // common case is your own draft, and colouring that as a warning would
    // train the rep to ignore the one case that matters.
    var mine = !BDPG._draftAuthor || BDPG._draftAuthor === RoadysBD.auth.email();
    var provHtml = prov
      ? ' <span style="color:' + (mine ? 'var(--muted)' : 'var(--yellow)') + '">' +
        (mine ? '' : '⚠ ') + BDPG.escHtml(prov) + '</span>'
      : '';
    return msg + provHtml + link;
  };

  // Targeted write, never a BDPG.render(): this fires on every keystroke and
  // re-rendering the ⓪ card would take the cursor out of the field being
  // typed in. The element lives inside prospectHtml(), which both
  // onProspectInput() and onStateInput() deliberately leave standing.
  BDPG.setDraftMsg = function (msg) {
    BDPG._draftMsg = msg;
    var el = document.getElementById('bdpg-draft-status');
    if (el) el.innerHTML = BDPG.draftStatusInnerHtml();
  };

  // Runs once, from the DOMContentLoaded hook, BEFORE the first render.
  BDPG.restoreDraft = function () {
    var d = BDPG.readDraft();
    if (!d) return false;
    var p = BDPG.state.prospect;
    p.name = d.name; p.street = d.street; p.city = d.city;
    p.locationType = d.locationType; p.notes = d.notes;
    BDPG.state.state = d.stateCode;
    // Picking a Location Type is the ⓪ card's one coupling into the engine
    // (see onLocationType): Fuel Stop auto-sets Step 1's baseline. Replaying
    // that rule here means a restored card means the same thing it meant
    // when it was typed, and autoSetNote puts the reason on screen rather
    // than leaving a silently pre-selected baseline. Nothing is generated at
    // this point, so there is no result to invalidate.
    var rule = BDPG.LOCTYPE_PROFILE[d.locationType];
    if (rule && rule.auto) {
      BDPG.state.profile = rule.auto;
      BDPG.state.roadway = rule.roadway;
      BDPG.state.autoSetNote = d.locationType + ' type selected — baseline auto-set.';
    }
    BDPG.updatePreEvalSignal();
    // A restored draft is, by definition, work that never reached the
    // tracker. savedSig = '' is this file's existing idiom for exactly that
    // (see onDeleteProfile), and it has to be set BEFORE the first render:
    // render()'s `if (savedSig === null)` baseline capture would otherwise
    // record the restored draft as already-saved, and Load / Export Pitch
    // Summary would then replace it with no discard prompt at all.
    BDPG.savedSig = '';
    BDPG._draftMsg = 'Draft restored ' + BDPG.draftTimeLabel(d.savedAt);
    return true;
  };

  // The cloud draft wins when it exists: it is the shared one, and the local
  // mirror may be this browser's older copy. Runs after the first render, so
  // the page is never blank waiting on the network; re-renders only if the
  // cloud copy actually differs from what restoreDraft() already painted.
  BDPG.hydrateDraftFromCloud = function () {
    return RoadysBD.profiles.draftFor(BDPG.currentLeadId).then(function (p) {
      if (!p) return false;
      // The rep has changed something since the page painted -- any field, not
      // just the ⓪ card. Their work wins: adopt the cloud row's id so the next
      // flush updates THAT row rather than minting a second one, take the
      // provenance, and leave the screen alone. That is last-write-wins.
      var edited = BDPG._bootSig !== null && BDPG.stateSig() !== BDPG._bootSig;
      if (edited) {
        BDPG.currentCloudId = p.id;
        BDPG._draftAuthor = p.author || '';
        BDPG._draftUpdatedAt = p.updatedAt || '';
        BDPG.setDraftMsg(BDPG._draftMsg);
        return false;
      }
      // Compare the whole input payload, not four prospect fields. Those four
      // can match while the baseline, adjustments or supporting details differ
      // -- and the old check would then skip applyProfile() while still
      // stamping the caption with that person's name, captioning data that was
      // never synced from them. profileInputs() is exactly what applyProfile()
      // writes, so comparing it compares the right thing.
      var same = BDPG.stableStringify(BDPG.profileInputs()) ===
                 BDPG.stableStringify(p.inputs || {});
      // Provenance is set on BOTH paths: a cloud draft that already matches
      // what is on screen still has an author worth naming.
      BDPG._draftAuthor = p.author || '';
      BDPG._draftUpdatedAt = p.updatedAt || '';
      if (same) { BDPG.currentCloudId = p.id; BDPG.setDraftMsg(BDPG._draftMsg); return false; }
      BDPG.applyProfile(p);
      BDPG.currentCloudId = p.id;
      BDPG.savedSig = '';          // a restored draft is still unsaved work
      // Just the fact. Who and when are rendered by draftProvenanceLabel()
      // from the two fields above — saying it here too would print the author
      // twice on one line.
      BDPG._draftMsg = 'Draft restored from the cloud';
      BDPG.render();
      return true;
    });
  };

  // Writes a stored profile back onto BDPG.state. Mirrors onLoadProfile()'s
  // migration guards: each field is replaced only when it has the type it
  // must have, so a hand-edited row cannot reach the DOM as [object Object].
  BDPG.applyProfile = function (p) {
    var i = p.inputs || {};
    var s = BDPG.state;
    if (typeof i.profile === 'string') s.profile = i.profile;
    if (typeof i.roadway === 'string') s.roadway = i.roadway;
    if (typeof i.state === 'string') s.state = i.state;
    if (i.amenityDetails && typeof i.amenityDetails === 'object') s.amenityDetails = i.amenityDetails;
    if (typeof i.amenityLevel === 'string') s.amenityLevel = i.amenityLevel;
    if (typeof i.restroomLevel === 'string') s.restroomLevel = i.restroomLevel;
    if (typeof i.truckerPathRating === 'number' || typeof i.truckerPathRating === 'string') s.truckerPathRating = i.truckerPathRating;
    if (typeof i.pricingLevel === 'number' || typeof i.pricingLevel === 'string') s.pricingLevel = i.pricingLevel;
    if (typeof i.rewardsLevel === 'string') s.rewardsLevel = i.rewardsLevel;
    if (i.supportingDetails && typeof i.supportingDetails === 'object') s.supportingDetails = i.supportingDetails;
    if (i.prospect && typeof i.prospect === 'object') s.prospect = i.prospect;
    // A reopened profile has inputs but no result until Generate runs again,
    // and that is not a stale result — it is simply not computed yet.
    s.result = null;
    s.resultStale = false;
    BDPG.normalizeLevels();
    BDPG.updatePreEvalSignal();
  };

  BDPG.onClearDraft = function () {
    // Deleting only the stored key would be a no-op in practice -- the
    // fields are still filled, so the very next keystroke writes them
    // straight back. "Start fresh" therefore has to mean the card too. And
    // because State feeds the region term, emptying it can strand a
    // generated result, so this goes through the same invalidateResult()
    // discipline every other State write does, and it asks first.
    if (!confirm('Clear the saved draft and empty the Prospect Profile card?\n\n' +
                 'Name, street, city, state, location type and notes are all cleared, ' +
                 'and any generated result goes with them.\n\n' +
                 'Drafts are SHARED — if a colleague has been working this draft, ' +
                 'this clears it for them too.\n\n' +
                 'Prospects already saved on the Prospects tab are not touched.')) return;
    if (BDPG._draftTimer) { clearTimeout(BDPG._draftTimer); BDPG._draftTimer = null; }
    // Supabase is the source of truth for drafts, so a clear that only
    // removes the local mirror does not stick: the next hydrate pulls the
    // row straight back. softDelete sets deleted_at, which the partial
    // unique indexes exclude, so a fresh draft can take the slot afterwards.
    if (BDPG.currentCloudId) {
      var clearedId = BDPG.currentCloudId;
      RoadysBD.profiles.softDelete(clearedId).then(function (r) {
        if (!r.ok) {
          // The local card is already empty, so saying nothing would imply the
          // shared draft went with it. It did not, and it will come back on
          // the next reload.
          BDPG.setDraftMsg('Cleared here, but the shared draft could not be removed');
        }
      });
    }
    BDPG.clearDraftStorage();
    var p = BDPG.state.prospect;
    p.name = ''; p.street = ''; p.city = ''; p.locationType = ''; p.notes = '';
    if (BDPG.state.state) BDPG.invalidateResult();
    BDPG.state.state = '';
    BDPG.state.autoSetNote = '';
    BDPG.state.suggestProfiles = [];
    BDPG.updatePreEvalSignal();
    // The card no longer describes the record it may have been loaded from,
    // so a later Save must create a new row rather than overwrite that one --
    // the same binding onSaveProfile() drops when the displayed name changes.
    BDPG.currentProfileId = null;
    // Clearing the card empties both id spaces it could be bound to -- the
    // local tracker record above, and the cloud draft row this card was
    // mirroring.
    BDPG.currentCloudId = null;
    BDPG.currentLeadId = null;
    BDPG._leadLabel = '';
    BDPG._leadSearchResults = [];
    BDPG._draftMsg = '';
    // The card describes nothing now, so neither does its byline: leaving
    // these would caption an empty card "by X · today 1:30 PM" for data that
    // is no longer anywhere.
    BDPG._draftAuthor = '';
    BDPG._draftUpdatedAt = '';
    BDPG.render();
  };

  BDPG.prospectHtml = function () {
    var p = BDPG.state.prospect;
    var req = ' <span style="color:var(--red)">*</span>';

    var segs = BDPG.PROSPECT_LOCATION_TYPES.map(function (t) {
      var on = (p.locationType === t);
      return '<button class="' + (on ? 'on' : '') + '"' + (on ? ' style="background:var(--accent)"' : '') +
        ' onclick="BDPG.onLocationType(' + JSON.stringify(t).replace(/"/g, '&quot;') + ')">' + BDPG.escHtml(t) + '</button>';
    }).join('');

    return '<div class="bdpg-grid-3">' +
        '<div class="fg"><label>Truck Stop Name' + req + '</label>' +
          '<input id="bdpg-prospect-name" value="' + BDPG.escHtml(p.name) + '" oninput="BDPG.onProspectInput(\'name\', this.value)"></div>' +
        '<div class="fg"><label>Street Address</label>' +
          '<input id="bdpg-prospect-street" value="' + BDPG.escHtml(p.street) + '" oninput="BDPG.onProspectInput(\'street\', this.value)"></div>' +
        '<div class="fg"><label>City' + req + '</label>' +
          '<input id="bdpg-prospect-city" value="' + BDPG.escHtml(p.city) + '" oninput="BDPG.onProspectInput(\'city\', this.value)"></div>' +
        // Same field Step 2's map click and typed fallback write -- routed
        // through the existing BDPG.onStateInput, not a parallel handler, so
        // typing a code here resolves the region and updates the map for free.
        '<div class="fg"><label>State' + req + '</label>' +
          '<input id="bdpg-prospect-state" maxlength="2" placeholder="e.g. ID" value="' + BDPG.escHtml(BDPG.state.state) + '" ' +
          'oninput="BDPG.onStateInput(this.value)" style="text-transform:uppercase"></div>' +
        // Display-only: it names the rep on the Export Pitch Summary and in
        // Copy Summary and feeds no calculation, so it deliberately routes
        // through onProspectInput (no render(), no invalidateResult()) --
        // typing a name must never throw away a generated result. Placed
      '</div>' +
      '<div class="fg" style="margin-top:12px"><label>Location Type</label><div class="bdpg-seg">' + segs + '</div></div>' +
      '<div class="fg" style="margin-top:12px"><label>Notes</label>' +
        '<textarea id="bdpg-prospect-notes" rows="2" style="width:100%;background:var(--bg);border:1px solid var(--border);' +
        'border-radius:5px;color:var(--text);padding:6px 8px;font-size:.85em;font-family:var(--fb)" ' +
        'oninput="BDPG.onProspectInput(\'notes\', this.value)">' + BDPG.escHtml(p.notes) + '</textarea></div>' +
      // The draft indicator. Its own id so setDraftMsg() can patch it on
      // every keystroke without re-rendering the card around it -- see the
      // comment on setDraftMsg().
      '<div id="bdpg-draft-status" style="margin-top:12px;font-size:.72em;color:var(--muted);' +
        'display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        BDPG.draftStatusInnerHtml() +
      '</div>';
  };

  // BDPG region fills. The selection ring is deliberately NOT one of these
  // eight, and is no longer --accent either: --accent is amber, which sits
  // between Midwest (#FFD60A) and Southwest (#FF6B35) and would disappear on
  // both. Nor is it any single colour -- with eight saturated fills spanning
  // the wheel, every candidate hue is adjacent to one of them. path.sel rings
  // DUAL-TONE instead (white stroke, #0A0E1A casing), so one tone or the other
  // always carries. See the note on #bdpg-usa-svg path.sel near the top of the
  // stylesheet for the per-region table.
  // The practical consequence for anyone editing this map: these eight can be
  // rebalanced freely without checking them against a ring colour. The ring no
  // longer depends on a hue gap existing in this object -- which is what every
  // previous version of this comment was really tracking, and what
  // FOLLOW-UPS.md #1 was open on twice.
  BDPG.REGION_COLORS = {
    West: '#00D68F', Southwest: '#FF6B35', Midwest: '#FFD60A',
    Northeast: '#7C3AED', Southeast: '#FF4757',
    Northwest: '#0891B2', Texas: '#E0218A', 'Upper Midwest': '#8BC34A'
  };

  BDPG.mapHtml = function () {
    return '<div style="position:relative">' +
      '<svg id="bdpg-usa-svg" viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg"><g id="bdpg-states-group"></g></svg>' +
      '<div class="map-tooltip" id="bdpg-map-tip"></div>' +
    '</div>';
  };

  // Third instance of the shared TopoJSON map (Territory and GS Metrics are the
  // other two). loadUSTopojson() is memoized, so this costs no extra fetch.
  BDPG.renderMap = function () {
    var sg = document.getElementById('bdpg-states-group');
    if (!sg) return;
    if (typeof usTopoLoaded === 'undefined' || !usTopoLoaded) {
      sg.innerHTML = '<text x="450" y="280" text-anchor="middle" fill="var(--muted)" font-size="14">Loading map…</text>';
      loadUSTopojson().then(function () { if (usTopoLoaded) BDPG.renderMap(); });
      return;
    }
    var sel = BDPG.state.state;
    var activeRegion = sel ? BusDevGallonsCalc.resolveRegion(sel) : null;
    var html = '';
    Object.keys(STATE_PATHS).forEach(function (st) {
      var region = BusDevGallonsCalc.resolveRegion(st);
      var isSel = (st === sel);
      var fill, cls;
      if (!region) {
        fill = hexToRgba('#3A4A6B', 0.35); cls = 'nomap';
      } else {
        fill = hexToRgba(BDPG.REGION_COLORS[region], region === activeRegion ? 0.85 : 0.55);
        cls = isSel ? 'sel' : '';
      }
      html += '<path id="bdpg-st-' + st + '" d="' + STATE_PATHS[st] + '" fill="' + fill + '" class="' + cls + '"' +
        ' onmouseenter="BDPG.mapTip(event,\'' + st + '\')" onmouseleave="BDPG.mapTipHide()"' +
        (region ? ' onclick="BDPG.onMapStateClick(\'' + st + '\')"' : '') + '/>' +
        '<text x="' + getCentroid(STATE_PATHS[st], 'x') + '" y="' + getCentroid(STATE_PATHS[st], 'y') +
        '" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,.9)" font-size="9" font-weight="600"' +
        ' font-family="var(--ff)" pointer-events="none" style="text-shadow:0 1px 2px rgba(0,0,0,.6)">' + st + '</text>';
    });
    sg.innerHTML = html;
  };

  BDPG.mapTip = function (e, st) {
    var tt = document.getElementById('bdpg-map-tip');
    if (!tt) return;
    var region = BusDevGallonsCalc.resolveRegion(st);
    var name = (typeof STATE_NAMES !== 'undefined' && STATE_NAMES[st]) ? STATE_NAMES[st] : st;
    var body;
    if (region) {
      var pct = BDPG.effectiveRegionPct(region) * 100;
      body = BDPG.escHtml(name) + ' — ' + BDPG.escHtml(region) + ' — ' +
             (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
    } else {
      body = BDPG.escHtml(name) + ' — not in any network region';
    }
    tt.innerHTML = '<div class="map-tooltip-state">' + body + '</div>';
    tt.style.display = 'block';
    tt.style.left = (e.clientX + 12) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
  };
  BDPG.mapTipHide = function () {
    var tt = document.getElementById('bdpg-map-tip');
    if (tt) tt.style.display = 'none';
  };

  BDPG.onMapStateClick = function (st) {
    // Same field the typed input sets; a click is just a second path to it.
    if (BDPG.state.state !== st) BDPG.invalidateResult();
    BDPG.state.state = st;
    BDPG.render();
  };

  BDPG.regionChipsHtml = function () {
    var active = BDPG.state.state ? BusDevGallonsCalc.resolveRegion(BDPG.state.state) : null;
    var nc = BDPG.networkContext;
    // Ordered from BDPG.REGION_KEYS (the config's own BDPG_REGION_MAP order),
    // like the admin sliders and every other region surface. Iterating
    // REGION_COLORS instead put the original five first and the three new ones
    // last, so the legend listed regions in an order that matched nothing else
    // in the tool -- and left region order defined in two places.
    return '<div class="bdpg-chips">' + BDPG.REGION_KEYS.map(function (r) {
      var pct = BDPG.effectiveRegionPct(r) * 100;
      var count = (nc && nc.byRegion && nc.byRegion[r]) ? nc.byRegion[r].total : null;
      // Colour map and key list are both config-derived and carry the same
      // eight keys, but a plain lookup would emit "background:undefined" if a
      // future region were added to one and not the other.
      var dot = hasOwn(BDPG.REGION_COLORS, r) ? BDPG.REGION_COLORS[r] : 'var(--muted)';
      return '<div class="bdpg-chip' + (r === active ? ' on' : '') + '">' +
        '<span class="bdpg-chip-dot" style="background:' + dot + '"></span>' +
        '<span class="bdpg-chip-name">' + BDPG.escHtml(r) + '</span>' +
        '<span class="bdpg-chip-meta">' + (pct >= 0 ? '+' : '') + pct.toFixed(1) + '% · ' +
          (count === null ? '—' : count + ' loc') + '</span>' +
      '</div>';
    }).join('') + '</div>';
  };

  // ── Baseline from the network ───────────────────────────────────────────
  //
  // The baseline is the median avgGalMo of every reporting location in the
  // prospect's PROFILE -- not in its profile AND region. Region is applied
  // exactly once, downstream, as the like-for-like delta. The earlier
  // per-prospect lookup filtered by region here as well, which counted it
  // twice the moment a region delta was also applied.
  //
  // Falls back to the static BASELINE_TABLE row below three reporting
  // locations, which today is Small/Backroad alone (n=2).
  BDPG.BASELINE_DIVERGENCE_FLAG = 0.20;

  BDPG.profileBaselineMap = function () {
    if (!BDPG._locationsReady) return null;
    return BDPG_STATS.profileBaselines(BDPG.networkLocations(), BDPG_CONFIG.BASELINE_TABLE);
  };

  BDPG.currentBaseline = function () {
    var s = BDPG.state;
    var row = (s.profile && s.roadway)
      ? BusDevGallonsCalc.getBaselineRow(s.profile, s.roadway) : null;
    if (!row) return null;
    var map = BDPG.profileBaselineMap();
    var b = map ? map[BDPG_STATS.baselineKeyFor(row.profile, row.roadway)] : null;
    if (!b) {
      return { baseline: row.baseline, source: 'static', n: 0, total: 0,
               median: null, staticBaseline: row.baseline, loading: !BDPG._locationsReady };
    }
    return {
      baseline: b.baseline, source: b.source, n: b.n, total: b.total,
      median: b.median, staticBaseline: b.staticBaseline, loading: false
    };
  };

  BDPG.networkLocations = function () {
    if (!BDPG._locationsReady) return [];
    return BDPG.effectiveLocations();
  };

  BDPG.primeLocationsForBaseline = function () {
    if (BDPG._locationsReady || BDPG._locationsLoaded) return;
    BDPG.ensureLocations(function () { BDPG.render(); });
  };

  // Live region deltas, computed like-for-like and cached per render pass.
  BDPG.networkRegionDeltas = function () {
    if (!BDPG._locationsReady) return {};
    return BDPG_STATS.regionDeltas(BDPG.networkLocations(), BDPG_CONFIG.BASELINE_TABLE,
      BusDevGallonsCalc.resolveRegion);
  };

  // Live per-region median gallons, from the same file and the same reporting
  // floor as the baselines. Distinct from networkRegionDeltas() above: that is
  // the like-for-like ratio the engine applies, this is the plain observed
  // figure the results page displays. See regionAverages()' comment.
  BDPG.networkRegionAverages = function () {
    if (!BDPG._locationsReady) return {};
    return BDPG_STATS.regionAverages(BDPG.networkLocations(), BusDevGallonsCalc.resolveRegion);
  };

  BDPG.baselineSourceNoteHtml = function (d) {
    if (!d) return '';
    var muted = 'font-size:.78em;color:var(--muted);margin-top:6px';
    var count = '<div style="' + muted + '"># of network locations: <b>' + d.total + '</b></div>';
    if (d.source === 'network') {
      var div = (d.staticBaseline > 0) ? (d.baseline - d.staticBaseline) / d.staticBaseline : null;
      var flag = (div !== null && Math.abs(div) >= BDPG.BASELINE_DIVERGENCE_FLAG)
        ? '<div style="font-size:.78em;color:var(--yellow);margin-top:4px">⚠ ' +
            (div > 0 ? '+' : '') + Math.round(div * 100) + '% vs the ' +
            BDPG.fmtGal(d.staticBaseline) + ' fallback value.</div>'
        : '';
      return '<div style="' + muted + '"><span class="badge tag-green">Network average (n=' + d.n + ')</span> ' +
        'Average of ' + d.n + ' reporting location' + (d.n === 1 ? '' : 's') + ' in this profile.</div>' +
        count + flag;
    }
    var why = d.loading
      ? 'Loading network locations…'
      : 'Using network default — only ' + d.n + ' reporting location' + (d.n === 1 ? '' : 's') +
        ' in this profile' +
