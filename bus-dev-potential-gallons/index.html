<!-- Percentile and profile-matching maths for the Network Locations tab.
     Separate from the calculator engine on purpose: nothing in it is on the
     estimate path, and keeping it in its own UMD module is what makes the
     rule that decides which locations feed which baseline unit-testable. -->

<style>
:root{
  --bg:#080C18;--surface:#0D1225;--surface2:#121830;--border:#1E2A45;--border2:#2A3A5C;
  --accent:#F59E0B;--green:#00D68F;--red:#FF4757;--yellow:#FFD60A;--orange:#FF6B35;
  --purple:#7C3AED;--teal:#0891B2;--text:#E8EDF8;--muted:#6B7A99;--dim:#3A4A6B;
  /* --blue is NOT --accent. It exists so the two places that must stay cool
     blue -- .tag-blue (the "informational" member of the tag-green/yellow/
     red/gray semantic set) and GRADE_COLORS.A -- can keep their hue now that
     --accent is warm amber. Folding either into amber would make .tag-blue
     indistinguishable from .tag-yellow, and would put grade A between C
     (yellow) and D (orange) in a five-letter scale that exists to be scanned
     at a glance. It is a token rather than a bare #00C8FF literal because
     both consumers paint TEXT on a near-white ground in day mode, where
     #00C8FF measures ~1.9:1 and is unreadable; the day value below keeps the
     pre-amber day blue. */
  --blue:#00C8FF;
  --ff:'Barlow Condensed','Arial Narrow',sans-serif;
  --fb:'DM Sans','Segoe UI',sans-serif;
}
body.day-mode{
  --bg:#F0F2F5;--surface:#FFFFFF;--surface2:#F7F8FA;--border:#D8DCE3;--border2:#C0C7D3;
  /* Day accent is amber-700, not the dark theme's amber-500: #F59E0B on this
     background measures 1.9:1 and fails as text or as a border. #B45309
     measures 5.02:1 on --surface (#FFFFFF), 4.73:1 on --surface2 and 4.48:1
     on this --bg, so every accent-coloured label, link, active tab and focus
     ring clears AA on the two grounds it actually sits on. */
  --accent:#B45309;--green:#0B8A50;--red:#D32F2F;--yellow:#E6A800;--orange:#D4520A;
  --purple:#6528C7;--teal:#067A8B;--text:#1A1D24;--muted:#5A6170;--dim:#9AA0AD;
  --blue:#0078D4;
}
body.day-mode ::-webkit-scrollbar-track{background:#E8EBF0;}
body.day-mode ::-webkit-scrollbar-thumb{background:#C0C7D3;}
body.day-mode #bdpg-usa-svg path{stroke:#D8DCE3;}
/* Pre-existing bug (from the original ab77820 standalone-page commit) fixed
   here because it blocks the Task 4 contrast gate: the rule above (0-1-1-2)
   outranked #bdpg-usa-svg path.sel's stroke (0-1-1-1 at line ~110), so the
   selected state's ring silently fell back to the same grey as every
   unselected border in day mode, for every region, not just teal. This rule
   (0-1-2-2) restores the ring; stroke-width and the dark casing still come
   from path.sel below, which needs no day-mode override now that the ring is
   the same two tones in both themes.
   The ring is #FFF over a dark casing, deliberately NOT var(--accent) and
   deliberately not any single hue -- see the long note on path.sel below. */
body.day-mode #bdpg-usa-svg path.sel{stroke:#FFFFFF;}
body.day-mode .map-tooltip{background:rgba(255,255,255,.96);border-color:#D8DCE3;color:#1A1D24;}
*{box-sizing:border-box;margin:0;padding:0;}
html{color-scheme:dark;}
body.day-mode{color-scheme:light;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;}
select option{background:var(--surface);color:var(--text);}
body.day-mode select option{background:#FFFFFF;color:#1A1D24;}
a{color:var(--accent);text-decoration:none;}

body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);}
.bdpg-page-hd{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);}
.bdpg-page-title{font-family:var(--ff);font-size:1.4em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
/* Audience label beside the page title. Muted and uppercase like the other
   small labels in this file (.bdpg-lbl, .cc-lbl) so it reads as a standing
   note about who the tool is for, not a status message that might change. */
.bdpg-page-note{font-size:.7em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border-left:1px solid var(--border);padding-left:12px;margin-left:2px;}
.container{max-width:1500px;margin:0 auto;padding:18px 22px;}

.btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:5px;cursor:pointer;font-size:.75em;font-weight:600;letter-spacing:.04em;transition:all .15s;display:flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--border2);color:var(--text);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#000;}
.btn-accent:hover{opacity:.9;}
/* Day mode flips this one to white. See the note on .bdpg-seg button.on below
   for the #000 convention and why .btn-accent and .bdpg-go are the two
   buttons that leave it: #000 on the day accent #B45309 is 4.18:1 (under AA),
   #FFF on it is 5.02:1. Dark mode keeps #000 -- 9.78:1 on #F59E0B. */
body.day-mode .btn-accent{color:#FFFFFF;}
.badge{padding:3px 10px;border-radius:20px;font-size:.7em;font-weight:700;letter-spacing:.05em;}

.fg label{display:block;font-size:.7em;color:var(--muted);margin-bottom:3px;}
.fg input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:.85em;}
.fg input:focus{outline:none;border-color:var(--accent);}

table th[data-sort]{cursor:pointer;user-select:none;position:relative;padding-right:18px!important;}
table th[data-sort]:hover{color:var(--accent);}
table th[data-sort]::after{content:'⇅';position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:.65em;opacity:.4;}
table th[data-sort].sort-asc::after{content:'▲';opacity:.9;color:var(--accent);}
table th[data-sort].sort-desc::after{content:'▼';opacity:.9;color:var(--accent);}

.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sec-title{font-family:var(--ff);font-size:1.3em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}

.cg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.cg4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.cc-lbl{font-size:.7em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.cw{height:160px;position:relative;}

.tw{overflow-x:auto;margin-bottom:20px;}
.dt{width:100%;border-collapse:collapse;font-size:.88em;}
.dt th{background:var(--surface2);color:var(--muted);font-size:.78em;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.dt td{padding:8px 12px;border-bottom:1px solid rgba(30,42,69,.5);color:var(--text);}
.dt tr:hover td{background:rgba(255,255,255,.02);}
.dt td.up{color:var(--green);}
.dt td.dn{color:var(--red);}
.dt td.fl{color:var(--yellow);}
.bdpg-box{background:var(--bg2,rgba(255,255,255,.03));border:1px solid var(--border);border-radius:8px;padding:12px 14px}
/* Collapsible panel headers in the admin tab. Previously a bold <div> with a
   caret and cursor:pointer and nothing else, which read as a section label --
   so a collapsed panel looked like a broken one and was unreachable by
   keyboard. A real button with a border, hover and focus state says "this
   opens". */
.bdpg-disclosure{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-family:var(--fb);font-size:.86em;font-weight:700;
  padding:8px 10px;cursor:pointer;transition:all .15s;}
.bdpg-disclosure:hover{border-color:var(--accent);color:var(--accent);}
.bdpg-disclosure:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.bdpg-disclosure-caret{color:var(--muted);font-size:.9em;}
.bdpg-disclosure:hover .bdpg-disclosure-caret{color:var(--accent);}
/* Inline baseline editing in the Network Baseline Analysis table. The value is
   a real <button> so it is tab-reachable and announces itself as clickable;
   styled to sit in the numeric column without looking like a form control
   until you touch it. */
.bdpg-bl-val{background:none;border:1px solid transparent;border-radius:4px;color:var(--text);
  font-family:var(--fb);font-size:1em;padding:1px 5px;cursor:pointer;transition:all .12s;}
.bdpg-bl-val:hover{border-color:var(--accent);color:var(--accent);}
.bdpg-bl-val:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
/* The override marker. Amber because --accent is amber, and it reads as
   "changed here" rather than "wrong" -- an override is a legitimate state. */
.bdpg-bl-dot{color:var(--accent);font-size:.85em;margin-left:3px;}
.bdpg-bl-mini{padding:2px 7px!important;font-size:.85em!important;line-height:1.2!important;}
.bdpg-bl-reset{font-size:.72em;color:var(--muted);cursor:pointer;text-decoration:underline;
  background:none;border:none;padding:0;font-family:var(--fb);display:block;margin:2px 0 0 auto;}
.bdpg-bl-reset:hover{color:var(--accent);}
.bdpg-bl-commit{background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;margin:0;overflow-x:auto;font-family:var(--ff);font-size:.74em;
  line-height:1.7;white-space:pre;color:var(--text);}

/* ── Bus Dev Potential Gallons — wizard shell ── */
.bdpg-step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;position:relative;}
.bdpg-step.done{border-left:3px solid var(--green);}
.bdpg-step-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.bdpg-badge{width:28px;height:28px;flex:0 0 auto;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--ff);font-weight:800;font-size:1em;}
.bdpg-step.done .bdpg-badge{background:rgba(0,214,143,.15);border-color:var(--green);color:var(--green);}
.bdpg-step-title{font-family:var(--ff);font-size:1.15em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text);}
.bdpg-check{color:var(--green);font-size:.9em;font-weight:700;margin-left:auto;}
.bdpg-grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.bdpg-callout{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px;}
.bdpg-lbl{font-size:.7em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.bdpg-bcard{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;text-align:left;}
.bdpg-bcard:hover{border-color:var(--border2);transform:translateY(-1px);}
.bdpg-bcard.dim{opacity:.45;}
.bdpg-bcard.on{border-color:var(--accent);background:rgba(245,158,11,.08);box-shadow:0 0 14px rgba(245,158,11,.25);}
/* :not(.on) makes the "selected beats suggested" rule live in the CSS itself.
   Both selectors set border-color at equal specificity, so without it the
   winner is decided by source order, and the only reason a card never carries
   both classes is step1Html's `suggest = !on && …` boolean -- a JS guard one
   simplification away from turning a selected card yellow. */
.bdpg-bcard.suggest:not(.on){border-color:var(--yellow);box-shadow:0 0 10px rgba(255,214,10,.2);}
.bdpg-bcard-ico{font-size:1.3em;line-height:1;margin-bottom:6px;}
.bdpg-bcard-name{font-family:var(--ff);font-size:1em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text);}
.bdpg-bcard-sub{font-size:.72em;color:var(--muted);margin-top:2px;}
.bdpg-bcard-gal{font-family:var(--ff);font-size:1.35em;font-weight:800;color:var(--muted);margin-top:8px;}
.bdpg-bcard.on .bdpg-bcard-gal{color:var(--accent);}
#bdpg-usa-svg{width:100%;height:auto;display:block;}
#bdpg-usa-svg path{cursor:pointer;stroke:#0A0E1A;stroke-width:.5;transition:all .15s;}
#bdpg-usa-svg path:hover{opacity:.85;stroke-width:1.5;stroke:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.3));}
/* The selection ring is DUAL-TONE in both themes: a white 2.2px stroke inside
   a near-black casing. It is deliberately decoupled from --accent, and just as
   deliberately not any single colour.
   Three rounds of single-hue attempts are the reason. --accent is amber
   (#F59E0B / #B45309), which sits between Midwest #FFD60A and Southwest
   #FF6B35 and vanishes on both, so the ring could not simply follow the
   recolour. Plain white was tried next and fixed the teal Northwest case the
   old cyan/blue ring failed (FOLLOW-UPS.md #1, 1.23:1) while breaking Midwest
   yellow instead, at 1.35:1. That is not bad luck: there are eight saturated
   fills spanning the wheel, so ANY one ring colour is adjacent to one of them.
   Worst case across all eight, ring vs the active region's .85-alpha fill
   composited on its card (#0D1225 dark, #FFFFFF day):
     old cyan #00C8FF / day blue #0078D4   1.02:1 dark   1.04:1 day
     amber #F59E0B / #B45309               1.12:1 dark   1.15:1 day
     plain white                           1.92:1 dark   1.35:1 day
     white + #0A0E1A casing (shipped)      4.43:1 dark   4.42:1 day
   The dual tone works because the two tones fail on opposite fills: where the
   white is weakest (Midwest yellow, 1.35:1 day) the casing is at its strongest
   (14.25:1), and where the casing is weakest (Northeast purple, 4.42:1 day)
   the white carries it (4.36:1). The measured floor is whichever tone reads
   better on that fill, and that floor clears 3:1 on every region in both
   themes -- the first treatment here that does.
   #0A0E1A is not a new colour: it is the same ink #bdpg-usa-svg path already
   strokes every state border with. Against the white stroke it is 19.25:1, so
   the ring reads as a deliberate object rather than a halo whatever it is
   drawn over.
   Why a stacked filter and not a second path: SVG gives one stroke per
   element, so a true double stroke needs a duplicated path underneath, which
   means changing what renderMap() emits. Three zero-offset 1.5px drop-shadows
   compose into a near-opaque casing hugging the stroke's outer edge, stay
   purely in CSS, and cost one declaration on one element. They also replace
   the old 7px white glow, which was invisible in day mode anyway -- a white
   halo on a white card -- so nothing is lost by spending the filter here.
   One rule for both themes: a filter cannot interpolate a custom property, and
   a theme-scoped copy would only be a second place to forget. */
#bdpg-usa-svg path.sel{stroke:#FFFFFF;stroke-width:2.2;filter:drop-shadow(0 0 1.5px #0A0E1A) drop-shadow(0 0 1.5px #0A0E1A) drop-shadow(0 0 1.5px #0A0E1A);}
#bdpg-usa-svg path.nomap{cursor:default;}
/* .nomap paths (DC alone today -- anything BDPG_REGION_MAP does not cover;
   AK and HI were in this set until the 8-region model mapped them to
   Northwest and West) would otherwise
   inherit the generic path:hover glow above, which reads as "clickable" even
   though onclick is a no-op for them. Opt them back out of the hover styling
   while leaving the tooltip in place -- it usefully explains why nothing
   happens. */
#bdpg-usa-svg path.nomap:hover{opacity:1;stroke-width:.5;stroke:#0A0E1A;filter:none;}
body.day-mode #bdpg-usa-svg path.nomap:hover{stroke:#D8DCE3;}
.bdpg-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.bdpg-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.72em;}
.bdpg-chip.on{border-color:var(--accent);box-shadow:0 0 10px rgba(245,158,11,.3);}
.bdpg-chip-dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.bdpg-chip-name{font-weight:700;color:var(--text);}
.bdpg-chip-meta{color:var(--muted);}
.bdpg-2col{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;}
@media(max-width:1000px){.bdpg-2col{grid-template-columns:1fr;}}
.bdpg-seg{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.bdpg-seg button{flex:1;background:var(--surface2);border:none;border-right:1px solid var(--border);color:var(--muted);padding:9px 4px;font-family:var(--fb);font-size:.68em;font-weight:700;cursor:pointer;transition:all .15s;line-height:1.3;}
.bdpg-seg button:last-child{border-right:none;}
.bdpg-seg button:hover{color:var(--text);}
/* #000 (not a --token) is the project convention for text on a saturated
   fill in this file, and THIS button is the reason the convention exists:
   the segmented button's "on" background cycles through the accent, green,
   yellow, orange and red in both day and night mode, and no --root token
   evaluates to a theme-stable dark. #000 is the only value that reads on all
   of them -- #FFF would fail outright on yellow (#FFD60A / #E6A800).
   So this one keeps #000 unconditionally, and it is now the only one of the
   three that does. .btn-accent and .bdpg-go moved to #FFF in day mode,
   because their fill is ALWAYS the accent: #000 on the day accent #B45309 is
   4.18:1, under AA, while #FFF on it is 5.02:1. That reasoning is about a
   fixed fill and does not reach a button whose fill varies -- do not
   "finish the job" by bringing this rule along. Dark mode is unaffected
   everywhere: #000 on #F59E0B is 9.78:1. */
.bdpg-seg button.on{color:#000;}
.bdpg-stars{font-size:1.15em;letter-spacing:2px;color:var(--yellow);}
.bdpg-star-half{position:relative;display:inline-block;}
.bdpg-star-half>span{position:absolute;left:0;top:0;width:50%;overflow:hidden;}
.bdpg-acard{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px;cursor:pointer;text-align:center;transition:all .15s;}
.bdpg-acard:hover{border-color:var(--border2);}
.bdpg-acard.set{border-color:var(--accent);background:rgba(245,158,11,.07);}
.bdpg-acard-ico{font-size:1.4em;line-height:1;}
.bdpg-acard-f{font-size:.64em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:5px;}
.bdpg-acard-v{font-size:.76em;font-weight:700;color:var(--text);margin-top:3px;min-height:1.1em;}
.bdpg-acard:not(.set) .bdpg-acard-v{color:var(--dim);}
.bdpg-astep{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;
  padding:14px 0;border-top:1px solid var(--border);}
.bdpg-astep:first-child{border-top:none;}
.bdpg-astep-n{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--surface);
  border:1px solid var(--border);color:var(--accent);font-family:var(--ff);
  font-size:.72em;font-weight:800;margin-right:8px;flex-shrink:0;}
.bdpg-astep-t{font-weight:800;font-size:.85em;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text);display:flex;align-items:center;}
.bdpg-astep-sub{font-size:.76em;color:var(--muted);margin:2px 0 0 30px;}
.bdpg-astep-body{margin:10px 0 0 30px;}
.bdpg-astep-v{font-family:var(--ff);font-size:1.25em;font-weight:800;
  text-align:right;white-space:nowrap;min-width:5.5em;}
.bdpg-astep-v.none{color:var(--muted);}
.bdpg-astep-v.gallons{color:var(--text);}
.bdpg-go{width:100%;padding:15px;margin:16px 0;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:var(--ff);font-size:1.3em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.bdpg-go:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 0 22px rgba(245,158,11,.45);}
.bdpg-go:disabled{opacity:.45;cursor:not-allowed;background:var(--surface2);color:var(--muted);}
/* Same flip as .btn-accent, and the same reason -- the fill is always the
   accent, and #000 on the day accent is 4.18:1 against #FFF's 5.02:1.
   :not(:disabled) is load-bearing, not decoration: this selector is 0-3-1 and
   would otherwise outrank .bdpg-go:disabled's color:var(--muted) at 0-2-0,
   painting the disabled Generate button's label white on the grey --surface2
   fill it falls back to. */
body.day-mode .bdpg-go:not(:disabled){color:#FFFFFF;}
.bdpg-results{animation:bdpgIn .22s ease-out;}
@keyframes bdpgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bdpg-hero{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;}
@media(max-width:820px){.bdpg-hero{grid-template-columns:1fr;}}
.bdpg-hero-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
.bdpg-hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.bdpg-hero-card.final::before{background:var(--accent);}

/* Bus Dev Potential Gallons — Export Pitch Summary.
   Gated on body.bdpg-print-mode (set by BDPG.onExportPdf, cleared on
   'afterprint') rather than unconditionally, so a plain browser File > Print
   keeps behaving normally -- only a print triggered through the Export Pitch
   Summary button gets caught by these rules.
   The dashboard-only selectors this block used to carry (.sidebar, .topbar,
   .page, #pg-bus-dev-potential-gallons) came over verbatim with the
   extraction and match 0 elements on this standalone page; they were removed
   rather than left reading as load-bearing. #toast is kept: this page does
   have one. */
@media print {
  body.bdpg-print-mode #toast { display: none !important; }
  /* The app chrome (page title bar, Potential Gallons / Prospects tabs) sits
     outside #bdpg-content, so the rules below never reached it and it printed
     as a navigation band across the top of a document handed to a prospect. */
  body.bdpg-print-mode > *:not(#bdpg-content) { display: none !important; }
  /* html carries its own background:var(--bg) (see the :root block), so body's
     white does NOT propagate to the print canvas -- everything past the first
     viewport-height prints on the dark app background.
     This needs a class ON html, not html:has(body.bdpg-print-mode): a missing
     :has() would make the selector no-op silently, and the failure mode is a
     packet printed on a dark ground with no error to notice. onExportPdf()
     and the 'afterprint' handler already toggle body.bdpg-print-mode, so they
     set and clear this one in the same two places -- same gate, one mechanism,
     no selector-support question. */
  html.bdpg-print-mode { background: #fff !important; }
  /* #bdpg-print-only is built by resultsWrapHtml(), so it lives one level
     down inside #bdpg-results-wrap -- not as a direct child of #bdpg-content.
     Hiding every #bdpg-content child except #bdpg-print-only therefore hid
     the wrap, and display:block on a descendant cannot resurrect a hidden
     ancestor: the packet printed as a blank page. Both levels have to be
     walked -- exempt the wrap here, then hide the on-screen results inside
     it below. The #bdpg-print-only exemption is kept in the first rule so
     the block still prints if it is ever hoisted to the top level. */
  body.bdpg-print-mode #bdpg-content > *:not(#bdpg-print-only):not(#bdpg-results-wrap) { display: none !important; }
  body.bdpg-print-mode #bdpg-results-wrap > *:not(#bdpg-print-only) { display: none !important; }
  body.bdpg-print-mode #bdpg-results-wrap { display: block !important; }
  body.bdpg-print-mode #bdpg-print-only { display: block !important; }
  body.bdpg-print-mode { background: #fff !important; color: #000 !important; }
  body.bdpg-print-mode #bdpg-print-only .bdpg-box { border: 1px solid #999 !important; page-break-inside: avoid; }
  /* The hero card reuses the on-screen classes so the print layout stays in
     lockstep with the pitch markup, but the glow/accent styling those classes
     carry on-screen (box-shadow, var(--accent) text) has to become plain
     black-on-white with a border for a leave-behind.
     The grade-badge and network-range rules this block used to carry were
     removed with Task 10: the packet is prospect-facing and no longer renders
     .bdpg-grade or .bdpg-nrange at all, so those selectors matched nothing. */
  body.bdpg-print-mode #bdpg-print-only .bdpg-hero-card { background: #fff !important; border: 1px solid #999 !important; page-break-inside: avoid; }
  body.bdpg-print-mode #bdpg-print-only .bdpg-hero-card::before { display: none !important; }
  body.bdpg-print-mode #bdpg-print-only .bdpg-hero-num,
  body.bdpg-print-mode #bdpg-print-only .bdpg-lbl { color: #000 !important; }
  /* The pitch sections come from BDPG.pitchSectionsHtml(), which is written
     for the dark UI and carries inline color:var(--accent) / var(--muted) /
     var(--border). On white those resolve to #F59E0B (under 2:1) and #6B7A99
     -- a pale smear on the largest numbers an owner is meant to read. An
     inline style can only be beaten by !important, and there is no selector
     for "elements whose inline style mentions --accent", so re-point the
     tokens themselves for the duration of the packet. Repainting the palette
     rather than the rules is also what keeps this from having to be updated
     every time a pitch section adds a colored element.
     Only the color tokens are re-pointed: --ff / --fb are fonts and must
     survive. */
  body.bdpg-print-mode #bdpg-print-only {
    --accent: #000; --text: #000; --muted: #555;
    --bg: #fff; --surface: #fff; --surface2: #fff;
    --border: #999; --border2: #999;
  }
}
#bdpg-print-only { display: none; }

let STATE_PATHS = {}; // Will be populated from topojson
let usTopoLoaded = false;
let usTopoPromise = null;

function loadUSTopojson(){
  if(usTopoPromise) return usTopoPromise;
  usTopoPromise = fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    .then(r=>r.json())
    .then(us=>{
      const states = topojson.feature(us, us.objects.states);
      const projection = d3.geoAlbersUsa().fitSize([900, 550], states);
      const path = d3.geoPath().projection(projection);
      states.features.forEach(f=>{
        const fips = String(f.id).padStart(2,'0');
        const abbr = FIPS_TO_STATE[fips];
        if(abbr){
          const d = path(f);
          if(d) STATE_PATHS[abbr] = d;
        }
      });
      usTopoLoaded = true;
      return STATE_PATHS;
    })
    .catch(e=>{
      console.error('Failed to load US topojson:', e);
      usTopoLoaded = false;
    });
  return usTopoPromise;
}

function hexToRgba(hex, alpha){
  if(hex.startsWith('rgb')) return hex.replace(')',`,${alpha})`).replace('rgb(','rgba(');
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function getCentroid(pathStr, axis){
  // Parse all numeric coordinates from the path
  const parts = pathStr.split(/[MLZCQASTHVmlzcqasthv,\s]+/).filter(s=>s&&!isNaN(parseFloat(s)));
  const nums = parts.map(Number);
  // Extract x,y pairs (skip single values from H/V commands by pairing sequentially)
  let xs=[], ys=[];
  for(let i=0;i<nums.length-1;i+=2){ xs.push(nums[i]); ys.push(nums[i+1]); }
  if(xs.length===0) return 0;
  // Use bounding box center
  if(axis==='x') return (Math.min(...xs)+Math.max(...xs))/2;
  return (Math.min(...ys)+Math.max(...ys))/2;
}

// ═══════════════════════════════════════════════
// SORTABLE TABLES — event delegation (survives re-renders)
// ═══════════════════════════════════════════════
(function(){
  // Single delegated click handler on document for all table headers
  document.addEventListener('click',function(e){
    const th=e.target.closest('table.dt thead th, table.sortable thead th');
    if(!th) return;
    const tbl=th.closest('table');
    if(!tbl) return;
    const thead=th.closest('thead');
    if(!thead) return;
    // Skip toggle columns (width:50px)
    if(th.style.width==='50px') return;
    const ths=Array.from(thead.querySelectorAll('th'));
    const ci=ths.indexOf(th);
    if(ci<0) return;
    const tbody=tbl.querySelector('tbody');
    if(!tbody) return;
    const rows=Array.from(tbody.querySelectorAll('tr'));
    if(rows.length===0) return;

    const wasAsc=th.classList.contains('sort-asc');
    ths.forEach(t=>t.classList.remove('sort-asc','sort-desc'));
    th.classList.add(wasAsc?'sort-desc':'sort-asc');
    const dir=wasAsc?-1:1;

    rows.sort((a,b)=>{
      const ac=a.cells[ci], bc=b.cells[ci];
      if(!ac||!bc) return 0;
      let av=ac.textContent.trim(), bv=bc.textContent.trim();
      // N/A and — always sort last
      const aNA=(av==='N/A'||av==='—'||av===''), bNA=(bv==='N/A'||bv==='—'||bv==='');
      if(aNA&&!bNA) return 1;
      if(bNA&&!aNA) return -1;
      if(aNA&&bNA) return 0;
      // Try numeric: strip $, commas, %, K, M, arrows, spaces
      const an=parseFloat(av.replace(/[,$%▲▼●KM—\s]/g,'')),
            bn=parseFloat(bv.replace(/[,$%▲▼●KM—\s]/g,''));
      if(!isNaN(an)&&!isNaN(bn)) return (an-bn)*dir;
      // Alphabetical
      return av.localeCompare(bv,undefined,{numeric:true,sensitivity:'base'})*dir;
    });
    rows.forEach(r=>tbody.appendChild(r));
  });

  // Add data-sort attribute to all table headers for CSS styling (cursor, arrows)
  function markSortableHeaders(){
    document.querySelectorAll('table.dt thead th, table.sortable thead th').forEach(th=>{
      if(th.style.width==='50px') return;
      if(!th.hasAttribute('data-sort')) th.setAttribute('data-sort','');
    });
  }

  // Run on page changes and periodically catch new tables
  const _obsTarget=document.querySelector('.main')||document.body;
  const _obs=new MutationObserver(()=>{ markSortableHeaders(); });
  _obs.observe(_obsTarget,{childList:true,subtree:true});
  setTimeout(markSortableHeaders,300);
})();

        BDPG.stepCardOpen(2, 'Step 2 — Adjustments', BDPG.step2Done()) + BDPG.step2Html() + BDPG.stepCardClose() +
        // No admin control appears on this tab. The region % panel and the
        // network-context generator used to sit right here, between Step 3
        // and Generate; both moved to the ⚙ Admin tab (spec §5.3) so the
        // rep's calculator is only the calculator.
        BDPG.generateButtonHtml() +
        // One container for "the results, or the notice that they were
        // cleared", so BDPG.invalidateResult() can swap between them with a
        // targeted patch instead of a focus-stealing full render.
        '<div id="bdpg-results-wrap">' + BDPG.resultsWrapHtml() + '</div>' +
        // Save writes the record and re-renders; the Prospects tab is where
        // saved prospects are read back. The old "My Profiles" modal that
        // used to sit beside this button was a second, less-hardened view of
        // the same roadysBDPGProfiles array and has been removed.
        BDPG.saveToProspectsHtml();
      BDPG.renderMap();
      BDPG.drawCharts();
      // Baseline for "does the rep have unsaved work?", captured after the
      // first complete calc render rather than off the state literal: both
      // step2Html() (pricingLevel/amenityLevel defaults) and
      // updatePreEvalSignal() (preEvalSignal) write to state during the
      // render above, so a signature taken any earlier would never match.
      if (BDPG.savedSig === null) BDPG.savedSig = BDPG.stateSig();
      // Same capture point and the same reason as savedSig above:
      // hydrateDraftFromCloud() compares against this to decide whether the
      // rep has touched anything since the page settled. It CANNOT be taken
      // in the boot handler -- the first render() call returns early after
      // kicking off the three data fetches, so a signature taken out there
      // describes state the user never saw, and every later load would look
      // like an edit and suppress the colleague's draft.
      if (BDPG._bootSig === null) BDPG._bootSig = BDPG.stateSig();
    }
  };

  // Source of truth for the region key set -- derived from the config's
  // BDPG_REGION_MAP rather than hardcoded, so the variance lookup, the
  // "is it set" check and the override-diff check can never drift out of
  // sync with the 8-region model in busDevGallonsConfig.js.
  BDPG.REGION_KEYS = Object.keys(BDPG_CONFIG.BDPG_REGION_MAP);

  // The formula's contract: region % is a manual +/-REGION_PCT_BOUND nudge,
  // not a re-statement of network performance (BDPG_NETWORK_BASELINES runs
  // from -43.3% to +76.1%, which is exactly why it stays display-only). One
  // constant so the slider's min/max attributes, the formula-side clamp, and
  // the rendered readout can't drift apart -- widening the range later means
  // changing this line, not hunting three call sites.
  // Was 10. The cap existed because the region term was described as a manual
  // nudge; it is now the real measured per-region delta, and five of the eight
  // regions fall outside +/-10 (Midwest +58.8, Texas -36.7). Capping them
  // meant the tool knowingly understated most of the network.
  //
  // 100 is a slider range, not a claim about the data -- the largest real
  // magnitude is 58.8. calculateEstimate() floors the multiplier at zero so
  // even the extreme end of this range cannot produce negative gallons.
  BDPG.REGION_PCT_BOUND = 100;

  BDPG.clampRegionPct = function (n) {
    n = Number(n);
    if (!isFinite(n)) return 0;
    return Math.max(-BDPG.REGION_PCT_BOUND, Math.min(BDPG.REGION_PCT_BOUND, n));
  };

  // Every committed-data fetch goes through here. The ?v= param is the data
  // set's own asOf, so a deploy that changes the data changes the URL and no
  // browser can keep serving the previous copy out of its HTTP cache. Without
  // it a viewer can sit on a pre-deploy network-locations.json indefinitely
  // and every median, delta and count on the page is a version behind with
  // nothing on screen to say so.
  BDPG.dataUrl = function (path) {
    return path + '?v=' + encodeURIComponent(BDPG_CONFIG.DATA_ASOF);
  };

  BDPG.regionVariance = { committed: null, override: null };
  BDPG._regionVarianceLoaded = false;
  // Set true when a stored override was discarded for not matching the
  // current 8-key region shape (see loadRegionVariance below). Read by
  // the admin panel to show a one-line notice.
  BDPG.regionOverrideWasReset = false;

  BDPG.loadRegionVariance = function (onDone) {
    if (BDPG._regionVarianceLoaded) { if (onDone) onDone(); return; }
    BDPG._regionVarianceLoaded = true;

    var raw = localStorage.getItem('roadysBDPGRegionOverride');
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        var ok = parsed && typeof parsed === 'object' &&
          BDPG.REGION_KEYS.every(function (k) { return hasOwn(parsed, k); });
        if (ok) { BDPG.regionVariance.override = parsed; }
        else {
          // A 5-region override cannot be carried forward: old "West" covered
          // WA/OR/ID/MT/WY as well as CA/NV/UT/CO, so its number describes a
          // different set of states than any new region. Applying it to the
          // new "West" would silently attribute Pacific-Northwest performance
          // to California. Discarded whole and reported.
          localStorage.removeItem('roadysBDPGRegionOverride');
          BDPG.regionOverrideWasReset = true;
        }
      } catch (e) { localStorage.removeItem('roadysBDPGRegionOverride'); BDPG.regionOverrideWasReset = true; }
    }

    fetch(BDPG.dataUrl('../region_variance.json')).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (json) { BDPG.regionVariance.committed = json; if (onDone) onDone(); })
      .catch(function () { if (onDone) onDone(); });
  };

  BDPG.networkContext = null;
  BDPG._networkContextLoaded = false;

  BDPG.loadNetworkContext = function (onDone) {
    if (BDPG._networkContextLoaded) { if (onDone) onDone(); return; }
    BDPG._networkContextLoaded = true;
    fetch(BDPG.dataUrl('../network-context.json')).then(function (r) { return r.ok ? r.json() : null; })
      // Normalized here, at the single point every count surface reads
      // through -- the pre-evaluation panel, the region chips and the pitch
      // strip all take BDPG.networkContext, so none of them can be updated
      // and one of them forgotten.
      .then(function (json) {
        BDPG.networkContext = BDPG_STATS.normalizeNetworkContext(json);
        if (onDone) onDone();
      })
      .catch(function () { if (onDone) onDone(); });
  };

  BDPG.effectiveRegionVariance = function () {
    if (BDPG.regionVariance.override) return BDPG.regionVariance.override;
    if (BDPG.regionVariance.committed) return BDPG.regionVariance.committed;
    // Built from BDPG.REGION_KEYS rather than a hardcoded literal so the
    // zero-fallback shape always matches the current region map.
    var fallback = { asOf: '' };
    BDPG.REGION_KEYS.forEach(function (k) { fallback[k] = 0; });
    return fallback;
  };

  BDPG.effectiveRegionPct = function (region) {
    if (!region) return 0;
    var v = BDPG.effectiveRegionVariance();
    // Exact key, no case transform: region keys now contain spaces
    // ("Upper Midwest"), and a lowercased space-bearing key is a silent
    // mismatch that reads as 0% rather than failing.
    if (!hasOwn(v, region)) return 0;
    var n = Number(v[region]);
    if (!isFinite(n)) return 0;
    // Clamped regardless of how a bigger number got into regionVariance --
    // a hand-edited localStorage value, a stale override, a CSV-computed
    // figure -- because the formula's contract is +/-REGION_PCT_BOUND
    // (see the constant above), not whatever happens to be stored.
    return BDPG.clampRegionPct(n) / 100;
  };

  BDPG.regionVarianceAsOf = function () {
    return BDPG.effectiveRegionVariance().asOf || null;
  };

  // Spec §6: the effective region-variance "as of" date must be shown on both
  // the results view and the export. Two wordings, same disclosure, because
  // the two surfaces have different audiences -- see the pitch variant below.
  //
  // This is the rep-facing one: it names the internal knob and says outright
  // when it is unset, which is what a rep needs in order to distrust a
  // region-flat estimate. It renders below the INTERNAL divider.
  BDPG.regionVarianceAsOfLine = function () {
    var asOf = BDPG.regionVarianceAsOf();
    return asOf ? ('Region variance as of: ' + asOf) : 'Region variance: not set (0% adjustment)';
  };

  // The prospect-facing one, for the pitch block and the exported packet.
  // "Region variance: not set (0% adjustment)" is an internal data-freshness
  // note; on a leave-behind an owner reads it as "they quoted me off
  // incomplete data", and "variance" names a lever they were never shown.
  // The date itself is a genuine disclosure and is kept, in plain language.
  // When there is no date there is nothing to disclose, so this renders
  // nothing at all rather than announcing the gap -- the rep still sees the
  // internal line below the divider and the admin panel's yellow banner.
  BDPG.regionVarianceAsOfLinePitch = function () {
    var asOf = BDPG.regionVarianceAsOf();
    return asOf ? ('Regional volume figures as of ' + asOf + '.') : '';
  };

  BDPG.regionVarianceIsSet = function () {
    var v = BDPG.effectiveRegionVariance();
    return BDPG.REGION_KEYS.some(function (k) { return Number(v[k]) !== 0; });
  };

  BDPG.regionVarianceOverrideDiffers = function () {
    if (!BDPG.regionVariance.override || !BDPG.regionVariance.committed) return false;
    var o = BDPG.regionVariance.override, c = BDPG.regionVariance.committed;
    return BDPG.REGION_KEYS.some(function (k) { return Number(o[k]) !== Number(c[k]); });
  };

  // Open by default. This panel used to sit on the calculator tab among a dozen
  // other sections, where collapsed-by-default was right -- it was one optional
  // thing among many. Task 9 moved it onto a dedicated admin tab whose first
  // card (the grade weights) renders expanded, which teaches the eye that
  // panels here are open; a collapsed row underneath then reads as a static
  // heading rather than a control, and the region sliders and Save button look
  // like they are missing. Reported as "the sliders are not interactive" when
  // in fact they were never in the DOM. The tab exists to hold these controls,
  // so there is nothing for them to be collapsed behind.
  BDPG.state.adminOpen = true;
  // Holds the pretty-printed JSON text from the most recent Save, so the preview
  // block survives the BDPG.render() that Save triggers (adminPanelHtml() re-emits
  // this block hidden/empty every render unless it has saved text to show).
  BDPG.state.adminSavedJson = null;

  // "region-a" style id fragment for a region key that may contain spaces
  // ("Upper Midwest") -- shared by the slider render and the Save/Reset
  // handlers so the three can never look up mismatched element ids.
  BDPG.regionSlug = function (r) { return String(r).replace(/\s+/g, '-').toLowerCase(); };

  BDPG.committedRegionPct = function (r) {
    var c = BDPG.regionVariance.committed;
    if (!c || !hasOwn(c, r)) return 0;
    var n = Number(c[r]);
    return isFinite(n) ? n : 0;
  };

  BDPG.adminPanelHtml = function () {
    var liveDeltas = BDPG.networkRegionDeltas();
    var s = BDPG.state;
    var v = BDPG.effectiveRegionVariance();

    var banner = !BDPG.regionVarianceIsSet()
      ? '<div class="bdpg-box" style="border-color:var(--yellow);margin-top:14px">Region variance not set — estimates use 0% region adjustment.</div>'
      : '';
    var overrideNotice = BDPG.regionVarianceOverrideDiffers()
      ? '<div style="font-size:.8em;color:var(--yellow);margin-bottom:8px">Using a local override that differs from the committed region_variance.json — ' +
        '<button class="btn" onclick="BDPG.onClearRegionOverride()">Clear override</button></div>'
      : '';
    // A stored override from the old 5-region shape can't be carried forward
    // (see loadRegionVariance) -- it was discarded on load, so tell the admin
    // rather than let the reset happen silently.
    var resetNotice = BDPG.regionOverrideWasReset
      ? '<div style="font-size:.8em;color:var(--yellow);margin-bottom:8px">Your saved region override was from the old 5-region layout and could not be carried forward — it has been cleared. Please re-enter your region percentages.</div>'
      : '';

    // Per region: a +/-10% slider (today's engine input), its live readout,
    // a Reset that snaps back to the committed region_variance.json value
    // (never the network figure below it -- see BDPG_NETWORK_BASELINES'
    // comment for why those two numbers must never be conflated), and the
    // read-only network-data context line. Texas alone carries a
    // lowSample/n pair in config; nothing here hardcodes that it's Texas.
    var sliders = BDPG.REGION_KEYS.map(function (r, i) {
      var slug = BDPG.regionSlug(r);
      var sliderId = 'bdpg-admin-' + slug;
      // Clamped before it ever reaches the slider's value= attribute or the
      // readout text, so an out-of-contract stored number (hand-edited
      // localStorage, a stale override) can't leave the handle sitting at
      // the native-clamped bound while the readout beside it still claims
      // the raw figure.
      var curVal = BDPG.clampRegionPct(Number(v[r]) || 0);

      // Labeled "Network data" and suffixed "vs network" (spec §3) so this
      // line can never be mistaken for the slider's own value -- the two
      // numbers are never allowed to be conflated (see BDPG_NETWORK_BASELINES'
      // comment) and a bare, unlabeled figure invites exactly that mistake.
      // The live like-for-like delta beside the slider that applies it. The
      // two are different things -- one is measured, one is chosen -- and
      // they are never assigned to each other in code.
      var live = liveDeltas[r] || null;
      var thin = live && live.n < BDPG_STATS.REGION_THIN_N;
      var netLine = live
        ? ('<div style="font-size:.72em;color:var(--muted);margin-top:2px">' +
            'Network (like-for-like): ' + (live.pct >= 0 ? '+' : '') + live.pct.toFixed(1) +
            '% &middot; Slider: ' + (curVal >= 0 ? '+' : '') + curVal.toFixed(1) + '%' +
            (thin ? ' <span style="color:var(--yellow)">&#9888; based on only ' + live.n +
                    ' locations</span>' : ' &middot; n=' + live.n) +
          '</div>')
        : '<div style="font-size:.72em;color:var(--muted);margin-top:2px">No reporting locations in this region yet.</div>';
      return '<div class="fg">' +
        '<label style="font-size:.72em">' + BDPG.escHtml(r) + ' %</label>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<input id="' + sliderId + '" type="range" min="' + (-BDPG.REGION_PCT_BOUND) + '" max="' + BDPG.REGION_PCT_BOUND + '" step="0.1" style="flex:1" ' +
            'value="' + curVal + '" oninput="BDPG.onRegionSliderInput(' + i + ', this.value)">' +
          '<span id="' + sliderId + '-val" style="font-family:var(--ff);font-weight:700;min-width:3.6em;text-align:right">' +
            curVal.toFixed(1) + '%</span>' +
          '<button type="button" class="btn" style="font-size:.66em" onclick="BDPG.onResetRegionSlider(' + i + ')">Reset</button>' +
        '</div>' +
        netLine +
      '</div>';
    }).join('');

    return banner + resetNotice +
      '<div class="bdpg-box" style="margin-top:14px">' +
        // A real <button>, not a bold div: the old markup carried a leading
        // "▸" and a trailing caret with no border, hover or focus state, so it
        // read as a section label and its collapsed content looked absent
        // rather than hidden. It also could not be reached by keyboard at all.
        '<button class="bdpg-disclosure" aria-expanded="' + (s.adminOpen ? 'true' : 'false') +
          '" onclick="BDPG.toggleAdmin()"><span class="bdpg-disclosure-caret">' +
          (s.adminOpen ? '▾' : '▸') + '</span>Region % — Admin</button>' +
        (s.adminOpen ? (
          overrideNotice +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px">' + sliders + '</div>' +
          '<div class="fg" style="margin-top:10px;max-width:180px"><label>As of (month)</label>' +
          '<input id="bdpg-admin-asof" value="' + BDPG.escHtml(v.asOf) + '" placeholder="e.g. 2026-09"></div>' +
          '<button class="btn btn-accent" style="margin-top:10px" onclick="BDPG.onSaveRegionOverride()">Save locally</button>' +
          '<div id="bdpg-admin-json" style="margin-top:10px;font-family:monospace;font-size:.75em;white-space:pre-wrap;background:var(--bg2,#111);padding:8px;border-radius:6px;' +
            (s.adminSavedJson ? '' : 'display:none') + '">' + (s.adminSavedJson ? BDPG.escHtml(s.adminSavedJson) : '') + '</div>'
        ) : '') +
      '</div>';
  };

  BDPG.toggleAdmin = function () { BDPG.state.adminOpen = !BDPG.state.adminOpen; BDPG.render(); };

  // Same-rule-as-every-other-continuous-control: patch the readout span
  // directly on `input` rather than calling BDPG.render(), which would tear
  // down and rebuild the very slider the user is dragging. Nothing is
  // committed here -- the value isn't read back until Save.
  BDPG.onRegionSliderInput = function (i, value) {
    var r = BDPG.REGION_KEYS[i];
    var val = document.getElementById('bdpg-admin-' + BDPG.regionSlug(r) + '-val');
    if (val) val.textContent = Number(value).toFixed(1) + '%';
  };

  // Snaps one region's slider back to the committed region_variance.json
  // value -- NOT the network-data figure shown below it, which is display
  // context outside the +/-10% range this slider even allows. Nothing is
  // persisted until Save; only the in-progress form value moves.
  BDPG.onResetRegionSlider = function (i) {
    var r = BDPG.REGION_KEYS[i];
    // Clamped for the same reason the render path is: region_variance.json
    // is meant to stay in-contract, but nothing stops a hand-edit there
    // either, and a clamped handle next to an unclamped readout is the
    // exact mismatch this fix exists to close everywhere, not just on load.
    var committed = BDPG.clampRegionPct(BDPG.committedRegionPct(r));
    var slug = BDPG.regionSlug(r);
    var slider = document.getElementById('bdpg-admin-' + slug);
    var val = document.getElementById('bdpg-admin-' + slug + '-val');
    if (slider) slider.value = committed;
    if (val) val.textContent = committed.toFixed(1) + '%';
  };

  BDPG.onSaveRegionOverride = function () {
    var out = {};
    BDPG.REGION_KEYS.forEach(function (r) {
      var el = document.getElementById('bdpg-admin-' + BDPG.regionSlug(r));
      // The native range input already clamps el.value to the rendered
      // min/max, but clamping again here means Save doesn't depend on that
      // browser behaviour to keep an out-of-contract number out of storage.
      out[r] = el ? BDPG.clampRegionPct(Number(el.value) || 0) : 0;
    });
    out.asOf = document.getElementById('bdpg-admin-asof').value.trim();
    localStorage.setItem('roadysBDPGRegionOverride', JSON.stringify(out));
    BDPG.regionVariance.override = out;
    BDPG.state.adminSavedJson = JSON.stringify(out, null, 2) + '\n\n// Paste this into region_variance.json to make it the new team-wide default.';
    // The region % set is an engine input too -- it just lives outside
    // BDPG.state. Changing it strands any result computed under the old one.
    BDPG.invalidateResult();
    BDPG.render();
  };

  BDPG.onClearRegionOverride = function () {
    localStorage.removeItem('roadysBDPGRegionOverride');
    BDPG.regionVariance.override = null;
    BDPG.state.adminSavedJson = null;
    BDPG.invalidateResult();
    BDPG.render();
  };

  // Uploaded rows live only in memory for the duration of the compute step —
  // never written to localStorage or sent anywhere. See CLAUDE.md's Task 22
  // note: the raw CSV is parsed entirely client-side and never persisted.
  BDPG.ncCsv = { rows: null, headers: [] };

  BDPG.networkContextGeneratorHtml = function () {
    var s = BDPG.state;
    return '<div class="bdpg-box" style="margin-top:14px">' +
      // Same treatment as the Region % header. This one stays collapsed by
      // default -- it is a rarely-used one-off tool with a file picker, not the
      // tab's main content -- so its affordance matters more, not less.
      '<button class="bdpg-disclosure" aria-expanded="' + (s.ncGeneratorOpen ? 'true' : 'false') +
        '" onclick="BDPG.toggleNcGenerator()"><span class="bdpg-disclosure-caret">' +
        (s.ncGeneratorOpen ? '▾' : '▸') + '</span>Regenerate network-context.json</button>' +
      (s.ncGeneratorOpen ? (
        '<div style="margin-top:10px;font-size:.82em;color:var(--muted)">Drop in the current location-list CSV. Parsed entirely in this browser tab — never uploaded anywhere.</div>' +
        '<input type="file" accept=".csv" onchange="BDPG.onNetworkContextCsvFile(this)" style="margin-top:8px">' +
        '<div id="bdpg-nc-result" style="margin-top:10px;font-family:monospace;font-size:.72em;white-space:pre-wrap;max-height:300px;overflow:auto;background:var(--bg2,#111);padding:8px;border-radius:6px"></div>'
      ) : '') +
    '</div>';
  };

  BDPG.toggleNcGenerator = function () { BDPG.state.ncGeneratorOpen = !BDPG.state.ncGeneratorOpen; BDPG.render(); };

  BDPG.onNetworkContextCsvFile = function (input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = BDPG.parseCsv(String(reader.result));
      BDPG.ncCsv.headers = rows[0];
      BDPG.ncCsv.rows = rows.slice(1);
      BDPG.onNetworkContextCsvCompute();
    };
    reader.readAsText(file);
  };

  BDPG.onNetworkContextCsvCompute = function () {
    var h = BDPG.ncCsv.headers;
    var idx = {
      company: h.indexOf('Company'), name: h.indexOf('Name'), type: h.indexOf('Type'),
      group: h.indexOf('Group'), state: h.indexOf('State'), status: h.indexOf('Status')
    };
    var byRegion = {};
    Object.keys(BDPG_CONFIG.BDPG_REGION_MAP).forEach(function (r) {
      byRegion[r] = { total: 0, byType: {}, byGroup: {}, byTypeGroup: {} };
    });

    BDPG.ncCsv.rows.forEach(function (row) {
      var status = (row[idx.status] || '').trim().toLowerCase();
      var company = (row[idx.company] || '').toLowerCase();
      var name = (row[idx.name] || '').toLowerCase();
      if (status !== 'active') return;
      if (company.indexOf('demo') !== -1 || name.indexOf('demo') !== -1) return;

      var region = BusDevGallonsCalc.resolveRegion(row[idx.state]);
      if (!region) return;
      var type = (row[idx.type] || '').trim() || 'Unknown';
      var group = (row[idx.group] || '').trim() || 'Unknown';
      // Same exclusion the loader applies, done at source so a regenerated
      // file needs no correcting. normalizeNetworkContext() is idempotent,
      // so doing it in both places is belt-and-braces, not double-counting.
      if (BDPG_STATS.isExcludedNetworkType(type)) return;

      var rd = byRegion[region];
      rd.total += 1;
      rd.byType[type] = (rd.byType[type] || 0) + 1;
      rd.byGroup[group] = (rd.byGroup[group] || 0) + 1;
      rd.byTypeGroup[type] = rd.byTypeGroup[type] || {};
      rd.byTypeGroup[type][group] = (rd.byTypeGroup[type][group] || 0) + 1;
    });

    var activeTotal = Object.keys(byRegion).reduce(function (sum, r) { return sum + byRegion[r].total; }, 0);
    var out = { asOf: (new Date()).toISOString().slice(0, 10), activeTotal: activeTotal, byRegion: byRegion };

    var el = document.getElementById('bdpg-nc-result');
    if (el) el.textContent = JSON.stringify(out, null, 2) + '\n\n// Paste this into network-context.json to make it the new committed default.';

    // Rows live only for the duration of this compute step (see the comment
    // above BDPG.ncCsv) -- reset now that the result is rendered.
    BDPG.ncCsv = { rows: null, headers: [] };
  };

  // Minimal CSV line parser (no library). Handles a quoted field containing a
  // comma or an escaped `""` inside quotes; not a full RFC 4180 parser (no
  // embedded newlines inside a quoted field), which is fine for the simple
  // per-location exports this feeds. Sole consumer today is the
  // network-context generator above; it was shared with the region-variance
  // CSV tool until that tool was retired.
  BDPG.parseCsv = function (text) {
    // Strip a leading UTF-8 BOM -- an Excel export otherwise makes the first
    // header read as "﻿Company", which breaks the exact indexOf() header
    // matching onNetworkContextCsvCompute() does.
    text = text.replace(/^﻿/, '');
    var lines = text.replace(/\r\n/g, '\n').split('\n').filter(function (l) { return l.length; });
    return lines.map(function (line) {
      var out = [], cur = '', inQ = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; continue; }
          inQ = !inQ;
          continue;
        }
        if (c === ',' && !inQ) { out.push(cur); cur = ''; continue; }
        cur += c;
      }
      out.push(cur);
      return out;
    });
  };

  // ── Admin PIN gate ─────────────────────────────────────────────────────
  //
  // NOT security. The page is public, the stored PIN sits in localStorage where
  // anyone can read or delete it, and every value it guards is editable there
  // directly. It exists so a rep cannot change grade weights by wandering into
  // the wrong panel -- an accident guard, nothing more.
  //
  // The default state is deliberately UNSET: with no PIN stored the admin tab
  // is fully open. There is no constant default PIN anywhere in this file and
  // there must never be one -- a hardcoded code would be both a lie about what
  // this gate is and a secret nobody was told, locking the next owner out of
  // their own tool. Clearing the key below always returns the page to the
  // open, unset state.
  BDPG.ADMIN_PIN_KEY = 'roadysBDPGAdminPin';
  BDPG.ADMIN_PIN_RE = /^[0-9]{4}$/;

  // Session-only, and on BDPG rather than BDPG.state so it is never
  // serialized into a saved record or seen by stateSig(). A reload re-locks.
  BDPG.adminUnlocked = false;

  BDPG.storedAdminPin = function () {
    var raw = null;
    try { raw = localStorage.getItem(BDPG.ADMIN_PIN_KEY); } catch (e) { return null; }
    if (raw === null) return null;
    // Anything that is not exactly four digits can only have come from a hand
    // edit. Treating it as "a PIN nobody can type" would lock the panel
    // permanently with no way back; the contract is the opposite -- a cleared
    // or corrupted key reopens the controls. So it is discarded like a
    // cleared one.
    if (!BDPG.ADMIN_PIN_RE.test(raw)) {
      try { localStorage.removeItem(BDPG.ADMIN_PIN_KEY); } catch (e2) {}
      return null;
    }
    return raw;
  };

  BDPG.adminAccessible = function () { return !BDPG.adminPinIsSet() || BDPG.adminUnlocked; };

  // render(), which would wipe whatever is half-typed in the sibling fields.
  BDPG.pinMsg = function (text, isErr) {
    var el = document.getElementById('bdpg-pin-msg');
    if (!el) return;
    el.textContent = text;
    el.style.color = isErr ? 'var(--red)' : 'var(--green)';
  };

  BDPG.pinFieldValue = function (id) {
    var el = document.getElementById(id);
    return el ? String(el.value).trim() : '';
  };

  BDPG.clearPinFields = function (ids) {
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
  };

  BDPG.onSetAdminPin = function () {
    var a = BDPG.pinFieldValue('bdpg-pin-new');
    var b = BDPG.pinFieldValue('bdpg-pin-new2');

    // never half-set a PIN -- the key is either absent or exactly four digits.
    if (!BDPG.ADMIN_PIN_RE.test(a)) {
      BDPG.pinMsg('PIN must be exactly 4 digits (0-9). Nothing was saved.', true);
      return;
    }
    if (a !== b) { BDPG.pinMsg('The two PINs do not match. Nothing was saved.', true); return; }
    try { localStorage.setItem(BDPG.ADMIN_PIN_KEY, a); }
    catch (e) { BDPG.pinMsg('Could not save the PIN in this browser.', true); return; }
    // Whoever just set it is standing in the panel: setting a PIN must not
    // lock you out of the thing you are in the middle of configuring.
    BDPG.adminUnlocked = true;
    BDPG.render();
    BDPG.pinMsg('PIN set. These controls lock on the next reload.', false);
  };

  BDPG.onChangeAdminPin = function () {
    var stored = BDPG.storedAdminPin();
    if (stored === null) { BDPG.pinMsg('No PIN is set yet — use Set PIN.', true); return; }
    var cur = BDPG.pinFieldValue('bdpg-pin-cur');
    var a = BDPG.pinFieldValue('bdpg-pin-new');
    var b = BDPG.pinFieldValue('bdpg-pin-new2');
    if (cur !== stored) { BDPG.pinMsg('Current PIN is incorrect. Nothing was changed.', true); return; }
    if (!BDPG.ADMIN_PIN_RE.test(a)) { BDPG.pinMsg('New PIN must be exactly 4 digits (0-9). Nothing was changed.', true); return; }
    if (a !== b) { BDPG.pinMsg('The two new PINs do not match. Nothing was changed.', true); return; }

  // means "no evidence", and must never be filled in with today's value.
  BDPG.regionPctStamp = function (pct) {
    var n = Number(pct);
    if (!isFinite(n)) return '';
    return (n * 100).toFixed(1);
  };

  // Third member of the same family, for the input the other two do not cover:
  // the PDF baseline itself. BASELINE_TABLE was treated as fixed until Profile 3
  // moved 5,000 -> 4,000 on 2026-09-24 from real network analysis, which makes it
  // exactly as volatile as the region % and the grade weights -- and unlike
  // those two it is the *first* term of officialSubtotal, so a change scales
  // every downstream figure on the row.
  //
  // Stamps the row's own baseline, not a version of the whole table. A
  // table-wide version would flag every saved prospect whenever any single row
  // changed, including the seven rows a given record never touched -- which
  // teaches reps to ignore the badge. Per-row means a Small TS / Highway record
  // is marked and a Large TS / Interstate record beside it is not, which is the
  // truth.
  //
  // Stored gallons are NEVER recomputed to match a new baseline. Stamp and
  // mark; never rewrite -- same ruling as the region % and the weights.
  //
  // '' means "no evidence" and must never be filled in with today's value.
  BDPG.baselineStamp = function (baseline) {
    var n = Number(baseline);
    if (!isFinite(n)) return '';
    return String(Math.round(n));
  };

  // ── Admin baseline overrides ──────────────────────────────────────────
  //
  // BASELINE_TABLE is shipped config and this page must not edit it on disk.
  // An admin still needs to move a baseline without waiting on a developer --
  // the 2026-09-24 Profile 3 change (5,000 -> 4,000) took a code edit, a
  // review and a commit -- so the override lives in localStorage and is
  // applied INTO the in-memory BDPG_CONFIG.BASELINE_TABLE at load.
  //
  // Patching the table itself rather than wrapping each read is deliberate.
  // Six surfaces resolve a baseline: the engine's getBaselineRow(), the
  // engine's profileMin/profileMax band, the Step 1 profile cards, the
  // pre-eval mapper, the tutorial's worked example, and the tracker's
  // staleness check. Any one of them left unwrapped would show a different
  // baseline from the others for the same prospect -- the exact "two numbers,
  // one prospect" failure this file keeps ruling against -- and a wrapper per
  // call site is one forgotten call site away from it. A patched table cannot
  // disagree with itself.
  //
  // The overrides apply on every load, INCLUDING while the admin panel is
  // locked. The PIN gates who may *change* a baseline, not whether a saved
  // change takes effect; locking the panel does not restore config figures,
  // clearing the storage key does. The panel says so out loud.
  //
  // No new stamping machinery is needed. e.baseline flows from the patched row
  // into BDPG.baselineStamp() on save, and the tracker's "other baseline"
  // badge compares against getBaselineRow(), which reads the same patched
  // table -- so changing an override marks every already-saved prospect on
  // that row, and still never recomputes one.
  BDPG.ADMIN_BASELINE_KEY = 'roadysBDPGAdminBaselines';

  // A typo guard, not a policy. The largest shipped baseline is 15,000, so
  // anything past a million is a pasted phone number rather than an estimate.
  // Out-of-range entries are refused with a message, never clamped: clamping
  // would store a figure the admin did not choose and then show it back to
  // them as though they had.
  BDPG.BASELINE_MIN = 1;
  BDPG.BASELINE_MAX = 1000000;

  // profile+roadway is already the engine's identity for a baseline row --
  // getBaselineRow() matches on exactly this pair -- so keying overrides the
  // same way cannot address a row the calculator resolves differently.
  BDPG.baselineKey = function (profile, roadway) {
    return String(profile) + '|' + String(roadway);
  };

  // Snapshotted BEFORE any override is applied, and never written to again:
  // once the live table is patched this is the only remaining record of what
  // busDevGallonsConfig.js actually ships, and both "Reset to default" and the
  // "update the config with these values" note are worthless if it drifts.
  BDPG.BASELINE_DEFAULTS = (function () {
    var out = {};
    BDPG_CONFIG.BASELINE_TABLE.forEach(function (r) {
      out[BDPG.baselineKey(r.profile, r.roadway)] = r.baseline;
    });
    return out;
  })();

  BDPG.baselineOverrides = {};
  // Stored entries discarded as unusable at load, surfaced as a notice in the
  // panel. Dropping them silently would leave an admin looking at a config
  // figure they believe they had overridden.
  BDPG.baselineOverridesDropped = 0;
  BDPG.baselineOverridesWereReset = false;

  BDPG.validBaselineValue = function (v) {
    if (v === null || v === undefined || v === '') return null;
    var n = Number(v);
    if (!isFinite(n)) return null;
    n = Math.round(n);
    if (n < BDPG.BASELINE_MIN || n > BDPG.BASELINE_MAX) return null;
    return n;
  };

  BDPG.liveBaseline = function (key) {
    return hasOwn(BDPG.baselineOverrides, key)
      ? BDPG.baselineOverrides[key] : BDPG.BASELINE_DEFAULTS[key];
  };

  BDPG.baselineIsOverridden = function (key) {
    return hasOwn(BDPG.baselineOverrides, key);
  };

  // Every row is rewritten on every call -- default first, override second --
  // so removing an override restores the shipped figure without a reload, and
  // calling this twice can never compound.
  BDPG.applyBaselineOverrides = function () {
    BDPG_CONFIG.BASELINE_TABLE.forEach(function (r) {
      var k = BDPG.baselineKey(r.profile, r.roadway);
      r.baseline = hasOwn(BDPG.baselineOverrides, k)
        ? BDPG.baselineOverrides[k] : BDPG.BASELINE_DEFAULTS[k];
    });
  };

  BDPG.writeBaselineOverrides = function () {
    try {
      if (Object.keys(BDPG.baselineOverrides).length === 0) {
        localStorage.removeItem(BDPG.ADMIN_BASELINE_KEY);
      } else {
        localStorage.setItem(BDPG.ADMIN_BASELINE_KEY, JSON.stringify(BDPG.baselineOverrides));
      }
      return true;
    } catch (e) { return false; }
  };

  // Storage first, memory second, and rolled back together. An override that
  // is live on screen but absent from storage is a figure that vanishes on the
  // next reload while the prospect records built from it keep its stamp --
  // worse than refusing the edit outright.
  BDPG.commitBaselineOverrides = function (next) {
    var prev = BDPG.baselineOverrides;
    BDPG.baselineOverrides = next;
    if (!BDPG.writeBaselineOverrides()) { BDPG.baselineOverrides = prev; return false; }
    BDPG.applyBaselineOverrides();
    return true;
  };

  BDPG.loadBaselineOverrides = function () {
    var raw = null;
    try { raw = localStorage.getItem(BDPG.ADMIN_BASELINE_KEY); } catch (e) { return; }
    if (!raw) return;

    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e2) { parsed = null; }
    if (!parsed || typeof parsed !== 'object' ||
        Object.prototype.toString.call(parsed) === '[object Array]') {
      // Nothing in the blob can be trusted, so none of it is applied and the
      // key goes rather than being re-read and re-rejected on every load.
      try { localStorage.removeItem(BDPG.ADMIN_BASELINE_KEY); } catch (e3) {}
      BDPG.baselineOverridesWereReset = true;
      return;
    }

    // Per entry, not all-or-nothing: unlike the region override -- where an old
    // 5-region key described a different set of states and so poisoned the
    // whole set -- a baseline key names exactly one profile/roadway pair. One
    // unusable entry says nothing about its neighbours.
    var dropped = 0, kept = {};
    Object.keys(parsed).forEach(function (k) {
      if (!hasOwn(BDPG.BASELINE_DEFAULTS, k)) { dropped++; return; }
      var n = BDPG.validBaselineValue(parsed[k]);
      if (n === null) { dropped++; return; }
      // An entry equal to the shipped figure is not an override. Keeping it
      // would show a permanent amber dot and a "commit this" line for a value
      // already in the config.
      if (n === BDPG.BASELINE_DEFAULTS[k]) { dropped++; return; }
      kept[k] = n;
    });
    BDPG.baselineOverrides = kept;
    BDPG.baselineOverridesDropped = dropped;
    // Storage must never keep holding what the page refuses to apply -- else a
    // hand edit that looks saved never is, and the same entries are re-dropped
    // on every load forever.
    if (dropped > 0) BDPG.writeBaselineOverrides();
    BDPG.applyBaselineOverrides();
  };

  // Runs at module scope, before DOMContentLoaded and therefore before the
  // first getBaselineRow() of the session, so no surface ever renders a config
  // figure that an override was about to replace.
  BDPG.loadBaselineOverrides();

  BDPG.baselineMsg = function (text, isErr) {
    var el = document.getElementById('bdpg-bl-msg');
    if (!el) return;
    el.textContent = text;
    el.style.color = isErr ? 'var(--red)' : 'var(--green)';

  BDPG.BASELINE_ANALYSIS = [

    { profile: 'Small TS · Highway · 3–5 lanes',         cfgProfile: 'Small truck stop',  cfgRoadway: 'Highway',    laneTier: '3-5', pdf: 5000,  median: 6059,  p25: null, p75: null, n: 87, status: 'Pending baseline review', tone: 'yellow' },

  BDPG.BASELINE_ANALYSIS_NOTES = [

    var overridden = BDPG.baselineIsOverridden(key);

    // How many regions now answer this profile from network data instead of
    // this row. Deliberately a count, not a single "computed value": the
    // dynamic baseline is per REGION, so one profile has up to eight of them
    // and there is no one number to show read-only in its place.
    //
    // The input therefore stays editable, which is not what a literal reading
    // of "read-only for dynamic profiles" would do -- this value still governs
    // every region that has no live data, so locking it would remove the
    // admin's only control over the majority of prospects.
    // The row stays editable even when the network drives the number: the
    // override is the documented escape hatch, and it is what the profile
    // falls back to if its sample ever drops below three.
    var driven = BDPG.profileIsNetworkDriven(r.cfgProfile, r.cfgRoadway);
    var drivenNote = (driven && driven.source === 'network')
      ? '<div style="font-size:.66em;color:var(--muted);margin-top:2px">network average ' +
          BDPG.fmtGal(driven.baseline) + ' (n=' + driven.n + ') is in use — this value is the fallback</div>'
      : (driven
          ? '<div style="font-size:.66em;color:var(--muted);margin-top:2px">in use — only ' +
            driven.n + ' reporting location' + (driven.n === 1 ? '' : 's') + ' in this profile</div>'
          : '');
    var dot = overridden
      ? '<span class="bdpg-bl-dot" title="Overridden in this browser. busDevGallonsConfig.js ships ' +
          BDPG.fmtGal(BDPG.BASELINE_DEFAULTS[key]) + ' gal/mo for this row.">●</span>'
      : '';
    var reset = overridden
      ? '<button class="bdpg-bl-reset" onclick="BDPG.onBaselineReset(' + i +
          ')" title="Restore the figure busDevGallonsConfig.js ships">Reset to default</button>'
      : '';
    return '<button class="bdpg-bl-val" onclick="BDPG.onBaselineEditStart(' + i +
        ')" title="Click to edit this baseline">' + BDPG.fmtGal(live) + '</button>' +
      dot + reset + drivenNote;
  };

  // Patches this one cell rather than calling render(): a render would rebuild
  // the table and throw away both the focus and any column sort the admin
  // applied to find the row.
  BDPG.onBaselineEditStart = function (i) {
    var r = BDPG.BASELINE_ANALYSIS[i];
    if (!r) return;
    var key = BDPG.baselineKey(r.cfgProfile, r.cfgRoadway);
    if (!hasOwn(BDPG.BASELINE_DEFAULTS, key)) return;
    var cell = document.getElementById('bdpg-bl-cell-' + i);
    if (!cell) return;
    cell.innerHTML =
      '<span style="display:inline-flex;gap:4px;align-items:center;justify-content:flex-end">' +
        '<input id="bdpg-bl-in-' + i + '" type="number" step="1" ' +
          'min="' + BDPG.BASELINE_MIN + '" max="' + BDPG.BASELINE_MAX + '" ' +
          'style="width:7.5em;text-align:right" value="' + BDPG.liveBaseline(key) + '" ' +
          'aria-label="Live baseline for ' + BDPG.escHtml(r.profile) + '" ' +
          'onkeydown="if(event.key===\'Enter\'){event.preventDefault();BDPG.onBaselineSave(' + i +
            ');}else if(event.key===\'Escape\'){BDPG.onBaselineEditCancel(' + i + ');}">' +
        '<button class="btn btn-accent bdpg-bl-mini" title="Save this baseline" ' +
          'onclick="BDPG.onBaselineSave(' + i + ')">✓</button>' +
        '<button class="btn bdpg-bl-mini" title="Cancel" ' +
          'onclick="BDPG.onBaselineEditCancel(' + i + ')">✕</button>' +
      '</span>';
    var inp = document.getElementById('bdpg-bl-in-' + i);
    if (inp) { inp.focus(); inp.select(); }
  };

  BDPG.onBaselineEditCancel = function (i) {
    var cell = document.getElementById('bdpg-bl-cell-' + i);
    if (cell) cell.innerHTML = BDPG.baselineCellInnerHtml(i);
    BDPG.baselineMsg('', false);
  };

  // Builds the next override map, commits it, and only then touches the page.
  // `remove` is the Reset path; both share this so the two can never diverge
  // on what a write failure or an invalidated result means.
  BDPG.applyBaselineEdit = function (i, value, remove) {
    var r = BDPG.BASELINE_ANALYSIS[i];
    if (!r) return;
    var key = BDPG.baselineKey(r.cfgProfile, r.cfgRoadway);
    if (!hasOwn(BDPG.BASELINE_DEFAULTS, key)) return;

    var n = null;
    if (!remove) {
      n = BDPG.validBaselineValue(value);
      if (n === null) {
        // Refused, not coerced -- the same rule as onSaveWeights. The cell
        // stays in edit mode holding the rejected value, so the admin can see
        // what was turned down instead of watching it silently become
        // something else.
        BDPG.baselineMsg('Baseline must be a whole number between ' + BDPG.fmtGal(BDPG.BASELINE_MIN) +
          ' and ' + BDPG.fmtGal(BDPG.BASELINE_MAX) + ' gal/mo. Nothing was saved.', true);
        return;
      }
    }

    var next = {};
    Object.keys(BDPG.baselineOverrides).forEach(function (k) { next[k] = BDPG.baselineOverrides[k]; });
    // Typing the shipped figure back in is a reset, not an override -- storing
    // it would leave a permanent amber dot and a "commit this" line for a
    // value already in the config.
    if (remove || n === BDPG.BASELINE_DEFAULTS[key]) delete next[key];
    else next[key] = n;

    if (!BDPG.commitBaselineOverrides(next)) {
      BDPG.baselineMsg('Could not save the baseline in this browser — nothing was changed.', true);
      return;
    }

    // The baseline is the first term of officialSubtotal, so anything on
    // screen was computed on the old figure and is stale the instant this
    // lands. Same rule as the region % and the weights writers.
    BDPG.invalidateResult();
    BDPG.render();
    // baselineMsg writes textContent, so these are plain strings -- escaping
    // here would print the entities rather than the characters.
    BDPG.baselineMsg(remove || n === BDPG.BASELINE_DEFAULTS[key]
      ? r.profile + ' restored to the config default of ' +
          BDPG.fmtGal(BDPG.BASELINE_DEFAULTS[key]) + ' gal/mo. Re-run Generate to use it.'
      : r.profile + ' baseline set to ' + BDPG.fmtGal(n) +
          ' gal/mo in this browser. Re-run Generate to use it.', false);
  };

  BDPG.onBaselineSave = function (i) {
    var inp = document.getElementById('bdpg-bl-in-' + i);
    BDPG.applyBaselineEdit(i, inp ? inp.value : null, false);
  };

  BDPG.onBaselineReset = function (i) { BDPG.applyBaselineEdit(i, null, true); };

  // The hand-off to whoever commits. Listed in BASELINE_TABLE's own order
  // rather than the override map's insertion order, and emitted as the literal
  // config rows so the developer pastes them instead of transcribing four
  // fields. `lanes` is copied straight off the live row, which keeps the ASCII
  // hyphen the Step 3 lane-mismatch parser needs -- retyping that field by
  // hand is exactly how an en dash gets in.
  BDPG.baselineCommitNoteHtml = function () {
    var overridden = BDPG_CONFIG.BASELINE_TABLE.filter(function (r) {
      return BDPG.baselineIsOverridden(BDPG.baselineKey(r.profile, r.roadway));
    });
    if (overridden.length === 0) return '';
    var lines = overridden.map(function (r) {
      var k = BDPG.baselineKey(r.profile, r.roadway);
      return BDPG.escHtml("  { profile: '" + r.profile + "', roadway: '" + r.roadway +
          "', lanes: '" + r.lanes + "', baseline: " + BDPG.liveBaseline(k) + " },") +
        '<span style="color:var(--muted)">   // was ' + BDPG.fmtGal(BDPG.BASELINE_DEFAULTS[k]) + '</span>';
    }).join('\n');
    return '<div class="bdpg-box" style="margin-top:12px;border-color:var(--accent)">' +
      '<div style="font-weight:700;margin-bottom:4px">📌 To make these permanent</div>' +
      '<div style="font-size:.8em;color:var(--muted);margin-bottom:8px">' +
        overridden.length + ' baseline' + (overridden.length === 1 ? ' is' : 's are') +
        ' overridden in this browser only — nobody else\'s copy of the calculator has ' +
        (overridden.length === 1 ? 'it' : 'them') + '. Update <code>BASELINE_TABLE</code> in ' +
        '<code>busDevGallonsConfig.js</code> with these values and commit, then Reset each row here ' +
        'so this browser stops diverging from the shipped config:</div>' +
      '<pre class="bdpg-bl-commit">' + lines + '</pre>' +
    '</div>';
  };

  BDPG.networkBaselinePanelHtml = function () {
    function cell(v) { return v === null ? '—' : BDPG.fmtGal(v); }

    var rows = BDPG.BASELINE_ANALYSIS.map(function (r, i) {
      var tone = hasOwn({ green: 1, yellow: 1, gray: 1 }, r.tone) ? r.tone : 'gray';
      return '<tr>' +
        '<td>' + BDPG.escHtml(r.profile) + '</td>' +
        '<td style="text-align:right">' + BDPG.fmtGal(r.pdf) + '</td>' +
        '<td id="bdpg-bl-cell-' + i + '" style="text-align:right;white-space:nowrap">' +
          BDPG.baselineCellInnerHtml(i) + '</td>' +
        '<td style="color:var(--muted)">' + BDPG.escHtml(r.laneTier || '—') + '</td>' +
        '<td style="text-align:right">' + cell(r.median) + '</td>' +
        '<td style="text-align:right">' + cell(r.p25) + '</td>' +
        '<td style="text-align:right">' + cell(r.p75) + '</td>' +
        '<td style="text-align:right">' + r.n + '</td>' +
        '<td><span class="badge tag-' + tone + '">' + BDPG.escHtml(r.status) + '</span></td>' +
      '</tr>';
    }).join('');

    var notes = BDPG.BASELINE_ANALYSIS_NOTES.map(function (t) {
      return '<li>' + BDPG.escHtml(t) + '</li>';
    }).join('');

    // Both notices report storage that was refused at load. Saying nothing
    // would leave an admin looking at a config figure for a row they believe
    // they had already overridden.
    var notices = '';
    if (BDPG.baselineOverridesWereReset) {
      notices += '<div style="font-size:.8em;color:var(--yellow);margin-bottom:8px">The baseline ' +
        'overrides saved in this browser were not readable, so they were discarded and every row ' +
        'below is on its config value.</div>';
    }
    if (BDPG.baselineOverridesDropped > 0) {
      notices += '<div style="font-size:.8em;color:var(--yellow);margin-bottom:8px">' +
        BDPG.baselineOverridesDropped + ' saved baseline override' +
        (BDPG.baselineOverridesDropped === 1 ? ' was' : 's were') + ' discarded at load — the row ' +
        'no longer exists, the value was out of range, or it already matched the config. Those rows ' +
        'are on their config values.</div>';
    }

    return '<div class="bdpg-box" style="margin-top:14px">' +
      '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
        '<div style="font-weight:700">📊 Network Baseline Analysis</div>' +
        '<div style="font-size:.78em;color:var(--muted)">last updated ' +
          BDPG.escHtml(BDPG.BASELINE_ANALYSIS_ASOF) + '</div>' +
      '</div>' +
      '<div style="font-size:.8em;color:var(--muted);margin:6px 0 10px">' +
        'What the real network says about each Roady\'s BD Calculator baseline, beside what the ' +
        'calculator is using right now. The analysis columns are a frozen record of the ' +
        BDPG.escHtml(BDPG.BASELINE_ANALYSIS_ASOF) + ' study; <b>Live Baseline</b> is editable and ' +
        'feeds every estimate this browser produces.</div>' +
      // Two baseline analyses now exist and neither shadows the other: this
      // one is the frozen record of what the Sept 27 cut concluded, the
      // Network Locations tab recomputes live from per-location data. Saying
      // so in both directions is what stops a reader treating whichever they
      // opened first as the only one.
      '<div style="font-size:.78em;color:var(--muted);margin:0 0 10px">' +
