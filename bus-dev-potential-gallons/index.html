    var signalCounts = { Strong: 0, Moderate: 0, Review: 0 };
    var officialSum = 0, officialN = 0, finalSum = 0, finalN = 0;

    profiles.forEach(function (p) {
      var sum = BDPG.readSummary(p);
      // hasOwn guards against a stored grade/signal that isn't one of the
      // known five/three (or a prototype-polluting key like "constructor")
      // silently landing in the wrong bucket -- an unrecognized value is
      // simply excluded, same treatment as an empty one.
      if (hasOwn(signalCounts, sum.preEvalSignal)) signalCounts[sum.preEvalSignal]++;
      // isNum(), not just `!= null`: readSummary only guards against
      // null/undefined, so a hand-edited record holding a numeric *string*
      // ('5000') would pass `!= null` and then `+=` would concatenate
      // instead of add, and any other non-numeric value would poison both
      // averages to NaN for the whole tracker. A rejected value must not
      // inflate the denominator either, so the count only increments
      // alongside the sum. Same guard the row cells above use, so a value
      // the table prints as "—" is also the one the averages skip.
      if (isNum(sum.officialSubtotal)) { officialSum += sum.officialSubtotal; officialN++; }
      if (isNum(sum.finalGallons)) { finalSum += sum.finalGallons; finalN++; }
    });

    var avgOfficial = officialN ? BDPG.fmtGal(officialSum / officialN) + ' gal/mo' : '—';
    var avgFinal = finalN ? BDPG.fmtGal(finalSum / finalN) + ' gal/mo' : '—';

    var signalChips = signalOrder.map(function (s) {
      var tone = BDPG.PREEVAL_SIGNAL_TONES[s];
      return '<span class="badge tag-' + tone + '" style="margin:0 6px 6px 0;display:inline-block">' +
        BDPG.escHtml(s) + ' ×' + signalCounts[s] + '</span>';
    }).join('');

    var statLbl = 'font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px';

    return '<div class="cc" style="margin-top:16px">' +
      '<div class="cc-lbl">Tracker Summary</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">' +
        '<div><div style="' + statLbl + '">Avg Network-Adjusted Baseline</div>' +
          '<div style="font-size:1.2em;font-weight:700">' + avgOfficial + '</div></div>' +
        '<div><div style="' + statLbl + '">Avg Final Potential Gallons</div>' +
          '<div style="font-size:1.2em;font-weight:700">' + avgFinal + '</div></div>' +
        '<div><div style="' + statLbl + '">Pre-Eval Signal</div>' +
          '<div>' + signalChips + '</div></div>' +
      '</div></div>';
  };

  // ── Prospects tab: the saved-prospect cards ───────────────────────────
  //
  // A card per saved prospect, above the tracker table. The table is not
  // replaced: it carries nine more columns, the delegated column sort, the
  // provenance badges and the roll-up, and every one of those is still the
  // way to compare the pipeline. The cards are the "what did I save, and let
  // me reopen it" view -- the five fields a rep looks for by name, plus View.
  //
  // Reads through BDPG.readSummary(p) like every other consumer, never
  // p.state / p.summary directly, so a legacy record (no `prospect`, no
  // `summary`) degrades here exactly as it does in the table rather than
  // printing "undefined".

  // Whether a card's stored gallons were computed on a basis that no longer
  // matches today's. The table states this per figure in two badges and
  // explains the reasoning at length (see trackerRowHtml); the card needs
  // only the one fact, because View RECOMPUTES -- so without this line a rep
  // could read one number on the card and a different one the moment they
  // clicked through, with nothing on screen accounting for the gap.
  //
  // "Unknown" is deliberately not folded into "matches", same as the table:
  // a record saved before stamping carries no evidence either way.
  BDPG.storedFigureBasisNote = function (sum) {
    if (!isNum(sum.officialSubtotal)) return '';
    var parts = [];
    if (sum.region && hasOwn(BDPG.REGION_COLORS, sum.region)) {
      var curRegionStamp = BDPG.regionPctStamp(BDPG.effectiveRegionPct(sum.region));
      if (!sum.regionPctStamp) parts.push('an unrecorded region %');
      else if (sum.regionPctStamp !== curRegionStamp) parts.push('a ' + sum.regionPctStamp + '% region adjustment');
    }
    if (sum.profile && sum.roadway) {
      var curMap = BDPG.profileBaselineMap();
      var curDyn = curMap ? curMap[BDPG_STATS.baselineKeyFor(sum.profile, sum.roadway)] : null;
      var curRow = curDyn && isNum(curDyn.baseline)
        ? curDyn : BusDevGallonsCalc.getBaselineRow(sum.profile, sum.roadway);
      if (curRow) {
        var curBaselineStamp = BDPG.baselineStamp(curRow.baseline);
        if (!sum.baselineStamp) parts.push('an unrecorded baseline');
        else if (sum.baselineStamp !== curBaselineStamp) {
          parts.push('a ' + BDPG.fmtGal(Number(sum.baselineStamp)) + ' gal/mo baseline');
        }
      }
    }
    if (!parts.length) return '';
    return 'Saved under ' + parts.join(' and ') + ', which is not what the calculator uses now — ' +
      'View recomputes, so it will show a different figure. The stored number above is left as saved.';
  };

  BDPG.prospectCardHtml = function (p) {
    var sum = BDPG.readSummary(p);

    var cityState = (!sum.city && !sum.stateCode) ? '—' :
      BDPG.escHtml(sum.city || '') + (sum.city && sum.stateCode ? ', ' : '') + BDPG.escHtml(sum.stateCode || '');

    var profileTxt = (sum.profile && sum.roadway)
      ? BDPG.escHtml(sum.profile) + ' · ' + BDPG.escHtml(sum.roadway) : '—';

    // Dash, not zero, when nothing was generated: a prospect saved before
    // Generate has null gallons, and printing "0 gal/mo" would assert a
    // figure the calculator never produced.
    var gallonsTxt = isNum(sum.finalGallons) ? BDPG.fmtGal(sum.finalGallons) : '—';
    var gallonsSub = isNum(sum.finalGallons) ? 'gal/mo final potential' : 'no value profile generated yet';
    // The dash is muted, not accent. In the accent orange every other card
    // uses for its figure it reads as a value rather than the absence of one
    // -- at that weight and size an em dash is just a short orange bar.
    var gallonsColor = isNum(sum.finalGallons) ? 'var(--accent)' : 'var(--dim)';

    // Sliced from the ISO string rather than Date-converted, for the same
    // reason the table's Saved cell is (see trackerRowHtml): no "Invalid
    // Date" for a junk value, and no UTC-stored/local-rendered day shift.
    var savedTxt = (typeof sum.savedAt === 'string' && sum.savedAt.length >= 10)
      ? sum.savedAt.slice(0, 10) : '—';

    var typeBadge = sum.locationType
      ? ' <span class="badge tag-gray">' + BDPG.escHtml(sum.locationType) + '</span>' : '';

    var signalBadge = '';
    if (sum.preEvalSignal) {
      var tone = hasOwn(BDPG.PREEVAL_SIGNAL_TONES, sum.preEvalSignal) ? BDPG.PREEVAL_SIGNAL_TONES[sum.preEvalSignal] : 'gray';
      signalBadge = ' <span class="badge tag-' + tone + '">' + BDPG.escHtml(sum.preEvalSignal) + '</span>';
    }

    // Same id-escaping rule as trackerRowHtml's action buttons: JSON.stringify
    // then escape only the attribute-delimiting `"`. HTML-entity-escaping the
    // id would NOT be safe here, because the browser decodes entities in the
    // attribute before compiling it as JS.
    var pid = p.id || '';
    var viewLink = pid
      ? '<a href="#" onclick="BDPG.onProspectView(' + JSON.stringify(pid).replace(/"/g, '&quot;') + '); return false;" ' +
        'style="color:var(--accent);font-weight:700;text-decoration:underline">View →</a>'
      : '<span style="color:var(--muted)">No id — can’t reopen</span>';

    var basisNote = BDPG.storedFigureBasisNote(sum);
    var lbl = 'font-size:.66em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em';

    return '<div class="bdpg-box" style="display:flex;flex-direction:column;gap:10px">' +
      '<div>' +
        '<div style="font-weight:700;font-size:1.02em;line-height:1.25">' + BDPG.escHtml(sum.name) + typeBadge + signalBadge + '</div>' +
        '<div style="font-size:.8em;color:var(--muted);margin-top:3px">' + cityState + '</div>' +
      '</div>' +
      '<div>' +
        '<div style="font-family:var(--ff);font-size:1.75em;font-weight:800;color:' + gallonsColor + ';line-height:1">' + gallonsTxt + '</div>' +
        '<div style="font-size:.7em;color:var(--muted);margin-top:2px">' + gallonsSub + '</div>' +
      '</div>' +
      '<div><div style="' + lbl + '">Location Profile</div>' +
        '<div style="font-size:.82em">' + profileTxt + '</div></div>' +
      (basisNote ? '<div style="font-size:.68em;color:var(--yellow);line-height:1.4">&#9888; ' + basisNote + '</div>' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;' +
          'border-top:1px solid var(--border);padding-top:9px;margin-top:auto">' +
        '<span style="font-size:.72em;color:var(--muted)">Saved ' + BDPG.escHtml(savedTxt) + '</span>' +
        viewLink +
      '</div>' +
    '</div>';
  };

  BDPG.prospectCardsHtml = function (profiles) {
    return '<div class="cc" style="margin-bottom:16px">' +
      '<div class="cc-lbl">Saved Prospects (' + profiles.length + ')</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px">' +
        profiles.map(BDPG.prospectCardHtml).join('') +
      '</div></div>';
  };

  // "View" reopens the FULL result, which a plain Load cannot: onLoadProfile
  // deliberately clears state.result (see its comment), so a loaded prospect
  // arrives with its inputs and no results panel, no pitch hero and no
  // export buttons. This loads and then re-runs Generate.
  //
  // The three guards are onTrackerExport's, in the same order and for the
  // same reasons: the baseline check runs against the SAVED record before
  // anything touches BDPG.state, so a view that turns out to be impossible
  // leaves a rep's in-progress work untouched; the discard prompt comes only
  // once the view is known to be possible; and the try/catch recovers the
  // page rather than leaving #bdpg-content stuck half-rendered.
  BDPG.onProspectView = function (id) {
    if (!id) return;
    var found = BDPG.getSavedProfiles().filter(function (p) { return p.id === id; })[0];
    if (!found) return;
    var st = found.state || {};
    if (!BusDevGallonsCalc.getBaselineRow(st.profile, st.roadway)) {
      toast('This saved prospect has no Location Profile/Roadway, so there is no result to reopen.', 'terr');
      return;
    }
    if (!BDPG.confirmDiscard(
      'You have unsaved changes on the Potential Gallons tab.\n\n' +
      'Viewing "' + (found.name || 'this prospect') + '" loads it over them, and they cannot be recovered.\n\nContinue?')) return;

    BDPG.onLoadProfile(id, true);
    try {
      BDPG.switchTab('calc');
      BDPG.onGenerate();
      BDPG.savedSig = BDPG.stateSig();
    } catch (err) {
      BDPG.activeTab = 'prospects';
      BDPG.render();
      toast('Could not reopen this prospect\'s result.', 'terr');
      return;
    }
    if (!BDPG.state.result) toast('Could not reopen this prospect\'s result.', 'terr');
  };

  BDPG.prospectsHtml = function () {
    // Default sort: saved date descending (newest first). ISO 8601 strings
    // sort correctly lexicographically; a missing savedAt (pre-Task-7
    // record) sorts to the bottom since '' < any real timestamp. The
    // delegated table-header handler (bound once on document, see the
    // SORTABLE TABLES block near the top of this file) takes over from
    // here on any header click -- this only sets the order shown on load.
    var profiles = BDPG.getSavedProfiles().slice().sort(function (a, b) {
      return (b.savedAt || '').localeCompare(a.savedAt || '');
    });

    var rows = profiles.length
      ? profiles.map(BDPG.trackerRowHtml).join('')
      : '<tr><td colspan="12" style="text-align:center;padding:24px;color:var(--muted)">📋 No prospects evaluated yet — complete a profile above and save it.</td></tr>';

    // The summary card is a separate .cc sibling, not a <tr> in this table
    // -- the delegated sort handler operates on `tbody > tr` (see the
    // SORTABLE TABLES block), so keeping the roll-up entirely outside the
    // <table> means a header click can never sort it into the body,
    // duplicate it, or lose it. Hidden outright with zero profiles: an
    // average of nothing and all-zero chips would just be noise sitting
    // above the tracker's own "no prospects yet" empty state.
    var statsHtml = profiles.length ? BDPG.trackerStatsHtml(profiles) : '';

    // Cards first, then the full tracker table. Hidden with zero profiles for
    // the same reason the roll-up is: an empty card grid above the table's own
    // "no prospects yet" row says the same thing twice.
    var cardsHtml = profiles.length ? BDPG.prospectCardsHtml(profiles) : '';

    return cardsHtml +
      '<div class="cc"><div class="cc-lbl">Prospects Tracker</div>' +
      '<div class="tw"><table class="dt"><thead><tr>' +
        '<th>Prospect</th><th>Location</th><th>Location Profile</th>' +
        '<th>Network-Adjusted Baseline</th><th>Final Potential Gallons</th>' +
        '<th>Pre-Eval</th><th>Amenity Level</th>' +
        '<th>Pricing Strategy</th><th>Rewards</th><th>Saved</th><th style="width:50px">Actions</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' + statsHtml;
  };

  BDPG.onTrackerLoad = function (id) {
    if (!id) return;
    // onLoadProfile asks before discarding unsaved work and returns false if
    // the rep declines -- in which case we stay on the Prospects tab with
    // their in-progress calculation untouched.
    if (!BDPG.onLoadProfile(id)) return;
    BDPG.switchTab('calc');
    BDPG.savedSig = BDPG.stateSig();
  };

  // Export needs a generated result, and onLoadProfile deliberately clears
  // state.result (see its comment) -- but onLoadProfile also replaces the
  // *entire* BDPG.state wholesale. A REFUSED export must not do that: if a
  // rep has an in-progress, not-yet-saved profile on the Potential Gallons
  // tab and clicks Export Pitch Summary on some other tracker row that turns out to
  // be ungeneratable, the toast must be the only effect -- their unsaved
  // work has to survive. So the profile/roadway check has to run against
  // the *saved record itself* (via getSavedProfiles(), same as
  // onLoadProfile reads it) before anything touches BDPG.state, not against
  // BDPG.state after onLoadProfile has already overwritten it.
  BDPG.onTrackerExport = function (id) {
    if (!id) return;
    var found = BDPG.getSavedProfiles().filter(function (p) { return p.id === id; })[0];
    if (!found) return;
    var st = found.state || {};
    // BusDevGallonsCalc.getBaselineRow() is exactly the check
    // BDPG.onGenerate() itself uses to decide whether to bail with an
    // alert(), so checking it here first means that alert is never reached
    // and the tracker can show a clear toast instead of an empty print
    // dialog -- all before BDPG.state is touched.
    if (!BusDevGallonsCalc.getBaselineRow(st.profile, st.roadway)) {
      toast('This saved prospect is missing a Location Profile/Roadway and can\'t produce an Export Pitch Summary.', 'terr');
      return;
    }

    // Only now, once the export is known to be possible, is anything about
    // to be discarded. "Export Pitch Summary" does not read as "throw away what I am
    // working on", so the rep has to be told that it does -- there is no
    // prompt, no toast and no undo on the other side of this.
    if (!BDPG.confirmDiscard(
      'You have unsaved changes on the Potential Gallons tab.\n\n' +
      'Exporting "' + (found.name || 'this prospect') + '" loads it over them, and they cannot be recovered.\n\nContinue?')) return;

    BDPG.onLoadProfile(id, true);
    try {
      BDPG.switchTab('calc');
      BDPG.onGenerate();
      BDPG.savedSig = BDPG.stateSig();
    } catch (err) {
      // The profile/roadway check above can pass yet render() still throw
      // deeper in -- e.g. a hand-edited record missing supportingDetails or
      // amenityDetails -- which would otherwise leave #bdpg-content stuck
      // mid-render and the page inert. Recover to a working tab and say so,
      // rather than leaving that promise conditional.
      BDPG.activeTab = 'prospects';
      BDPG.render();
      toast('Could not generate a value profile for this prospect.', 'terr');
      return;
    }
    if (!BDPG.state.result) {
      toast('Could not generate a value profile for this prospect.', 'terr');
      return;
    }
    BDPG.onExportPdf();
  };

  window.BDPG = BDPG;
})();

BDPG.toggleTheme = function () {
  document.body.classList.toggle('day-mode');
  try { localStorage.setItem('roadysBDPGTheme', document.body.classList.contains('day-mode') ? 'day' : 'night'); } catch (e) {}
};

// Escape closes the help modal. It is the only full-screen overlay a reader
// can be left stuck behind with no keyboard route out -- the Add Location
// dialog is DEV-only and has its own Cancel in reach.
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && BDPG.state && BDPG.state.tutorialOpen) BDPG.closeTutorial();
});

// A pending debounced draft write must not be lost to a closed tab or a
// reload -- that window is the one gap in "save after every field change".
// pagehide rather than beforeunload: it fires on mobile/background teardown
// too, and it does not risk an unload prompt. flushDraft() is a single
// synchronous localStorage write, which is what this event allows.
window.addEventListener('pagehide', function () {
  if (BDPG._draftTimer) BDPG.flushDraft();
});

// ── Login gate ────────────────────────────────────────────────────────
// Supabase Auth, email + password. Sign-ups are disabled in the dashboard,
// so the account list IS the allowlist — there is no email list in this
// bundle, because any list shipped to the browser is advisory, not enforcing.
//
// This is NOT the old SETTINGS.pin soft-lock, which compares a localStorage
// string in client JS and stops nobody. That stays where it is, as the
// accident guard it already is, and runs after this.
function bdShowLoginGate(onReady){
  RoadysBD.auth.init().then(function(session){
    if(session){ onReady(); return; }
    var ov=document.createElement('div');
    ov.className='pin-overlay';
    ov.innerHTML=
      '<div class="pin-box">'+
      '<h3>🔒 Sign in</h3>'+
      '<p>Business Development — Roady\'s</p>'+
      '<input type="email" class="pin-input bd-cred bd-email" placeholder="email" autocomplete="username"/>'+
      '<input type="password" class="pin-input bd-cred bd-pw" placeholder="password" autocomplete="current-password"/>'+
      '<div class="pin-err"></div>'+
      '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center">'+
      '<button class="btn btn-accent bd-go">Sign in</button></div>'+
      '</div>';
    document.body.appendChild(ov);
    var em=ov.querySelector('.bd-email'), pw=ov.querySelector('.bd-pw'),
        err=ov.querySelector('.pin-err'), go=ov.querySelector('.bd-go');
    var submit=function(){
      err.textContent='';
      go.disabled=true; go.textContent='Signing in…';
      RoadysBD.auth.signIn(em.value.trim(), pw.value).then(function(r){
        go.disabled=false; go.textContent='Sign in';
        if(!r.ok){ err.textContent=r.error||'Sign-in failed'; pw.value=''; pw.focus(); return; }
        ov.remove();
        onReady();
      });
    };
    go.onclick=submit;
    [em,pw].forEach(function(i){ i.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); }); });
    setTimeout(function(){ em.focus(); },50);
  });
}

// Sign-out must also drop the offline caches. Leaving them would keep the
// previous user's data readable on disk after the tables themselves moved
// behind auth -- the cache would become the hole in the lock. The key list
// lives in roadysBD.js so the three pages cannot drift apart.
function bdSignOut(){
  RoadysBD.auth.signOut().then(function(){ location.reload(); });
}

document.addEventListener('DOMContentLoaded', function () {
  bdShowLoginGate(function () {
    // Parsed by the shared module so the one step that can mangle a company
    // name or a state code is unit-tested. See RoadysBD.leadParamsFrom.
    var leadParams = RoadysBD.leadParamsFrom(location.search);
    // Before the first render, never after: restoreDraft() writes the ⓪ card's
    // fields and sets savedSig, and render() captures its unsaved-work baseline
    // on that first pass.
    BDPG.restoreDraft();
    // Between restore and render, so the rep's own local draft is on the card
    // when applyLeadParams decides whether opening this lead would discard it —
    // and so anything it writes lands inside the _bootSig baseline, leaving a
    // shared cloud draft for the same lead free to win over a CRM snapshot.
    BDPG.applyLeadParams(leadParams);
    BDPG.render();
    BDPG.hydrateDraftFromCloud();
  });
});
</script>
</body>
</html>
